<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <meta name="theme-color" content="#1b1840">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>燼火營地</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Huninn&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">

<body>
  <canvas id="bg"></canvas>
  <div class="vignette"></div>
  <div id="app">
    <header id="top"></header>
    <main id="main"></main>
    <nav id="nav">
      <button data-act="go" data-arg="camp"><span class="ni" data-i="mon/goblinhermit"></span>營地</button>
      <button data-act="go" data-arg="heroes"><span class="ni" data-i="mon/dragonkinknight"></span>英雄</button>
      <button data-act="go" data-arg="run" class="mid"><span class="ni" data-i="item/sword_fire"></span>爬塔</button>
      <button data-act="go" data-arg="altar"><span class="ni" data-i="mon/cabalistnun"></span>祭壇</button>
      <button data-act="go" data-arg="more"><span class="ni" data-i="item/book"></span>更多</button>
    </nav>
  </div>
  <div id="toasts"></div>
  <div id="sheet"><div class="sheet"><div class="grab"></div><div class="sheet-body"></div></div></div>
  <div id="loading"><div class="flame"></div><p>點燃篝火中…</p></div>

  <script src="js/config.js"></script>
  <script src="js/data.js"></script>
  <script src="js/store.js"></script>
  <script src="js/art.js"></script>
  <script src="js/fx.js"></script>
  <script src="js/sync.js"></script>
  <script src="js/levels.js"></script>
  <script src="js/camp.js"></script>
  <script src="js/tower.js"></script>
  <script src="js/battle.js"></script>
  <script src="js/play.js"></script>
  <script src="js/main.js"></script>

</html>
