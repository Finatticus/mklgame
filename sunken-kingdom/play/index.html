html, body { margin: 0; padding: 0; border: 0; width: 100%; height: 100%; background: #000; }
body { color: #f0e6d2; overflow: hidden; touch-action: none; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; overscroll-behavior: none; font-family: 'PingFang TC', 'Microsoft JhengHei', 'Noto Sans TC', sans-serif; }
/* 瀏海、圓角、Home 條：畫面只畫在安全區裡，介面不會被擋到 */
#wrap { position: fixed; top: env(safe-area-inset-top); right: env(safe-area-inset-right); bottom: env(safe-area-inset-bottom); left: env(safe-area-inset-left); }

.cover h1 { color: #e8c46a; font-size: 28px; margin: 0 0 12px; letter-spacing: 4px; }
.cover p { margin: 6px 0; font-size: 16px; line-height: 1.6; color: #cfc4ae; }

	<body>
		<div id="wrap"><canvas id="canvas">你的瀏覽器不支援 canvas。</canvas></div>
		<div id="status" class="cover">
			<h1>沉沒王國</h1>
			<p id="status-text">載入中……</p>
			<progress id="status-progress"></progress>
		</div>
		<div id="rotate" class="cover">
			<div class="phone"></div>
			<h1>請把手機轉成橫向</h1>
			<p>這個遊戲只能橫向遊玩</p>
			<p class="tip">轉了沒反應？iPhone 請從右上角往下滑打開控制中心，關掉「直向鎖定」</p>
		</div>
		<noscript>這個遊戲需要開啟 JavaScript。</noscript>

		<script>
// ---------------------------------------------------------------- 手機：強制橫向、全螢幕
(function () {
	const ua = navigator.userAgent;
	const mobile = /iPhone|iPad|iPod|Android/i.test(ua) || (/Macintosh/.test(ua) && navigator.maxTouchPoints > 1);
	if (mobile) document.body.classList.add('mobile');
	window.SK_MOBILE = mobile;
	window.SK_maxDpr = mobile ? 2 : 99; // 手機最多畫 2 倍像素（3 倍的 iPhone 會很燙，看起來差不多）
	const standalone = window.matchMedia('(display-mode: standalone)').matches || window.matchMedia('(display-mode: fullscreen)').matches || navigator.standalone === true;
	function lock() {
		// Android：全螢幕之後才能鎖定橫向（加到主畫面的 App 由 manifest 直接鎖橫向）；iOS 不支援，只能提示轉向
		if (!mobile) return;
		const el = document.documentElement;
		const p = (!standalone && el.requestFullscreen && !document.fullscreenElement) ? el.requestFullscreen({ navigationUI: 'hide' }).catch(() => {}) : Promise.resolve();
		p.then(() => { if (screen.orientation && screen.orientation.lock) screen.orientation.lock('landscape').catch(() => {}); });
	}
	window.addEventListener('pointerdown', lock, { once: false, passive: true });
	// 畫布大小用安全區內的大小（避開瀏海、Home 條）；Godot 每一幀都會來問（index.js 由 patch_engine.py 修改）
	const wrap = document.getElementById('wrap');
	window.SK_canvasSize = function () { return [wrap.clientWidth, wrap.clientHeight]; };
	if (standalone && screen.orientation && screen.orientation.lock) screen.orientation.lock('landscape').catch(() => {});
}());
		</script>
		<script src="index.js"></script>
		<script>
const GODOT_CONFIG = {"args":[],"canvasResizePolicy":2,"emscriptenPoolSize":8,"ensureCrossOriginIsolationHeaders":true,"executable":"index","experimentalVK":true,"fileSizes":{"index.pck":46655488,"index.wasm":39514754},"focusCanvas":true,"gdextensionLibs":[],"godotPoolSize":4};
const GODOT_THREADS_ENABLED = false;
const statusBox = document.getElementById('status');
const statusText = document.getElementById('status-text');
const statusProgress = document.getElementById('status-progress');

function withTimeout(p, ms) {
	return Promise.race([p, new Promise((_, rej) => setTimeout(() => rej(new Error('timeout')), ms))]);
}

// ---------------------------------------------------------------- 自動更新：有網路時比對版本號，有新版就清掉舊快取、重新載入
async function checkUpdate() {
	let remote = null;
	try {
		const r = await withTimeout(fetch('version.json?t=' + Date.now(), { cache: 'no-store' }), 5000);
		if (r.ok) remote = (await r.json()).version;
	} catch (e) { /* 沒網路：直接用手機裡的版本 */ }
	const local = localStorage.getItem('sk_version');
	if (remote && local && remote !== local) {
		statusText.textContent = '發現新版本，更新中……';
		try {
			const keys = await caches.keys();
			await Promise.all(keys.filter((k) => k.startsWith('sk-')).map((k) => caches.delete(k)));
			const reg = await navigator.serviceWorker.getRegistration();
			if (reg) await reg.update();
		} catch (e) { console.warn(e); }
		localStorage.setItem('sk_version', remote);
		location.reload();
		return false;
	}
	if (remote) localStorage.setItem('sk_version', remote);
	window.SK_VERSION = remote || local || '';
	return true;
}

// ---------------------------------------------------------------- 雲端伺服器網址（cloud_config.json，改網址不用重新匯出遊戲）
async function loadCloudConfig() {
	try {
		const r = await withTimeout(fetch('cloud_config.json?t=' + Date.now(), { cache: 'no-store' }), 5000);
		if (r.ok) {
			const c = await r.json();
			if (c.url) { window.SK_CLOUD_URL = c.url; localStorage.setItem('sk_cloud_url', c.url); }
		}
	} catch (e) { /* 沒網路：用上次記住的網址 */ }
	if (!window.SK_CLOUD_URL) window.SK_CLOUD_URL = localStorage.getItem('sk_cloud_url') || '';
}

// ---------------------------------------------------------------- 離線：Service Worker 把遊戲檔案存在手機裡
async function registerWorker() {
	if (!('serviceWorker' in navigator)) return;
	try { await navigator.serviceWorker.register('sw.js'); } catch (e) { console.warn('service worker', e); }
}

(async function () {
	if (!(await checkUpdate())) return;
	await loadCloudConfig();
	registerWorker();
	const missing = Engine.getMissingFeatures({ threads: GODOT_THREADS_ENABLED });
	if (missing.length !== 0) {
		statusText.textContent = '這個瀏覽器不支援：' + missing.join('、') + '。請用最新版的 Chrome 或 Safari 開啟。';
		statusProgress.style.display = 'none';
		return;
	}
	const engine = new Engine(GODOT_CONFIG);
	engine.startGame({
		onProgress: function (current, total) {
			if (current > 0 && total > 0) {
				statusProgress.value = current;
				statusProgress.max = total;
				statusText.textContent = '載入中……' + Math.round(current / total * 100) + '%';
			}
		},
	}).then(() => {
		statusBox.remove();
	}, (err) => {
		console.error(err);
		statusText.textContent = '載入失敗：' + (err && err.message ? err.message : err) + '。請重新整理再試一次。';
		statusProgress.style.display = 'none';
	});
}());
		</script>
