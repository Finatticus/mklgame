道德危險","金融中介","逆選擇"],"a":3,"e":"答案(D)。依教材，銀行在事前因資訊不對稱，無法分辨借款人的風險，把資金貸放給違約機率高的人，卻沒有相應提高利率（風險訂價不足），這是「逆選擇」，屬於事前的問題。(B)道德危險則是契約簽訂後，借款人改變行為、損害銀行利益，屬於事後的問題。","c":15,"f":3,"ap":["H15-19","E13-42","E23-9"]},{"i":"E1-1","q":"關於銀行用以整合組織目標與單位目標之管理機制，下列敘述何者錯誤？","o":["單軌制的內部轉撥價格相較於多軌制的內部轉撥價格更能正確反映政策目標","根據風險資本的配置系統(Capital allocation system)，應將營業單位、業務項目和交易活動的所有風險，緊密地與銀行自有資本搭配","各項業務及主管的風險權限若能按照「風險值」衡量，則風險資本的配置與績效目標有否達成的研判將更加客觀","總行財務部可以使用聯行往來的資金調撥系統，剖析各分支機構和分行等營業單位的營業利潤，並引導其業務重點配合全行的經營政策"],"a":0,"e":"答案(A)。依教材，多軌制是由多種借用利率與供應利率組成的內部轉撥價格，能針對不同資金來源與用途分別訂價，分攤方式更準確，也更能反映政策目標。所以(A)說單軌制更能反映政策目標是錯的。(B)風險資本應與自有資本緊密搭配、(C)以風險值衡量風險權限使評估更客觀、(D)總行財務部用聯行往來剖析各單位利潤並引導業務，三項都正確。","c":2,"f":1,"ap":["E1-1"]},{"i":"E1-2","q":"有關風險管理的觀念，下列何者錯誤？","o":["風險管理的本質是「管理風險」，不是「消除風險」","唯唯諾諾的主管不得罪別人，最適合擔任「風險管理處長」","銀行的風險決策宜兼顧業務與財務目標，彈性和循序漸進的做法，有時比「堅持」按照統計結果執行更有功效","轉嫁「風險成本」於所有客戶的購買價格，不一定適用在競爭激烈的市場環境"],"a":1,"e":"答案(B)。風險管理主管必須獨立、客觀，敢對業務單位提出風險警示，甚至說「不」。唯唯諾諾、不得罪人的主管反而無法發揮監督功能，所以(B)錯誤。(A)風險管理是管理風險而不是消除風險；(C)風險決策兼顧業務與財務目標、彈性漸進；(D)在競爭激烈的市場，不一定能把風險成本轉嫁給客戶，三項都正確。","c":1,"f":1,"ap":["E1-2"]},{"i":"E1-4","q":"關於作業基礎成本制度，下列敘述何者錯誤？","o":["各項作業成本是由其成本動因的活動數量乘以動因費率而求得","作業基礎成本制度旨在促使成本與成本標的對資源需求的因果關係更明確","傳統成本制度相較作業基礎成本制度更能清楚浮現各項金融業務的獲利情形","作業基礎成本制度相較傳統成本制度更著重在「資源分配」的合理性與需要性"],"a":2,"e":"答案(C)。作業基礎成本制度(ABC)依作業活動與成本動因分攤成本，比傳統成本制度更能清楚呈現各項金融業務與客戶的真實獲利，所以(C)說傳統成本制度更能浮現獲利情形是錯的。(A)作業成本＝動因活動量×動因費率；(B)使成本與成本標的的因果關係更明確；(D)更著重資源分配的合理性，三項都正確。","c":2,"f":2,"ap":["E1-4","E2-5"]},{"i":"E1-5","q":"銀行比較難以實施「利潤中心」制度的組織結構，係指下列何者？","o":["金融業務別","營業單位或分行別","企業機能別","境內與境外地區別"],"a":2,"e":"答案(C)。企業機能別是在總行第一層級依功能分設營業、信託、財務、國外等處級單位。這些單位的收入與成本互相交錯，難以單獨衡量利潤，所以部門主管較難成立利潤中心。依金融業務別、分行別或境內外地區別劃分的單位，收支比較容易歸屬，適合實施利潤中心制度。","c":2,"f":1,"ap":["E1-5"]},{"i":"E1-6","q":"關於營運利潤、財務利潤與會計利潤之關係，下列敘述何者錯誤？","o":["會計利潤為營運利潤與財務利潤相加","財務利潤為內部移轉價格與市場價格的差額","營運利潤為顧客價格與內部移轉價格的差額","會計利潤蘊含內部損益與外部損益的合計，但內部損益相抵銷之後合計不為零"],"a":3,"e":"答案(D)。依教材，會計利潤（本期損益）是內部損益與外部損益的合計，而各營業單位之間的內部損益互相抵銷後，合計數應「為零」，所以(D)說不為零是錯的。(A)會計利潤＝營運利潤＋財務利潤；(B)財務利潤＝內部移轉價格與市場價格的差額；(C)營運利潤＝顧客價格與內部移轉價格的差額，三項都正確。","c":2,"f":2,"ap":["E1-6","E2-7"]},{"i":"E1-7","q":"關於資金移轉價格，下列敘述何者不適當？","o":["全行的會計利潤係指「本期損益」，是由營業單位的營運利潤與財務部的財務利潤所構成","銀行營業單位所稱的營運利潤，包括內部損益與外部損益","銀行的聯行往來政策，應優先追求閒置資金的利潤極大化","存放款顧客的價格簡稱存款利率與放款利率，是藉由內部移轉價格加減利潤目標而訂定"],"a":2,"e":"答案(C)。聯行往來（內部資金轉撥）政策的功能，是引導各單位落實全行的業務策略、提升全行整體營運利潤，不是優先追求閒置資金本身的利潤極大化，所以(C)不適當。(A)會計利潤＝營運利潤＋財務利潤；(B)營運利潤包括內部與外部損益；(D)存放款利率是以內部移轉價格加減利潤目標訂定，三項都正確。","c":2,"f":1,"ap":["E1-7"]},{"i":"E1-8","q":"關於作業風險概念，下列敘述何者錯誤？","o":["科技設備創新所發揮的規模經濟，使相關業務的長期平均成本跟著降低","行員的工作意願與能力不足，造成業務效率不高，非屬於作業風險涵蓋範疇","新種金融商品與服務推出後，行銷決策不穩帶來的收入減少，亦屬於作業風險涵蓋範疇","藉由新穎設備的跨業務聯結，創造比原先更多樣化的服務水準，有效發揮業務種類的綜效，是範圍經濟(Economies of Scope)的寫照"],"a":1,"e":"答案(B)。作業風險包括「人員」因素造成的損失，行員工作意願或能力不足導致效率低落、作業失誤，正屬於作業風險的範疇，所以(B)錯誤。(A)設備創新帶來規模經濟，使長期平均成本下降；(D)跨業務聯結發揮綜效是範圍經濟，兩項皆正確；(C)依本題官方答案，新商品推出後行銷決策不穩造成的收入減少，亦視為作業風險涵蓋範疇。","c":15,"f":1,"ap":["E1-8"]},{"i":"E1-10","q":"假設本國A 銀行於承作5 千萬美元放款時，同時發行4 千5 百萬美元定期存單，則借貸相抵後該行擁有多少美元外幣部位？","o":["短部位5 千萬美元","短部位5 百萬美元","長部位5 百萬美元","長部位5 千萬美元"],"a":2,"e":"答案(C)。美元放款5千萬是美元資產（買入），美元定存單4千5百萬是美元負債（賣出）。淨部位＝5,000萬−4,500萬＝＋500萬美元，買入大於賣出，所以是長部位5百萬美元。","c":13,"f":1,"ap":["E1-10"]},{"i":"E1-11","q":"假設小王購買了一張期別2 年、AA 等級、平價發行的本國債券，該債券票面價值$100,000 元且票面利率為每年4%，若經過一年後，該債券被信用評等機構調降評等，導致該債券的市場殖利率從原本的4%上升至5%，請問該債券因遭調降評等致債券市場價值變動多少？","o":["減少$962","減少$952","增加$952","增加$962"],"a":1,"e":"答案(B)。一年後債券剩一年到期，到期時可收到本息100,000＋4,000＝104,000元。殖利率升到5%後，價格＝104,000/1.05≈99,048元，和原本的平價100,000元相比，減少約$952。殖利率上升使債券價格下跌，所以不是(C)(D)的增加。","c":13,"f":1,"ap":["E1-11"]},{"i":"E1-13","q":"衡量企業取得資金之後的經營效能，下列何者錯誤？","o":["存貨周轉率越高，企業經營效能越好","應收帳款週轉率越高，企業經營效能越好","總資產周轉率越高，企業經營效能越好","應付帳款周轉率越高，企業經營效能越好"],"a":3,"e":"答案(D)。存貨週轉率、應收帳款週轉率、總資產週轉率越高，代表資產運用與回收的速度越快，經營效能越好，所以(A)(B)(C)正確。應付帳款週轉率越高，代表付款給供應商越快、議價能力較弱，資金被提早支用。依教材，這項指標一般是越低越好，不能說越高經營效能越好，所以(D)錯誤。","c":4,"f":1,"ap":["E1-13"]},{"i":"E1-14","q":"關於融資業務，下列敘述何者錯誤？","o":["經常性融資以協助企業短期週轉金為目的","經常性融資之還款來源仰賴固定資產處分變現","中長期融資以協助企業建立中長期的營運資金為目的","中長期融資之還款來源仰賴未來經營所賺得的利潤"],"a":1,"e":"答案(B)。經常性融資是協助企業短期週轉的資金（如票據融通、短期放款、透支），還款來源主要是正常營運的收入，例如銷貨收款、應收帳款回收，不是靠處分固定資產變現，所以(B)錯誤。(A)經常性融資以短期週轉金為目的；(C)(D)中長期融資協助企業建立中長期營運資金，還款來源是未來經營賺得的利潤，三項都正確。","c":4,"f":3,"ap":["E1-14","E2-19","E5-32"]},{"i":"E1-15","q":"銀行之放款利率=基準利率+風險加減碼，關於風險加減碼，下列何者錯誤？","o":["信用等級加碼","外匯實績加減碼","存款實績加減碼","產業風險加減碼"],"a":3,"e":"答案(D)。依教材，放款利率＝基準利率＋風險加減碼，風險加減碼包括(A)信用等級加碼、(B)外匯實績加減碼、(C)存款實績加減碼等，視企業的經營績效與產業環境而定。(D)「產業風險加減碼」不在教材所列的加減碼項目中，所以錯誤。","c":4,"f":1,"ap":["E1-15"]},{"i":"E1-18","q":"根據2015 年1 月底的統計數據，消費性貸款中，何者金額最多？","o":["購置住宅貸款","房屋修繕貸款","汽車貸款","信用卡循環信用餘額"],"a":0,"e":"答案(A)。依統計數據（2015年1月底，以及教材引用的2020年12月底資料），消費性貸款中承作金額最多的都是購置住宅貸款，遠高於(B)房屋修繕貸款、(C)汽車貸款和(D)信用卡循環信用餘額。","c":5,"f":1,"ap":["E1-18"]},{"i":"E1-19","q":"關於房屋貸款之本息平均每月攤還，下列敘述何者正確？","o":["每月攤還的本金固定，但本金餘額隨房貸餘額減少，利息也會跟著遞減","每月攤還的利息固定，但本金餘額隨房貸餘額減少","每月償還總額固定，但愈往後本金償還的部分愈多，利息償還的部分愈少","每月償還總額固定，但愈往後利息償還的部分愈多，本金償還的部分愈少"],"a":2,"e":"答案(C)。本息平均攤還是每月繳款總額固定。初期本金餘額高，利息占比較大；隨著本金逐月減少，利息部分遞減，本金償還的部分遞增，所以(C)正確、(D)相反。(A)每月本金固定、利息遞減，描述的是「本金平均攤還」；(B)每月利息固定則不符合攤還原理。","c":5,"f":1,"ap":["E1-19"]},{"i":"E1-20","q":"假設ARMs 定儲利率指數為2.5%，銀行承作房貸之成本加碼為2.55%，違約風險相關之信用等級加碼為1%，請根據ARMs 房貸之利率訂價方式，計算房貸利率為何？","o":["5.05%","6.05%","3.50%","3.55%"],"a":0,"e":"答案(A)。依教材，ARMs（指數型房貸）的利率＝指標利率（定儲利率指數）＋成本加碼＝2.5%＋2.55%＝5.05%。教材的訂價公式只包括指標利率和成本加碼，題目另外給的信用等級加碼1%不計入；若加計就會得到(B)的6.05%。","c":5,"f":2,"ap":["E1-20","E7-46"]},{"i":"E1-21","q":"有關國內指數型住宅貸款，下列敘述何者正確？A.銀行可依資金成本調控指標利率 B.指標利率需定期浮動調整 C.貸款利率經風險貼水調整後貼近內部設定之營業利潤目標 D.指標利率通常以採樣銀行之一年期定期儲蓄存款固定利率之平均數訂定","o":["僅A、B","僅B、D","僅A、B、C","僅A、C、D"],"a":1,"e":"答案(B)。B.指數型房貸的指標利率須定期浮動調整，D.指標利率通常以採樣銀行一年期定儲利率的平均數訂定，這兩項正確。A.指標利率是由多家採樣銀行的利率平均而來，個別銀行無法依自己的資金成本調控，所以錯誤。C.指數型房貸的利率＝指標利率＋約定加碼，隨指標利率機動調整，不是依內部營業利潤目標調整，所以也錯誤。故選僅B、D。","c":5,"f":2,"ap":["E1-21","E2-26"]},{"i":"E1-22","q":"銀行制定不同產業的集中性風險時，可參考信評機構公佈之下列何種評等機制？","o":["債務發行信用評等","發行人信用評等","特殊用途信用評等","產業評等"],"a":3,"e":"答案(D)。依教材，授信集中性風險主要以產業別衡量，銀行制定不同產業的集中度限額時，可參考信評機構公布的「產業評等」。(A)債務發行信用評等是針對個別債券；(B)發行人信用評等是針對個別企業；(C)特殊用途評等則是針對特定目的，三者都不是針對產業。","c":7,"f":3,"ap":["E1-22","E5-8","E6-22"]},{"i":"E1-23","q":"穆迪信評公司衡量受評公司信用風險之方法架構，係為下列何者？","o":["由上而下涵蓋國家風險、產業風險和企業風險","由上而下涵蓋法令遵循、產業風險和企業風險","由下而上涵蓋企業風險、產業風險和外匯風險","由下而上涵蓋企業風險、法令遵循和國家風險"],"a":0,"e":"答案(A)。穆迪(Moody's)採由上而下(Top-Down)的方式評估受評公司的信用風險：先看國家風險，再看產業風險，最後看企業本身的風險。(B)(D)的法令遵循，以及(C)的外匯風險與由下而上的順序，都不符合穆迪的架構。","c":6,"f":3,"ap":["E1-23","E4-24","E8-23"]},{"i":"E1-24","q":"依據標準普爾信用評等機構之觀點，下列哪些指標可以衡量受評公司之現金流量是否足夠？ A.營業利益／營業收入 B.長短期借款／總資產 C.（正常營業活動的現金流量+利息費用）／利息費用 D.借款的還本期限","o":["僅C、D","僅A、D","僅C","A、B、C、D"],"a":0,"e":"答案(A)。依教材，標準普爾衡量受評公司現金流量是否足夠的指標是：C.(正常營業活動的現金流量＋利息費用)÷利息費用，以及D.借款的還本期限，所以僅C、D。A.營業利益÷營業收入是獲利能力指標；B.長短期借款÷總資產是財務槓桿（資本結構）指標，兩者都不是衡量現金流量是否足夠的指標。","c":6,"f":1,"ap":["E1-24"]},{"i":"E1-27","q":"有關風險限額，下列敘述何者錯誤？","o":["違約機率的差幅隨著信用評等等級越差而縮小，所以風險限額也等幅降低","風險限額使用率達到早期預警門檻，應主動提醒營業及業管單位","信用評等等級越佳的企業集團，其風險限額越高","風險越高，則風險限額越小且放款利差越高"],"a":0,"e":"答案(A)。信用評等等級越差，違約機率會呈加速上升，相鄰等級之間的違約機率差幅是「擴大」而不是縮小。所以風險限額應隨等級變差而加速遞減，不是等幅降低，(A)錯誤。(B)使用率達預警門檻應主動提醒營業及業管單位；(C)評等越好的企業集團限額越高；(D)風險越高，限額越小、放款利差越高，三項都正確。","c":7,"f":1,"ap":["E1-27"]},{"i":"E1-28","q":"中國外匯交易中心於2015 年8 月11 日公布人民幣兌美元中間價為6.2298 元，較前一交易日重貶1.9%，此對於外國銀行在當地之授信或投資會衍生何種類型之風險？","o":["信用風險","外匯風險","作業風險","流動性風險"],"a":1,"e":"答案(B)。人民幣兌美元中間價重貶1.9%，外國銀行在當地以人民幣計價的授信或投資，換算回本國貨幣或美元時價值減少，產生匯率變動造成的外匯風險。信用風險是借款人違約，作業風險源自內部作業或外部事件，流動性風險是資金調度不足，都不是本題情境。","c":13,"f":1,"ap":["E1-28"]},{"i":"E1-29","q":"希臘總理齊普拉斯於2015 年6 月11 日宣佈，希臘銀行將停止對外營業，並將實行資本管制，此事件為何種類型之風險？","o":["聲譽風險","法律風險","詐欺風險","國家風險"],"a":3,"e":"答案(D)。希臘政府宣布銀行停止營業並實施資本管制，是國家主權行為造成資金無法自由匯出、債權人無法收回資金的風險，屬於國家風險（含外匯移轉風險）。(A)聲譽風險、(B)法律風險、(C)詐欺風險都不是由國家主權行為造成的。","c":8,"f":1,"ap":["E1-29"]},{"i":"E1-30","q":"關於國家風險的統計，下列敘述何者錯誤？","o":["總曝險除已動用的放款餘額，還需加計剩餘可用或未動用部份","信用狀保兌按承作金額計算曝險值","已提列資產減損之有價證券投資，按減損後之資產價值計算","附賣回證券直接以有價證券之市場價值計算"],"a":3,"e":"答案(D)。國家風險暴險值計算中，附賣回證券係於評估交易對手不履約時，依「發生的損失金額」認列暴險值，而非直接以有價證券市場價值計算，故(D)錯誤。(A)授信業務除已動用餘額外，須加計剩餘可用或未動用額度；(B)信用狀保兌及轉開信用狀按承作金額計算；(C)有價證券按面額計算，已提列減損者按減損後價值計算，均正確。","c":8,"f":1,"ap":["E1-30"]},{"i":"E1-31","q":"有關Basel 監理委員會2010 年12 月16 日發布的資本協定第三版(Basel III)，下列敘述何者錯誤？","o":["除了法定的資本計提額，另外要求增訂「緩衝資本2.5%」","提高「普通股權益資本的比率」由2013 年起逐步調高至2015 年的4.5%","為了防範景氣循環帶來的衝擊，設計了「額外緩衝資本」為0~2.5%，建議各國政府自行決定","增訂長期的淨穩定資金率(Net Stable Funding Ratio)，該比率在推動初期以「大於或等於120%」作為門檻"],"a":3,"e":"答案(D)。Basel III增訂的淨穩定資金比率(NSFR)門檻為「大於或等於100%」，並非120%，故(D)錯誤。(A)增訂2.5%的留存緩衝資本；(B)普通股權益比率自2013年起逐步提高至2015年的4.5%；(C)抗景氣循環緩衝資本0~2.5%，由各國主管機關自行決定，均正確。","c":9,"f":3,"ap":["E1-31","E2-36","E4-32"]},{"i":"E1-32","q":"臺灣的銀行資本分為四個等級，倘若銀行計畫使用「現金」分配盈餘，或以「現金」買回其流通在外股份，必須達到下列何種等級以上？","o":["資本適足","資本不足","資本顯著不足","資本嚴重不足"],"a":0,"e":"答案(A)。依銀行法第44條之1，資本等級為資本不足、資本顯著不足或資本嚴重不足之銀行，不得以現金分配盈餘或買回其股份；因此須達「資本適足」等級，才可以現金分配盈餘或以現金買回其流通在外股份。(B)(C)(D)均屬不得為之的等級，並依等級受主管機關不同程度的監理措施。","c":9,"f":3,"ap":["E1-32","E3-35","E5-11"]},{"i":"E1-33","q":"依據銀行資本適足性及資本等級管理辦法，下列何者不得列為普通股權益第一類資本？","o":["資本公積","可轉換之次順位債券","累積盈虧","普通股"],"a":1,"e":"答案(B)。普通股權益第一類資本包括普通股、資本公積、累積盈虧（保留盈餘）等；「可轉換之次順位債券」屬於第二類資本（第二類資本含長期次順位債券、可轉換之次順位債券、營業準備及備抵呆帳等），不得列入普通股權益。","c":9,"f":2,"ap":["E1-33","E2-39"]},{"i":"E1-34","q":"票券金融公司資本適足率低於百分之六者，主管機關可採行下列哪些措施？ A.解除負責人職務 B.命令取得或處分特定資產，應先經主管機關核准 C.命令處分特定資產 D.命令對負責人之報酬予以降低","o":["僅A","僅A、D","僅B、C、D","A、B、C、D"],"a":3,"e":"答案(D)。票券金融公司資本適足率低於6%者，主管機關得視情節輕重採取：解除負責人職務、命令取得或處分特定資產應先經主管機關核准、命令處分特定資產、限制轉投資或命令限期裁撤分支機構、命令降低負責人報酬等措施。A、B、C、D四項均屬之。","c":10,"f":2,"ap":["E1-34","E3-31"]},{"i":"E1-35","q":"關於金融控股公司之資本適足率規範，下列敘述何者錯誤？","o":["轄下子公司可以豁免遵守各業別資本適足率規範","集團之資本適足率不得低於100%","未達最低法定比率標準，不得以現金分配盈餘","申請轉投資事業時，其合併本次投資後之資本適足率不得低於100%"],"a":0,"e":"答案(A)。依金融控股公司合併資本適足性管理辦法，金控公司之子公司仍「應符合各業別資本適足性之相關規範」，不能豁免，故(A)錯誤。(B)集團資本適足率不得低於100%；(C)未達標準者盈餘不得以現金分配；(D)申請轉投資時合併本次投資後資本適足率不得低於100%，均正確。","c":9,"f":1,"ap":["E1-35"]},{"i":"E1-36","q":"有關保險公司的資本適足率與業務限制，下列敘述何者錯誤？","o":["資本充裕等級的保險公司其資本適足率須達300%以上","臺灣自2013 年6 月底開始，分成五個等級的資本適足率","保險公司的資本適足率達200%以上時，得申請從事增加投資效益之衍生性金融商品交易","財務和業務健全的保險公司，最近一年之資本適足率達200%時，可申請「傷害保險」及「健康保險」"],"a":2,"e":"答案(C)。依保險業從事衍生性金融商品交易管理辦法，保險業從事「增加投資效益」目的之衍生性商品交易，資本適足率須達法定標準(200%)的1.25倍，即250%以上，而非200%，故(C)錯誤。(A)資本充裕等級須達300%以上；(B)自2013年6月底起分級管理；(D)財務業務健全、最近一年資本適足率達200%者可申請經營傷害保險及健康保險，均為教材所述內容。","c":10,"f":1,"ap":["E1-36"],"g":"本題依舊制RBC（法定標準200%、300%以上視為資本充裕）作答；2026年起保險業改採TW-ICS新制，資本適足法定標準改為100%（講義資本等級表採新制：適足100%以上、不足50%～未達100%、顯著不足25%～未達50%、嚴重不足低於25%）"},{"i":"E1-37","q":"國際清算銀行(Bank for International Settlements,BIS)之巴賽爾委員會推動資本適足管理，其中銀行授信業務的風險管理制度除傳統指標外，透過內部評等法(Internal Rating-Based Approach,IRB)開始重視之風險量化指標，不包括下列何者？","o":["違約風險","暴露風險","回收風險","市場風險"],"a":3,"e":"答案(D)。Basel內部評等法(IRB)對授信業務重視的風險量化指標為違約風險（違約機率PD）、暴露風險（違約暴險額EAD）與回收風險（違約損失率LGD），三者均屬信用風險的組成；「市場風險」是另一類風險，不屬於授信信用風險量化指標。","c":12,"f":2,"ap":["E1-37","E5-13"]},{"i":"E1-38","q":"信用風險的「標準法」，依據授信對象的「信用等級」，決定「風險權數」；下列何者不屬於目前國內銀行常用的信用等級資訊來源？","o":["公開資訊觀測站資訊","信用評等機構的信用資訊","銀行自行建立的信用評分模型","金融聯合徵信中心(JCIC)提供的「信用資料庫」"],"a":0,"e":"答案(A)。國內銀行常用的信用等級資訊來源包括：信用評等機構的信用評等、銀行自行建立的信用評分模型，以及金融聯合徵信中心(JCIC)的信用資料庫；「公開資訊觀測站」主要提供上市櫃公司財報與重大訊息等揭露資料，並非信用等級的來源。","c":12,"f":1,"ap":["E1-38"]},{"i":"E1-39","q":"衡量回收風險之信用損失，假設借款客戶的信用暴險額及違約損失率已知，只有違約機率是變動且未知時，下列敘述何者錯誤？","o":["信用損失＝信用暴險額×違約機率×違約損失率","信用損失＝信用暴險額×違約機率×（1－回收率）","信用損失＝信用暴險額×違約機率－回收率","信用損失＝信用暴險額×違約機率－回收金額"],"a":2,"e":"答案(C)。信用損失＝信用暴險額×違約機率×違約損失率，而違約損失率＝1－回收率，故(A)(B)正確；若以金額表示，可寫為暴險額×違約機率再扣除預期回收金額，(D)可成立。(C)以金額直接減去「回收率」（比率），單位不一致，公式錯誤。","c":12,"f":2,"ap":["E1-39","E2-44"]},{"i":"E1-40","q":"銀行的交易對手發現衍生性交易明顯不利於自己時，可能選擇「不履約」，係稱為何種風險？","o":["交割日風險","交割日之前的風險","直接放款風險","間接放款風險"],"a":1,"e":"答案(B)。衍生性交易在交割日之前，交易對手若發現契約對其明顯不利（對銀行為正的市價），可能選擇不履約，使銀行損失重置成本，稱為「交割前風險」(Pre-settlement Risk)。交割日風險則是交割當日一方已付款、另一方未交付的風險。","c":12,"f":2,"ap":["E1-40","E6-52"]},{"i":"E1-41","q":"2014 年1 月1 日台灣已將資本適足率(BIS)的「合格資本」改為「自有資本」，金融服務業需要計提合格資本的風險種類不包括下列何者？","o":["市場風險","作業風險","信用風險","法律風險"],"a":3,"e":"答案(D)。我國自2014年(103年)起將「合格資本」改稱「自有資本」，銀行須計提資本的風險為信用風險、市場風險及作業風險三大類（風險性資產總額＝信用風險加權風險性資產＋市場及作業風險應計提資本×12.5）；法律風險雖涵蓋於作業風險定義中，但不單獨列為計提資本的風險種類。","c":9,"f":2,"ap":["E1-41","E2-46"]},{"i":"E1-42","q":"有關「風險權數」之適用，如借款人以自用住宅做為十足擔保，設定抵押權於債權銀行以取得資金者，下列敘述何者錯誤？","o":["一律適用45%風險權數","貸放比率在75%以下之貸款，適用25%的風險權數","貸放比率在75%以下之貸款，適用35%的風險權數","貸放比率在75%以上之貸款，適用75%的風險權數"],"a":1,"e":"答案(B)。依講義（現行規定），以「自用住宅」當作擔保品、貸放比率在75%以下之貸款，適用35%的風險權數；以「非自用住宅」當作擔保品則一律適用75%。故貸放比率75%以下適用「25%」是錯的，(B)錯誤，為官方答案。(C)即為正確規定；(D)貸放比率超過75%者不適用35%的優惠權數，適用75%；(A)「一律45%」與現行規定不符。","c":12,"f":3,"ap":["E1-42","E3-42","E5-38"],"g":"依講義現行規定，(A)「一律適用45%」亦不正確，選項有爭議；(B)的25%在任何規定下都不正確，故官方答案為(B)"},{"i":"E1-43","q":"大直銀行的內部評等法，對AAA 級授信客戶，設定14%風險權數，低於標準法使用的20%，若該銀行承作此客戶10 億元「無擔保授信」，請問二種方法相差多少資本計提額？","o":["0.6 億元","0.048 億元","0.112 億元","0.128 億元"],"a":1,"e":"答案(B)。兩法風險性資產差額＝10億×(20%－14%)＝0.6億元；資本計提額差額＝0.6億×8%（題目未給資本適足率，以Basel最低8%計）＝0.048億元。注意：若題目載明資本適足率10.5%（講義新版題型），則為10億×6%×10.5%＝0.063億元。","c":12,"f":1,"ap":["E1-43"],"g":"題目未給資本適足率，官方答案以8%計算；講義新版題目以10.5%計算得0.063億元，作答時須留意題目條件"},{"i":"E1-45","q":"財務處的交易部位超過風險限額時，下列何種處理方法錯誤？","o":["提前解約","只要是獲利狀態，事後報備即可","請更高層級主管，在職權範圍增加限額","將超過部位轉售第三者"],"a":1,"e":"答案(B)。交易部位超過風險限額時，不論目前獲利或虧損，都必須立即依規定處理（例如提前解約、將超限部位轉售第三者，或在授權範圍內由更高層級主管核增限額），不可因處於獲利狀態就僅事後報備，否則形同架空限額控管機制。","c":13,"f":1,"ap":["E1-45"]},{"i":"E1-46","q":"依據Basel 委員會規範，與市場風險有關的「主要部位」不包括下列何者？","o":["外匯部位","權益證券部位","擔保放款部位","固定收益證券部位"],"a":2,"e":"答案(C)。依巴賽爾委員會規範，市場風險的主要部位為交易簿中的利率（固定收益證券）部位、權益證券部位、外匯部位及商品部位；「擔保放款」屬銀行簿的授信業務，其風險為信用風險，不屬於市場風險主要部位。","c":13,"f":1,"ap":["E1-46"]},{"i":"E1-49","q":"有關銀行的放款對存款之比率（簡稱存放比率），下列敘述何者錯誤？","o":["存放比率愈高，意味銀行的流動性愈低","存放比率愈高，意味銀行的流動能力愈強","存放比率愈高，意味銀行的流動性風險愈大","銀行仍以存放款業務為主，存放比率仍具相當參考價值"],"a":1,"e":"答案(B)。存放比率＝放款÷存款，比率愈高表示資金愈多貸出、可動用的流動資金愈少，流動性愈低、流動性風險愈大，故(A)(C)正確，(B)「流動能力愈強」錯誤。國內銀行仍以存放款業務為主，存放比率仍具參考價值，(D)正確。","c":14,"f":2,"ap":["E1-49","E6-58"]},{"i":"E1-52","q":"重新訂價的缺口又稱「資金缺口」，有關資金缺口的敘述，下列何者錯誤？","o":["是某天期的敏感性資產與敏感性負債相減而得","敏感性資產除以敏感性負債大於0 時，稱為「正」資金缺口","利率由高往低下滑時，適合採用「負」資金缺口策略","利率處於最高點或低谷時，適合採用「零」資金缺口策略"],"a":1,"e":"答案(B)。資金缺口＝敏感性資產－敏感性負債，差額大於0為正缺口；若以比率表示，敏感性資產÷敏感性負債「大於1」才稱為正資金缺口，而非大於0，故(B)錯誤。利率下滑時宜採負缺口，利率處於高點或低谷時宜採零缺口，(C)(D)正確。","c":14,"f":1,"ap":["E1-52"]},{"i":"E1-54","q":"自民國108 年起，國內銀行的資本適足率不得低於多少？","o":["8%","9%","10%","10.50%"],"a":3,"e":"答案(D)。依銀行資本適足性及資本等級管理辦法，自民國108年(2019年)起，銀行普通股權益比率不得低於7%、第一類資本比率不得低於8.5%、資本適足率不得低於10.5%。","c":9,"f":1,"ap":["E1-54"]},{"i":"E1-55","q":"按照資本適足性管理辦法，銀行發行的「長期次順位債券」，在計算資本適足率時，具有何種資本性質？","o":["普通股股本","第一類資本","第二類資本","不可視為資本使用"],"a":2,"e":"答案(C)。依資本適足性管理辦法，銀行發行的長期次順位債券屬於「第二類資本」（第二類資本另包括可轉換之次順位債券、營業準備及備抵呆帳等），不屬於普通股權益或第一類資本。","c":9,"f":4,"ap":["E1-55","E2-60","E5-55","E6-29"]},{"i":"E1-56","q":"依據金融控股公司及銀行業內部控制及稽核制度實施辦法，銀行業之風險控管機制應包括下列哪些原則？ A.監控資本適足性 B.降低洗錢及資助恐怖主義風險 C.應建立資產品質及分類之評估方法 D.建立資訊安全防護機制及緊急應變計畫","o":["僅A","僅A、C","僅B、C、D","A、B、C、D"],"a":3,"e":"答案(D)。依金融控股公司及銀行業內部控制及稽核制度實施辦法，銀行業風險控管機制應包括：監控資本適足性、建立資產品質及分類之評估方法並提足備抵呆帳、辨識衡量及管理洗錢及資助恐怖主義風險、建立資訊安全防護機制及緊急應變計畫等原則，A、B、C、D皆屬之。","c":1,"f":1,"ap":["E1-56"]},{"i":"E1-57","q":"依據銀行流動性覆蓋比率實施標準，自民國108 年1 月1 日起，流動性覆蓋比率之最低標準為下列何者？","o":["70%","80%","90%","100%"],"a":3,"e":"答案(D)。依銀行流動性覆蓋比率實施標準，流動性覆蓋比率(LCR)＝合格高品質流動性資產÷未來30個日曆日淨現金流出，自民國108年1月1日起最低標準為100%（淨穩定資金比率NSFR亦自107年起不得低於100%）。","c":14,"f":1,"ap":["E1-57"]},{"i":"E1-58","q":"依據銀行辦理衍生性金融商品業務內部作業制度及程序管理辦法，銷售結構型商品，應分類商品之風險程度，其考量要素包括下列哪些？ A.本金虧損之風險與機率 B.流動性 C.年期 D.手續費收入比率","o":["僅A","僅A、D","僅A、B、C","A、B、C、D"],"a":2,"e":"答案(C)。依銀行辦理衍生性金融商品業務內部作業制度及程序管理辦法，銀行銷售結構型商品應綜合考量本金虧損之風險與機率、流動性、商品年期（及商品結構複雜度）等要素，分類商品風險程度；「手續費收入比率」是銀行收益指標，與商品風險程度無關，故選僅A、B、C。","c":13,"f":1,"ap":["E1-58"]},{"i":"E1-59","q":"依據銀行自有資本與風險性資產計算方法說明及表格，關於市價評估交易對手風險損失(CVA)，下列敘述何者錯誤？","o":["屬於店頭市場衍生性金融商品交易均應計提","計算風險期間為1 年","交易對手之外部信用評等愈好，則適用權數愈高","因避險目的所購買之信用違約交換，具風險抵減效果"],"a":2,"e":"答案(C)。CVA（信用評價調整）風險係指店頭衍生性商品交易對手信用品質變動造成的市價損失，交易對手外部信用評等愈好，適用的風險權數應「愈低」而非愈高，故(C)錯誤。(A)店頭衍生性商品交易均應計提；(B)風險期間為1年；(D)為避險所購買的信用違約交換(CDS)具風險抵減效果，均正確。","c":12,"f":1,"ap":["E1-59"]},{"i":"E1-60","q":"關於主管機關為強化本國銀行對海外及大陸地區授信風險之控管，下列敘述何者錯誤？","o":["應依國家別及產業別採取分級管理措施，分別訂定國家及產業風險限額","因應總體經濟、政治發展情勢及金融環境變化，訂定控管調整機制及限額預警門檻","針對風險升高或暴險額已達限額預警門檻之國家或產業進行評估，必要時採凍結或暫停額度之措施","授信風險管理部門應定期檢視相關授信限額之適當性，並提報總經理"],"a":3,"e":"答案(D)。主管機關要求本國銀行對海外及大陸地區授信，應依國家別及產業別分級管理並訂定限額、訂定控管調整機制及預警門檻、對風險升高者必要時凍結或暫停額度；授信限額之適當性應由授信風險管理部門定期檢視並「提報董事會」，而非僅提報總經理，故(D)錯誤。","c":7,"f":1,"ap":["E1-60"]},{"i":"E2-2","q":"銀行有效發揮「風險分散效應」(Diversification Effects)，具有下列何種財務涵義？","o":["使銀行的總風險小於個別業務的風險相加","銀行的信用風險比市場風險，更應受到重視","總行管理單位承擔的風險責任，宜分散配置給予分行營業單位","全行的總風險限額宜按照組織結構，分配至各營業單位"],"a":0,"e":"答案(A)。風險分散效應是指各項業務的風險並非完全正相關，彼此可部分抵銷，使銀行整體的總風險小於個別業務風險的簡單加總。(B)(C)(D)談的是風險重要性比較或限額分配方式，並非分散效應的財務涵義。","c":1,"f":1,"ap":["E2-2"]},{"i":"E2-6","q":"下列何者不包含於經濟移轉價格(Economic Transfer Prices)？","o":["預定的利潤目標","與資金來源有關的借款成本","與信用風險有關的呆帳準備","與流動性風險有關的流動性貼水"],"a":0,"e":"答案(A)。依教材，擬定經濟移轉價格需考量的因子為：與資金來源有關的借款成本、與信用風險有關的呆帳準備、與流動性風險有關的流動性貼水；「預定的利潤目標」是訂定顧客價格時另行加上的部分，不屬於經濟移轉價格的構成要素。","c":2,"f":3,"ap":["E2-6","E5-28","E6-3"]},{"i":"E2-8","q":"關於資金移轉價格，下列何者錯誤？","o":["銀行的營運政策及顧客價格，與資金移轉價格系統的訂價策略無關","資金移轉價格的首要功能是適當調撥各部門和分行的剩餘與不足資金","本國銀行資金移轉價格系統中，扮演居中協調的單位主要是指總行的財務部","移轉價格的訂定可誘導相關部門或行員，落實推動高階主管屬意的業務項目"],"a":0,"e":"答案(A)。資金移轉價格系統的訂價策略應反映銀行營運目標及市場狀況，顧客價格（存放款利率）也是以內部移轉價格加減利潤目標訂定，因此與營運政策及顧客價格密切相關，(A)錯誤。(B)首要功能是調撥各單位資金餘缺；(C)居中協調者通常為總行財務部；(D)可引導業務推動，均正確。","c":2,"f":2,"ap":["E2-8","E3-4"]},{"i":"E2-11","q":"有關成本觀念的敘述，下列何者錯誤？","o":["可控制成本又稱變動成本，不宜與固定成本相混淆","每項產品的邊際貢獻，是由該產品的售價減去變動成本而得","直接材料加上直接人工，合稱「直接成本」或「變動成本」","沉沒成本(Sunk Cost)類似固定成本，無論產銷及環境如何變化，它依然發生"],"a":0,"e":"答案(A)。可控制成本是指管理者在其權責範圍內能影響或決定的成本，與「變動成本」（隨產量變動的成本）分類依據不同，兩者不可畫上等號，故(A)錯誤。(B)邊際貢獻＝售價－變動成本；(C)直接材料加直接人工為直接成本；(D)沉沒成本已發生且無法改變，均正確。","c":2,"f":1,"ap":["E2-11"]},{"i":"E2-13","q":"回顧美國的儲蓄貸款機構於1980 年代的倒閉風潮，係為下列何種風險威脅金融機構的例證？","o":["國家風險","再融資風險","再投資風險","市場價值風險"],"a":1,"e":"答案(B)。1980年代美國儲貸機構以短期存款支應長期固定利率房貸，形成「借短貸長」的部位；市場利率大幅上升時，到期負債須以更高利率再融資，利差轉為負值，導致大量倒閉，是「再融資風險」的典型例證。","c":14,"f":2,"ap":["E2-13","E5-4"]},{"i":"E2-17","q":"下列何者不屬於銀行辦理企業之經常性融資業務？","o":["票據融通","自創品牌放款","擔保透支","短期放款"],"a":1,"e":"答案(B)。經常性融資以協助企業短期週轉金為目的，包括票據融通、短期放款、透支（含擔保透支）等；「自創品牌放款」用於企業中長期發展，屬於中長期融資。","c":4,"f":1,"ap":["E2-17"]},{"i":"E2-18","q":"衡量企業取得資金之後的經營效能，下列何者錯誤？","o":["存貨週轉率越高企業經營效能越好","應收帳款週轉率越高企業經營效能越好","總資產週轉率越高企業經營效能越好","應付帳款週轉率越高企業經營效能越好"],"a":3,"e":"答案(D)。存貨週轉率、應收帳款週轉率、總資產週轉率愈高，代表資產運用與回收效率愈高，經營效能愈好，(A)(B)(C)正確。應付帳款週轉率＝銷貨成本÷平均應付帳款，週轉率高代表付款給供應商較快、議價能力較弱；依教材此指標一般是「越低越好」（議價能力強、可較晚付款），不能說越高經營效能越好，故(D)錯誤。","c":4,"f":1,"ap":["E2-18"]},{"i":"E2-21","q":"關於本國銀行以「內保外貸」方式承作陸資企業之運作模式，係指下列何者？","o":["借款企業需提供外資銀行開立的擔保信用狀，以擔保借款人履行合約之義務或責任","借款企業之負責人需提供連帶保證，擔保借款人履行合約之義務或責任","借款企業需提供銀行存單做為放款之擔保品","借款企業需提供其境外子公司做為放款擔保人，共同承擔履約義務"],"a":0,"e":"答案(A)。「內保外貸」係指借款企業須提供（境內）外資銀行開立的擔保信用狀(SBLC)，由開狀銀行擔保借款人履行合約之義務或責任，本國銀行據以對陸資企業授信。負責人連帶保證、存單質押或子公司擔保都不是內保外貸的定義。","c":4,"f":2,"ap":["E2-21","E5-18"]},{"i":"E2-22","q":"甲公司該年度相關財務數字如下：銷貨收入7,500 萬元、銷貨毛利2,800 萬元、營業費用2,200 萬元、流動資產700萬元、流動負債220 萬元、利息費用150 萬元、長期資產淨額800 萬元，請計算其利息保障倍數？","o":["4.0","5.1","6.3","8.8"],"a":0,"e":"答案(A)。利息保障倍數＝稅前息前盈餘(EBIT)÷利息費用。EBIT＝銷貨毛利－營業費用＝2,800－2,200＝600萬元；利息保障倍數＝600÷150＝4.0倍。流動資產、流動負債、長期資產等為干擾數據。","c":4,"f":3,"ap":["E2-22","E4-17","E6-54"]},{"i":"E2-23","q":"下列敘述，何者正確？","o":["金管會2009 年4 月推動消費者債務清償條例","台灣於1975 年9 月開辦助學貸款","台灣於1994 年將助學貸款之對象擴大，並更名為就學貸款","台灣於1989 年首先開辦萬事達卡(MasterCard)，其後為威士卡(VisaCard)、美國運通(AE)卡與日本JCB 卡"],"a":2,"e":"答案(C)。我國於民國65年(1976年)開辦「助學貸款」，民國83年(1994年)擴大辦理對象並更名為「就學貸款」，故(C)正確、(B)年份錯誤。(A)應為「消費者債務清理條例」，屬司法院主管、於2008年4月施行，並非金管會2009年推動的「清償條例」；(D)所述信用卡發卡年份與順序亦不符史實。","c":5,"f":2,"ap":["E2-23","E4-18"]},{"i":"E2-24","q":"購置住宅貸款之借款客戶要降低還本付息的壓力時，則可以在最初幾年申請「寬限期」，辦理下列何者？","o":["付息不還本","還本不付息","不還本不付息","少還本少付息"],"a":0,"e":"答案(A)。房貸「寬限期」是指在貸款初期的一段期間內，借款人只需繳付利息、暫不攤還本金（付息不還本），以減輕前幾年的還款壓力；寬限期滿後再開始本息攤還。","c":5,"f":2,"ap":["E2-24","E6-18"]},{"i":"E2-25","q":"關於消費性放款之信用評分制度，下列敘述何者錯誤？","o":["系統量化評分後，即不准再執行額外人為輔助之加減分異動","借款人容易在申請時隱匿不利之個人資訊，導致違約率上升","銀行依信用評分決定准駁和最高申貸金額","常理上，銀行降低信用評分的准駁標準，會提高信用風險規模"],"a":0,"e":"答案(A)。信用評分系統量化評分後，仍可由授信人員依質化資訊進行適度的人為輔助調整（加減分），並非一律不准異動，故(A)錯誤。(B)借款人可能隱匿不利資訊（逆選擇）；(C)銀行依評分決定准駁與額度；(D)降低准駁標準會擴大信用風險，均正確。","c":5,"f":1,"ap":["E2-25"]},{"i":"E2-27","q":"Moody’s 將短期別債券之信用等級分為Prime-1、Prime-2、Prime-3 以及Not-Prime。請問其中Not-Prime 類似於長期債券哪個信用等級以下？","o":["Aa1","A1","Baa1","Ba1"],"a":3,"e":"答案(D)。Moody's短期評等分為Prime-1、Prime-2、Prime-3及Not-Prime，前三者屬投資級；Not-Prime類似長期債券Ba1（含）以下的投機級等級（長期Baa3以上為投資級）。","c":6,"f":2,"ap":["E2-27","E6-23"]},{"i":"E2-28","q":"Moody’s 採取由上而下(Top-Down)的評估方式，檢視受評公司的風險等級。所謂由上而下的評估方式，係指下列何者？","o":["由Aaa 信用等級至C 信用等級","由國家風險至產業風險至企業風險的風險層次","上至總經理下至各執行部門，逐一檢視各單位風險狀況","由該公司於所處產業之營運優劣排序，決定該公司之暴險等級"],"a":1,"e":"答案(B)。Moody's衡量受評公司信用風險採由上而下(Top-Down)的架構，依序評估國家風險→產業風險→企業（個別公司）風險。(A)是等級排列，(C)是組織層級檢視，均非其意涵。","c":6,"f":3,"ap":["E2-28","E3-21","E5-34"]},{"i":"E2-29","q":"有關信用等級移轉矩陣，下列敘述何者錯誤？","o":["信用等級不同可反應相對不同的違約機率","信評機構透過轉移矩陣分析，統計不同時期之評等等級的變動機率","期初信用等級愈佳，期末仍維持在原來等級的機率愈低","期初信用等級愈差，則期末違約的機率愈高"],"a":2,"e":"答案(C)。信用等級移轉矩陣顯示，期初信用等級愈佳，期末仍維持原等級的機率通常「愈高」（信用品質較穩定），而非愈低，故(C)錯誤。(A)不同等級反映不同違約機率；(B)信評機構以移轉矩陣統計等級變動機率；(D)期初等級愈差、期末違約機率愈高，均正確。","c":6,"f":1,"ap":["E2-29"]},{"i":"E2-30","q":"為避免承擔過高的信用風險，銀行會以客戶和產業為對象訂定風險限額。由內部評等模型所計算出的風險限額稱為下列何者？","o":["風險值","授信總餘額","融資額度","信用暴險額"],"a":0,"e":"答案(A)。銀行以內部自建的評等模型，依客戶違約機率、暴險額及違約損失率計算出的風險限額，稱為「（信用）風險值」。授信總餘額、融資額度與信用暴險額則是額度或暴險金額概念，不是模型算出的風險限額。","c":12,"f":3,"ap":["E2-30","E5-23","E6-26"]},{"i":"E2-31","q":"已知A 銀行之總資產為6,000 億和淨值為800 億元，下列敘述何者正確？","o":["A 銀行對同一自然人之授信總餘額不得超過30 億元","A 銀行對同一自然人之無擔保授信總餘額不得超過8 億元","A 銀行對同一法人之授信總餘額不得超過100 億元","A 銀行對同一法人之無擔保授信總餘額不得超過80 億元"],"a":1,"e":"答案(B)。依銀行法第33條之3授權規定，對同一自然人授信總餘額不得超過淨值3%、無擔保不得超過1%；同一法人授信總餘額不得超過淨值15%、無擔保不得超過5%。淨值800億：自然人無擔保上限＝800×1%＝8億元，(B)正確；自然人總額上限為24億（非30億），法人總額上限為120億（非100億），法人無擔保上限為40億（非80億）。","c":7,"f":1,"ap":["E2-31"]},{"i":"E2-32","q":"甲公司於開曼群島登記註冊，但未實際營運，為國家風險統計需要，應該匡計列入何者？","o":["開曼群島","中華民國","不列入統計","以資金主要使用所在地之國別認列"],"a":3,"e":"答案(D)。授信對象若在開曼群島、英屬維京群島等免稅地區註冊但未實際營運，國家風險統計時不以註冊地認列，而應以該信用風險對象「資金主要使用所在地」之國別認列，才能反映真實的國家風險。","c":7,"f":2,"ap":["E2-32","E5-35"]},{"i":"E2-33","q":"2010 年4 月哪個國家因公共債務佔國內生產毛額113%以上，遭S&P 調降主權評等，且長期公債評等由BBB+調降至CC？","o":["冰島","西班牙","希臘","古巴"],"a":2,"e":"答案(C)。2010年4月，希臘因公共債務占GDP比重過高（題載113%以上）、財政赤字惡化，遭S&P調降主權評等，引爆歐債危機；希臘屬歐豬五國(PIIGS：葡萄牙、義大利、愛爾蘭、希臘、西班牙)之一。冰島為2008年金融海嘯時的銀行危機。","c":8,"f":1,"ap":["E2-33"]},{"i":"E2-35","q":"關於「主權上限」之意義，下列敘述何者正確？","o":["任何企業之信用等級不得高於該國的主權評等","非投資級企業之長期債務評等不得高於該國的主權評等","投資級企業之短期債務評等不得高於該國的主權評等","非主權發行公司的信用等級可能高於主權評等"],"a":0,"e":"答案(A)。「主權上限」(Sovereign Ceiling)是指任何企業（發行人）的信用等級不得高於其所在國家的主權評等，因為企業償債可能受該國外匯管制等國家風險影響。(B)(C)只限定部分企業，(D)與主權上限意義相反。","c":8,"f":1,"ap":["E2-35"]},{"i":"E2-37","q":"比較臺灣主管機關對銀行與票券金融公司的資本適足率與業務限制，下列敘述何者錯誤？","o":["票券金融公司在金融控股公司法中，隸屬於銀行業，所以兩者的資本適足率相當類似","當銀行呈現資本顯著不足或資本嚴重不足，及票券金融公司的資本適足率未達8%，主管機關皆可命令「限期裁撤」分支機構","銀行及票券金融公司如未按照主管機關要求，在期限內提出資本重建或其他財務業務改善計畫，可對負責人減薪，或解除其職務","銀行的資本等級未達資本適足，票券金融公司的資本適足率未達8%或最低資本適足率要求，皆不得以「現金」分配盈餘或買回股份"],"a":1,"e":"答案(B)。銀行資本顯著不足（含嚴重不足）時，主管機關得命令限期裁撤分支機構或部門；但票券金融公司須資本適足率低於「6%」才得命令限期裁撤分支機構，未達8%時是不得設立分公司、命令提出資本重建或財務業務改善計畫、限制新增風險性資產等，故(B)錯誤。(A)金融控股公司法將票券金融公司歸屬於銀行業，兩者資本適足規範相近；(C)未依命令提出或執行資本重建、財務業務改善計畫者，得採取更嚴格之監理措施（如降低負責人報酬、解除職務）；(D)銀行未達資本適足、票券金融公司未達8%，均不得以現金分配盈餘或買回股份，(A)(C)(D)正確。","c":10,"f":2,"ap":["E2-37","E4-33"]},{"i":"E2-40","q":"有關證券業在不同資本適足率下之業務規範及限制，下列敘述何者錯誤？","o":["證券商申請辦理有價證券借貸業務、有價證券買賣融資融券，證券業務借貸款項時，申請日前半年的資本適足率應達150%以上","證券商申請合併，合併前六個月的資本適足率，均須達到200%以上，且申請前一個月之「擬制性合併」的資本適足率應達200%以上","證券商包銷有價證券時，包銷總金額不得超過其流動資產減流動負債後餘額之二十倍；自有資本適足率低於120%時，不得超過十倍","證券商辦理融資融券時，若資本適足率連續三個月達250%以上時，可以提高承作規模至融資或融券的總金額，分別不得超過淨值的400%"],"a":2,"e":"答案(C)。依規定，證券商包銷有價證券的包銷總金額不得超過其流動資產減流動負債後餘額的15倍；自有資本適足率低於120%時，不得超過5倍，並非20倍、10倍，故(C)錯誤。(A)申請借貸、融資融券業務須前半年達150%；(B)合併前6個月均須達200%且擬制性合併達200%；(D)連續3個月達250%以上，融資或融券總金額各可達淨值400%，均正確。","c":10,"f":2,"ap":["E2-40","E5-42"]},{"i":"E2-41","q":"關於保險公司申請從事衍生性金融商品交易之資格，請問其資本適足率至少須達多少以上？","o":["150%","200%","250%","300%"],"a":2,"e":"答案(C)。依「保險業從事衍生性金融商品交易管理辦法」第5條，保險業從事增加投資效益目的之衍生性金融商品交易，自有資本與風險資本之比率須達資本適足法定標準之1.25倍以上；出題當時（舊制RBC）法定標準為200%，故為200%×1.25＝250%。(A)150%為舊制資本不足區間下限、(B)200%為舊制法定最低標準、(D)300%為舊制「資本充裕」門檻，均非本題門檻。","c":10,"f":2,"ap":["E2-41","E6-51"],"g":"本題依舊制RBC（法定標準200%）作答；2026年起保險業改採TW-ICS新制，資本適足法定標準改為100%（講義資本等級表採新制：適足100%以上、不足50%～未達100%、顯著不足25%～未達50%、嚴重不足低於25%），若依新制換算門檻將不同，考試以官方答案(C)為準"},{"i":"E2-43","q":"信用風險的「標準法」，依據授信對象的「信用等級」，決定「風險權數」；目前國內銀行常用的信用等級資訊來源，下列敘述何者錯誤？","o":["公開資訊觀測站資訊","信用評等機構的信用資訊","銀行自行建立的信用評分模型","金融聯合徵信中心(JCIC)提供的「信用資料庫」"],"a":0,"e":"答案(A)。國內銀行用以決定風險權數的信用等級資訊來源，主要為信用評等機構的評等、銀行自建信用評分模型及聯徵中心(JCIC)的信用資料庫；「公開資訊觀測站」僅提供公開揭露的財務與重大訊息資料，並非信用等級的資訊來源。","c":12,"f":1,"ap":["E2-43"]},{"i":"E2-45","q":"商業銀行會衍生信用風險的金融業務包括，表內的企業金融業務與消費金融業務及表外的衍生性和非衍生性業務。關於表外非衍生性業務，下列敘述何者錯誤？","o":["選擇權","擔保信用狀","未動用額度的「承諾協議書」","循環式包銷融資"],"a":0,"e":"答案(A)。表外非衍生性業務包括擔保信用狀、未動用額度的放款承諾（承諾協議書）、循環式包銷融資(RUF)等；「選擇權」屬於表外「衍生性」業務（另有期貨、遠期契約、金融交換），故(A)錯誤。","c":15,"f":2,"ap":["E2-45","E5-60"]},{"i":"E2-47","q":"有關信用風險的資產分類與風險權數，將Basel I的標準法與Basel II比較，Basel II具有三項特色，下列敘述何者錯誤？","o":["借款期間愈長，信用風險愈低","借款期間愈長，信用風險愈高","借款人信用評等不同，以「風險權數」反映其差異","若借款人提供抵押品，計提自有資本時，可「向下」調整風險性資產"],"a":0,"e":"答案(A)。Basel II相較於Basel I的特色包括：考量借款期間（期間愈長，信用風險愈高）、以風險權數反映借款人信用評等差異、借款人提供合格擔保品時可向下調整風險性資產；(A)「借款期間愈長，信用風險愈低」與(B)相反，為錯誤敘述。","c":12,"f":1,"ap":["E2-47"]},{"i":"E2-52","q":"下列何種資金來源，屬於銀行「非自主性」的資金？","o":["央行融資","同業融資","權益資金","存款資金"],"a":3,"e":"答案(D)。存款資金的存入與提領由存戶決定，銀行無法主動控制其金額與時點，屬「非自主性」資金；央行融資、同業融資等屬銀行可主動籌措的「買入負債」，權益資金則屬自有資金。","c":13,"f":1,"ap":["E2-52"]},{"i":"E2-53","q":"實務上，觀察市場利率變動1 單位，對目標部位或金融商品價格的影響，此1 單位，依慣例係指多少？","o":["0.01%","0.10%","1%","2%"],"a":0,"e":"答案(A)。實務上觀察利率變動對部位價格的影響，以1個基本點(1 basis point, 1bp)為單位，依市場慣例1bp＝0.01%。例如敏感性係數5的資產，利率變動1bp時價值變動約0.05%。","c":13,"f":2,"ap":["E2-53","E10-56"]},{"i":"E2-54","q":"有關銀行之「流動準備」，依據中央銀行法第25 條暨銀行法第43 條訂定「金融機構流動性查核要點」，下列敘述何者錯誤？","o":["1978 年7 月起流動準備率為7%，按月計提","2011 年10 月起流動準備率為10%，按月計提","2011 年10 月起流動準備率為10%，按日計提","2014 年12 月底流動準備率高達31.22%"],"a":1,"e":"答案(B)。依金融機構流動性查核要點，1978年7月起流動準備率為7%；自2011年10月起提高為10%，並改為「按日」計提，而非按月，故(B)錯誤、(C)正確。(D)2014年12月底全體銀行流動準備比率達31.22%，遠高於法定標準。","c":14,"f":1,"ap":["E2-54"]},{"i":"E2-55","q":"銀行資產負債部位的特性不同，其持有水準與波動情況也會有所差異，有關利率風險管理的重新訂價缺口的監督，下列敘述何者錯誤？","o":["類似流動性缺口指標是以不同天期「累計」概念衡量","實務上，利率風險的缺口指標，適合就個別營業單位做觀察","實務上，利率風險的缺口指標，均以全行或其銀行簿的部位為主","部位幣別以新台幣與美金計價兩種為主，人民幣計價的部位為輔"],"a":1,"e":"答案(B)。實務上利率風險的重新訂價缺口指標，均以全行或其銀行簿的部位為主進行觀察，不適合就個別營業單位觀察，故(B)錯誤、(C)正確。(A)與流動性缺口類似，以不同天期累計概念衡量；(D)幣別以新臺幣及美元為主、人民幣為輔，均正確。","c":14,"f":2,"ap":["E2-55","E4-52"]},{"i":"E2-56","q":"下列何者不屬於「存款準備」部位？","o":["庫存現金","存款負債","存款準備金帳戶餘額","跨行業務清算基金專戶的存款"],"a":1,"e":"答案(B)。存款準備部位（實際準備金）係銀行的資產，包括庫存現金、在央行或受託收管機構的準備金帳戶存款、跨行業務清算基金專戶存款等；「存款負債」是銀行應提存準備金的對象（負債），本身不屬於存款準備部位。","c":11,"f":2,"ap":["E2-56","E4-54"]},{"i":"E2-58","q":"有關銀行的作業風險管理，從監督管理層面觀察有三道防線，下列敘述何者錯誤？","o":["第一道防線，包括海內外分子行、總行部級的營業單位","第二道防線，總行業務管理單位、風險控管及法律遵循部門","第三道防線，銀行董事會轄下的稽核處或稽核室","第三道防線，不包括董事會轄下的風險管理委會、監事會"],"a":3,"e":"答案(D)。作業風險三道防線：第一道為營業單位（含海內外分子行、總行部級營業單位）的自評與自行查核；第二道為總行業務管理、風險控管及法令遵循部門；第三道為董事會轄下的稽核單位，並包括董事會轄下的風險管理委員會、監事會（監察人），故(D)「不包括」錯誤。","c":15,"f":1,"ap":["E2-58"]},{"i":"E2-59","q":"依據金管會「銀行資本適足性及資本等級管理辦法」(103.01.09)，有關「風險性資產總額」，指信用風險加權風險性資產總額，加計市場風險及作業風險應計提之資本乘以多少之合計數，下列敘述何者正確？","o":["12","12.5","15","18"],"a":1,"e":"答案(B)。風險性資產總額＝信用風險加權風險性資產總額＋（市場風險應計提資本＋作業風險應計提資本）×12.5。12.5為8%最低資本要求的倒數(1÷8%)，用以將資本計提額轉換為風險性資產。","c":9,"f":1,"ap":["E2-59"]},{"i":"E3-2","q":"面對風險問題的態度，下列何者錯誤？","o":["主管責任大於部屬","使用最高且相同的單一行為標準看待所有員工","不可忽略組織成員的權責差異","宜區分為出資的所有者與被雇用的員工"],"a":1,"e":"答案(B)。面對風險問題應考量組織成員的權責差異：主管責任大於部屬、應區分出資的所有者與受雇員工，不宜以「最高且相同的單一行為標準」看待所有員工與主管，故(B)錯誤，(A)(C)(D)正確。","c":1,"f":2,"ap":["E3-2","E4-1"]},{"i":"E3-3","q":"關於銀行用以整合組織目標與單位目標之管理機制，下列敘述何者錯誤？","o":["單軌制的內部轉撥價格相較於多軌制的內部轉撥價格更能正確反映政策目標","根據風險資本的配置系統(Capital allocation system)，應將營業單位、業務項目和交易活動的所有風險，緊密地與銀行自有資本搭配","各項業務及主管的風險權限若能按照「風險值」衡量，則風險資本的配置與績效目標達成與否的研判將更加客觀","總行財務部可以使用聯行往來的資金調撥系統，剖析各分支機構和分行等營業單位的營業利潤，並引導其業務重點配合全行的經營政策"],"a":0,"e":"答案(A)。多軌制內部轉撥價格可依不同資金來源與去路設定不同利率，較單軌制更能引導業務、正確反映政策目標，故(A)敘述相反而錯誤。(B)風險資本配置應使各單位風險與自有資本緊密搭配；(C)以風險值衡量風險權限使績效研判更客觀；(D)總行財務部可透過聯行往來調撥系統剖析營業單位利潤並引導業務，均正確。","c":2,"f":1,"ap":["E3-3"]},{"i":"E3-6","q":"下列何者是不適當的資金移轉價格制度？","o":["銀行若要加強推動授信業務，則訂定的「借用利率」宜降低","當銀行資金浮濫時，宜調高供應利率，以減少吸收定期存款","多種供應來源與運用去路的利率，稱其為「多軌制」的聯行往來利率","銀行若要鼓勵吸收「活期存款」、減少「定期存款」，則對提供「活期存款」的供應利率，宜相對優於「定期存款」"],"a":1,"e":"答案(B)。銀行資金浮濫（過剩）時，應「調低」對營業單位的供應利率，降低其吸收定期存款的誘因，而非調高，故(B)不適當。(A)要推動授信可降低借用利率；(C)多種來源與去路利率即多軌制；(D)要鼓勵活存可給予活存較優的供應利率，均適當。","c":2,"f":1,"ap":["E3-6"]},{"i":"E3-8","q":"關於成本與收入觀念，下列敘述何者錯誤？","o":["責任中心體系包括投資中心在內","成本中心追求最低成本，利潤中心強調利潤最高","成本中心的主管通常無權決定產品售價","任何收入中心的主管，均應有權決定行銷產品的數量多寡與售價高低"],"a":3,"e":"答案(D)。收入中心以銷售收入衡量績效，其主管通常只能決定行銷數量或努力程度，未必有權決定產品售價，故「任何收入中心主管均應有權決定數量與售價」錯誤。(A)責任中心包括成本、收入、利潤與投資中心；(B)(C)正確。","c":2,"f":1,"ap":["E3-8"]},{"i":"E3-9","q":"下列哪個項目不包括於可控制成本中？","o":["直接材料","直接人工","沉沒成本","半變動成本"],"a":2,"e":"答案(C)。可控制成本是管理者在權責範圍內能影響的成本，如直接材料、直接人工、半變動成本等；「沉沒成本」為過去已發生、無法因任何決策而改變的成本，不屬於可控制成本。","c":2,"f":2,"ap":["E3-9","E5-29"]},{"i":"E3-10","q":"下列何者不屬於銀行實務上所稱「買入負債」的融資行為？","o":["在債券市場，買入「金融債券」","在貨幣市場，發行「可轉讓定期存單」","在同業拆款市場，籌措「同業融資」的途徑","在重貼現及短期融通市場，辦理「央行融資」"],"a":0,"e":"答案(A)。「買入負債」是銀行主動向市場借入資金的融資行為，如在貨幣市場發行可轉讓定期存單、在同業拆款市場籌措同業融資、向央行辦理重貼現及短期融通等；在債券市場「買入」金融債券是投資行為，屬於資產而非負債。","c":13,"f":1,"ap":["E3-10"]},{"i":"E3-12","q":"「借短貸長」的資金部位，可能存在何種風險？","o":["再投資風險","再融資風險","市場價值變化的風險","信用風險"],"a":1,"e":"答案(B)。「借短貸長」是以短期負債支應長期資產，負債先到期時須在市場重新借款，若利率上升則融資成本提高、利差縮小，此為「再融資風險」。反之「借長貸短」面臨的是再投資風險。","c":14,"f":1,"ap":["E3-12"]},{"i":"E3-13","q":"關於銀行票據承兌業務，下列何者錯誤？","o":["銀行代替委託人，為其賣方所發匯票之付款人提供承兌，稱為「買方委託承兌」","買方業者基於資金調度考量，進口貨物時常開發「即期信用狀」取代「遠期信用狀」","銀行受理之賣方委託承兌，旨在協助賣方將取得的「遠期支票」轉換為「銀行承兌匯票」","賣方在提供商品或勞務時，將買方給予的遠期支票，轉讓與往來銀行，請銀行依照支票金額擔任付款人於票據到期時承兌"],"a":1,"e":"答案(B)。買方業者基於資金調度考量，進口貨物時通常開發「遠期信用狀」（延後付款），而非以即期信用狀取代遠期信用狀，故(B)錯誤。(A)銀行代買方為賣方所發匯票擔任付款人承兌，為買方委託承兌；(C)(D)賣方委託承兌係將遠期支票轉換為銀行承兌匯票，均正確。","c":4,"f":1,"ap":["E3-13"]},{"i":"E3-15","q":"關於財務比率分析，下列敘述何者錯誤？","o":["企業之預付費用變高，會導致速動比率降低，反應短期償債能力變差","企業之財務槓桿比率愈高，反映承擔之財務風險愈大","企業之存貨週轉率愈高，反應其庫存管理能力愈差及資金積壓壓力愈大","企業之應收帳款週轉率愈高，反應其現金回收速度越快"],"a":2,"e":"答案(C)。存貨週轉率愈高，代表存貨銷售速度愈快、庫存管理能力愈好、資金積壓愈少，故(C)敘述相反而錯誤。(A)預付費用增加使速動比率下降，短期償債能力變差；(B)財務槓桿愈高財務風險愈大；(D)應收帳款週轉率愈高現金回收愈快，均正確。","c":4,"f":1,"ap":["E3-15"]},{"i":"E3-16","q":"一般而言，關於企業之信用評分，下列敘述何者錯誤？","o":["負責人在業界之評價愈高，則違約機率愈低","企業內部組織運作愈健全，則違約機率愈低","企業跨足陌生產業，可以分散經營風險，所以違約機率可以降低","在業界中扮演龍頭地位之領導企業，其違約機率較低"],"a":2,"e":"答案(C)。企業跨足不熟悉的陌生產業，缺乏經驗與競爭優勢，經營風險反而上升，違約機率通常提高，不能視為分散風險，故(C)錯誤。負責人評價高、內部組織健全、居產業龍頭地位者，違約機率較低。","c":4,"f":1,"ap":["E3-16"]},{"i":"E3-17","q":"甲公司該年度相關財務數字如下：營業收入166 百萬元、營業成本92 百萬元、營業外收入5 百萬元、期初應收帳款淨額13 百萬元、期末應收帳款淨額28 百萬元，請計算其應收帳款週轉率為何？","o":["6.1","8.1","10.1","13.1"],"a":1,"e":"答案(B)。應收帳款週轉率＝營業收入÷平均應收帳款淨額。平均應收帳款＝(13＋28)÷2＝20.5百萬元；週轉率＝166÷20.5≒8.1次。營業成本與營業外收入為干擾數據。","c":4,"f":1,"ap":["E3-17"]},{"i":"E3-19","q":"成立於1997 年5 月的臺灣本土第一家信用評等公司為下列何者？","o":["臺灣信用評等公司","中華信用評等公司","聯合資信","金融聯合徵信中心"],"a":1,"e":"答案(B)。中華信用評等公司成立於1997年5月，是臺灣本土第一家信用評等公司（與S&P合作）。金融聯合徵信中心是信用資料庫機構，並非信用評等公司。","c":6,"f":1,"ap":["E3-19"]},{"i":"E3-20","q":"依據標準普爾信用評等機構之觀點，下列哪些指標可以衡量受評公司之現金流量是否足夠？A.營業利益/營業收入B.長短期借款/總資產 C.（正常營業活動的現金流量+利息費用）/利息費用 D.借款的還本期限","o":["僅C、D","僅A、D","僅C","A、B、C、D"],"a":0,"e":"答案(A)。依S&P觀點，衡量受評公司現金流量是否足夠的指標為：（正常營業活動的現金流量＋利息費用）÷利息費用，以及借款的還本期限（C、D）。A營業利益率屬獲利能力指標，B長短期借款÷總資產屬財務結構（負債）指標。","c":6,"f":2,"ap":["E3-20","E5-49"]},{"i":"E3-22","q":"有關標準普爾信用評等制度，下列敘述何者錯誤？","o":["分為長期及短期兩種評等類別","信用等級分為投資級和投機級兩大類","不考慮產業和規模差異，統一適用一般產業評等","針對短期債券的信用等級，以「A-1」為最好"],"a":2,"e":"答案(C)。S&P評等會考慮受評公司所屬產業特性與規模差異，並非不分產業規模一律適用一般產業評等，故(C)錯誤。(A)分長期與短期評等；(B)分投資級與投機級；(D)S&P短期債券評等以A-1級為最高等級（償債能力特強者可再加註「＋」成為A-1+，仍屬A-1級），均正確。","c":6,"f":1,"ap":["E3-22"]},{"i":"E3-23","q":"根據銀行法，授信業務對同一關係企業之風險限額，下列敘述何者正確？","o":["授信總餘額不得超過銀行淨值的30%，其中無擔保授信總餘額不得超過銀行淨值的10%","授信總餘額不得超過銀行淨值的15%，其中無擔保授信總餘額不得超過銀行淨值的5%","授信總餘額不得超過銀行淨值的40%，其中無擔保授信總餘額不得超過銀行淨值的15%","授信總餘額不得超過銀行淨值的45%，其中無擔保授信總餘額不得超過銀行淨值的10%"],"a":2,"e":"答案(C)。依銀行法第33條之3授權之規定，銀行對同一關係企業的授信總餘額不得超過銀行淨值的40%，其中無擔保授信總餘額不得超過淨值的15%。對照：同一自然人為3%／1%，同一法人為15%／5%。","c":7,"f":1,"ap":["E3-23"]},{"i":"E3-24","q":"甲公司於開曼群島登記註冊，但未實際營運，為國家風險統計需要，應該如何匡計認列？","o":["以開曼群島認列","以中華民國認列","不列入統計","以資金主要使用所在地之國別認列"],"a":3,"e":"答案(D)。授信對象在開曼群島等免稅地區註冊但未實際營運者，國家風險統計不以註冊地匡計，而應以資金主要使用所在地的國別認列，以反映實際承擔的國家風險。","c":7,"f":1,"ap":["E3-24"]},{"i":"E3-25","q":"關於國家風險與主權風險相關敘述，下列何者錯誤？","o":["外幣舉債所屬國發生政治或社會動亂屬於國家風險","外幣舉債所屬國貨幣大幅貶值屬於國家風險","任何企業的信用等級不得高於該國主權評等","外匯管制或短缺的情況屬於國家風險"],"a":2,"e":"答案(C)。政治社會動亂、貨幣大幅貶值、外匯管制或短缺，都屬於國家風險，(A)(B)(D)正確。「任何企業的信用等級不得高於該國主權評等」是「主權上限」的定義，並非國家風險或主權風險本身的內涵，故(C)錯誤。","c":8,"f":1,"ap":["E3-25"]},{"i":"E3-26","q":"依「臺灣地區與大陸地區金融業務往來及投資許可管理辦法」規定，銀行對中國的國家風險總額度不得超過下列何者？","o":["上年度決算後資本額的1 倍","上年度決算後資本額的1.5 倍","上年度決算後淨值的1 倍","上年度決算後淨值的1.5 倍"],"a":2,"e":"答案(C)。依臺灣地區與大陸地區金融業務往來及投資許可管理辦法第12條之1，臺灣地區銀行對大陸地區之授信、投資及資金拆存總額度，不得超過其上年度決算後「淨值」的1倍。","c":7,"f":1,"ap":["E3-26"]},{"i":"E3-27","q":"關於國家風險限額的核配，下列敘述何者錯誤？","o":["依據信評公司之評等核配國家風險額度，稱為靜態核配額度制度","依據信用違約交換的價格核配國家風險額度，稱為動態核配額度制度","靜態核配額度指標，係以信用加碼的基點來檢視交易對手的國際金融市場信用","當信用違約交換觸及標準，應凍結該國額度"],"a":2,"e":"答案(C)。國家風險限額核配分為：依信評公司評等核配的「靜態」制度，以及依信用違約交換(CDS)價格核配的「動態」制度；以信用加碼基點（CDS價格）檢視交易對手國在國際金融市場的信用，屬「動態」指標，故(C)錯誤。(D)CDS觸及標準應凍結該國額度，正確。","c":8,"f":1,"ap":["E3-27"]},{"i":"E3-28","q":"關於國家主權評等，下列哪些因子會影響其評等？ A.對外淨資產部位規模 B.貨幣管理健全性 C.政府債務規模 D.人口結構改變或不佳的外部衝擊，導致財政赤字加劇","o":["僅A、B","僅C、D","僅A、B、C","A、B、C、D"],"a":3,"e":"答案(D)。影響國家主權評等的因子包括：對外淨資產部位規模、貨幣管理健全性、政府債務規模，以及人口結構改變或不佳的外部衝擊導致財政赤字加劇等，A、B、C、D皆屬之。","c":8,"f":1,"ap":["E3-28"]},{"i":"E3-29","q":"臺灣近年來密集與大陸官方建立合作關係，下列敘述何者錯誤？","o":["2009 兩岸正式簽訂「金融MOU」","2010 年金管會公布立法院通過的兩岸金融三法","2013 年中央銀行宣布，臺灣銀行的廣州分行負責新臺幣在大陸的清算業務","2013 年中央銀行宣布，中國銀行台北分行擔任臺灣的人民幣清算行"],"a":2,"e":"答案(C)。兩岸貨幣清算機制中，中央銀行指定的新臺幣在大陸清算行為臺灣銀行「上海分行」，而非廣州分行，故(C)錯誤；人民幣在臺清算行為中國銀行臺北分行，(D)正確。(A)2009年兩岸簽署金融MOU；(B)2010年兩岸金融相關法規修正通過，亦為教材所述。","c":8,"f":1,"ap":["E3-29"]},{"i":"E3-30","q":"有關各種風險之資本計提，下列敘述何者錯誤？","o":["信用風險加權風險性資產，係衡量交易對手不履約，致銀行產生損失的風險","市場風險應計提之資本係衡量市場價格波動，致銀行資產產生損失之風險，所需計提之資本","風險性資產總額為信用風險加權風險性資產，加計市場風險及作業風險應計提之資本乘以12.5 之合計數","作業風險應計提之資本，係在衡量銀行因內部作業、人員及系統之不當或失誤，造成損失之風險，所需計提之資本，但不包含外部事件造成損失之風險"],"a":3,"e":"答案(D)。作業風險係指因內部作業、人員及系統之不當或失誤，「或因外部事件」造成損失之風險，作業風險應計提之資本須涵蓋外部事件，故(D)錯誤。(A)信用風險為交易對手不履約；(B)市場風險為市場價格波動；(C)風險性資產總額＝信用RWA＋（市場＋作業風險資本）×12.5，均正確。","c":15,"f":1,"ap":["E3-30"]},{"i":"E3-32","q":"A 銀行在104 年6 月之信用風險加權風險性資產為新臺幣（以下同）1,000 億元，市場風險和作業風險應計提資本各為5 億元，請問其加權風險性資產總額為下列何者？","o":["1,000 億元","1,005 億元","1,010 億元","1,125 億元"],"a":3,"e":"答案(D)。加權風險性資產總額＝信用風險加權風險性資產＋（市場風險應計提資本＋作業風險應計提資本）×12.5＝1,000＋(5＋5)×12.5＝1,000＋125＝1,125億元。","c":9,"f":1,"ap":["E3-32"]},{"i":"E3-33","q":"票券金融公司之資本適足率須至少達到多少以上，才可以辦理外幣債券及股權商品的投資？","o":["8%","9%","10%","12%"],"a":2,"e":"答案(C)。依規定，票券金融公司資本適足率須達10%以上，才可辦理外幣債券及股權商品的投資。對照：未達8%不得設立分公司、不得以現金分配盈餘；達13%者短期票券保證背書總餘額得達淨值5.5倍。","c":10,"f":1,"ap":["E3-33"]},{"i":"E3-34","q":"有關銀行因資本適足率而受到之業務規範與限制，下列敘述何者錯誤？","o":["在中國大陸設立代表人辦事處，則資本適足率須達到8%以上","資本適足等級之銀行可發行現金儲值卡","申請轉投資金融相關事業，應將本次申請投資金額納入計算後之資本適足率達到資本適足等級","銀行的資本等級屬於資本顯著不足，不得使用現金分配盈餘"],"a":0,"e":"答案(A)。銀行在中國大陸設立代表人辦事處，最近半年資本適足率須達10%以上（教材所列標準），並非8%，故(A)錯誤。(B)資本適足等級銀行可發行現金儲值卡；(C)申請轉投資須將本次投資金額納入計算後仍達資本適足等級；(D)資本顯著不足者不得以現金分配盈餘，均正確。","c":9,"f":2,"ap":["E3-34","E4-36"]},{"i":"E3-36","q":"關於保險業之資本適足率規範，下列敘述何者錯誤？","o":["以風險基礎資本額衡量資本適足率","最低法定比率不得低於300%","自2013 年6 月底開始，比率大於300%者，視為資本充裕","資本適足率＝（自有資本／風險資本）*100%"],"a":1,"e":"答案(B)。保險業以風險基礎資本(RBC)衡量資本適足率，資本適足率＝(自有資本÷風險資本)×100%，法定最低標準為200%，不是300%，故(B)錯誤。(C)自2013年6月底起，比率達300%以上者視為「資本充裕」，為教材分級內容。","c":10,"f":1,"ap":["E3-36"],"g":"本題依舊制RBC（法定標準200%、300%以上視為資本充裕）作答；2026年起保險業改採TW-ICS新制，資本適足法定標準改為100%（講義資本等級表採新制：適足100%以上、不足50%～未達100%、顯著不足25%～未達50%、嚴重不足低於25%）"},{"i":"E3-37","q":"倘若證券商計畫向主管機關申請於其營業處所經營衍生性業務，其最近六個月每月申報的資本適足率至少均須超過下列何者？","o":["100%","150%","200%","250%"],"a":2,"e":"答案(C)。依規定，證券商申請在營業處所經營衍生性金融商品業務，最近六個月每月申報的自有資本適足比率均須超過200%。對照：低於150%得暫緩新種業務；連續3個月達250%以上，融資或融券總金額可達淨值400%。","c":10,"f":1,"ap":["E3-37"]},{"i":"E3-38","q":"關於金融控股公司之資本適足率規範，下列敘述何者錯誤？","o":["轄下子公司可以豁免遵守各業別資本適足率規範","集團之資本適足率不得低於100%","未達最低法定比率標準，不得以現金分配盈餘","申請轉投資事業時，其合併本次投資後之集團資本適足率須達100%以上"],"a":0,"e":"答案(A)。金融控股公司合併資本適足性管理辦法要求，金控之子公司仍應符合各業別資本適足性規範，不得豁免，故(A)錯誤。(B)集團資本適足率不得低於100%；(C)未達標準不得以現金分配盈餘；(D)申請轉投資時合併本次投資後須達100%以上，均正確。","c":9,"f":1,"ap":["E3-38"]},{"i":"E3-39","q":"營業單位之信用風險控管，包括分行、區域中心、總行審查部與總經理層級，當高階主管（稱專業經理人）可能在不當利益引誘下，下達下列何種決策，會導致銀行承擔信用損失？","o":["主管對授信議題之客觀與主觀偏好","達成單位盈餘目標","逆選擇與道德風險","遵守營業單位之總授信額度"],"a":2,"e":"答案(C)。高階專業經理人與銀行（股東）之間存在資訊不對稱與代理問題，若受不當利益引誘，可能在授信前做出「逆選擇」（將資金貸給高風險者），或在授信後出現「道德風險」行為，導致銀行承擔信用損失。主觀偏好、達成盈餘目標、遵守總授信額度均非此意。","c":12,"f":1,"ap":["E3-39"]},{"i":"E3-40","q":"客戶之違約風險係由違約事件的發生機率來描述，銀行經營業務可能面對的違約行為，下列敘述何者錯誤？","o":["經濟違約","尚未履行付款義務之違約","交易對手未遵守契約規定的違約","掌握擔保品的處分權與第三人的保證"],"a":3,"e":"答案(D)。銀行可能面對的違約行為包括：經濟違約（客戶資產市值低於負債市值）、尚未履行付款義務之違約（逾期放款、催收款及呆帳）、交易對手未遵守契約規定的技術性違約；「掌握擔保品處分權與第三人保證」是降低損失的回收手段，並非違約類型，也不代表沒有違約問題。","c":12,"f":1,"ap":["E3-40"]},{"i":"E3-41","q":"當授信客戶發生違約時，銀行想辦法回收部分違約損失，以減輕信用損失的負擔；實務上，銀行的「債權管理」仍會發生之風險，有關回收風險，下列何者非屬之？","o":["擔保品風險","第三人保證的風險","簽訂的法律契約風險","違約機率固定且已知風險"],"a":3,"e":"答案(D)。銀行債權管理的回收風險包括：擔保品風險（價值下跌、處分困難）、第三人保證的風險、簽訂的法律契約風險等。「違約機率固定且已知」描述的是違約風險的假設條件，不屬於回收風險。","c":12,"f":1,"ap":["E3-41"]},{"i":"E3-43","q":"有關表外業務之信用風險，分為衍生性與非衍生性兩類，其中衍生性業務不包括下列何者？","o":["股票(Stock)","期貨(Future)","選擇權(Option)","金融交換(SWAP)"],"a":0,"e":"答案(A)。表外衍生性業務包括期貨、遠期契約、選擇權、金融交換(SWAP)等；「股票」是現貨權益證券，屬表內投資資產，不是衍生性商品。","c":15,"f":3,"ap":["E3-43","E5-25","E23-32"]},{"i":"E3-44","q":"計算Basel II 之「表內」風險性資產與信用風險的資本計提額，銀行之資本適足率(BIS)須滿足三條件，假設銀行之合格資本$4,500,000，下列敘述何者錯誤？","o":["槓桿比率＝核心資本÷總資產≧4%","第一類資本÷風險性資產≧4%","（第一類資本＋第二類資本＋第三類資本）÷風險性資產≧8%","如總資產$100,000,000，則槓桿比率＝4%"],"a":3,"e":"答案(D)。題目合格資本4,500,000，若總資產100,000,000，槓桿比率＝4,500,000÷100,000,000＝4.5%，並非4%，故(D)錯誤。(A)核心資本÷總資產≧4%、(B)第一類資本÷風險性資產≧4%、(C)(第一類＋第二類＋第三類資本)÷風險性資產≧8%為教材所列Basel II表內資本計提三條件。","c":9,"f":1,"ap":["E3-44"]},{"i":"E3-45","q":"從全行角度衡量「市場風險」，不論單一金融商品、組合部位或全行資產負債觀點，最常見的市場因素不包括下列何者？","o":["利率","匯率","生產要素成本","生產要素的估計價格"],"a":3,"e":"答案(D)。市場風險最常見的市場因素為利率、匯率、股價及商品價格（如生產要素成本、石油價格）等可在市場觀察到的價格；「生產要素的估計價格」並非市場實際交易形成的價格，不屬於衡量市場風險的市場因素。","c":13,"f":1,"ap":["E3-45"]},{"i":"E3-46","q":"財務處的交易部位超過風險限額時，下列何種處理方法錯誤？","o":["提前解約","只要是獲利狀態，事後報備就可","請更高層級主管，在職權範圍增加限額","將超過部位轉售第三者"],"a":1,"e":"答案(B)。交易部位超過風險限額時，無論處於獲利或虧損狀態，都必須立即依規定處理，如提前解約、將超限部位轉售第三者，或請更高層級主管在職權範圍內增加限額；「只要獲利就事後報備」會破壞限額控管，為錯誤做法。","c":13,"f":1,"ap":["E3-46"]},{"i":"E3-47","q":"銀行可藉由「損失波動幅度」與「波動倍數」的相乘，估算部位的何種指標？","o":["信用風險值或限額","市場風險值或限額","作業風險值或限額","信用損失的期望值與標準差"],"a":1,"e":"答案(B)。市場風險值(VaR)＝損失波動幅度（標準差σ×敏感性係數）×波動倍數（依信賴水準對應的Z值），用以估算部位在一定信賴水準下的最大可能損失，並可作為市場風險限額的依據。","c":13,"f":1,"ap":["E3-47"]},{"i":"E3-48","q":"原來為10,000 元的債券，敏感性係數為5 時，殖利率上升1 個基本點(Basis Point)，請問此時的債券價格應為多少元？","o":["9,950 元","9,500 元","9,995 元","500 元"],"a":2,"e":"答案(C)。1個基本點＝0.01%＝0.0001。價格變動率≒－敏感性係數×殖利率變動＝－5×0.0001＝－0.05%；新價格＝10,000×(1－0.0005)＝9,995元。","c":13,"f":2,"ap":["E3-48","E21-34"]},{"i":"E3-49","q":"計算市場風險之主要部位變動幅度，當利率、匯率或石油價格等市場因素變動「一單位」時，觀察目標部位或金融商品的價格變動幅度之指標稱為下列何者？","o":["風險係數","波動幅度","向下風險","敏感性係數"],"a":3,"e":"答案(D)。當利率、匯率或石油價格等市場因素變動一單位時，目標部位或金融商品價格的變動幅度，最直接的衡量指標是「敏感性係數」（如存續期間、Delta；例如敏感性係數5的債券，利率變動1bp＝0.01%時，價格約變動0.05%）。講義雖將(B)波動幅度、(C)向下風險也和敏感性係數並列為此類指標，但依定義最精確對應「變動一單位」的是敏感性係數；(A)「風險係數」則不屬於此類指標（講義同題講義第13章第23題問「何者錯誤」，答案就是風險係數）。","c":13,"f":1,"ap":["E3-49"],"g":"講義將波動幅度、向下風險與敏感性係數並列為此類指標，(B)(C)亦有爭議；官方答案取最精確的敏感性係數"},{"i":"E3-50","q":"銀行發行票券或債券商品，迄今仍流通在外的餘額，實務上，係稱為下列何者？","o":["買入票券或債券","金融資產","金融負債","長部位"],"a":2,"e":"答案(C)。銀行發行票券或債券商品，迄今仍流通在外（未到期）的餘額，屬銀行應償還的債務，實務上稱為「金融負債」。買入票券或債券屬金融資產；長部位指持有多頭部位。","c":13,"f":2,"ap":["E3-50","E6-39"]},{"i":"E3-51","q":"有關銀行之利率風險管理，下列敘述何者錯誤？","o":["主要工具以「資產管理」為主","評估銀行的資金成本與運用收益","主要工具以「重新訂價缺口模型」為主","透過資產負債表探討資金來源與資金運用項目的系統分析"],"a":0,"e":"答案(A)。銀行利率風險管理屬「資產負債管理」的範疇，透過資產負債表系統分析資金來源與運用，評估資金成本與運用收益，主要工具為重新訂價缺口模型；並非只以「資產管理」為主，故(A)錯誤。","c":14,"f":1,"ap":["E3-51"]},{"i":"E3-52","q":"重新訂價的缺口又稱「資金缺口」，有關資金缺口的描述，下列敘述何者錯誤？","o":["某天期的敏感性資產與敏感性負債相減而得","敏感性資產除以敏感性負債大於0 時，稱為「正」資金缺口","利率由高往低下滑時，適合採用「負」資金缺口策略","利率處於最高點或低谷時，適合採用「零」資金缺口策略"],"a":1,"e":"答案(B)。資金缺口＝敏感性資產－敏感性負債；以比率表示時，敏感性資產÷敏感性負債「大於1」才稱正資金缺口，而非大於0，故(B)錯誤。利率下滑宜採負缺口、利率處於高點或低谷宜採零缺口，(C)(D)正確。","c":14,"f":1,"ap":["E3-52"]},{"i":"E3-53","q":"銀行資產項下「存款準備金」之構成項目，不包括下列何者？","o":["儲蓄存款","庫存現金","在台灣銀行開立「票據清算帳戶」之存款","在央行或受託管理機構開立存款準備金甲戶與乙戶之存款"],"a":0,"e":"答案(A)。存款準備金是銀行為存款提存的準備資產，包括庫存現金、在臺灣銀行開立的票據交換清算帳戶存款、在央行或受託收管機構開立的準備金甲戶與乙戶存款等；「儲蓄存款」是應提準備的存款負債，不是準備金構成項目。","c":11,"f":1,"ap":["E3-53"]},{"i":"E3-54","q":"有關銀行的放款對存款之比率（簡稱存放比率），下列敘述何者錯誤？","o":["存放比率愈高，意味銀行的流動性愈低","存放比率愈高，意味銀行的流動能力愈強","存放比率愈高，意味銀行的流動性風險愈大","銀行多以存放款業務為主，存放比率具相當參考價值"],"a":1,"e":"答案(B)。存放比率愈高，表示存款資金多已貸放出去，流動性愈低、流動性風險愈大，故(A)(C)正確，(B)「流動能力愈強」錯誤。國內銀行多以存放款業務為主，存放比率具相當參考價值，(D)正確。","c":14,"f":1,"ap":["E3-54"]},{"i":"E3-55","q":"變現能力高的金融商品，買賣時不致產生過高的資本損失，所以何種風險較低？","o":["作業風險","流動性風險","信用風險","與任何風險均無關"],"a":1,"e":"答案(B)。流動性是指資產的變現能力；變現能力高的金融商品可迅速以接近公平價格買賣，不致產生過高的資本損失，因此其「流動性風險」較低。","c":14,"f":1,"ap":["E3-55"]},{"i":"E3-56","q":"金管會「銀行資本適足性及資本等級管理辦法」第2 條第4 項，定義「資本適足率」，係以下列何者除以風險性資產總額而得？","o":["第一類資本淨額","第二類資本淨額","第三類資本淨額","第一類資本淨額及第二類資本淨額之合計數"],"a":3,"e":"答案(D)。依銀行資本適足性及資本等級管理辦法第2條，資本適足率＝（第一類資本淨額＋第二類資本淨額）÷風險性資產總額。第一類資本比率則僅以第一類資本淨額為分子。","c":9,"f":1,"ap":["E3-56"]},{"i":"E3-58","q":"依「銀行資本適足性及資本等級管理辦法」第2 條第1 項，定義自有資本與風險性資產之比率應包括之項目，下列何者非屬之？","o":["法定資本","資本適足率","普通股權益比率","第一類資本比率"],"a":0,"e":"答案(A)。依該辦法第2條第1項，自有資本與風險性資產之比率包括普通股權益比率、第一類資本比率及資本適足率三項；「法定資本」並非此處所定義的比率項目。","c":9,"f":1,"ap":["E3-58"]},{"i":"E3-60","q":"依「銀行資本適足性及資本等級管理辦法」，銀行發行的「長期次順位債券」，在計算資本適足率時，係屬於何種範圍？","o":["普通股股本","第一類資本","第二類資本","不可視為資本使用"],"a":2,"e":"答案(C)。依銀行資本適足性及資本等級管理辦法，銀行發行的長期次順位債券於計算資本適足率時屬「第二類資本」，可計入自有資本，但不屬於普通股權益或第一類資本。","c":9,"f":1,"ap":["E3-60"]},{"i":"E4-2","q":"下列何種風險不屬於敘述客戶信用風險的「風險值」計算種類？","o":["違約風險(Default Risk)","回收風險(Recovery Risk)","暴露風險(Exposure Risk)","作業風險(Operation Risk)"],"a":3,"e":"答案(D)。描述客戶信用風險的「風險值」由三類風險構成：違約風險（違約機率）、暴露風險（違約時暴險額）與回收風險（違約損失率）；作業風險屬於另一類風險，不在信用風險值計算範圍內。","c":12,"f":1,"ap":["E4-2"]},{"i":"E4-3","q":"有關成本中心，下列敘述何者錯誤？","o":["成本中心的主管僅能控制成本或費用","成本中心以追求產品或服務成本最低為其努力目標","成本中心主管無權參與選擇各項投入資源的標準及來源","成本中心適用對產量或服務之多寡，以及產品或服務之售價「無權決定」的單位"],"a":2,"e":"答案(C)。成本中心主管雖僅能控制成本或費用、對產量與售價無權決定，但「有權參與選擇」各項投入資源的標準及來源，故(C)錯誤。(A)(B)(D)為成本中心的正確特性。","c":2,"f":1,"ap":["E4-3"]},{"i":"E4-4","q":"有關轉投資類型的投資中心，該單位宜使用下列何者當作績效衡量指標？","o":["銷售額","外部損益","投資報酬率","可控制成本"],"a":2,"e":"答案(C)。轉投資類型的投資中心，主管須對投入資本的運用效益負責，宜以「投資報酬率」（資本或股權投資的報酬率）作為績效衡量指標。銷售額適用收入中心，可控制成本適用成本中心。","c":2,"f":3,"ap":["E4-4","E7-3","E10-2"]},{"i":"E4-5","q":"有關資金移轉價格，下列敘述何者錯誤？","o":["銀行的營運政策及顧客價格，與資金移轉價格系統的訂價策略無關","資金移轉價格的首要功能是適當調撥各部門和分行的剩餘與不足資金","本國銀行資金移轉價格系統中，扮演居中協調的單位主要是指總行的財務部","移轉價格的訂定可誘導相關部門或行員，落實推動高階主管屬意的業務項目"],"a":0,"e":"答案(A)。資金移轉價格系統的訂價策略應反映銀行的營運政策與市場狀況，顧客價格也是以內部移轉價格加減利潤目標訂定，兩者密切相關，故(A)錯誤。(B)首要功能為調撥各單位資金餘缺；(C)總行財務部居中協調；(D)可誘導推動高層屬意業務，均正確。","c":2,"f":1,"ap":["E4-5"]},{"i":"E4-6","q":"有關作業基礎成本制度(Activity-Based Costing, ABC)，下列敘述何者正確？","o":["金融服務業面對的是人的交易行為，人的慣性行為使得「標準」作業的設定很容易","ABC 制度的各項作業成本，是由作業動因的作業量除以「動因費率」計算而得","ABC 制度的作業成本，不須納入每項作業的「風險成本」","ABC 制度的特色之一，在於能夠區分個別業務及客戶的績效差異"],"a":3,"e":"答案(D)。ABC制度能將作業成本精確歸屬至個別業務及客戶，區分其績效差異，(D)正確。(A)人的慣性行為使「標準」作業設定「不容易」；(B)作業成本＝作業動因的作業量「乘以」動因費率；(C)ABC作業成本「須」納入每項作業的風險成本。","c":2,"f":1,"ap":["E4-6"]},{"i":"E4-13","q":"衡量企業取得資金之後的經營效能，下列敘述何者錯誤？","o":["存貨週轉率越高，企業經營效能越好","應收帳款週轉率越高，企業經營效能越好","總資產週轉率越高，企業經營效能越好","應付帳款週轉率越高，企業經營效能越好"],"a":3,"e":"答案(D)。存貨週轉率、應收帳款週轉率、總資產週轉率愈高，代表資產運用與回收效率愈高，經營效能愈好，(A)(B)(C)正確。應付帳款週轉率＝銷貨成本÷平均應付帳款，週轉率高代表付款給供應商較快、議價能力較弱；依教材此指標一般是「越低越好」，不能說越高經營效能越好，故(D)錯誤。","c":4,"f":1,"ap":["E4-13"]},{"i":"E4-14","q":"有關企業之信用評分，下列敘述何者錯誤？","o":["負責人在業界之評價愈高，則違約機率愈低","企業內部組織運作愈健全，則違約機率愈低","企業跨足陌生產業，可以分散經營風險，所以違約機率可以降低","在業界中扮演龍頭地位之領導企業，其違約機率會較低"],"a":2,"e":"答案(C)。企業跨足陌生產業時缺乏經驗與競爭優勢，經營風險上升，違約機率通常提高，並非可以分散風險而降低違約機率，故(C)錯誤。負責人評價高、組織運作健全、產業龍頭企業，違約機率較低。","c":4,"f":1,"ap":["E4-14"]},{"i":"E4-15","q":"有關融資業務，下列敘述何者錯誤？","o":["經常性融資以協助企業短期週轉金為目的","經常性融資之還款來源仰賴固定資產處分變現","中長期融資以協助企業建立中長期的營運資金為目的","中長期融資之還款來源仰賴未來經營所賺得的利潤"],"a":1,"e":"答案(B)。經常性融資以協助企業短期週轉金為目的，還款來源主要仰賴營業收入、應收帳款收回等短期營運現金流量，並非處分固定資產變現，故(B)錯誤。中長期融資協助建立中長期營運資金，還款來源仰賴未來經營所賺得的利潤，(C)(D)正確。","c":4,"f":1,"ap":["E4-15"]},{"i":"E4-16","q":"有關應收帳款代收融資業務，下列敘述何者錯誤？","o":["係用以企業的應收帳款尚未收妥之前，提供週轉資金並賺取利息收入","在有追索權的條件下，應收帳款管理商得向商品供應者追討墊付之帳款","無追索權的授信對象為商品勞務的提供者","銀行可要求應收帳款讓與者額外負擔保險費用，以降低信用風險"],"a":2,"e":"答案(C)。應收帳款承購（代收融資）有追索權時，授信對象為應收帳款讓與者（賣方，即商品勞務提供者）；無追索權時，銀行承擔的是買方（應收帳款還款者）的信用風險，授信對象為買方，故(C)錯誤。(A)(B)(D)正確。","c":4,"f":1,"ap":["E4-16"]},{"i":"E4-19","q":"假設「幸福滿屋」之目前房屋市場價值為1,000 萬元，已向甲銀行貸款700 萬元，甲銀行乃該屋之第一胎房貸銀行，並設定該屋之可貸金額為房屋價值的75%，並依可貸金額的1.2 倍設定質權。若「幸福滿屋」屋主向乙銀行提出二胎房貸申請，若乙銀行對風險容忍程度在第一順位質權設定的20%，「幸福滿屋」依乙銀行對該屋之二胎房貸上限金額進行全額貸款後，請問該屋之淨值剩下多少？","o":["300 萬元","250 萬元","120 萬元","70 萬元"],"a":2,"e":"答案(C)。甲銀行第一順位質權設定＝可貸金額(1,000萬×75%＝750萬)×1.2＝900萬元；乙銀行二胎上限＝900萬×20%＝180萬元。全額貸款後總負債＝700＋180＝880萬元，房屋淨值＝1,000－880＝120萬元。","c":5,"f":1,"ap":["E4-19"]},{"i":"E4-20","q":"有關健全的信用評分制度，應具備下列哪些特質？ A.能降低信用損失 B.了解顧客之人口統計特質 C.增進處理效率 D.可隨時檢視信用評分標準與授信準則是否適當","o":["僅A、B","僅A、B、C","僅A、B、D","A、B、C、D"],"a":3,"e":"答案(D)。健全的信用評分制度應能降低信用損失、了解顧客的人口統計特質、增進授信處理效率，並可隨時檢視信用評分標準與授信準則是否適當，A、B、C、D皆屬之。","c":6,"f":2,"ap":["E4-20","E10-20"]},{"i":"E4-21","q":"有關信用卡之違冒詐欺事件，應歸類為下列何種風險型態？","o":["信用風險","市場風險","作業風險","流動性風險"],"a":2,"e":"答案(C)。信用卡偽冒詐欺是因外部人員詐欺或內部流程、系統控管不足所造成的損失，依Basel定義屬「作業風險」（外部詐欺事件類型），而非持卡人無力還款的信用風險。","c":15,"f":1,"ap":["E4-21"]},{"i":"E4-22","q":"成立於1997 年5 月的台灣本土第一家信用評等公司為下列何者？","o":["臺灣信用評等公司","中華信用評等公司","聯合資信","金融聯合徵信中心"],"a":1,"e":"答案(B)。中華信用評等公司成立於1997年5月，為臺灣本土第一家信用評等公司。金融聯合徵信中心是提供信用資料查詢的機構，不是信用評等公司。","c":6,"f":1,"ap":["E4-22"]},{"i":"E4-23","q":"穆迪信評公司評估公司債信用等級所使用之量化財務指標，下列何者最為重要？","o":["利息保障倍數","流動比率","資產報酬率","負債比率"],"a":0,"e":"答案(A)。穆迪評估公司債信用等級的量化財務指標中，「利息保障倍數」為最重要的主要指標；長期償債能力（判斷是否舉債過多）則為次要指標。","c":6,"f":2,"ap":["E4-23","E8-5"]},{"i":"E4-25","q":"有關標準普爾信用評等制度，下列敘述何者錯誤？","o":["分為長期及短期兩種評等類別","信用等級分為投資級和投機級兩類","不考慮產業和規模差異，統一適用一般產業評等","以符號「－」表示同一等級中信用品質最差之類別"],"a":2,"e":"答案(C)。S&P評等會考量產業特性與企業規模差異，並非不分產業規模一律適用一般產業評等，故(C)錯誤。(A)分長、短期評等；(B)分投資級與投機級；(D)同一等級加註「－」表示該等級中信用品質最差者，均正確。","c":6,"f":1,"ap":["E4-25"]},{"i":"E4-30","q":"有關國家風險與主權風險相關敘述，下列何者錯誤？","o":["外幣舉債所屬國發生政治或社會動亂屬於國家風險","外幣舉債所屬國貨幣大幅貶值屬於國家風險","任何企業的信用等級不得高於該國主權評等","外匯管制或短缺的情況屬於國家風險"],"a":2,"e":"答案(C)。外幣舉債國的政治社會動亂、貨幣大幅貶值、外匯管制或短缺均屬國家風險，(A)(B)(D)正確。「任何企業的信用等級不得高於該國主權評等」是「主權上限」的定義，不是國家風險或主權風險的內容，故(C)錯誤。","c":8,"f":1,"ap":["E4-30"]},{"i":"E4-31","q":"有關國家主權評等，下列哪些因子會影響其評級？ A.對外淨資產部位規模 B.貨幣管理健全性 C.政府債務規模 D.人口結構改變或不佳的外部衝擊，導致財政赤字加劇","o":["僅A、B","僅C、D","僅A、B、C","A、B、C、D"],"a":3,"e":"答案(D)。影響國家主權評等的因子包括對外淨資產部位規模、貨幣管理健全性、政府債務規模，以及人口結構改變或不佳外部衝擊導致財政赤字加劇，A、B、C、D皆會影響。","c":8,"f":1,"ap":["E4-31"]},{"i":"E4-35","q":"A 銀行於104 年12 月31 日之資本適足率、第一類資本比率和普通股權益比率分別為9%、7%和5%，銀行資本適足性及資本等級管理辦法之資本等級劃分標準，應歸類為下列何者？","o":["資本適足","資本不足","資本顯著不足","資本嚴重不足"],"a":0,"e":"答案(A)。依104年(2015年)當時的過渡期最低標準：普通股權益比率4.5%、第一類資本比率6%、資本適足率8%。A銀行為5%、7%、9%，三項皆達標，屬「資本適足」。注意：依108年起現行標準(7%、8.5%、10.5%)，同樣數據未達標且資本適足率仍在8.5%以上，將屬「資本不足」。","c":9,"f":1,"ap":["E4-35"],"g":"依108年起現行標準(普通股7%、第一類8.5%、資本適足率10.5%)此數據應屬資本不足；官方答案係依104年過渡期標準"},{"i":"E4-37","q":"臺灣保險業使用「風險基礎資本額」(Risk Based Capital)衡量其資本適足率，且規定該比率不得低於下列何者？","o":["100%","150%","200%","250%"],"a":2,"e":"答案(C)。保險業以「風險基礎資本額(RBC)」衡量資本適足率，即自有資本與風險資本之比率；依保險法規定，該比率不得低於200%，未達者不得分配盈餘，並依資本等級採取監理措施。100%、150%、250%均非法定最低標準。","c":10,"f":2,"ap":["E4-37","E8-42"],"g":"本題依舊制RBC（法定標準200%、300%以上視為資本充裕）作答；2026年起保險業改採TW-ICS新制，資本適足法定標準改為100%（講義資本等級表採新制：適足100%以上、不足50%～未達100%、顯著不足25%～未達50%、嚴重不足低於25%）"},{"i":"E4-38","q":"臺灣「金融控股公司合併資本適足性管理辦法」要求金融控股公司之子公司，應符合各業別資本適足性之相關規範，整個集團的資本適足率則不得低於下列何者？","o":["100%","150%","200%","250%"],"a":0,"e":"答案(A)。「金融控股公司合併資本適足性管理辦法」規定，金控公司以合併基礎計算之資本適足率（集團合格資本淨額÷集團法定資本需求）不得低於100%，且各子公司仍須符合各自業別的資本適足規範。","c":9,"f":2,"ap":["E4-38","E6-35"]},{"i":"E4-39","q":"有關金融控股公司之資本適足率規範，下列敘述何者錯誤？","o":["轄下子公司可以豁免遵守各業別資本適足率規範","金融控股公司特別股及次順位債券之當次發行額度，應全數收足","未達最低法定比率標準，不得以現金分配盈餘","申請轉投資事業時，其合併本次投資後之資本適足率不得低於100%"],"a":0,"e":"答案(A)。金控公司的子公司不能豁免，必須符合各業別（銀行、保險、證券等）的資本適足性規範，集團合併資本適足率另須達100%以上。(B)特別股及次順位債券當次發行額度須全數收足才能計入合格資本；(C)未達法定比率不得以現金分配盈餘；(D)申請轉投資時，合併本次投資後的資本適足率不得低於100%，均正確。","c":9,"f":1,"ap":["E4-39"]},{"i":"E4-40","q":"有關證券商之資本適足率規範，下列敘述何者錯誤？","o":["資本適足率會影響可以包銷之有價證券規模","連續三個月達到250%以上，對客戶融資總金額可達到淨值的400%","低於150%時，主管機關得暫緩增加新種業務","連續六個月均超過250%，可申請經營衍生性金融商品業務"],"a":3,"e":"答案(D)。證券商申請經營衍生性金融商品業務，須最近6個月每月申報的資本適足率均超過200%，不是250%。(A)資本適足率會影響包銷有價證券的規模；(B)連續3個月達250%以上，對客戶融資總金額可達淨值的400%；(C)低於150%時主管機關得暫緩增加新種業務，均正確。","c":10,"f":1,"ap":["E4-40"]},{"i":"E4-42","q":"客戶之違約風險係由違約事件的發生機率來描述，銀行經營業務可能面對違約行為的挑戰，下列敘述何者錯誤？","o":["經濟違約","尚未履行付款義務之違約","交易對手未遵守契約規定的違約","掌握擔保品的處分權與第三人的保證"],"a":3,"e":"答案(D)。違約類型包括：經濟違約（客戶市場淨值為負，即總資產市值低於總負債市值）、尚未履行付款義務之違約（逾期放款、催收款、呆帳）、技術性違約（交易對手未遵守契約規定）。掌握擔保品處分權與第三人保證只能降低違約後的損失（屬回收風險的保障），不代表沒有違約問題，故(D)錯誤。","c":12,"f":1,"ap":["E4-42"]},{"i":"E4-44","q":"計算非衍生性商品之信用相當額與風險性資產，依Basel II估計此類風險性資產時，下列敘述何者錯誤？","o":["信用相當額＝交易金額×信用轉換係數","風險性資產＝信用相當額×風險權數","信用轉換係數有0%、20%、50%、100%","風險權數有0%、20%、50%、100%"],"a":3,"e":"答案(D)。依Basel II計算表外非衍生性業務：信用相當額＝交易金額×信用轉換係數（0%、20%、50%、100%）；風險性資產＝信用相當額×風險權數。依教材，此類業務的風險權數為0%、20%、100%三種（交易對手外部信評越好，權數越低），(D)把50%列入風險權數是錯的；(A)(B)(C)正確。","c":12,"f":1,"ap":["E4-44"]},{"i":"E4-49","q":"計算市場風險之主要部位變動幅度，當利率、匯率或石油價格等市場因素變動「一單位」時，觀察目標部位或金融商品的價格，變動多少幅度，係為下列何項指標？","o":["風險係數","波動幅度","向下風險","敏感性係數"],"a":3,"e":"答案(D)。市場因素（利率、匯率、油價等）變動「一單位」時，目標部位或金融商品價格變動多少幅度，最直接的衡量指標是敏感性係數（例如利率變動1bp=0.01%，敏感性係數5的債券價格變動0.05%）。講義將此類指標列為波動幅度、向下風險、敏感性係數；(A)「風險係數」不屬於此類。","c":13,"f":1,"ap":["E4-49"],"g":"講義同題為「何者錯誤」(答案為風險係數)，且波動幅度、向下風險亦列為同類指標；本題改問「係為何項指標」，以定義最直接的敏感性係數為答案，題意略有歧義"},{"i":"E4-50","q":"假設常態情況的容忍水準為1%，殖利率標準差為0.5%，β為敏感性係數為0.5，下列敘述何者正確？","o":["VaR=0－2.325×1×0.005","VaR=0－2.325×1×0.01","VaR=0－2.325×0.5×0.01","VaR=0－2.325×0.5×0.005"],"a":3,"e":"答案(D)。市場風險值公式：VaR＝0－Z×β×σ。單尾容忍水準1%對應Z＝2.325，敏感性係數β＝0.5，殖利率標準差σ＝0.5%＝0.005，所以VaR＝0－2.325×0.5×0.005（約－0.0058）。(A)(B)把β誤用成1，(C)把σ誤用成0.01。","c":13,"f":2,"ap":["E4-50","E6-46"]},{"i":"E4-51","q":"前檯的交易員應具備之最重要才能為下列何者？","o":["經營理念","人際關係與溝通協調能力","專業技術能力","與客戶的私人關係"],"a":2,"e":"答案(C)。前台交易員直接操作金融商品買賣、承擔價格風險，必須正確評價商品、判斷市場走勢並控管部位，所以最重要的是專業技術能力。經營理念屬高階主管層次；人際溝通雖有幫助，但不是核心；與客戶的私人關係反而可能衍生利益衝突與作業風險。","c":13,"f":2,"ap":["E4-51","E5-39"]},{"i":"E4-55","q":"2011 年10 月起，台灣的流動準備法定比率是多少？","o":["7%","9%","10%","12%"],"a":2,"e":"答案(C)。中央銀行自2011年10月起把銀行流動準備的法定最低比率由7%提高到10%，並且按日計提。流動準備與存款準備都是和流動性風險有關的準備部位。","c":14,"f":1,"ap":["E4-55"]},{"i":"E4-56","q":"有關流動性危機與流動性風險的敘述，下列何者錯誤？","o":["銀行對外籌措資金窒礙難行時，流動性風險即明顯提高","當銀行的擠兌風險一發不可收拾時，擴散效果將逐步蔓延至其他金融機構，殃及該地區的金融市場，形成全面性的金融恐慌","借款客戶出現嚴重違約，只能提高銀行的信用風險，不致影響其流動性風險","大部分客戶異常提領款項時，該銀行可能隨著流動性漸次不足而面臨擠兌"],"a":2,"e":"答案(C)。借款客戶嚴重違約不只提高信用風險，也會讓預期的現金流入落空，還可能引發存戶疑慮甚至擠兌，因此也會提高流動性風險（教材列為流動性風險的成因之一），(C)錯誤。(A)對外籌資窒礙難行、(B)擠兌擴散成金融恐慌、(D)客戶異常提領導致擠兌，均正確。","c":14,"f":1,"ap":["E4-56"]},{"i":"E4-57","q":"新巴賽爾資本協定，2004 年6 月將「作業風險」的「最低資本需求」，納入資本適足率的第一支柱。依據金管會定義作業風險，係起因於哪些不當因素，造成銀行損失之風險，下列敘述何者錯誤？","o":["人員","系統","內部作業與外部事件","策略風險與信譽風險"],"a":3,"e":"答案(D)。金管會定義的作業風險，是因內部作業、人員或系統的不當或失誤，或外部事件，所造成損失的風險（包含法律風險）。策略風險與信譽風險不包括在作業風險定義內，所以(D)錯誤；(A)人員、(B)系統、(C)內部作業與外部事件都屬作業風險的成因。","c":15,"f":1,"ap":["E4-57"]},{"i":"E4-59","q":"依據金管會「銀行資本適足性及資本等級管理辦法」(103.01.09)，「風險性資產總額」係指信用風險加權風險性資產總額，加計市場風險及作業風險應計提之資本乘以多少之合計數？","o":["12","12.5","15","18"],"a":1,"e":"答案(B)。依「銀行資本適足性及資本等級管理辦法」，風險性資產總額＝信用風險加權風險性資產總額＋(市場風險應計提資本＋作業風險應計提資本)×12.5。12.5是8%最低資本比率的倒數(1÷8%)，用來把資本計提額換算成風險性資產。","c":9,"f":1,"ap":["E4-59"]},{"i":"E4-60","q":"金管會「銀行資本適足性及資本等級管理辦法」第2 條第4 項，定義「資本適足率」，係以下列何者除以風險性資產總額而得？","o":["第一類資本淨額","第二類資本淨額","第三類資本淨額","第一類資本淨額及第二類資本淨額之合計數額"],"a":3,"e":"答案(D)。資本適足率＝(第一類資本淨額＋第二類資本淨額)÷風險性資產總額，也就是自有資本÷風險性資產，現行最低標準10.5%。只用第一類資本淨額計算的是第一類資本比率；第三類資本在Basel III制度下已取消。","c":9,"f":1,"ap":["E4-60"]},{"i":"E5-2","q":"下列哪個敘述不屬於適當的責任中心分類？","o":["當成本中心的作業活動具有客觀明確的投入產出關係時，稱其為機械性的成本中心","若利潤中心提供的金融業務或服務，是高階主管主導售價時，稱其為「人為」的利潤中心","當利潤中心提供的金融業務或服務，由市場供需決定售價時，稱其為「自然」的利潤中心","若成本中心作業活動的投入產出關係不明確，以致客觀衡量有困難時，稱其為標準成本中心"],"a":3,"e":"答案(D)。成本中心的作業活動投入產出關係不明確、難以客觀衡量時，應稱為「裁量性成本中心」，不是「標準成本中心」。投入產出關係明確的稱為機械性成本中心（又稱標準成本中心）；由高階主管主導售價的是「人為」利潤中心，由市場供需決定售價的是「自然」利潤中心，所以(A)(B)(C)正確。","c":2,"f":1,"ap":["E5-2"]},{"i":"E5-5","q":"下列何者不屬於銀行辦理企業之經常性融資業務？","o":["票據融通","存貨抵押貸款","擔保透支","短期放款"],"a":1,"e":"答案(B)。依教材分類，經常性融資以協助企業短期週轉金為目的，可分為票據融通、短期放款、透支（含擔保透支）等。存貨抵押貸款是以特定資產（存貨）抵押取得的擔保融資，不列在經常性融資的類別中。","c":4,"f":1,"ap":["E5-5"]},{"i":"E5-10","q":"金管會依「臺灣地區與大陸地區金融業務往來及投資許可管理辦法」第十二條之一規定，銀行對中國的國家風險總額度不得超過下列何者？","o":["上年度決算後資本額的1 倍","上年度決算後資本額的1.5 倍","上年度決算後淨值的1 倍","上年度決算後淨值的1.5 倍"],"a":2,"e":"答案(C)。依「臺灣地區與大陸地區金融業務往來及投資許可管理辦法」第12條之1，銀行對大陸地區的授信、投資及資金拆存總額度，不得超過上年度決算後淨值的1倍。基準是「淨值」不是「資本額」，倍數是1倍不是1.5倍。","c":8,"f":1,"ap":["E5-10"]},{"i":"E5-12","q":"下列何種風險不屬於臺灣人身保險業的風險項目？","o":["資產風險","信用風險","保險風險","利率風險"],"a":1,"e":"答案(B)。依（舊制）保險業資本適足性管理辦法，人身保險業的風險資本項目為資產風險、保險風險、利率風險及其他風險；信用風險（以及核保風險、資產負債配置風險）是財產保險業的風險項目，所以人身保險業不包括信用風險。","c":10,"f":1,"ap":["E5-12"],"g":"依舊制分類作答；新版RBC/TW-ICS架構(講義所列)已將信用風險納入人身保險業風險資本，現行法規下本題可能有爭議"},{"i":"E5-15","q":"利潤中心制度最好能使用下列何者當作績效衡量指標？","o":["營業利益","邊際貢獻","可控制利益","淨利(Net Income)"],"a":2,"e":"答案(C)。利潤中心主管同時對收入與成本負責，但只能對自己能控制的部分負責，所以最好用「可控制利益」（收入減可控制成本）當作績效衡量指標。營業利益、淨利會混入總行分攤的不可控制成本或費用；邊際貢獻沒有考慮部門可控制的固定成本，都不如可控制利益公允。","c":2,"f":1,"ap":["E5-15"]},{"i":"E5-21","q":"銀行的信用評等分成哪兩種？","o":["國內評等與國際評等","標準評等法與進階評等法","內部評等法與外部評等法","自我評等法與公開評等法"],"a":2,"e":"答案(C)。銀行的信用評等分為內部評等法（銀行自建評等模型，估計違約機率等）與外部評等法（採用信用評等機構的評等）兩種。台灣自2007年起，信用風險的資本計提可採標準法或內部評等法。","c":12,"f":3,"ap":["E5-21","E7-25","E10-23"]},{"i":"E5-33","q":"關於健全的信用評分制度，應具備下列哪些特質？ A.能降低信用損失 B.了解顧客之人口統計特質 C.增進處理效率 D.可隨時檢視信用評分標準與授信準則是否適當","o":["僅A、B","僅A、B、C","僅A、B、D","A、B、C、D"],"a":3,"e":"答案(D)。健全的信用評分制度應具備：能降低信用損失（A）、了解顧客的人口統計特質（B）、增進處理效率（C）、可隨時檢視信用評分標準與授信準則是否適當（D）。四項都是應具備的特質，所以選ABCD。","c":6,"f":1,"ap":["E5-33"]},{"i":"E5-40","q":"原來為10,000 元的債券，敏感性係數為5 時，殖利率上升1 個基本點(Basis Point)，試問此時的債券價格應為多少元？","o":["9,950 元","9,500 元","9,995 元","500 元"],"a":2,"e":"答案(C)。1個基本點＝0.01%＝0.0001，敏感性係數5表示殖利率每升1bp，價格下跌5×0.01%＝0.05%。新價格＝10,000×(1－5×0.0001)＝10,000×0.9995＝9,995元。(A)9,950元是上升10bp的結果。","c":13,"f":3,"ap":["E5-40","E6-57","E16-33"]},{"i":"E5-41","q":"臺灣近年來密集與大陸官方建立合作關係，下列敘述何者錯誤？","o":["2009 年兩岸正式簽訂「金融MOU」","2010 年金管會公布立法院通過兩岸金融三法","2011 年簽署兩岸經濟合作架構協議 (ECFA)","2013 年中央銀行宣布，「中國銀行台北分行」擔任台灣的人民幣清算行，而台灣銀行上海分行則負責新台幣在大陸的清算，正式啟動兩岸貨幣清算機制"],"a":2,"e":"答案(C)。兩岸經濟合作架構協議(ECFA)是在2010年6月簽署，不是2011年，所以(C)錯誤。(A)2009年11月兩岸簽署金融監理合作備忘錄(MOU)；(B)2010年公布兩岸金融往來相關法規；(D)人民幣清算行（中國銀行台北分行）與新台幣在大陸的清算（台灣銀行上海分行）機制於2013年正式啟動，均正確。","c":8,"f":1,"ap":["E5-41"]},{"i":"E5-43","q":"關於保險業之資本適足率規範，下列敘述何者錯誤？","o":["以風險基礎資本額衡量資本適足率","最低法定比率不得低於300%","自2013 年6 月底開始，比率大於300%者，視為資本充裕","資本適足率 =（自有資本／風險資本）*100%"],"a":1,"e":"答案(B)。保險業以風險基礎資本額衡量資本適足率，資本適足率＝(自有資本÷風險資本)×100%，法定最低比率是200%，不是300%，所以(B)錯誤。(A)(D)正確；(C)依教材，2013年6月底起比率高於300%的視為資本充裕。","c":10,"f":1,"ap":["E5-43"],"g":"本題依舊制RBC（法定標準200%、300%以上視為資本充裕）作答；2026年起保險業改採TW-ICS新制，資本適足法定標準改為100%（講義資本等級表採新制：適足100%以上、不足50%～未達100%、顯著不足25%～未達50%、嚴重不足低於25%）"},{"i":"E5-48","q":"原則上，銀行的自有資本對風險性資產的比率越高時，其承擔的資本風險將如何變化？","o":["越大","越小","不變","無關"],"a":1,"e":"答案(B)。自有資本對風險性資產的比率（資本適足比率）越高，代表可承擔損失的自有資本越多、風險性資產相對越少，所以銀行承擔的資本風險越小。","c":9,"f":1,"ap":["E5-48"]},{"i":"E5-51","q":"依主管機構規定，有關保險公司的資本適足率與業務限制，下列敘述何者錯誤？","o":["資本充裕等級的保險公司其資本適足率須達300%以上","臺灣自2013 年 6 月底開始，分成五個等級的資本適足率","保險公司的資本適足率達200%以上時，得申請從事增加投資效益之衍生性金融商品交易","財務和業務健全的保險公司，最近一年之資本適足率達200%時，可申請「傷害保險」及「健康保險」"],"a":2,"e":"答案(C)。保險業從事「增加投資效益」目的之衍生性金融商品交易，資本適足率須達法定標準(200%)的1.25倍，即250%以上，不是200%，所以(C)錯誤。(A)資本充裕須達300%以上、(B)2013年6月底起分成五個等級（依教材）、(D)最近一年資本適足率達200%可申請傷害保險及健康保險，均為教材所述內容。","c":10,"f":1,"ap":["E5-51"],"g":"本題依舊制RBC（法定標準200%、300%以上視為資本充裕）作答；2026年起保險業改採TW-ICS新制，資本適足法定標準改為100%（講義資本等級表採新制：適足100%以上、不足50%～未達100%、顯著不足25%～未達50%、嚴重不足低於25%）"},{"i":"E5-52","q":"假設容忍水準為1%，標準差為0.6%，β為敏感性係數為0.5，下列敘述何者正確？","o":["VaR=0－2.325×0.5×0.005","VaR=0－2.325×0.6×0.005","VaR=0－2.325×0.5×0.01","VaR=0－2.325×0.5×0.006"],"a":3,"e":"答案(D)。VaR＝0－Z×β×σ，容忍水準1%對應Z＝2.325，β＝0.5，標準差σ＝0.6%＝0.006，所以VaR＝0－2.325×0.5×0.006（約－0.00698）。(A)(B)把σ誤用成0.005，(B)也把β誤用成0.6，(C)把σ誤用成0.01。","c":13,"f":1,"ap":["E5-52"]},{"i":"E5-53","q":"依據「金融機構存款及其他各種負債準備金調整及查核辦法」規定，有關銀行應提「存款準備金」之存款負債項目，下列何者非屬之？","o":["支票存款","活期存款","定期存款","庫存現金"],"a":3,"e":"答案(D)。依「金融機構存款及其他各種負債準備金調整及查核辦法」第3條，應提存準備金的存款包括支票存款、活期存款、儲蓄存款及定期存款。庫存現金不是存款負債，而是依第7條可充當「實際準備金」的資產，所以不屬於應提準備的項目。","c":11,"f":1,"ap":["E5-53"]},{"i":"E5-54","q":"銀行資本適足性公式中，「第一類資本淨額，除以暴險總額」，係指下列何者？","o":["普通股權益比率","第一類資本比率","槓桿比率","資本適足率"],"a":2,"e":"答案(C)。槓桿比率＝第一類資本淨額÷暴險總額，最低要求3%，用來補充以風險為基礎的最低資本要求。普通股權益比率、第一類資本比率、資本適足率的分母都是「風險性資產總額」，不是暴險總額。","c":9,"f":1,"ap":["E5-54"]},{"i":"E5-58","q":"關於國家風險限額的核配，下列敘述何者錯誤？","o":["依據信評公司之評等核配國家風險額度，稱為靜態核配制度","依據信用違約交換的價格核配國家風險額度，稱為動態核配制度","信用違約交換的價格，原則上應每季檢查一次","當信用違約交換觸及標準，應凍結該國額度"],"a":2,"e":"答案(C)。銀行的CDS價格主要取自Bloomberg等金融資訊系統，並且「每日」檢視一次、留存資料備查，不是每季檢查，所以(C)錯誤。(A)依信評公司評等核配是靜態核配；(B)依CDS價格核配是動態核配；(D)CDS觸及標準（如101基點）時應凍結該國額度，均正確。","c":8,"f":2,"ap":["E5-58","E6-30"]},{"i":"E5-59","q":"關於證券商之資本適足率規範，下列敘述何者錯誤？","o":["資本適足率會影響可以包銷之有價證券規模","連續三個月達到250%以上，對客戶融資總金額可達到淨值的400%","低於150%時，主管機關得暫緩增加新種業務","連續六個月均超過250%，始可申請經營衍生性金融商品業務"],"a":3,"e":"答案(D)。證券商申請經營衍生性金融商品業務，條件是最近6個月資本適足率均超過200%，不是250%，所以(D)錯誤。(A)資本適足率影響包銷規模；(B)連續3個月達250%以上，融資總金額可達淨值400%；(C)低於150%時主管機關得暫緩增加新種業務，均正確。","c":10,"f":1,"ap":["E5-59"]},{"i":"E6-7","q":"有關間接成本的會計科目與分攤，下列敘述何者錯誤？","o":["按照對象的分擔能力做分攤，係遵循「能力原則」","按照對象的成本收益關係做分攤，係採用「受益原則」","直接材料與直接人工屬於間接成本，須按照產品量做分攤","營業費用屬於間接成本，應按照「提供服務最多、接受服務最少」原則優先分攤至其他各部門"],"a":2,"e":"答案(C)。直接材料與直接人工可以直接歸屬到產品，屬於「直接成本」（教材亦稱變動成本），不是間接成本，所以(C)錯誤。(A)按分擔能力分攤是能力原則；(B)按成本收益關係分攤是受益原則；(D)營業費用屬間接成本，依「提供服務最多、接受服務最少」的原則優先分攤到其他部門，均正確。","c":2,"f":1,"ap":["E6-7"]},{"i":"E6-17","q":"銀行法第38 條規定，購買或建造住宅使用的建築物，辦理中、長期借款時，最長期限不得超過幾年？","o":["20 年","25 年","30 年","40 年"],"a":2,"e":"答案(C)。銀行法第38條規定，銀行對購買或建造住宅或企業用建築，得辦理中、長期放款，最長期限不得超過30年；但對無自用住宅者購買自用住宅的放款，不在此限。","c":5,"f":1,"ap":["E6-17"]},{"i":"E6-19","q":"關於信用卡之違冒詐欺事件，應歸類為下列何種風險型態？","o":["信用風險","市場風險","作業風險","流動性風險"],"a":2,"e":"答案(C)。信用卡偽冒、詐欺是因人員、系統或外部事件（如盜刷、冒名申辦）造成的損失，屬於作業風險，不是借款人無力還款的信用風險。市場風險源於價格變動，流動性風險源於資金調度，都不符合。","c":15,"f":1,"ap":["E6-19"]},{"i":"E6-21","q":"在定量分析時，公司債等級之決定因素，下列何者最為重要？","o":["利息保障倍數","短期償債能力","長期償債能力","獲利能力"],"a":0,"e":"答案(A)。信評機構（如Moody's）評定公司債等級時，定量分析的主要指標是利息保障倍數（稅前息前盈餘÷利息費用），最為重要；次要指標是長期償債能力（判斷是否舉債過多）。短期償債能力與獲利能力只是輔助。","c":6,"f":1,"ap":["E6-21"]},{"i":"E6-25","q":"依據標準普爾信用評等機構之觀點，下列哪些指標可以衡量受評公司之現金流量是否足夠？A.營業利益/營業收入B.長短期借款/總資產 C.（正常營業活動的現金流量+利息費用）／利息費用 D.借款的還本期限","o":["僅C、D","僅A、D","僅C","A、B、C、D"],"a":0,"e":"答案(A)。依標準普爾的觀點，衡量受評公司現金流量是否足夠的指標是：C.(正常營業活動的現金流量＋利息費用)÷利息費用，以及D.借款的還本期限。A營業利益÷營業收入是獲利能力指標，B長短期借款÷總資產是財務結構（槓桿）指標，所以選僅C、D。","c":6,"f":1,"ap":["E6-25"]},{"i":"E6-27","q":"關於授信對象的風險限額，下列敘述何者錯誤？","o":["視借款金額大小，決定是否需經營業主管和徵信審查程序","風險限額設定需考慮擔保程度","借戶的融資額度需控管在風險限額範圍內","實務上，風險限額意旨風險權限、授信總餘額和放款額度"],"a":0,"e":"答案(A)。授信案件不論借款金額大小，都必須經過營業主管與徵信審查程序；說「視金額大小決定是否需要」（如金額低就不需徵審）是錯的。(B)風險限額設定要考慮擔保程度；(C)借戶融資額度要控管在風險限額內；(D)實務上風險限額指風險權限、授信總餘額和放款額度，均正確。","c":7,"f":1,"ap":["E6-27"]},{"i":"E6-32","q":"關於國家風險的統計，下列敘述何者錯誤？","o":["總暴險除已動用的放款餘額，還需加計剩餘可用或未動用部份","信用狀保兌按承作金額計算暴險值","已提列資產減損之有價證券投資，則按減損後之資產價值計算","附賣回證券直接以有價證券之市場價值計算"],"a":3,"e":"答案(D)。國家風險暴險值的統計中，附賣回證券是在評估交易對手不履約時，依「損失金額」認列暴險值，不是直接以有價證券的市場價值計算，所以(D)錯誤。(A)授信暴險要加計剩餘可用或未動用額度；(B)信用狀保兌按承作金額計算；(C)已提列減損的有價證券按減損後價值計算，均正確。","c":8,"f":1,"ap":["E6-32"]},{"i":"E6-33","q":"有關Basel 監理委員會2010 年12 月16 日發布的資本協定第三版(Basel III)，下列敘述何者錯誤？","o":["除了法定的資本計提額，另外要求增訂「緩衝資本2.5%」","提高「普通股權益資本的比率」由2013 年起逐步調高至2015 年的4.5%","為防範景氣循環帶來的衝擊，設計了「額外緩衝資本」為0~2.5%，建議各國政府自行決定","增訂長期的淨穩定資金率(Net Stable Funding Ratio)，該比率在推動初期以「大於或等於120%」作為門檻"],"a":3,"e":"答案(D)。Basel III的淨穩定資金比率(NSFR)門檻是「大於或等於100%」，不是120%（台灣自107年1月1日起實施，最低標準100%），所以(D)錯誤。(A)另設2.5%的留存緩衝資本；(B)普通股權益比率由2013年逐步提高到2015年的4.5%；(C)抗景氣循環緩衝資本0~2.5%由各國自行決定，均正確。","c":14,"f":1,"ap":["E6-33"]},{"i":"E6-34","q":"有關巴塞爾資本協定第三版(Basel III)增訂之流動性風險指標，下列敘述何者錯誤？","o":["流動性覆蓋率係指高品質的流動資產除以30 天期之凈現金流出","流動性覆蓋率反應在監理機關嚴峻的流動性需求下處分資產換取現金的能力","淨穩定資金率係指法定穩定資金除以可取得的穩定資金","淨穩定資金率強調用來支應資產和業務活動的資金，至少須一定比率來自於穩定的負債"],"a":2,"e":"答案(C)。淨穩定資金比率(NSFR)＝可取得的穩定資金÷應有（法定）穩定資金，(C)把分子分母寫反了。(A)流動性覆蓋比率(LCR)＝高品質流動資產÷未來30天淨現金流出；(B)LCR反映在嚴峻情境下處分資產換取現金的能力；(D)NSFR強調支應資產和業務活動的資金須有一定比率來自穩定負債，均正確。","c":14,"f":1,"ap":["E6-34"]},{"i":"E6-41","q":"甲公司該年度相關財務數字如下：營業收入166 佰萬元、營業成本92 佰萬元、營業外收入5 佰萬元、期初應收帳款淨額13 佰萬元、期末應收帳款淨額28 佰萬元，請計算其應收帳款週轉率？","o":["6.1","8.1","10.1","13.1"],"a":1,"e":"答案(B)。應收帳款週轉率＝營業收入÷平均應收帳款。平均應收帳款＝(13＋28)÷2＝20.5佰萬元，週轉率＝166÷20.5≈8.1次。營業成本和營業外收入與本指標無關。","c":4,"f":1,"ap":["E6-41"]},{"i":"E6-47","q":"重新訂價的缺口又稱「資金缺口」，有關資金缺口的敘述，下列何者錯誤？","o":["是某天期的敏感性資產與敏感性負債相減而得","敏感性資產除以敏感性負債大於０時，稱為「正」資金缺口","利率由高往低下滑時，適合採用「負」資金缺口策略","利率處於最高點或低谷時，適合採用「零」資金缺口策略"],"a":1,"e":"答案(B)。重新訂價缺口（資金缺口）＝利率敏感性資產－利率敏感性負債，差額大於0為正缺口；若以比率表示，敏感性資產÷敏感性負債須「大於1」才是正資金缺口，比率大於0並不代表正缺口，所以(B)錯誤。(A)缺口的定義、(C)利率下滑時宜採負缺口、(D)利率處於高點或谷底時宜採零缺口，均正確。","c":14,"f":1,"ap":["E6-47"]},{"i":"E6-55","q":"假設「幸福滿屋」之目前房屋市場價值為1,000 萬元，已向甲銀行貸款700 萬元，甲銀行乃該屋之第一胎房貸銀行，並設定該屋之可貸金額為房屋價值的75%，並依可貸金額的1.2 倍設定質權。若「幸福滿屋」屋主向乙銀行提出二胎房貸申請，若乙銀行對風險容忍程度在第一順位質權設定的20%，請問「幸福滿屋」可向乙銀行申請之二胎房貸金額上限為多少？","o":["700 萬元","900 萬元","200 萬元","180 萬元"],"a":3,"e":"答案(D)。甲銀行可貸金額＝1,000萬×75%＝750萬元，第一順位質權設定＝750萬×1.2＝900萬元。乙銀行的二胎房貸上限＝第一順位質權設定×20%＝900萬×20%＝180萬元。","c":5,"f":1,"ap":["E6-55"]},{"i":"E6-56","q":"商業銀行會衍生信用風險的金融業務包括，表內的企業金融業務與消費金融業務及表外的衍生性和非衍生性業務。下列何者不屬於表外非衍生性業務？","o":["選擇權","擔保信用狀","未動用額度的「承諾協議書」","循環式包銷融資"],"a":0,"e":"答案(A)。選擇權屬於表外「衍生性」業務。表外非衍生性業務包括擔保信用狀、未動用額度的放款承諾（承諾協議書）、循環式包銷融資等，所以(B)(C)(D)都屬於表外非衍生性業務。","c":12,"f":1,"ap":["E6-56"]},{"i":"E6-60","q":"依據「金融機構存款及其他各種負債準備金調整及查核辦法」銀行應提存準備金之存款負債範圍，不包括下列何者？","o":["支票存款","活期存款","定期存款","庫存現金"],"a":3,"e":"答案(D)。依「金融機構存款及其他各種負債準備金調整及查核辦法」，應提存準備金的存款範圍為支票存款、活期存款、儲蓄存款、定期存款。庫存現金是可充當實際準備金的資產，不是存款負債，所以不在應提準備範圍內。","c":11,"f":1,"ap":["E6-60"]},{"i":"E7-1","q":"下列何者是合理的風險管理觀念？","o":["不宜使用相同風險標準看待所有員工，但部屬的責任要大於主管","組織的前台與中台部門均要面對風險挑戰，只有後台部門不用","風險管理的決策，「從上而下」比「由下往上」更重要","處理風險問題宜乘風破浪、順勢而為，避免搞得驚濤駭浪、民不聊生"],"a":3,"e":"答案(D)。處理風險宜因勢利導、順勢而為，避免引起過度震盪，是合理的觀念。(A)錯：主管的責任應大於部屬；(B)錯：前台、中台、後台都要面對風險；(C)錯：「從上而下」與「由下往上」兩種決策過程同樣重要，應兼顧。","c":1,"f":1,"ap":["E7-1"]},{"i":"E7-2","q":"下列何者不屬於「責任中心體系」的分類要素？","o":["區域中心","成本中心","利潤中心","投資中心"],"a":0,"e":"答案(A)。責任中心體系依權責範圍分為成本（費用）中心、利潤中心及投資中心（另有收入中心）。「區域中心」是依地理劃分的組織單位，不是責任中心的分類要素。","c":2,"f":1,"ap":["E7-2"]},{"i":"E7-14","q":"銀行之放款利率＝基準利率＋風險加減碼，有關風險加減碼下列何者錯誤？","o":["信用等級加碼","外匯實績加減碼","存款實績加減碼","借款實績加減碼"],"a":3,"e":"答案(D)。放款利率＝基準利率＋風險加減碼，風險加減碼包括信用等級加碼、外匯實績加減碼、存款實績加減碼等，依企業經營績效與產業環境而定。「借款實績加減碼」不是教材列的風險加減碼項目。","c":4,"f":1,"ap":["E7-14"]},{"i":"E7-16","q":"有關授信案件之訂價原則，應考慮下列哪些風險貼水因子？ A.信用等級加減碼 B.借款期別 C.擔保品成數或比例D.授信展望加減碼","o":["僅AC","僅BD","僅ABC","ABCD"],"a":3,"e":"答案(D)。授信訂價應考慮的風險貼水因子包括：信用等級加減碼、借款期別（期間越長風險越高）、擔保品成數或比例、授信展望加減碼。A、B、C、D四項都要考慮。","c":4,"f":1,"ap":["E7-16"]},{"i":"E7-19","q":"銀行法第38 條規定，購買或建造住宅使用的建築物，辦理中、長期借款時，最長期限不得超過幾年？但對於無自用住宅者購買自用住宅之放款，不在此限。","o":["20 年","25 年","30 年","40 年"],"a":2,"e":"答案(C)。銀行法第38條規定，銀行對購買或建造住宅或企業用建築，得辦理中、長期放款，最長期限不得超過30年；但對無自用住宅者購買自用住宅的放款，不受此限。","c":5,"f":1,"ap":["E7-19"]},{"i":"E7-22","q":"有關房屋淨值放款，下列敘述何者錯誤？","o":["所謂房屋淨值係以其公告地價扣除第一順位抵押借款之餘額","實務上第二順位貸款的還款期間應比第一順位短","借款人還清部分房貸後，可申請增加額度","第二順位抵押貸款之信用風險貼水加碼會高於第一順位抵押貸款"],"a":0,"e":"答案(A)。房屋淨值＝房屋「市場價值」－第一順位抵押借款餘額，不是用公告地價計算，所以(A)錯誤。(B)實務上第二順位貸款的還款期間比第一順位短；(C)借款人還清部分房貸後可申請增加額度；(D)第二順位求償順位較後，信用風險貼水較高，均正確。","c":5,"f":1,"ap":["E7-22"]},{"i":"E7-23","q":"有關信用卡業務，下列敘述何者錯誤？","o":["特約商店係指接收持卡人刷卡消費並簽帳的商店","發卡機構從事代理收付持卡人在特約商店刷卡產生之帳款","正卡申請人應年滿20 歲，並檢附身分證明及還款能力相關資料","國外交易需經由國際清算組織，居間提供發卡機構和收單機構雙方的授權和清算服務"],"a":1,"e":"答案(B)。代理收付持卡人在特約商店刷卡消費帳款是「收單機構」的收單業務，不是發卡機構的業務，所以(B)錯誤。(A)特約商店是接受持卡人刷卡簽帳的商店；(D)國外交易須透過國際清算組織提供授權與清算服務，均正確。(C)「年滿20歲」為命題當時的規定，依官方答案視為正確敘述；現行規定已配合民法成年年齡下修為18歲。","c":5,"f":1,"ap":["E7-23"],"g":"C選項「年滿20歲」為舊規定；民法成年年齡自2023年起下修為18歲（講義同題亦為18歲），依現行規定C也可能被視為錯誤"},{"i":"E7-24","q":"根據金融控股公司法，金融控股公司之銀行子公司對利害關係人為擔保授信時，應經三分之二以上董事出席及出席董事四分之三以上同意之限額規定，下列敘述何者正確？","o":["對同一授信客戶之每筆或累計擔保授信金額達新臺幣1 億元或該銀行淨值1%者","對同一授信客戶之每筆或累計擔保授信金額達新臺幣2 億元或該銀行淨值2%者","對同一授信客戶之每筆或累計擔保授信金額達新臺幣3 億元或該銀行淨值3%者","對同一授信客戶之每筆或累計擔保授信金額達新臺幣4 億元或該銀行淨值4%者"],"a":0,"e":"答案(A)。依金融控股公司法（及銀行法第33條），銀行子公司對利害關係人辦理擔保授信，對同一授信客戶每筆或累計金額達新臺幣1億元以上或該銀行淨值1%以上者（孰低），應經三分之二以上董事出席、出席董事四分之三以上同意，而且條件不得優於其他同類授信對象。","c":7,"f":1,"ap":["E7-24"]},{"i":"E7-27","q":"下列何者不屬於內部評等法（IRB 法）之信用風險資本計提的決定因素？","o":["違約機率","存續期間","違約損失率","信用暴險值"],"a":1,"e":"答案(B)。內部評等法(IRB)的信用風險資本計提，決定因素包括違約機率(PD)、違約損失率(LGD)、信用暴險值(EAD)（進階法另考慮有效到期期間M）。教材列的三項是PD、LGD、EAD，「存續期間」(Duration)是衡量利率風險的指標，不是IRB的決定因素。","c":12,"f":1,"ap":["E7-27"]},{"i":"E7-30","q":"銀行根據風險對象所屬國家加以彙總，以了解國家的信用風險集中度時，若信用對象登記在英屬維京群島時，應：","o":["以該信用風險對象之所有人所屬國別認列","將該信用風險彙整入高風險類之其他國別","將該信用對象之國別風險彙整入英屬維京群島","以該信用風險對象資金主要使用所在地國別認列"],"a":3,"e":"答案(D)。授信客戶國別實務上採法定歸屬，但如果信用對象登記在英屬維京群島、開曼群島等免稅地區（多半沒有實際營運），應以該信用風險對象資金主要使用所在地的國別認列，才能反映真正的國家風險。","c":7,"f":1,"ap":["E7-30"]},{"i":"E7-33","q":"學理上，當借款企業之總資產低於總負債時，可能逐漸無法「還本付息」，接著出現逾期、催收與呆帳、宣告破產；此種可能發生的違約事件，將使銀行承擔鉅額的信用損失。此類違約事件，係屬於下列何者？","o":["經濟違約","技術性違約","借款人未符合契約要求","負債價值低於資產"],"a":0,"e":"答案(A)。借款企業總資產低於總負債（市場淨值為負），可能逐漸無法還本付息，這種違約事件在發生初期屬於「經濟違約」。技術性違約是指未遵守契約規定（如財務承諾條款）；(D)只是描述財務狀況，而且方向寫反了。","c":12,"f":1,"ap":["E7-33"]},{"i":"E7-36","q":"依據主管機關規定，臺灣地區銀行對大陸地區之授信、投資及資金拆存總額度，不得超過其上年度決算後淨值之多少倍數？","o":["0.8 倍","1 倍","1.2 倍","1.5 倍"],"a":1,"e":"答案(B)。依「臺灣地區與大陸地區金融業務往來及投資許可管理辦法」，臺灣地區銀行對大陸地區的授信、投資及資金拆存總額度，不得超過其上年度決算後淨值的1倍。","c":7,"f":1,"ap":["E7-36"]},{"i":"E7-42","q":"美麗華銀行平價(Par Value)持有息票利率為3%的2 年期債券10,000 元，一年之後，市場利率攀升10 個基本點(BasisPoint)，請問此債券的市場價值為何？","o":["9,804 元","9,718 元","9,699 元","9,615 元"],"a":1,"e":"答案(B)。平價債券一年後只剩一期，到期可收本金10,000＋利息10,000×3%＝300，共10,300元，價格＝10,300÷(1＋新殖利率)。若照題目，市場利率由3%上升10個基本點至3.1%，價格＝10,300÷1.031≈9,990元，沒有對應選項。觀察四個選項，分別約等於10,000÷1.02≈9,804、10,000÷1.029≈9,718、10,000÷1.031≈9,699、10,000÷1.04≈9,615，都是只折現本金、沒有計入最後一期利息；官方答案(B)9,718元恰為10,000÷1.029（用10,300÷1.06≈9,717也接近）。本題數據疑有誤植，考試時記住官方答案(B)即可。","c":13,"f":1,"ap":["E7-42"],"g":"題目寫「攀升10個基本點」，正確算法10,300÷1.031≈9,990元無對應選項；選項似為10,000÷(1＋r)（r＝2%、2.9%、3.1%、4%），官方答案9,718＝10,000÷1.029（或約10,300÷1.06），與題意不符，題目數據疑有誤植"},{"i":"E7-43","q":"假設本國A 銀行於承作5,000 萬美元放款時，同時發行4,500 萬美元定期存單，則借貸相抵後該行擁有多少美元外幣部位？","o":["短部位500 萬美元","短部位5,000 萬美元","長部位500 萬美元","長部位5,000 萬美元"],"a":2,"e":"答案(C)。放款5,000萬美元對銀行而言是買入美元資產，發行定期存單4,500萬美元是賣出美元（美元負債）。買入大於賣出，淨額5,000－4,500＝500萬美元，所以是長部位500萬美元（美元貶值時會有匯兌損失）。","c":13,"f":1,"ap":["E7-43"]},{"i":"E7-47","q":"大直銀行的內部評等法，對AAA 級授信客戶，設定14%風險權數，低於標準法使用的20%，若該銀行承作此客戶10 億元「無擔保授信」，請問兩種方法相差多少資本計提額？","o":["0.6 億元","0.048 億元","0.112 億元","0.128 億元"],"a":-1,"e":"本題官方公告一律給分。兩種方法的風險權數相差20%－14%＝6%，風險性資產相差10億×6%＝0.6億元，(A)只是風險性資產的差額，不是資本計提額。資本計提額＝授信金額×風險權數×資本比率：若以Basel最低資本比率8%計算，相差10億×6%×8%＝0.048億元(B)；若以資本適足率10.5%計算則為10億×6%×10.5%＝0.063億元（不在選項中）。題目未說明適用哪個比率，故無唯一標準答案（同題型見第1屆第43題、講義第12章第31題）。","c":12,"f":1,"ap":["E7-47"]},{"i":"E7-48","q":"假設常態情況的容忍水準為1%，殖利率標準差為0.5%，β為敏感性係數為0.5，下列敘述何者正確？","o":["VaR=0-2.325×1×0.005","VaR=0-2.325×1×0.01","VaR=0-2.325×0.5×0.01","VaR=0-2.325×0.5×0.005"],"a":3,"e":"答案(D)。VaR＝0－Z×β×σ，單尾容忍水準1%對應Z＝2.325，β＝0.5，殖利率標準差σ＝0.5%＝0.005，所以VaR＝0－2.325×0.5×0.005。(A)(B)把β誤用成1，(C)把σ誤用成0.01。","c":13,"f":1,"ap":["E7-48"]},{"i":"E7-52","q":"已知某借款客戶信用暴險額為100 億元，預估違約機率為5%，呆帳回收率為80%，則該借款客戶的預估信用損失應為多少？","o":["1 億元","2 億元","3 億元","4 億元"],"a":0,"e":"答案(A)。預估信用損失＝信用暴險額×違約機率×違約損失率，違約損失率＝1－回收率＝1－80%＝20%。計算：100億×5%×20%＝1億元。","c":12,"f":1,"ap":["E7-52"]},{"i":"E7-53","q":"依主管機關現行資本適足率規定，以「非自用住宅」當作擔保品，其風險權數應如何訂定？","o":["一律以貸放比率(Loan to Value; LTV)為基礎劃分","一律適用100%風險權數","一律適用45%風險權數","一律適用35%風險權數"],"a":-1,"e":"本題官方公告一律給分。依講義所載資本適足率規定，以「自用住宅」為擔保且貸放比率(LTV)在75%以下者適用35%風險權數；以「非自用住宅」為擔保者，不分LTV一律適用75%風險權數。本題四個選項（(A)依LTV劃分、(B)100%、(C)45%、(D)35%）都不是75%，因此無正確答案（正確選項版本見講義第12章第8題、第17屆第31題）。","c":12,"f":1,"ap":["E7-53"]},{"i":"E7-55","q":"已知債券市值為10,000 元，PVBP(Present Value of One Basis Point)計算為5。若利率上升10 基點(basis point)，則其價格應為下列何者？","o":["9,995 元","9,950 元","10,005 元","10,050 元"],"a":1,"e":"答案(B)。PVBP＝5表示利率每變動1個基點，債券價格變動5元。利率上升10個基點時，價格下跌5×10＝50元，新價格＝10,000－50＝9,950元。利率上升價格會下跌，所以(C)(D)方向錯誤。","c":13,"f":1,"ap":["E7-55"]},{"i":"E7-56","q":"五年期的英國純折扣債券(pure discount bond)，面額為100 英鎊，市場顯示相同風險等級的五年期殖利率為3%。若英鎊對美元的匯率為1：1.3310，則當英鎊貶值1%，債券價值將變動多少幅度？","o":["增加0.84 美元","增加0.86 美元","減少5.57 美元","減少5.74 美元"],"a":1,"e":"答案(B)。先算債券現值：100÷(1.03)^5≈86.26英鎊。教材解法是把現值乘以1%，得到86.26×1%≈0.86，對應答案(B)「增加0.86美元」。不過以美元投資人來看，債券美元價值＝86.26×1.331≈114.81美元，英鎊貶值1%應使美元價值減少約1.15美元。","c":13,"f":1,"ap":["E7-56"],"g":"依匯率邏輯，英鎊貶值1%應使美元價值減少約86.26×1.331×1%≈1.15美元；官方答案「增加0.86美元」是以86.26×1%計算，數值單位與方向都有疑義"},{"i":"E7-58","q":"A 銀行民國106 年底淨值為新臺幣（以下同）1,200 億元，107 年1 月對非為利害關係人之同一法人最高授信總餘額不得超過多少？","o":["60 億元","120 億元","180 億元","240 億元"],"a":2,"e":"答案(C)。依銀行法第33條之3授權規定，銀行對同一法人（非利害關係人）的授信總餘額不得超過銀行淨值的15%（其中無擔保授信不得超過5%）。計算：1,200億×15%＝180億元。","c":7,"f":1,"ap":["E7-58"]},{"i":"E8-8","q":"A 銀行在107 年12 月底之信用風險加權風險性資產為新臺幣（以下同）1,000 億元，市場風險和作業風險應計提資本各為5 億元，請問三種風險合計的加權風險性資產為下列何者？","o":["1,000 億元","1,005 億元","1,010 億元","1,125 億元"],"a":3,"e":"答案(D)。風險性資產總額＝信用風險加權風險性資產＋(市場風險應計提資本＋作業風險應計提資本)×12.5。計算：1,000＋(5＋5)×12.5＝1,000＋125＝1,125億元。","c":9,"f":1,"ap":["E8-8"]},{"i":"E8-10","q":"學理上，當借款企業總資產的市場價值低於總負債的市場價值時，可能逐漸無法「還本付息」，接著出現逾期、催收與呆帳、宣告破產；此種可能發生的違約事件，將使銀行承擔鉅額的信用損失。此類違約事件，係屬於下列何者？","o":["經濟違約","技術性違約","借款人未符合契約要求","負債帳面價值低於資產帳面價值"],"a":0,"e":"答案(A)。借款企業總資產市值低於總負債市值（市場淨值為負），可能逐漸無法還本付息，最後走到逾期、催收、呆帳甚至破產，這種違約在初期屬於經濟違約。技術性違約是指未遵守契約規定；(D)是用帳面價值描述，而且方向寫反了。","c":12,"f":1,"ap":["E8-10"]},{"i":"E8-17","q":"有關資金移轉制度的敘述，下列何者錯誤？","o":["銀行資金呈現浮濫時，宜透過調低供應利率，減少營業單位吸收定期性存款","銀行若要加強推動授信業務，可透過調高供應利率來間接達成","多種借用利率與供應利率構成的FTP 制度，稱為「多軌制」的聯行往來","銀行的內部資金轉撥價格，又稱聯行往來利率"],"a":1,"e":"答案(B)。要加強推動授信業務，應「降低借用利率」，讓營業單位取得放款資金的內部成本下降、更有誘因承作放款，而不是調高供應利率，所以(B)錯誤。(A)資金浮濫時調低供應利率可減少吸收定期性存款；(C)多種借用與供應利率構成「多軌制」；(D)內部資金轉撥價格又稱聯行往來利率，均正確。","c":2,"f":3,"ap":["E8-17","E9-10","E18-45"]},{"i":"E8-21","q":"有關保險公司的資本適足率與業務限制，下列敘述何者錯誤？","o":["資本充裕等級的保險公司其資本適足率須達300%以上","臺灣自2013 年6 月底開始，分成五個等級的資本適足率","保險公司的資本適足率達300%以上時，得申請從事增加投資效益之衍生性金融商品交易","財務和業務健全的保險公司，最近一年之資本適足率達200%時，可申請「傷害保險」及「健康保險」"],"a":2,"e":"答案(C)。依「保險業從事衍生性金融商品交易管理辦法」，保險業從事增加投資效益目的之衍生性商品交易，資本適足率須達法定標準(200%)的1.25倍，也就是250%以上；官方以(C)寫成「300%」作為錯誤選項。(A)資本充裕須達300%以上、(B)2013年6月底起分成五個等級、(D)最近一年資本適足率達200%可申請傷害保險及健康保險，依官方答案均屬正確敘述。","c":10,"f":1,"ap":["E8-21"],"g":"法定門檻為250%，資本適足率達300%以上者實際上也符合申請資格，(C)敘述嚴格來說並非錯誤，題意有歧義；另本題依舊制RBC（法定標準200%）作答，2026年起保險業改採TW-ICS新制，資本適足法定標準改為100%（講義資本等級表採新制：適足100%以上、不足50%～未達100%、顯著不足25%～未達50%、嚴重不足低於25%）"},{"i":"E8-26","q":"關於授信業務的回收風險，會受到哪些風險因素影響，下列敘述何者錯誤？","o":["擔保品風險","第三人保證的風險","簽訂的法律契約風險","違約機率固定且風險事先已知"],"a":3,"e":"答案(D)。授信業務的回收風險包括擔保品風險、第三人保證的風險、簽訂的法律契約（契約保障條款）風險。違約機率是「變動且未知」的，(D)「違約機率固定且風險事先已知」不是回收風險的因素，敘述本身也不正確。","c":12,"f":1,"ap":["E8-26"]},{"i":"E8-27","q":"請問衡量市場風險時，主要部位或個別金融商品的「價格波動」，下列哪項指標是錯誤？","o":["標準差","變異數","變異係數","敏感性係數"],"a":3,"e":"答案(D)。衡量部位價格波動程度（部位價值變動率）的統計指標是標準差、變異數、變異係數。敏感性係數衡量的是「市場因素變動一單位時部位價值變動多少」，屬於另一類指標，所以(D)錯誤。","c":13,"f":1,"ap":["E8-27"]},{"i":"E8-35","q":"信用風險的產生，主要係因下列何者的經營體質出現惡化或發生其他不利因素，導致客戶不依契約內容履行其付款義務，而使銀行產生違約損失的風險？","o":["存款人","借款人","保證人","財富管理客戶"],"a":1,"e":"答案(B)。信用風險是指借款人（客戶）經營體質惡化或發生其他不利因素，不依契約履行付款義務，讓銀行產生違約損失的風險。存款人、財富管理客戶不是授信債務人；保證人只是第二還款來源。","c":12,"f":1,"ap":["E8-35"]},{"i":"E8-46","q":"依Basel II估計表外非衍生性商品的風險性資產時，下列敘述何者錯誤？","o":["信用相當額＝交易金額×信用轉換係數","風險性資產＝信用相當額×風險權數","信用轉換係數有0%、20%、50%、100%","風險權數有0%、20%、50%、100%"],"a":3,"e":"答案(D)。依Basel II估計表外非衍生性商品：信用相當額＝交易金額×信用轉換係數（0%、20%、50%、100%），風險性資產＝信用相當額×風險權數。依教材，此處風險權數為0%、20%、100%三種，(D)列入50%是錯的。","c":12,"f":1,"ap":["E8-46"]},{"i":"E8-60","q":"A 公司資產負債表之流動資產為新臺幣（以下同）6,000 萬元，固定資產及長期投資為6,500 萬元，流動負債為9,000 萬元，長期負債及淨值為4,000 萬元，則下列敘述何者正確？","o":["A 公司尚有500 萬元之長期資金可供經常週轉用","A 公司以長期資金流用於固定資產及長期投資之金額達500 萬元","A 公司以短期資金流用於固定資產及長期投資之金額達2,500 萬元","A 公司尚有2,500 萬元之長期資金可供經常週轉用"],"a":2,"e":"答案(C)。長期資金＝長期負債＋淨值＝4,000萬元，但固定資產及長期投資有6,500萬元，長期資金不足以支應，差額6,500－4,000＝2,500萬元必須挪用短期資金（以短支長），所以(C)正確。這家公司沒有多餘的長期資金可供經常週轉，(A)(B)(D)錯誤。","c":4,"f":1,"ap":["E8-60"]},{"i":"E9-17","q":"金融監督管理委員會於2005 年12 月19 日發函，明確規範「債務人於全體金融機構之無擔保債務歸戶後之總餘額除以平均月收入」，不宜超過多少倍？","o":["20 倍","21 倍","22 倍","23 倍"],"a":2,"e":"答案(C)。金管會於2005年12月19日發函規定，債務人在全體金融機構的無擔保債務歸戶總餘額除以平均月收入，不宜超過22倍（俗稱DBR 22倍），以控管消費金融信用風險。","c":5,"f":1,"ap":["E9-17"]},{"i":"E9-31","q":"有關Basel 監理委員會2010 年12 月16 日發布的資本協定第三版(Basel III)，下列敘述何者錯誤？","o":["除了法定的資本計提額，另外增訂「緩衝資本2.5%」","提高「普通股權益資本的比率」由2013 年起逐步調高至2015 年的4.5%","為防範景氣循環帶來衝擊，設計「額外緩衝資本」0~2.5%，但建議各國政府自行決定緩衝幅度","增訂長期的淨穩定資金率(Net Stable Funding Ratio)，目前該比率以「大於或等於120%」作為門檻"],"a":3,"e":"答案(D)。Basel III的淨穩定資金比率(NSFR)門檻是「大於或等於100%」，不是120%，所以(D)錯誤。(A)另設2.5%的緩衝資本；(B)普通股權益比率由2013年逐步提高到2015年的4.5%；(C)抗景氣循環緩衝資本0~2.5%由各國自行決定，均正確。","c":14,"f":2,"ap":["E9-31","E20-53"]},{"i":"E9-38","q":"實務上，銀行的「債權管理」仍會發生回收風險，該回收風險不包括下列何者？","o":["擔保品風險","第三人保證的風險","簽訂的法律契約風險","違約機率固定且已知風險"],"a":3,"e":"答案(D)。債權管理的回收風險包括擔保品風險、第三人保證的風險、簽訂的法律契約風險。違約機率實際上是變動且未知的，「違約機率固定且已知」不屬於回收風險。","c":12,"f":1,"ap":["E9-38"]},{"i":"E9-40","q":"假設容忍水準為1%，標準差為0.6%，β為敏感性係數為0.5，下列敘述何者正確？","o":["VaR=0－2.325×0.5×0.005","VaR=0－2.325×0.6×0.006","VaR=0－2.325×0.5×0.01","VaR=0－2.325×0.5×0.006"],"a":3,"e":"答案(D)。VaR＝0－Z×β×σ，容忍水準1%對應Z＝2.325，β＝0.5，σ＝0.6%＝0.006，所以VaR＝0－2.325×0.5×0.006。(A)σ誤用成0.005，(B)β誤用成0.6，(C)σ誤用成0.01。","c":13,"f":1,"ap":["E9-40"]},{"i":"E9-41","q":"大衛是美國的投資者，購買一張德國債券1,000 歐元，購買當時的即期匯率為1 歐元兌換1.25 美元，經過了一年，歐元升值至1 歐元兌換1.5385 美元，請問此投資者來自匯率變動的損益如何？","o":["獲利288 美元","損失288 美元","獲利288 歐元","損失288 歐元"],"a":0,"e":"答案(A)。投資時債券價值＝1,000歐元×1.25＝1,250美元；一年後＝1,000×1.5385＝1,538.5美元。歐元升值，美國投資者的匯兌獲利為1,538.5－1,250＝288.5美元（約288美元），損益以本國貨幣美元衡量。","c":13,"f":1,"ap":["E9-41"]},{"i":"E9-43","q":"關於房屋淨值放款，下列何者錯誤？","o":["又稱二胎房貸","求償權居於第二順位","以房屋市場價值充當抵押品","房屋淨值是由房屋市場價值與第一順位抵押借款餘額相減而得"],"a":2,"e":"答案(C)。房屋淨值放款是以「房屋淨值」（房屋市場價值－第一順位抵押借款餘額）作為抵押品，不是以房屋市場價值作抵押，所以(C)錯誤。(A)又稱二胎房貸、(B)求償權居第二順位、(D)房屋淨值的定義，均正確。","c":5,"f":1,"ap":["E9-43"]},{"i":"E10-1","q":"有關資產負債管理委員會之權責，下列敘述何者錯誤？","o":["審核全行作業風險緊急應變計畫","審核流動性管理指標的門檻標準","審核利率風險之避險策略","審核金融同業拆款額度"],"a":0,"e":"答案(A)。資產負債管理委員會(ALCO)負責審核流動性管理指標門檻、利率風險避險策略、金融同業拆款額度、聯行往來利率等資產負債相關事項。作業風險的緊急應變計畫屬於作業風險管理範疇，由風險管理單位或相關委員會負責，不是ALCO的權責。","c":1,"f":1,"ap":["E10-1"]},{"i":"E10-25","q":"有關公司債之敘述，下列何者正確？","o":["同一發行機構的短期債券評等與長期債券評等並無絕對關係","同一發行機構的短期債券評等較高，則長期債券評等較高","同一發行機構的長期債券評等較高，則短期債券評等較高","公司長期債券評等最重要的因素是對該公司流動能力優劣的評估"],"a":0,"e":"答案(A)。同一發行機構的短期債券評等與長期債券評等並無絕對關係，因為兩者評估的重點不同：短期評等著重流動性與短期償債能力，長期評等著重長期獲利與償債能力，故(A)正確、(B)(C)錯誤。(D)錯誤：依講義，公司債等級定量分析最重要的指標是利息保障倍數（次要指標為長期償債能力），並非流動能力。","c":6,"f":1,"ap":["E10-25"]},{"i":"E10-28","q":"金管會依「台灣地區與大陸地區金融業務往來及投資許可管理辦法」第12 條之1 規定，銀行對中國的國家風險總額度不得超過下列何者？","o":["上年度決算後資本額的1 倍","上年度決算後資本額的1.5 倍","上年度決算後淨值的1 倍","上年度決算後淨值的1.5 倍"],"a":2,"e":"答案(C)。依「臺灣地區與大陸地區金融業務往來及投資許可管理辦法」第12條之1，銀行對大陸地區的授信、投資及資金拆存總額度（國家風險總額度），不得超過上年度決算後淨值的1倍。","c":8,"f":1,"ap":["E10-28"]},{"i":"E10-30","q":"本國銀行篩選與陸資銀行業務往來之信用等級標準為下列何者？","o":["中華信用評等機構給予的信用等級在A 等級以上","中華信用評等機構給予的信用等級在BBB 等級以上","S&P、Moody’s 及Fitch 信用評等機構給予的信用等級在A 等級以上","S&P、Moody’s 及Fitch 信用評等機構給予的信用等級在BBB 等級以上"],"a":3,"e":"答案(D)。本國銀行篩選往來的陸資銀行時，信用等級標準是經S&P、Moody's或Fitch等國際信用評等機構評定為BBB等級（投資等級）以上。標準是國際信評機構而不是中華信評，門檻是BBB不是A。","c":6,"f":1,"ap":["E10-30"]},{"i":"E10-37","q":"有關Basel III 增訂之流動性風險指標，下列敘述何者錯誤？","o":["流動性覆蓋率係指高品質的流動資產除以30 天期之淨現金流出","流動性覆蓋率反應在監理機關嚴峻的流動性需求下處分資產換取現金的能力","淨穩定資金比率係指法定穩定資金除以可取得的穩定資金","淨穩定資金比率強調用來支應資產和業務活動的資金，至少須一定比率來自於穩定的負債"],"a":2,"e":"答案(C)。淨穩定資金比率(NSFR)＝可取得的穩定資金÷應有（法定）穩定資金，(C)把分子分母顛倒了。(A)LCR＝高品質流動資產÷30天期淨現金流出；(B)LCR反映嚴峻情境下處分資產換取現金的能力；(D)NSFR要求支應資產和業務的資金有一定比率來自穩定負債，均正確。","c":14,"f":1,"ap":["E10-37"]},{"i":"E10-48","q":"A 銀行依據甲集團企業之信用評等核定風險限額為新臺幣（以下同）100 億元，目前使用率70%，考量其舉債能力變差，調降限額至80 億元，則剩餘可動用額度為多少元？","o":["10 億元","20 億元","30 億元","80 億元"],"a":0,"e":"答案(A)。原風險限額100億元、使用率70%，表示已動用70億元。限額調降為80億元後，剩餘可動用額度＝80－70＝10億元。","c":7,"f":1,"ap":["E10-48"]},{"i":"E10-52","q":"保險業經營人身保險業務，其風險構成項目包括下列哪些？ A.保險風險 B.利率風險 C.資產風險 D.資產負債配置風險","o":["僅A、B","僅C、D","僅A、B、C","A、B、C、D"],"a":2,"e":"答案(C)。依（舊制）保險業資本適足性管理辦法，人身保險業的風險資本構成項目為資產風險、保險風險、利率風險及其他風險，所以A、B、C屬之。資產負債配置風險（以及信用風險、核保風險）是財產保險業的風險項目，因此選僅A、B、C。","c":10,"f":3,"ap":["E10-52","E15-26","E19-54"],"g":"依舊制分類作答；新版RBC/TW-ICS架構已改按保險、市場、信用、作業等風險類別計算，現行法規下分類不同"},{"i":"E11-13","q":"有關信用卡業務，下列敘述何者錯誤？","o":["特約商店係指接收持卡人刷卡消費並簽帳的商店","所有發卡機構均從事代理收付持卡人在特約商店刷卡產生之帳款","正卡申請人應年滿20 歲，並檢附身分證明及還款能力相關資料","國外交易需經由國際清算組織，居間提供發卡機構和收單機構雙方的授權和清算服務"],"a":1,"e":"答案(B)。發卡機構負責發卡、循環信用、預借現金等；代理收付特約商店刷卡帳款是「收單機構」的收單業務，並非所有發卡機構都從事，所以(B)錯誤。(A)特約商店的定義、(D)國外交易須透過國際清算組織處理授權與清算，均正確。(C)「年滿20歲」為命題當時的規定，依官方答案視為正確敘述；現行規定已配合民法成年年齡下修為18歲。","c":5,"f":1,"ap":["E11-13"],"g":"C選項「年滿20歲」為舊規定；民法成年年齡自2023年起下修為18歲（講義同題亦為18歲），依現行規定C也可能被視為錯誤"},{"i":"E11-24","q":"關於金融控股公司之合格資本，應包括下列哪些項目？ A.普通股 B.特別股 C.商譽 D.按持股比例乘於子公司合格資本","o":["僅A","僅AB","僅ACD","ABCD"],"a":1,"e":"答案(B)。金控公司的合格資本是普通股、特別股、次順位債券、預收資本、公積、累積盈虧及其他權益的合計數，再減除商譽等無形資產、遞延資產及庫藏股。A普通股、B特別股屬於合格資本；C商譽是扣除項目；D「按持股比例乘以子公司合格資本」是集團合格資本的計算方式，不是金控本身合格資本的項目，所以選僅AB。","c":9,"f":1,"ap":["E11-24"]},{"i":"E11-27","q":"銀行的交易對手發現，衍生性交易明顯不利於自己時，可能選擇「不履約」，係稱為何種風險？","o":["交割日風險","交割日前的風險","直接放款風險","間接放款風險"],"a":1,"e":"答案(B)。衍生性交易在交割日之前，交易對手如果發現契約明顯對自己不利，可能選擇不履約，讓銀行損失重置成本，這稱為交割日前的風險（交割前風險）。交割日風險是交割當天一方已付款而對方未交付的風險。","c":12,"f":1,"ap":["E11-27"]},{"i":"E11-30","q":"銀行發行票券或債券商品，迄今仍流通在外的餘額，實務上稱為下列何者？","o":["買入票券或債券","金融資產","金融負債","長部位"],"a":2,"e":"答案(C)。銀行發行的票券或債券商品，到目前仍流通在外（尚未到期）的餘額，屬於銀行的負債，實務上稱為「金融負債」。如果是銀行買入的票券或債券，則屬於金融資產。","c":13,"f":1,"ap":["E11-30"]},{"i":"E11-49","q":"根據金管會規定，本國銀行在大陸地區的授信、投資與資金拆存總額，不得高於銀行淨值的多少比重？","o":["2 倍","1.5 倍","1 倍","0.5 倍"],"a":2,"e":"答案(C)。依主管機關規定，本國銀行對大陸地區的授信、投資及資金拆存總額度，不得超過其上年度決算後淨值的1倍。","c":7,"f":2,"ap":["E11-49","E17-21"]},{"i":"E11-57","q":"假設英國政府發行5 年期純折扣債券，到期一次還本、面額1 百萬英鎊，市場顯示相同風險等級的5 年期殖利率為6%。假設英鎊對美元為1:1.3 時，則英國公債之美元現值為何（取最接近值）？","o":["約971,435","約916,448","約1,029,721","約1,091,373"],"a":0,"e":"答案(A)。英鎊現值＝1,000,000÷(1.06)^5≈747,258英鎊；換算美元＝747,258×1.3≈971,436美元，最接近(A)約971,435。","c":13,"f":1,"ap":["E11-57"]},{"i":"E12-16","q":"銀行法對「利害關係人」之規範，下列敘述何者錯誤？","o":["適用同一授信客戶之每筆或累計擔保授信金額達新臺幣1 億元以上或銀行淨值1%孰低者","對同一法人之擔保授信總餘額，不得超過銀行淨值10%","對同一自然人之擔保授信總餘額，不得超過銀行淨值2%","對所有利害關係人之擔保授信總餘額，不得超過銀行淨值二倍"],"a":3,"e":"答案(D)。依銀行法規定，對所有利害關係人的擔保授信總餘額不得超過銀行淨值的1.5倍，不是二倍，所以(D)錯誤。(A)每筆或累計達1億元以上或淨值1%孰低者適用相關限制；(B)同一法人擔保授信不得超過淨值10%；(C)同一自然人不得超過淨值2%，均正確。","c":7,"f":1,"ap":["E12-16"]},{"i":"E12-24","q":"票券金融公司的資本適足率在13%以上時，辦理短期票券之保證、背書總餘額不得超過公司淨值多少？","o":["4 倍","5 倍","5.5 倍","6 倍"],"a":2,"e":"答案(C)。票券金融公司資本適足率在13%以上時，辦理短期票券保證、背書的總餘額不得超過其淨值的5.5倍。此外，資本適足率不得低於8%，達10%以上才可投資外幣債券及股權商品。","c":10,"f":1,"ap":["E12-24"]},{"i":"E12-25","q":"證券商向主管機關申請經營衍生性業務時，最近六個月每月申報的資本適足率均須超過下列何者？","o":["100%","150%","200%","250%"],"a":2,"e":"答案(C)。證券商申請經營衍生性金融商品業務，最近6個月每月申報的資本適足率均須超過200%。250%是連續3個月達到後，融資總金額可放寬到淨值400%的門檻；150%是主管機關得暫緩新種業務的界線。","c":10,"f":2,"ap":["E12-25","E19-26"]},{"i":"E12-26","q":"下列何種風險較不屬於人身保險業的風險項目？","o":["資產風險","信用風險","保險風險","利率風險"],"a":1,"e":"答案(B)。依（舊制）保險業資本適足性管理辦法，人身保險業的風險項目為資產風險、保險風險、利率風險及其他風險；信用風險則列在財產保險業的風險項目中，所以較不屬於人身保險業的風險項目。","c":10,"f":3,"ap":["E12-26","E16-25","E21-27"],"g":"依舊制分類作答；新版RBC/TW-ICS架構(講義所列)已將信用風險納入人身保險業風險資本，現行法規下本題可能有爭議"},{"i":"E12-30","q":"計算非衍生性業務之信用風險性資產時，計算過程不包含下列何者？","o":["信用相當額","交易金額","暴險額","風險權數"],"a":2,"e":"答案(C)。非衍生性業務的信用風險性資產計算：信用相當額＝交易金額×信用轉換係數，風險性資產＝信用相當額×風險權數，過程中不使用暴險額。暴險額（當期暴險額＋潛在暴險額）是計算衍生性業務信用相當額時使用的。","c":12,"f":1,"ap":["E12-30"]},{"i":"E12-31","q":"假設常態情況的容忍水準為1%，殖利率之標準差為0.5%，敏感性係數β為0.5，下列敘述何者正確？","o":["VaR=0-2.325×1×0.005","VaR=0-2.325×1×0.01","VaR=0-2.325×0.5×0.01","VaR=0-2.325×0.5×0.005"],"a":3,"e":"答案(D)。VaR＝0－Z×β×σ，容忍水準1%對應Z＝2.325，β＝0.5，殖利率標準差σ＝0.5%＝0.005，所以VaR＝0－2.325×0.5×0.005。(A)(B)β誤用成1，(C)σ誤用成0.01。","c":13,"f":2,"ap":["E12-31","E18-33"]},{"i":"E12-34","q":"銀行之流動性風險與利率風險管理的監督指標，下列敘述何者錯誤？","o":["存款準備與流動準備，係與利率風險有關的準備部位","存款準備與流動準備，係與流動性風險有關的準備部位","利率風險以資產負債的「利率敏感性和非敏感性」為基準，設置缺口指標","流動性風險以現金流入與流出相減的「淨現金流量」為基礎，設置缺口指標"],"a":0,"e":"答案(A)。存款準備與流動準備是和「流動性風險」有關的準備部位，不是利率風險，所以(A)錯誤、(B)正確。(C)利率風險以資產負債的利率敏感性與非敏感性為基準設置缺口指標；(D)流動性風險以淨現金流量為基礎設置缺口指標，均正確。","c":14,"f":1,"ap":["E12-34"]},{"i":"E13-5","q":"利潤中心制度最好使用下列何者當作績效衡量指標？","o":["營業利益","邊際貢獻","可控制利益","淨利(Net Income)"],"a":2,"e":"答案(C)。利潤中心主管只能對可控制的收入與成本負責，所以最好用「可控制利益」當作績效衡量指標。營業利益、淨利包含總行分攤的不可控制費用；邊際貢獻沒有考慮部門可控制的固定成本，都不夠公允。","c":2,"f":5,"ap":["E13-5","E15-5","E16-4","E18-4","E23-43"]},{"i":"E13-6","q":"可控制成本不包括下列何項？","o":["直接材料","直接人工","沉沒成本","半變動成本"],"a":2,"e":"答案(C)。可控制成本是管理人員在特定期間對成本的發生或金額有重大影響力者，例如直接材料、直接人工、半變動成本。沉沒成本是過去決策已經發生、無論採取什麼行動都無法收回的成本，屬於不可控制成本。","c":2,"f":1,"ap":["E13-6"]},{"i":"E13-7","q":"本國銀行的美金部位為短部位時，市場出現美金貶值，該銀行的匯率風險將如何變化？","o":["無關","不變","降低","提高"],"a":2,"e":"答案(C)。短部位是賣出（美元負債）大於買入（美元資產）。美元貶值時，償還美元負債所需的本國貨幣減少，反而產生匯兌利益，所以匯率風險降低。如果是長部位，美元貶值才會產生損失。","c":13,"f":2,"ap":["E13-7","E19-9"]},{"i":"E13-8","q":"假設A 銀行持有本金$10,000、票面利率固定5%之5 年期債券外，其餘資產均為現金；負債部分只發行一年到期的定期存單，金額$8,000，固定利率2%，到期後發行新存單的利率隨市場走勢調整，並預期未來無另外資產。市場利率在第一年年底，若上升50 個基準點，請問第二年年底的淨利息利潤，相較於第一年年底變動多少？","o":["減少$50","減少$40","增加$40","增加$50"],"a":1,"e":"答案(B)。債券是5年期固定利率5%，利息收入不受市場利率影響。第二年重新發行8,000元定期存單，利率由2%上升50個基準點到2.5%，利息支出增加8,000×0.5%＝40元，所以淨利息利潤比第一年減少40元。","c":14,"f":2,"ap":["E13-8","E17-46"]},{"i":"E13-9","q":"針對借款企業，下列何者非屬銀行之經常性融資業務？","o":["票據融通","住宅用之房屋抵押貸款","擔保透支","短期放款"],"a":1,"e":"答案(B)。經常性融資以協助企業短期週轉金為目的，包括票據融通、短期放款、透支（擔保透支）等。住宅用房屋抵押貸款屬於消費金融的中長期放款，不是企業經常性融資。","c":4,"f":1,"ap":["E13-9"]},{"i":"E13-10","q":"有關銀行的票據承兌業務，下列何者錯誤？","o":["銀行代替買方，為其賣方所發匯票之付款人提供承兌，稱為「買方委託承兌」","買方業者基於資金調度考量，進口貨物時，可藉由開發「即期信用狀」取代「遠期信用狀」","銀行受理之賣方委託承兌，旨在協助賣方將取得的「遠期支票」轉換為「銀行承兌匯票」","票據承兌業務屬於銀行授信業務之一"],"a":1,"e":"答案(B)。買方業者基於資金調度考量，進口貨物時通常開發「遠期信用狀」（延後付款），而不是用即期信用狀取代遠期信用狀，所以(B)錯誤。(A)買方委託承兌、(C)賣方委託承兌是把遠期支票轉成銀行承兌匯票、(D)票據承兌屬於授信業務，均正確。","c":4,"f":1,"ap":["E13-10"]},{"i":"E13-12","q":"有關自用住宅抵押貸款，下列敘述何者錯誤？","o":["依據銀行法規定，購買或建造住宅之放款期限不得超過二十年","寬限期係指貸款期間只付利息，不攤還本金","求償順位要求，先向借款人求償，次就不足部分向保證人求償","銀行辦理自用住宅放款，不得要求提供連帶保證人"],"a":0,"e":"答案(A)。依銀行法第38條，購買或建造住宅的放款期限最長不得超過30年（無自用住宅者購買自用住宅不在此限），不是二十年，所以(A)錯誤。(B)寬限期只付利息不攤還本金、(C)先向借款人求償再就不足部分向保證人求償、(D)自用住宅放款不得要求連帶保證人，均正確。","c":5,"f":1,"ap":["E13-12"]},{"i":"E13-17","q":"授信對象若在英屬維京群島、開曼群島、百慕達群島或其他免稅地區註冊，但未實際營運，也無提供十足擔保時，如何認定國家別？","o":["以承擔償還責任或保證責任者之法定國籍歸屬","以資金主要使用所在地","不須納入國別認定","按照屬地或屬人主義歸屬均可"],"a":1,"e":"答案(B)。授信對象在英屬維京群島、開曼群島、百慕達等免稅地區註冊，但沒有實際營運也沒有十足擔保時，國別應以其資金主要使用所在地認定，才能反映真實的國家風險。","c":7,"f":1,"ap":["E13-17"]},{"i":"E13-20","q":"有關國家主權評等之預告機制，下列敘述何者錯誤？","o":["預告機制包括觀察名單和展望兩種制度","觀察名單反映被觀察國家未來一年，信用等級可能朝向哪種變動","觀察國家為正向者，政府部門發行的債券或主權評等在短期內可能調升","展望機制著眼於政府發行的長期債務，未來一至二年的信用走向"],"a":1,"e":"答案(B)。觀察名單是在事件發生或即將發生時，將該國納入觀察，並於約90天（三個月）內做出評等調整或維持的決定，屬於短期預告，不是反映未來一年的變動，所以(B)錯誤。「展望」才是著眼於長期債務未來一至二年的信用走向，(A)(C)(D)正確。","c":8,"f":1,"ap":["E13-20"]},{"i":"E13-23","q":"依據銀行資本適足性及資本等級管理辦法，槓桿比率係指下列何者？","o":["第一類資本淨額／暴險總額","第一類資本淨額／總資產","合格資本／暴險總額","總負債／總資產"],"a":0,"e":"答案(A)。依銀行資本適足性及資本等級管理辦法，槓桿比率＝第一類資本淨額÷暴險總額，最低標準3%，用來補充以風險為基礎的資本要求。分母是暴險總額（含表內外暴險），不是總資產。","c":9,"f":1,"ap":["E13-23"]},{"i":"E13-25","q":"證券商的資本適足率，計算範圍包括下列哪些？A.市場風險、B.信用風險、C.作業風險、D.財富管理通路風險","o":["僅A","僅A、B","僅A、B、C","A、B、C、D"],"a":2,"e":"答案(C)。證券商資本適足率的計算範圍包括市場風險、交易對象風險（信用風險）、作業風險（執行業務疏誤所生的風險），教材另列基礎風險。「財富管理通路風險」不在計算範圍內，所以
