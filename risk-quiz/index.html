<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1d4f91">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="風管刷題">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" href="icon-192.png">
<title>風險管理基本能力測驗｜刷題</title>
<style>
:root{
  --bg:#f5f6f8; --card:#fff; --ink:#1f2933; --sub:#5f6b7a; --line:#e3e7ec;
  --pri:#1d4f91; --pri-soft:#e8f0fb; --ok:#1f8a4c; --ok-soft:#e6f5ec; --bad:#c0392b; --bad-soft:#fbeaea;
  --star:#e0a100; --mark:#fff3bf; --radius:12px; --fs:16px;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;
  background:var(--bg);color:var(--ink);font-size:var(--fs);line-height:1.6;-webkit-text-size-adjust:100%}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
.hidden{display:none!important}
/* layout */
header.top{position:sticky;top:0;z-index:20;background:var(--card);border-bottom:1px solid var(--line);
  padding:calc(env(safe-area-inset-top) + 10px) 16px 10px;display:flex;align-items:center;gap:12px}
header.top h1{font-size:17px;margin:0;font-weight:700;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sync{font-size:12px;color:var(--sub);display:flex;align-items:center;gap:6px}
.dot{width:8px;height:8px;border-radius:50%;background:#aab3bf;display:inline-block}
.dot.ok{background:var(--ok)}.dot.busy{background:#e0a100}.dot.err{background:var(--bad)}
main{max-width:860px;margin:0 auto;padding:16px 16px calc(90px + env(safe-area-inset-bottom))}
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--card);border-top:1px solid var(--line);
  display:flex;justify-content:center;padding-bottom:env(safe-area-inset-bottom)}
nav.tabs button{flex:1;max-width:172px;background:none;border:0;padding:8px 0 9px;font-size:12px;color:var(--sub);display:flex;flex-direction:column;align-items:center;gap:2px;white-space:nowrap}
nav.tabs button svg{width:22px;height:22px}
nav.tabs button.on{color:var(--pri);font-weight:700}
@media(min-width:900px){
  nav.tabs{top:0;bottom:auto;left:auto;right:16px;border:0;background:transparent;padding-top:calc(env(safe-area-inset-top) + 6px)}
  nav.tabs button{flex-direction:row;gap:6px;font-size:14px;padding:6px 12px;border-radius:8px}
  nav.tabs button.on{background:var(--pri-soft)}
  nav.tabs button svg{width:18px;height:18px}
  header.top{padding-right:560px}
  main{padding-bottom:40px}
}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:16px;margin-bottom:14px}
.card h2{font-size:16px;margin:0 0 10px}
.card h3{font-size:15px;margin:14px 0 6px}
.muted{color:var(--sub);font-size:14px}
.small{font-size:13px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.grow{flex:1}
.btn{border:1px solid var(--line);background:var(--card);border-radius:10px;padding:9px 14px;font-size:15px;line-height:1.3}
.btn:hover{border-color:#c5ccd6}
.btn.pri{background:var(--pri);border-color:var(--pri);color:#fff}
.btn.pri:hover{filter:brightness(1.07)}
.btn.ghost{background:transparent}
.btn.sm{padding:6px 10px;font-size:13px;border-radius:8px}
.btn.block{width:100%}
.btn:disabled{opacity:.45;cursor:default}
.grid{display:grid;gap:10px}
.g2{grid-template-columns:repeat(2,1fr)}.g3{grid-template-columns:repeat(3,1fr)}.g4{grid-template-columns:repeat(4,1fr)}
@media(max-width:560px){.g4{grid-template-columns:repeat(2,1fr)}.g3{grid-template-columns:repeat(2,1fr)}}
.stat{background:var(--bg);border-radius:10px;padding:12px}
.stat b{display:block;font-size:22px;line-height:1.2}
.stat span{font-size:12px;color:var(--sub)}
.seg{display:flex;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:3px;gap:3px;flex-wrap:wrap}
.seg button{flex:1;border:0;background:transparent;border-radius:8px;padding:7px 8px;font-size:14px;color:var(--sub);white-space:nowrap}
.seg button.on{background:var(--card);color:var(--ink);font-weight:600;box-shadow:0 1px 2px rgba(0,0,0,.08)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:5px 11px;font-size:13px}
.chip.on{background:var(--pri);border-color:var(--pri);color:#fff}
label.f{display:block;font-size:13px;color:var(--sub);margin:12px 0 6px}
input.t,select.t{width:100%;border:1px solid var(--line);border-radius:10px;padding:10px 12px;background:var(--card)}
input.t:focus,select.t:focus{outline:2px solid var(--pri-soft);border-color:var(--pri)}
mark{background:var(--mark);padding:0 2px;border-radius:3px;color:inherit}
.bar{height:8px;background:var(--bg);border-radius:6px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--pri);border-radius:6px}
table.t{width:100%;border-collapse:collapse;font-size:14px;margin:6px 0}
table.t th,table.t td{border:1px solid var(--line);padding:7px 8px;text-align:left;vertical-align:top}
table.t th{background:var(--bg);font-weight:600}
.tblwrap{overflow-x:auto}
ul.kp{margin:4px 0 4px;padding-left:20px}
ul.kp li{margin:3px 0}
.note{background:#fff8e6;border:1px solid #f3dfa8;border-radius:8px;padding:8px 10px;font-size:14px;margin:6px 0}
details.ch{border:1px solid var(--line);border-radius:var(--radius);background:var(--card);margin-bottom:10px}
details.ch>summary{list-style:none;padding:13px 16px;cursor:pointer;font-weight:600;display:flex;gap:10px;align-items:center}
details.ch>summary::-webkit-details-marker{display:none}
details.ch>summary .n{background:var(--pri-soft);color:var(--pri);border-radius:6px;padding:1px 8px;font-size:13px}
details.ch>summary::after{content:"";margin-left:auto;width:8px;height:8px;border-right:2px solid var(--sub);border-bottom:2px solid var(--sub);transform:rotate(45deg);transition:.2s}
details.ch[open]>summary::after{transform:rotate(-135deg)}
details.ch .body{padding:0 16px 14px}
.kv{display:grid;grid-template-columns:1fr auto;gap:0;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.kv div{padding:8px 12px;border-bottom:1px solid var(--line);font-size:14px}
.kv div:nth-child(even){text-align:right;font-weight:600;color:var(--pri)}
.kv div:nth-last-child(-n+2){border-bottom:0}
/* question */
.q-meta{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-bottom:8px}
.tag{font-size:12px;background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:1px 7px;color:var(--sub)}
.tag.hot{background:#fff1e6;border-color:#f6cfae;color:#b45309}
.q-text{font-size:calc(var(--fs) + 1px);margin:4px 0 12px;white-space:pre-wrap}
.opt{display:flex;gap:10px;width:100%;text-align:left;border:1.5px solid var(--line);background:var(--card);border-radius:10px;padding:11px 12px;margin-bottom:8px;line-height:1.5}
.opt .l{flex:none;width:26px;height:26px;border-radius:50%;border:1.5px solid var(--line);display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;color:var(--sub)}
.opt:hover:not(:disabled){border-color:#b9c3cf}
.opt.sel{border-color:var(--pri);background:var(--pri-soft)}
.opt.sel .l{background:var(--pri);border-color:var(--pri);color:#fff}
.opt.right{border-color:var(--ok);background:var(--ok-soft)}
.opt.right .l{background:var(--ok);border-color:var(--ok);color:#fff}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.opt.wrong .l{background:var(--bad);border-color:var(--bad);color:#fff}
.opt:disabled{cursor:default}
.exp{border-left:4px solid var(--pri);background:var(--pri-soft);border-radius:0 10px 10px 0;padding:10px 12px;margin-top:10px;font-size:15px}
.exp.ok{border-color:var(--ok);background:var(--ok-soft)}
.exp.bad{border-color:var(--bad);background:var(--bad-soft)}
.exp .flag{margin-top:6px;font-size:13px;color:#8a5a00}
.starbtn{border:1px solid var(--line);background:var(--card);border-radius:8px;padding:4px 10px;font-size:14px;color:var(--sub);display:inline-flex;align-items:center;gap:4px}
.starbtn.on{color:var(--star);border-color:#f1d27a;background:#fff9e6}
.qnav{display:grid;grid-template-columns:repeat(auto-fill,minmax(38px,1fr));gap:6px;margin-top:10px}
.qnav button{border:1px solid var(--line);background:var(--card);border-radius:8px;padding:6px 0;font-size:13px}
.qnav button.done{background:var(--pri-soft);border-color:#bcd0ee}
.qnav button.cur{outline:2px solid var(--pri)}
.qnav button.r{background:var(--ok-soft);border-color:#a8d9bb}
.qnav button.w{background:var(--bad-soft);border-color:#efb5b0}
.progress{height:5px;background:var(--line);border-radius:3px;overflow:hidden;margin:8px 0 14px}
.progress i{display:block;height:100%;background:var(--pri)}
.sticky-actions{position:sticky;bottom:calc(64px + env(safe-area-inset-bottom));background:linear-gradient(transparent,var(--bg) 30%);padding-top:14px;display:flex;gap:10px}
@media(min-width:900px){.sticky-actions{bottom:0}}
.timer{font-variant-numeric:tabular-nums;font-weight:700}
.timer.low{color:var(--bad)}
.big{font-size:40px;font-weight:800;line-height:1.1}
.pass{color:var(--ok)}.fail{color:var(--bad)}
.list-q{border-top:1px solid var(--line);padding:12px 0}
.list-q:first-child{border-top:0}
.ans-line{font-size:14px;margin:4px 0}
.ans-line .o{display:block;padding:2px 0}
.ans-line .o.c{color:var(--ok);font-weight:700}
.ans-line .o.x{color:var(--bad);text-decoration:line-through}
/* login */
#login{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}
#login .box{width:100%;max-width:380px;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:28px}
#login h1{font-size:20px;margin:0 0 4px}
.logo{width:48px;height:48px;border-radius:12px;background:var(--pri);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:20px;margin-bottom:14px}
.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom));transform:translateX(-50%);background:#1f2933;color:#fff;padding:9px 16px;border-radius:999px;font-size:14px;z-index:50;opacity:0;transition:opacity .25s;pointer-events:none;max-width:90vw}
.toast.show{opacity:1}
.empty{text-align:center;color:var(--sub);padding:30px 10px}
.search{position:relative}
.search input{padding-left:36px}
.search svg{position:absolute;left:11px;top:50%;transform:translateY(-50%);width:17px;height:17px;color:var(--sub)}
.hl{background:#ffe58a}
</style>
</head>
<body>

<!-- 登入 -->
<div id="login" class="hidden">
  <div class="box">
    <div class="logo">風</div>
    <h1>風險管理基本能力測驗</h1>
    <div class="muted">刷題・重點・模擬考</div>
    <label class="f" for="accInput">帳號（不分大小寫，第一次輸入會自動建立）</label>
    <input id="accInput" class="t" autocomplete="username" autocapitalize="none" spellcheck="false" placeholder="例如：amy" maxlength="40">
    <button id="loginBtn" class="btn pri block" style="margin-top:14px">登入</button>
    <div id="loginMsg" class="muted small" style="margin-top:10px"></div>
    <details style="margin-top:14px" class="small muted">
      <summary>後端設定</summary>
      <label class="f" for="gasInput">GAS 網址（/exec 結尾）</label>
      <input id="gasInput" class="t small" placeholder="https://script.google.com/macros/s/…/exec" spellcheck="false">
    </details>
  </div>
</div>

<!-- 主畫面 -->
<div id="app" class="hidden">
  <header class="top">
    <h1 id="pageTitle">首頁</h1>
    <div class="sync" id="syncState" title="雲端同步狀態"><span class="dot" id="syncDot"></span><span id="syncTxt">本機</span></div>
  </header>
  <main id="view"></main>
  <nav class="tabs" id="tabs">
    <button data-tab="home"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg>首頁</button>
    <button data-tab="notes"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 4h12a4 4 0 0 1 4 4v12H8a4 4 0 0 1-4-4z"/><path d="M8 9h8M8 13h6"/></svg>考試重點</button>
    <button data-tab="practice"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 11l3 3 8-8"/><path d="M20 12v7a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h9"/></svg>練習題</button>
    <button data-tab="review"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m12 3 2.8 5.7 6.2.9-4.5 4.4 1.1 6.2L12 17.3 6.4 20.2l1.1-6.2L3 9.6l6.2-.9z"/></svg>複習速讀</button>
    <button data-tab="me"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>統計</button>
  </nav>
</div>
<div class="toast" id="toast"></div>

<script>
/* ======================= 設定 ======================= */
// 部署 GAS 後，把 /exec 網址貼在這裡（三個人共用同一個網址）。也可在 App 內「統計 > 設定」修改。
const GAS_URL_DEFAULT = 'https://script.google.com/macros/s/AKfycbzQ8a1uMLJ2NfSpY2PjMsRMoh3F532jXv7cwSiZwNih4qVV0Dko_AyRP6kTV2fs-lQ/exec';

const DATA = {"bank":[{"i":"H1-1","q":"關於風險管理價值，下列何者錯誤？","o":["風險制度不能「解百憂」、也非「萬靈藥」，但求「對症下藥」","風險管理要集中火力在「不可控制的」事項，忽視「可控制」事項","風險管理的要領是兼顧「抓大放小」與「小事上忠心」，如何拿捏則要有智慧面對","「變化」是組織生活的「香料」，危機有時是轉機與機會"],"a":1,"e":"答案(B)。風險管理的目的是將「可控制」的風險、成本及損失極小化，因此應重視可控制事項，而非集中火力於不可控制事項、忽視可控制事項，故(B)錯誤。(A)風險制度不是萬靈藥而在對症下藥、(C)兼顧抓大放小與小事上忠心、(D)變化與危機可能是轉機，皆為正確的風險管理價值觀。","c":1,"f":2,"ap":["H1-1","E9-8"]},{"i":"H1-2","q":"有關風險管理體質檢視架構之步驟，下列何者正確？","o":["風險策略→風險組織→風險衡量→風險監控→風險願景","風險組織→風險策略→風險衡量→風險監控→風險願景","風險策略→風險衡量→風險組織→風險監控→風險願景","風險策略→風險組織→風險願景→風險衡量→風險監控"],"a":0,"e":"答案(A)。風險管理體質檢視架構的步驟依序為：風險策略→風險組織→風險衡量→風險監控→風險願景。先訂策略，再建立組織，接著衡量與監控風險，最後形成風險願景；(B)(C)(D)的順序皆有錯置。","c":1,"f":2,"ap":["H1-2","E11-41"]},{"i":"H1-3","q":"關於風險管理組織運作方式，下列敘述何者錯誤？","o":["強調風險產生單位與監督單位宜相互隸屬","風險管理的決策過程涵蓋「從上而下」與「由下往上」兩種","不論哪種風險均應詳細釐清前台、中台及後台的職掌，集中控制、分權營運","業務管理部門須定期評估所有營業單位的營業概況，包括不同業務的收支、利潤與風險承擔"],"a":0,"e":"答案(A)。風險管理組織運作強調風險產生單位與監督單位「不宜」相互隸屬，以維持監督的獨立性，且所用風險管理指標和標準也應不同，故(A)錯誤。(B)決策過程涵蓋從上而下與由下往上、(C)釐清前中後台職掌並集中控制分權營運、(D)業務管理部門定期評估各營業單位收支利潤與風險，皆正確。","c":1,"f":4,"ap":["H1-3","E2-1","E5-1","E9-1"]},{"i":"H1-4","q":"信用風險報告與監督成果，能暢行無阻地傳達至高階主管，屬於何種決策程序？","o":["從上而下","由下往上","垂直溝通程序","平行協調程序"],"a":1,"e":"答案(B)。風險管理決策包含「從上而下」與「由下往上」兩種程序。基層的信用風險報告與監督成果能暢行無阻地向上傳達至高階主管，屬於「由下往上」的決策程序；「從上而下」則是高階主管將風險政策與限額向下傳達執行。","c":1,"f":3,"ap":["H1-4","E5-37","E6-36"]},{"i":"H1-5","q":"下列何者是合理的風險管理觀念？","o":["不宜使用相同風險標準看待所有員工，但部屬的責任要大於主管","組織的前台與中台部門均要面對風險挑戰，只有後台部門不用","風險管理的決策，「從上而下」比「由下往上」的重要","風險產生單位與監督單位不宜相互隸屬，使用風險管理指標和標準也應不同"],"a":3,"e":"答案(D)。風險產生單位與監督單位不宜相互隸屬，使用的風險管理指標和標準也應不同，為正確觀念。(A)主管責任應大於部屬；(B)前、中、後台皆須面對風險挑戰；(C)「從上而下」與「由下往上」兩種決策程序同等重要，無孰輕孰重。","c":1,"f":2,"ap":["H1-5","E12-8"]},{"i":"H1-6","q":"面對風險問題的態度，下列何者錯誤？","o":["主管責任大於部屬","使用最高且相同的單一行為標準看待所有員工與主管","不可忽略組織成員的權責差異","宜區分出資的所有者與被雇用的員工"],"a":1,"e":"答案(B)。面對風險問題不宜用最高且相同的單一行為標準看待所有員工與主管，因組織成員權責不同，主管責任應大於部屬，也應區分出資的所有者與被雇用的員工，故(B)錯誤，(A)(C)(D)正確。","c":1,"f":4,"ap":["H1-6","E13-1","E20-1","E23-46"]},{"i":"H1-7","q":"中台部門是全行市場風險的管理單位，有關工作重點之敘述，下列何者錯誤？","o":["定期估算金融商品或業務之損益概況及市場風險值，向上陳報","部位價值之評估，如每月評估所持有之衍生性商品部位價值","隨時注意交易部位的部位水準與投資損失，是否超過風險權限","留意金融交易員是否依照停損規定辦理業務"],"a":1,"e":"答案(B)。中台負責全行市場風險管理，須定期估算損益與市場風險值向上陳報、隨時注意部位水準與投資損失是否超過權限、留意交易員是否依停損規定辦理。衍生性商品交易部位價值應每日（甚至即時）評估，「每月評估」頻率過低，故(B)錯誤。","c":1,"f":2,"ap":["H1-7","E17-35"]},{"i":"H1-8","q":"負責授信業務有關的清算、交割與保全任務的作業中心或債權管理部門，扮演信用風險的何種角色？","o":["前台","中台","後台","與信用風險無關"],"a":2,"e":"答案(C)。負責授信業務清算、交割與保全任務的作業中心或債權管理部門屬於信用風險的「後台」。前台為業務承作單位（如授信營業單位），中台則負責風險衡量、監控與管理。","c":1,"f":2,"ap":["H1-8","E7-32"]},{"i":"H1-9","q":"負責流動性管理政策與策略的功能性委員會，在銀行內部是下列何種委員會？","o":["薪酬管理委員會","投資審議委員會","授信審查委員會","資產負債管理委員會"],"a":3,"e":"答案(D)。資產負債管理委員會(ALCO)負責流動性管理政策與策略，權責包括審核流動性管理指標門檻、利率風險避險策略、金融同業拆款額度及聯行往來利率等。薪酬、投資審議、授信審查委員會則各有其他職掌。","c":1,"f":2,"ap":["H1-9","E18-36"]},{"i":"H1-10","q":"下列何者非屬於資產負債管理委員會(Asset and Liability Committee)的職掌範圍？","o":["監督與流動性風險和利率風險有關的目標與風險門檻","審核資產負債部位的額度權限與控管方法","編製資產負債表","審查流動性風險和利率風險的避險策略"],"a":2,"e":"答案(C)。ALCO的職掌包括監督流動性與利率風險之目標與風險門檻、審核資產負債部位的額度權限與控管方法、審查流動性與利率風險的避險策略等；「編製資產負債表」屬會計部門的工作，非ALCO職掌，故選(C)。","c":1,"f":3,"ap":["H1-10","E15-45","E19-41"]},{"i":"H1-11","q":"銀行聯行往來利率，應由下列哪一個單位核定？","o":["資產負債管理委員會","風險管理委員會","授信審查委員會","董事會"],"a":0,"e":"答案(A)。依教材，資產負債管理委員會的權責包括審核流動性管理指標門檻標準、利率風險避險策略、金融同業拆款額度及「聯行往來利率」，故聯行往來利率應由資產負債管理委員會核定。","c":1,"f":2,"ap":["H1-11","E10-6"]},{"i":"H1-12","q":"銀行有效發揮「風險分散效應」(Diversification Effects)，具有下列何種財務涵義？","o":["銀行的總風險小於個別業務的風險相加","銀行的信用風險比市場風險，更應受到重視","總行管理單位承擔的風險責任，宜分散配置給予分行營業單位","全行的總風險限額宜按照組織結構，分配至各營業單位"],"a":0,"e":"答案(A)。若銀行有效發揮風險分散效應，因各業務風險間並非完全正相關，銀行的總風險會小於個別業務風險的相加。(B)(C)(D)談的是風險重視程度或限額分配，並非風險分散效應的財務涵義。","c":1,"f":4,"ap":["H1-12","E5-27","E6-1","E9-2"]},{"i":"H1-13","q":"銀行要達到風險分散效應，需具備下列何種特徵？","o":["銀行的每股盈餘大於個別業務的每股盈餘相加","銀行的總經濟資本承擔大於個別業務的經濟資本相加","銀行的總作業成本小於個別業務的作業成本相加","銀行的總風險小於個別業務不同風險的相加"],"a":3,"e":"答案(D)。風險分散效應的特徵是銀行的總風險小於個別業務不同風險的相加。(A)每股盈餘、(C)作業成本與風險分散無關；(B)總經濟資本應「小於」而非大於個別業務經濟資本相加。","c":1,"f":3,"ap":["H1-13","E13-41","E17-2"]},{"i":"H1-14","q":"自2017 年起，金融機構的洗錢防制人員，至少須先上完多少時數的訓練課程，並考試取得結業證書，才能執行業務？","o":["6 小時","12 小時","24 小時","48 小時"],"a":2,"e":"答案(C)。依金融機構防制洗錢相關規定，防制洗錢專責人員應參加主管機關認定機構所舉辦24小時以上之課程，並經考試及格取得結業證書（或具相關證照、經歷），始能執行業務。","c":1,"f":2,"ap":["H1-14","E11-59"]},{"i":"H1-15","q":"下列敘述何者錯誤？","o":["轉嫁「風險成本」於所有客戶的購買價格，適用在激烈競爭的市場環境","銀行的業務經營強調，尋找「最適當」的客戶，而非「最優良」的客戶","缺乏對個別商品或業務、不同客戶和營業單位的盈餘與風險資訊，可能造成授信業務的「逆選擇」決策","銀行的業務經營過於保守而處處阻礙風險承擔，最多只能賺取「正常報酬」，難以創造「超額報酬」的機會"],"a":0,"e":"答案(A)。在激烈競爭的市場環境中，若將風險成本一律轉嫁到所有客戶的價格上，會使優質客戶流失，因此不一定適用，故(A)錯誤。(B)應找「最適當」而非「最優良」客戶、(C)缺乏盈餘與風險資訊易造成逆選擇、(D)過度保守難創造超額報酬，皆正確。","c":1,"f":2,"ap":["H1-15","E21-9"],"n":"轉嫁「風險成本」於所有客戶的購買價格，不一定適用在競爭激烈的市場環境。"},{"i":"H2-1","q":"銀行建立責任中心體系，應考慮的責任中心體系包括下列哪些？A.成本 B.收入 C.利潤 D.投資","o":["僅AB","僅CD","僅ABC","ABCD"],"a":3,"e":"答案(D)。責任中心是承擔一定經濟責任並享有一定權利的內部單位，銀行建立責任中心體系應考慮成本（費用）中心、收入中心、利潤中心及投資中心，四者皆包括在內，故選ABCD。","c":2,"f":2,"ap":["H2-1","E15-44"]},{"i":"H2-2","q":"下列何者不屬於「責任中心體系」的分類要素？","o":["區域中心","成本（費用）中心","利潤中心","投資中心"],"a":0,"e":"答案(A)。責任中心體系的分類要素為成本（費用）中心、收入中心、利潤中心及投資中心；「區域中心」是銀行在分行與總行間設置以分層負責、控管授信風險的組織，不屬於責任中心的分類。","c":2,"f":3,"ap":["H2-2","E12-6","E20-4"]},{"i":"H2-3","q":"下列何項目不包括於可控制成本中？","o":["直接材料","直接人工","沉沒成本","半變動成本"],"a":2,"e":"答案(C)。可控制成本是管理人員在特定期間對成本發生或金額大小有重大影響力者，如直接材料、直接人工、半變動成本。沉沒成本是過去決策已發生且無法收回的成本，屬不可控制成本，故選(C)。","c":2,"f":2,"ap":["H2-3","E9-6"]},{"i":"H2-4","q":"有關間接成本的會計科目與分攤，下列敘述何者錯誤？","o":["按照對象的分擔能力做分攤，係遵循「能力原則」","按照對象的成本收益關係做分攤，係採用「受益原則」","直接材料與直接人工屬於間接成本，須按照產品量做分攤","營業費用屬於間接成本，應按照「提供服務最多、接受服務最少」原則分攤至各部門"],"a":2,"e":"答案(C)。直接材料與直接人工可直接歸屬於產品，屬「直接成本」（教材亦稱變動成本）而非間接成本，故(C)錯誤。間接成本分攤原則有「能力原則」（按對象的分擔能力分攤）與「受益原則」（按成本收益關係分攤），(A)(B)正確；(D)營業費用屬間接成本，分攤時先從「提供服務最多、接受服務最少」的部門開始依序分攤至其他各部門，敘述正確。","c":2,"f":6,"ap":["H2-4","E3-5","E4-8","E5-20","E9-7","E20-2"]},{"i":"H2-5","q":"有關合理分攤間接成本之原則，包括下列哪些？A.按照對象的分攤能力作分攤 B.按照對象的成本受益關係作分攤C.按照對象的風險容忍度作分攤 D.按照總經理指示分攤","o":["僅B、C","僅A、B","僅A、B、C","A、B、C、D"],"a":1,"e":"答案(B)。合理分攤間接成本的原則有二：能力原則（按對象的分擔能力分攤）與受益原則（按對象的成本受益關係分攤），即A、B。按風險容忍度或總經理指示分攤皆非合理的分攤原則。","c":2,"f":2,"ap":["H2-5","E19-42"]},{"i":"H2-6","q":"有關成本觀念的敘述，下列何者錯誤？","o":["可控制成本又稱變動成本，不宜與固定成本相混淆","每項產品的邊際貢獻，是由該產品的售價減去變動成本而得","直接材料加上直接人工，合稱「直接成本」或「變動成本」","沉沒成本(Sunk Cost)類似固定成本，無論產銷及環境如何變化，該成本依然發生"],"a":0,"e":"答案(A)。可控制成本是指管理人員對其發生或金額有重大影響力的成本，並不等於變動成本，故(A)錯誤。(B)邊際貢獻＝售價－變動成本；(C)直接材料＋直接人工合稱直接成本或變動成本；(D)沉沒成本已發生且無法收回，類似固定成本，皆正確。","c":2,"f":2,"ap":["H2-6","E8-2"]},{"i":"H2-7","q":"有關間接成本分攤至作業中心，下列敘述何者錯誤？","o":["雜費以員工人數佔比分攤","營繕費以辦公室使用坪數佔全部空間比例分攤","薪資費用以僱用人數分配","加班費分攤係由主管直接認定"],"a":3,"e":"答案(D)。間接成本分攤至作業中心應有客觀基礎：雜費依員工人數占比、營繕費依使用坪數比例、薪資費用依僱用人數分配；加班費應依「工作性質」直接認定，而非由主管直接認定，故(D)錯誤。","c":2,"f":2,"ap":["H2-7","E11-2"],"n":"加班費分攤係由工作性質直接認定。"},{"i":"H2-8","q":"若財務部轄下有資金調撥等三個科別，則財務部經理每月領取的薪資費用之歸屬，下列何者正確？","o":["此薪資費用是財務部的間接成本","此薪資費用是財務部轄下資金調撥等三個科別的直接成本","此薪資費用是財務部轄下資金調撥等三個科別的間接成本","此薪資費用不宜當作財務部轄下任何科別的直接或間接成本"],"a":2,"e":"答案(C)。財務部經理的薪資可直接歸屬於財務部，是財務部的直接成本；但對其轄下資金調撥等三個科別而言，須經分攤才能計入，屬各科別的「間接成本」，故(C)正確，(A)(B)(D)錯誤。","c":2,"f":3,"ap":["H2-8","E7-4","E11-4"]},{"i":"H2-9","q":"財富管理處的處長，每個月領取的薪資費用應如何歸屬？","o":["此薪資費用是轄下理財等四個部門的間接成本","此薪資費用是財富管理處的間接成本","此薪資費用是轄下理財等四個部門的直接成本","此薪資費用不宜當作轄下任何部門的直接成本或間接成本"],"a":0,"e":"答案(A)。財富管理處處長的薪資可直接歸屬於財富管理處，是財富管理處本身的直接成本；但對轄下理財等四個部門而言，無法直接歸屬到單一部門而須分攤計入，屬各部門的間接成本，故選(A)。(B)應為財富管理處的直接成本；(C)不是轄下部門的直接成本；(D)此薪資仍可作為轄下部門的間接成本，並非不宜歸屬。","c":2,"f":3,"ap":["H2-9","E6-4","E20-5"]},{"i":"H2-10","q":"有關銀行財務處的直接成本和間接成本管理，下列敘述何者錯誤？","o":["財務處轄下資金調撥部經理的薪水，是該部的直接成本","財務處轄下資金調撥部經理的薪水，是上級單位財務處的直接成本","財務處處長的薪水，是轄下資金調撥部的直接成本","財務處處長的薪水，是財務處的直接成本"],"a":2,"e":"答案(C)。財務處處長的薪水是財務處的直接成本，但對轄下資金調撥部而言是「間接成本」，故(C)錯誤。資金調撥部經理的薪水是該部的直接成本，也可直接歸屬於上級單位財務處，(A)(B)(D)正確。","c":2,"f":3,"ap":["H2-10","E17-4","E21-3"]},{"i":"H2-11","q":"關於成本中心，下列敘述何者錯誤？","o":["成本中心的主管僅能控制成本或費用","成本中心以追求產品或服務成本最低為其努力目標","成本中心主管無權參與選擇各項投入資源的標準及來源","成本中心適用對產量或服務之多寡，以及產品或服務之售價「無權決定」的單位"],"a":2,"e":"答案(C)。成本中心只對成本或費用負責，以追求成本最低為目標，適用對產量及售價無權決定的單位；但成本中心主管「有權」參與選擇各項投入資源的標準及來源，故(C)錯誤。","c":2,"f":4,"ap":["H2-11","E1-3","E2-4","E6-8"]},{"i":"H2-12","q":"下列哪個敘述非屬適當的責任中心分類？","o":["成本中心的作業活動具有客觀明確的投入產出關係時，稱為機械性的成本中心","利潤中心提供的金融業務或服務，是高階主管主導售價時，稱為「人為」的利潤中心","利潤中心提供的金融業務或服務，由市場供需決定售價時，稱為「自然」的利潤中心","成本中心的作業活動在投入產出關係不明確，而困難客觀衡量時，稱為標準成本中心"],"a":3,"e":"答案(D)。成本中心的作業活動投入產出關係明確時稱為「機械性成本中心」；投入產出關係不明確而難以客觀衡量時稱為「裁量性成本中心」，而非標準成本中心，故(D)錯誤。(B)(C)人為與自然利潤中心的定義正確。","c":2,"f":2,"ap":["H2-12","E13-43"]},{"i":"H2-13","q":"關於成本與收入觀念，下列敘述何者錯誤？","o":["投資中心包括在責任中心體系內","成本中心追求最低成本，利潤中心強調利潤最高","成本中心的主管通常無權決定產品售價","任何收入中心的主管，均應有權決定行銷產品的數量多寡與售價高低"],"a":3,"e":"答案(D)。收入中心主管負責收入目標，但並非任何收入中心主管都有權決定產品數量與售價（售價可能由高階主管或市場決定），故(D)錯誤。投資中心屬責任中心體系、成本中心追求最低成本且通常無權決定售價、利潤中心強調利潤最高，(A)(B)(C)正確。","c":2,"f":2,"ap":["H2-13","E17-45"]},{"i":"H2-14","q":"銀行比較困難實施「利潤中心」制度的組織結構，係指下列何者？","o":["金融業務別","營業單位或分行別","企業機能別","境內與境外地區別"],"a":2,"e":"答案(C)。按「企業機能別」（如營業、信託、財務、國外等處）劃分組織時，各部門主管較難完整掌控收入與成本，比較困難實施利潤中心制度；按金融業務別、分行別或境內外地區別劃分，則較易實施利潤中心。","c":2,"f":5,"ap":["H2-14","E4-7","E8-16","E9-9","E22-45"]},{"i":"H2-15","q":"有關銀行組織規劃，在總行轄下第一層級分別設立營業、信託、財務、國外等處級單位之設計架構稱為下列何者？","o":["企業機能別","金融商品別","敏捷型組織","變形蟲組織"],"a":0,"e":"答案(A)。在總行轄下第一層級分別設立營業、信託、財務、國外等處級單位，係按照企業功能劃分，稱為「企業機能別」的組織架構。","c":2,"f":3,"ap":["H2-15","E10-4","E16-5"]},{"i":"H2-16","q":"銀行組織內部第一層級的部門，若是按企業機能別劃分，部門主管較難成立下列何種責任中心？","o":["利潤中心","成本中心","費用中心","收入中心"],"a":0,"e":"答案(A)。銀行第一層級部門若按企業機能別劃分，各部門主管難以同時掌握收入與成本，較難成立「利潤中心」；成本中心、費用中心或收入中心則仍可成立。","c":2,"f":4,"ap":["H2-16","E2-3","E5-14","E19-2"]},{"i":"H2-17","q":"有關績效評量，下列哪些單位不適用利潤中心制？A.資訊處 B.人力資源處 C.總務處 D.法令遵循處","o":["僅D","僅ABD","僅BCD","ABCD"],"a":3,"e":"答案(D)。資訊處、人力資源處、總務處及法令遵循處均屬支援或管理性質單位，無法直接產生收入與利潤，不適用利潤中心制（較適合以成本或費用中心管理），故ABCD皆是。","c":2,"f":2,"ap":["H2-17","E12-4"]},{"i":"H2-18","q":"有關利潤中心管理，下列何者可做為績效衡量指標？","o":["可控制利益","可控制成本","營業收入","沉沒成本"],"a":0,"e":"答案(A)。利潤中心既對成本也對收入與利潤負責，最好使用「可控制利益」當作績效衡量指標。可控制成本適用於成本中心；營業收入只反映收入面；沉沒成本為不可控制成本，不宜作為指標。","c":2,"f":4,"ap":["H2-18","E10-7","E17-5","E21-4"]},{"i":"H2-19","q":"關於績效評估觀念，下列何者正確？","o":["銀行的營業單位或分行最好使用每股盈餘、資產報酬率及淨值報酬率，衡量其管理績效","績效管理的重點，應擺在「不可控制」的成本項目","績效管理的良窳，端視管理者對「可控制成本」的掌控能力而定","銀行使用的所有績效管理指標，均應納入全部服務成本"],"a":2,"e":"答案(C)。績效管理的良窳，端視管理者對「可控制成本」的掌控能力而定，故(C)正確。(A)營業單位或分行以盈餘達成率或可控制利益衡量較適當，EPS、ROA、ROE屬全行層級指標；(B)重點應在可控制成本；(D)並非所有指標均須納入全部服務成本。","c":2,"f":3,"ap":["H2-19","E6-6","E11-3"]},{"i":"H2-20","q":"依據台灣的商業銀行編製財務及稅務會計報表制度架構，下列哪些單位係以盈餘達成率做為績效考評基礎？ A.營業單位別 B.分行 C.產品別 D.客戶屬性別","o":["僅A","僅B","僅A、B","A、B、C、D"],"a":2,"e":"答案(C)。依教材，營業單位別與分行係以「盈餘達成率」做為績效考評基礎，即A、B；產品別與客戶屬性別並非以盈餘達成率考評。","c":2,"f":2,"ap":["H2-20","E10-3"]},{"i":"H2-21","q":"有關銀行組織權責設計，將授信控管處定義為利潤中心時，其權責包括下列哪些？A.信用風險監督管理 B.承擔授信績效使命 C.資本適足率監控 D.訂定風險胃納制度","o":["僅A","僅A、B","僅A、B、C","A、B、C、D"],"a":1,"e":"答案(B)。將授信控管處定義為利潤中心時，其權責包括信用風險監督管理與承擔授信績效使命，即A、B。資本適足率監控及訂定風險胃納制度屬全行層級的風險管理單位或董事會權責，非授信控管處的權責。","c":2,"f":2,"ap":["H2-21","E10-8"]},{"i":"H2-22","q":"關於轉投資類型的投資中心，該單位宜使用下列何者當作績效衡量指標？","o":["銷售額","內外部損益","資本或股權投資的報酬率","可控制成本"],"a":2,"e":"答案(C)。投資中心既對成本、收入和利潤負責，也對投資效果負責，轉投資類型的投資中心最好以「資本或股權投資的報酬率」（投資報酬率）衡量績效；銷售額、內外部損益、可控制成本無法反映投資效果。","c":2,"f":2,"ap":["H2-22","E9-3"]},{"i":"H2-23","q":"將各項作業費用，按不同分攤基礎分攤至產品，一般稱此成本管理模式為下列何者？","o":["實際成本法","正常成本法","作業基礎成本法","標準成本法"],"a":2,"e":"答案(C)。將各項作業費用依不同分攤基礎（成本動因）分攤至產品的成本管理模式，稱為作業基礎成本法(ABC)，旨在使成本與成本標的間的資源需求因果關係更明確。","c":2,"f":2,"ap":["H2-23","E15-6"]},{"i":"H2-24","q":"建置作業基礎成本制的執行步驟，包括：A.訂定每項作業的成本動因 B.界定作業活動C.活動乘以對應之動因費率 D.衡量活動頻率或數量，請問其執行先後次序為下列何者？","o":["A→B→C→D","B→A→C→D","B→A→D→C","A→D→B→C"],"a":2,"e":"答案(C)。ABC制度的建置步驟為：界定作業活動(B)→訂定每項作業的成本動因(A)→衡量活動頻率或數量(D)→活動乘以對應之動因費率(C)，故順序為B→A→D→C。","c":2,"f":2,"ap":["H2-24","E10-9"]},{"i":"H2-25","q":"有關作業基礎成本制度(Activity-Based Costing, ABC)，下列敘述何者正確？","o":["金融服務業面對的是人的交易行為，人的慣性行為使得「標準」作業的設定很容易","ABC 制度的各項作業成本，是由作業動因的作業量除以「動因費率」計算而得","ABC 制度的作業成本，不須納入每項作業的「風險成本」","ABC 成本制度的特色之一，在於能夠區分個別業務及客戶的績效差異"],"a":3,"e":"答案(D)。ABC成本制度的特色之一是能區分個別業務及客戶的績效差異，(D)正確。(A)人的慣性行為使標準作業設定「不容易」；(B)作業成本＝作業量「乘以」動因費率；(C)ABC作業成本「須」納入每項作業的風險成本。","c":2,"f":3,"ap":["H2-25","E2-9","E6-9"]},{"i":"H2-26","q":"有關作業基礎成本制度，下列敘述何者錯誤？","o":["各項作業成本是由其成本動因的活動數量乘以動因費率而求得","作業基礎成本制度旨在促使成本與成本標的對資源需求的因果關係更明確","傳統成本制度相較於作業基礎成本制度，更能清楚浮現各項金融業務的獲利情形","作業基礎成本制度相較於傳統成本制度，更著重在「資源分配」的合理性與需要性"],"a":2,"e":"答案(C)。相較於傳統成本制度，ABC制度更能清楚浮現各項金融業務的獲利情形，故(C)說反了而錯誤。(A)作業成本＝活動數量×動因費率、(B)使資源需求因果關係更明確、(D)更著重資源分配的合理性，皆正確。","c":2,"f":2,"ap":["H2-26","E17-3"]},{"i":"H2-27","q":"有關衡量作業活動的標準處理時間，下列何種方法最合適？","o":["依據作業人員專家經驗訂定","依據會計部門訂定全行一致性單一標準","以碼錶多次測試，計算平均作業時間","徵詢外部顧問公司建議"],"a":2,"e":"答案(C)。衡量作業活動的標準處理時間，以碼錶多次測試計算平均作業時間最客觀合適；專家經驗、會計部門單一標準或外部顧問建議都較主觀或無法反映實際作業差異。","c":2,"f":2,"ap":["H2-27","E10-5"]},{"i":"H2-28","q":"銀行業要成功推動作業基礎成本制(Activity-BasedCosting, ABC)，下列何者因素最重要？","o":["企業社會責任","遵循會計公報規定","主管機關要求","作業標準化"],"a":3,"e":"答案(D)。作業標準化是銀行成功推動ABC制度最重要的因素，因為各項作業成本須以標準作業量與動因費率計算；金融業面對人的交易行為，標準作業設定不易，更凸顯標準化的重要。","c":2,"f":2,"ap":["H2-28","E18-6"]},{"i":"H2-29","q":"銀行總行與分行面臨資金過剩與不足時，可以透過下列何種制度，相互調撥資金？","o":["風險調整後報酬","資金移轉價格","風險限額移轉","固定資產調撥"],"a":1,"e":"答案(B)。資金移轉價格(FTP，又稱內部資金轉撥價格或聯行往來利率)是銀行內部資金中心與業務單位按一定規則有償轉移資金的制度，總行與分行面臨資金過剩或不足時可藉此相互調撥資金。","c":2,"f":3,"ap":["H2-29","E11-5","E15-43"]},{"i":"H2-30","q":"有關資金移轉價格(FTP)，下列敘述何者錯誤？","o":["用以調撥各部門剩餘或不足資金","聯行往來供應利率一定等於借用利率","訂價策略應反映營運目標及市場狀況","內部移轉價格與市場價格之差構成「財務利潤」"],"a":1,"e":"答案(B)。聯行往來的供應利率與借用利率不一定相等，銀行可採多軌制、依政策目標訂定不同的借用與供應利率，故(B)錯誤。FTP用以調撥各部門剩餘或不足資金、訂價應反映營運目標與市場狀況、內部移轉價格與市場價格之差構成財務利潤，(A)(C)(D)正確。","c":2,"f":2,"ap":["H2-30","E9-53"]},{"i":"H2-31","q":"有關營運利潤、會計利潤和財務利潤，下列敘述何者正確？","o":["財務利潤＝營運利潤＋會計利潤","會計利潤＝營運利潤＋財務利潤","營運利潤＝財務利潤＋會計利潤","三者非屬相同會計基礎，無法衡量"],"a":1,"e":"答案(B)。營運利潤為顧客價格與內部移轉價格的差額，財務利潤為內部移轉價格與市場價格的差額，兩者相加即為全行的會計利潤（本期損益），故會計利潤＝營運利潤＋財務利潤。","c":2,"f":2,"ap":["H2-31","E12-43"]},{"i":"H2-32","q":"關於營運利潤、財務利潤與會計利潤之關係，下列敘述何者錯誤？","o":["會計利潤為營運利潤與財務利潤相加","財務利潤為內部移轉價格與市場價格的差額","營運利潤為顧客價格與內部移轉價格的差額","會計利潤蘊含內部損益與外部損益的合計，將不同營業單位的內部損益相抵銷，合計數不為零"],"a":3,"e":"答案(D)。會計利潤蘊含內部損益與外部損益的合計，各營業單位間的內部損益相互抵銷後，合計數應「為零」，故(D)錯誤。(A)會計利潤＝營運利潤＋財務利潤、(B)(C)財務利潤與營運利潤的定義均正確。","c":2,"f":2,"ap":["H2-32","E11-6"]},{"i":"H2-33","q":"有關資金移轉價格，下列敘述何者較不適當？","o":["全行的會計利潤係指「本期損益」，用來描述銀行在某段經營期間的經營成果","銀行營業單位所稱的營運利潤，包括內部損益與外部損益","銀行的聯行往來政策，應優先追求閒置資金的利潤極大化","存放款顧客的價格簡稱存款利率與放款利率，是藉由內部移轉價格加減利潤目標而訂定"],"a":2,"e":"答案(C)。聯行往來政策應用以引導各單位落實全行策略目標，而非優先追求閒置資金的利潤極大化，故(C)較不適當。(A)會計利潤即本期損益、(B)營運利潤包括內部與外部損益、(D)存放款利率由內部移轉價格加減利潤目標訂定，皆正確。","c":2,"f":3,"ap":["H2-33","E12-5","E21-43"]},{"i":"H2-34","q":"營業單位給予客戶平均放款利率為5%，銀行牌告存款利率為3%，若存放款資金移轉價格(FTP)相同，下列何者為營業單位營運利潤之計算公式？","o":["放款×(5%-FTP)+存款×(FTP-3%)","放款×(5%-FTP)-存款×(FTP-3%)","放款×(FTP-5%)+存款×(FTP-3%)","放款×(FTP-5%)-存款×(FTP-3%)"],"a":0,"e":"答案(A)。營業單位營運利潤＝放款×(放款利率－FTP)＋存款×(FTP－存款利率)。放款端賺取5%與FTP的差額，存款端以FTP將資金供應給總行而賺取FTP與3%的差額，兩者相加，故為放款×(5%－FTP)＋存款×(FTP－3%)。","c":2,"f":2,"ap":["H2-34","E7-51"]},{"i":"H2-35","q":"下列敘述哪個是不適當的資金移轉價格制度？","o":["銀行若要加強推動授信業務，則宜降低「借用利率」","當銀行資金浮濫時，宜調高供應利率，以減少吸收定期存款","多種供應來源與運用去路的內部利率制度，稱為「多軌制」的聯行往來利率","銀行若要鼓勵吸收「活期存款」、減少「定期存款」，則在面對「活期存款」的供應利率，即宜提供一相對優於「定期存款」的利率"],"a":1,"e":"答案(B)。當銀行資金浮濫時，應「調降」供應利率，降低營業單位吸收定期存款的誘因，而非調高，故(B)不適當。(A)要推動授信宜降低借用利率、(C)多種利率構成的FTP稱多軌制、(D)鼓勵活存則給活存較優的供應利率，皆合理。","c":2,"f":2,"ap":["H2-35","E20-42"]},{"i":"H2-36","q":"銀行整合組織目標與部門目標之管理機制，下列敘述何者錯誤？","o":["單軌制的內部轉撥價格相較於多軌制的內部轉撥價格更能正確反映政策目標","根據風險資本的配置系統(Capital allocation system)，應將營業單位、業務項目和交易活動的所有風險，緊密地與銀行自有資本搭配","各項業務及主管的風險權限若按「風險值」衡量，對風險資本的配置與績效目標有否達成的研判可更加客觀","總行財務處可以使用聯行往來的資金調撥系統，剖析分行等營業單位的營運利潤，並引導各項業務配合全行的經營政策"],"a":0,"e":"答案(A)。多軌制內部轉撥價格依不同資金來源與去路訂定不同利率，分攤方式更準確，比單軌制更能反映政策目標，故(A)說反而錯誤。(B)風險資本配置系統、(C)以風險值衡量風險權限、(D)以聯行往來剖析營運利潤，皆正確。","c":2,"f":2,"ap":["H2-36","E12-7"]},{"i":"H2-37","q":"下列何者不是經濟移轉價格(Economic Transfer Prices)的構成要素？","o":["預定的利潤目標","與資金來源有關的借款成本","與信用風險有關的呆帳準備","與流動性風險有關的流動性貼水"],"a":0,"e":"答案(A)。經濟移轉價格的構成要素為：與資金來源有關的借款成本、與信用風險有關的呆帳準備、與流動性風險有關的流動性貼水；預定的利潤目標是顧客價格在移轉價格上加減的部分，不屬經濟移轉價格要素。","c":2,"f":5,"ap":["H2-37","E9-4","E13-4","E19-3","E23-6"]},{"i":"H2-38","q":"擬定經濟移轉價格，需考量下列哪些因子？ A.作業成本 B.與資金來源有關的借款成本 C.與流動性風險有關的流動性貼水 D.與信用風險有關的呆帳準備","o":["僅B","僅A、B","僅B、C、D","A、B、C、D"],"a":2,"e":"答案(C)。依教材，擬定經濟移轉價格需考量與資金來源有關的借款成本(B)、與流動性風險有關的流動性貼水(C)、與信用風險有關的呆帳準備(D)，作業成本(A)不在其列，故選僅B、C、D。","c":2,"f":2,"ap":["H2-38","E10-10"]},{"i":"H2-39","q":"銀行分行（營業單位）主要收入來源不包括下列何者？","o":["供應多餘內部資金時，按照供應利率賺取的利息收入","手續費收入","承作授信業務的放款利息收入","調撥資金產生之財務投資收入"],"a":3,"e":"答案(D)。分行（營業單位）的主要收入來源包括供應多餘內部資金所賺的供應利率利息收入、手續費收入及放款利息收入；調撥資金產生的財務投資收入屬總行財務處（資金中心）的收入，非分行收入。","c":2,"f":2,"ap":["H2-39","E12-44"]},{"i":"H2-40","q":"有關聯行往來利率之功能，下列敘述何者錯誤？","o":["誘導相關部門，落實業務策略目標","加速業務部門開發有利提高績效的目標市場","提高資金定價成本，不利市場競爭","有利提升全行的營運利潤"],"a":2,"e":"答案(C)。聯行往來利率的功能在於誘導相關部門落實業務策略目標、加速開發有利績效的目標市場、提升全行營運利潤，並非提高資金定價成本而不利競爭，故(C)錯誤。","c":2,"f":2,"ap":["H2-40","E17-6"]},{"i":"H2-41","q":"銀行的營業單位遇到資金不足時，透過聯行往來取得資金適用的利率，係指下列何者？","o":["存款利率","放款利率","借用利率","供應利率"],"a":2,"e":"答案(C)。營業單位資金不足時，透過聯行往來向總行取得資金所適用的利率稱為「借用利率」；提供多餘資金給總行則適用「供應利率」。存款利率與放款利率則是對外部顧客的價格。","c":2,"f":6,"ap":["H2-41","E2-10","E5-16","E6-5","E9-5","E17-44"]},{"i":"H2-42","q":"銀行的營業單位透過聯行往來，提供多餘資金適用的利率，係指下列何者？","o":["存款利率","放款利率","借用利率","供應利率"],"a":3,"e":"答案(D)。營業單位透過聯行往來提供多餘資金給總行所適用的利率稱為「供應利率」；取得資金則適用「借用利率」。","c":2,"f":3,"ap":["H2-42","E3-7","E8-1"]},{"i":"H2-43","q":"銀行營業單位有100 億元放款資產及60 億元存款負債，已知放款利率9%、存款利率4%、聯行往來利率為7%，請計算營業單位的營運利潤？","o":["1.8 億元","2 億元","3.8 億元","5 億元"],"a":2,"e":"答案(C)。放款利息收入＝100億×9%＝9億；存款利息支出＝60億×4%＝2.4億；資金缺口100－60＝40億向聯行借用，成本＝40億×7%＝2.8億。營運利潤＝9－2.4－2.8＝3.8億元。","c":2,"f":4,"ap":["H2-43","E11-42","E15-3","E20-46"],"n":"100 億元放款，利率9%，可賺100(億)*0.09 = 9 億 60 億元存款負債，利率4%，需付60(億)*0.04 = 2.4 億 聯行提供資金為100 – 60 = 40 億，利率7%，需付40(億)*0.07 = 2.8 億 9 – 2.4 – 2.8 = Ans"},{"i":"H2-44","q":"銀行的營業單位有放款資產120 億元及存款負債80 億元，其中不足的40 億元資金，由財務處以利率8%向同業融資，在聯行往來利率為7%的基礎下，計算財務處的財務利潤為多少？","o":["虧損3.2 億元","虧損0.4 億元","獲利0.4 億元","獲利2.8 億元"],"a":1,"e":"答案(B)。財務利潤＝(內部移轉價格－市場價格)×資金。財務處以7%將40億元借給營業單位，收入40億×7%＝2.8億；向同業以8%融資，成本40億×8%＝3.2億，財務利潤＝2.8－3.2＝－0.4億，即虧損0.4億元。","c":2,"f":4,"ap":["H2-44","E13-45","E19-45","E23-1"],"n":"由聯行借款40 億，需付40(億)*0.07 = 2.8 億；由同業借款40 億，需付40(億)*0.08 = 3.2 億 跟聯行借款相比，與同業借款需要多付(虧損) 3.2 - 2.8 = 0.4 億"},{"i":"H4-1","q":"下列何者不屬於銀行對借款企業之經常性融資業務？","o":["票據融通","住宅用之房屋抵押貸款","擔保透支","短期放款"],"a":1,"e":"答案(B)。經常性融資以協助企業短期週轉金為目的，包括票據融通、短期放款、透支（含擔保透支）等。住宅用房屋抵押貸款屬於個人的消費性（中長期）貸款，不是對企業的經常性融資。","c":4,"f":2,"ap":["H4-1","E9-13"]},{"i":"H4-2","q":"常見的中長期融資不包含下列何者？","o":["自創品牌放款","企業天然災害復建放款","民間投資興辦公共設施放款","墊付出口票款"],"a":3,"e":"答案(D)。中長期融資以協助企業建立中長期營運資金為目的，如自創品牌放款、天然災害復建放款、民間投資興辦公共設施放款等；墊付出口票款屬短期票據融通（經常性融資），不屬中長期融資。","c":4,"f":4,"ap":["H4-2","E5-31","E9-15","E18-12"]},{"i":"H4-3","q":"關於融資業務，下列敘述何者錯誤？","o":["經常性融資以協助企業短期週轉金為目的","經常性融資之還款來源，仰賴處分固定資產來變現","中長期融資以協助企業建立中長期的營運資金為目的","中長期融資之還款來源，仰賴未來經營所賺得的利潤"],"a":1,"e":"答案(B)。經常性融資以協助企業短期週轉為目的，還款來源主要為營業收入、應收帳款回收等短期現金流入，而非仰賴處分固定資產變現，故(B)錯誤。中長期融資的還款來源則仰賴未來經營所賺得的利潤，(A)(C)(D)正確。","c":4,"f":2,"ap":["H4-3","E8-19"]},{"i":"H4-4","q":"關於應收帳款代收融資業務，下列敘述何者錯誤？","o":["係根據企業尚未收妥的應收帳款，提供週轉資金並賺取利息收入","有追索權的應收帳款管理商，得向商品或勞務供應者追討墊付之帳款","無追索權的授信對象為商品或勞務的提供者","銀行可要求應收帳款讓與者額外負擔保險費用，以降低信用風險"],"a":2,"e":"答案(C)。無追索權的應收帳款承購，銀行承擔買方的信用風險，授信對象為商品或勞務的「購買者」（應收帳款的還款者），而非提供者，故(C)錯誤。有追索權者得向供應者（讓與者）追討，(B)正確；(A)(D)亦正確。","c":4,"f":3,"ap":["H4-4","E8-4","E14-10"]},{"i":"H4-5","q":"有關應收帳款代收融資，下列何者正確？","o":["應收帳款管理商若無法向商品勞務供應者，追回其墊付的帳款，則稱此為有追索權之應收帳款承購","有追索權的授信對象為應收帳款的讓與者（即賣方），無追索權的授信對象為應收帳款的還款者（即買方）","辦理應收帳款承購業務的銀行若覺得承擔的流動性風險與信用風險過高，可在初級市場將部分應收帳款轉售予其他銀行","辦理應收帳款承購業務的銀行若發現商品勞務買方存在明顯不同的信用等級時，無須銀行自行負擔保險費用（一般無法要求應收帳款讓與者額外負擔保險費用），以降低其信用風險"],"a":1,"e":"答案(B)。有追索權時，銀行可向賣方追討，授信對象為應收帳款讓與者（賣方）；無追索權時授信對象為還款者（買方），(B)正確。(A)無法向供應者追回者為「無追索權」；(C)應是在「次級市場」轉售；(D)銀行可要求讓與者額外負擔保險費用以降低信用風險。","c":4,"f":2,"ap":["H4-5","E7-12"]},{"i":"H4-6","q":"本國銀行以「內保外貸」承作陸資企業授信之運作模式，係指下列何者？","o":["借款企業需提供外資銀行開立的擔保信用狀，擔保該借款客戶履行合約義務或責任","借款企業之負責人需提供連帶保證，擔保該借款客戶履行合約義務或責任","借款企業需提供銀行存單做為放款之擔保品","借款企業需提供其境外子公司做為放款擔保人，共同承擔履約義務"],"a":0,"e":"答案(A)。「內保外貸」是指借款企業須提供外資銀行開立的擔保信用狀(SBLC)，擔保借款人履行合約義務或責任，本國銀行據以承作陸資企業授信。","c":4,"f":3,"ap":["H4-6","E12-9","E15-8"]},{"i":"H4-7","q":"銀行接受廠商委託，向國外商品勞務的賣方簽定「即期跟單匯票」，於完成信用狀約定下，先行墊付款項。然後，通知借款人在合理期限內「備款贖單」之票據融通方式，稱為哪種業務？","o":["墊付國內票款","墊付出口票款","出口押匯","進口押匯"],"a":3,"e":"答案(D)。銀行接受進口商委託，對國外賣方（出口商）簽發的即期跟單匯票，在符合信用狀條件下先行墊付款項，再通知借款人在合理期限內備款贖單，稱為「進口押匯」。出口押匯則是銀行向出口商墊付貨款。","c":4,"f":3,"ap":["H4-7","E12-11","E18-10"]},{"i":"H4-8","q":"A 公司全年營業收入為新臺幣（以下同）1.2 億元，其中內銷占九成，其應收款項（含應收票據）週轉次數2 次，該公司在其他行庫辦理票據融資額度為3,000 萬元，假定A 公司預期未來一年營業及收款條件無明顯變化，銀行墊付成數最高為八成，則A 公司可獲核定之客票融資額度以不超過多少金額為宜？","o":["1,320 萬元","1,800 萬元","2,500 萬元","3,000 萬元"],"a":0,"e":"答案(A)。最高客票融資額度＝全年內銷金額÷週轉次數×貸放成數－其他行庫墊付國內票款金額＝(1.2億×90%)÷2×80%－3,000萬＝10,800萬÷2×0.8－3,000萬＝4,320萬－3,000萬＝1,320萬元。","c":4,"f":3,"ap":["H4-8","E8-59","E15-46"],"n":"最高客票融資額度=全年內銷金額/週轉次數*貸放乘數-其他行庫墊付國內票款金額 = (1.2 億*0.9) / 2 * 0.8 – 3000 = Ans"},{"i":"H4-9","q":"旺旺公司發行一張由大發銀行允諾承兌的匯票，面額500 萬元，180 天到期，貼現率為6%，承兌費用為發行面額的0.5%，則該銀行允諾承兌匯票的發行價格為何？","o":["2.5 萬元","485.21 萬元","25 萬元","48.52 萬元"],"a":1,"e":"答案(B)。發行價格＝面額－貼現息。貼現息＝500萬×6%×180/365≈14.79萬元，發行價格＝500－14.79≈485.21萬元。承兌費用500萬×0.5%＝2.5萬元是發行人另付給承兌銀行的費用，不影響投資人支付的發行價格，(A)即承兌費用金額。","c":4,"f":3,"ap":["H4-9","E9-58","E11-45"],"n":"發行價格(已含承兌費用) + 貼現息[500 萬 * 6% * (180/365)] = 500 萬"},{"i":"H4-10","q":"關於銀行票據承兌業務，下列何者錯誤？","o":["銀行代替買方，為其賣方所發匯票之付款人提供承兌，稱為「買方委託承兌」","買方業者基於資金調度考量，進口貨物時常開發「即期信用狀」取代「遠期信用狀」","銀行受理之賣方委託承兌，旨在協助賣方將取得的「遠期支票」轉換為「銀行承兌匯票」","票據承兌業務係銀行授信業務之一種"],"a":1,"e":"答案(B)。買方業者基於資金調度考量，進口貨物時常開發「遠期信用狀」（可延後付款），而非以即期信用狀取代遠期信用狀，故(B)錯誤。(A)買方委託承兌定義、(C)賣方委託承兌將遠期支票轉為銀行承兌匯票、(D)承兌屬授信業務，皆正確。","c":4,"f":2,"ap":["H4-10","E6-16"]},{"i":"H4-11","q":"有關「票據承兌業務」的敘述，下列何者錯誤？","o":["商品勞務的買方與賣方均可擔任委託付款的當事人","銀行只承擔買方委託開立的「遠期信用狀」，進而負擔「承兌」，而衍生的信用風險","銀行也可承擔賣方簽發「出口跟單匯票」，而衍生承兌委託的信用風險","依票據法規定，承兌制度僅限於匯票，本票及支票無承兌交易"],"a":1,"e":"答案(B)。票據承兌的委託人可為買方或賣方，銀行除承擔買方委託開立遠期信用狀衍生的承兌信用風險外，也可承擔賣方簽發出口跟單匯票衍生的承兌委託信用風險，「只承擔」的說法錯誤。(D)依票據法，承兌制度僅限匯票，正確。","c":4,"f":2,"ap":["H4-11","E19-47"]},{"i":"H4-12","q":"銀行和客戶簽訂承諾協議書，對於額度範圍內之尚未動用部分，應收取下列何種費用？","o":["利息費用","承諾費用","違約費用","承兌費用"],"a":1,"e":"答案(B)。銀行與客戶簽訂承諾協議書後，對額度範圍內尚未動用的部分應收取「承諾費用」，以補償銀行須隨時準備資金供借戶動用所承擔的風險；利息費用則針對已動用部分收取。","c":4,"f":6,"ap":["H4-12","E2-20","E6-15","E7-15","E10-16","E23-47"]},{"i":"H4-13","q":"有關授信業務的承諾費用(Up-Front Fee)，下列敘述何者錯誤？","o":["此項費用適用在融資額度內，尚未動用的部分","借戶在融資額度內尚未動用的部分，不須負擔利息費用，惟須支付承諾費用","銀行給予借戶隨時動用款項，因而承擔「再融資風險」","銀行給予借戶隨時動用款項，因而承擔「再投資風險」"],"a":3,"e":"答案(D)。承諾費用適用於融資額度內尚未動用部分，借戶對該部分不負擔利息但須支付承諾費。銀行給予借戶隨時動用款項，承擔的是須隨時籌措資金的「再融資風險」，而非「再投資風險」，故(D)錯誤。","c":4,"f":2,"ap":["H4-13","E17-12"]},{"i":"H4-14","q":"下列哪項不符企業的非公開舉債(Private Debt)？","o":["銀行借款","增資發行普通股","保單借款","證券金融公司提供的融資"],"a":1,"e":"答案(B)。非公開舉債是指不透過公開市場的借款，如銀行借款、保單借款、證券金融公司提供的融資等。增資發行普通股是透過公開市場籌措自有資金（權益），既非非公開舉債，也不屬債務。","c":4,"f":2,"ap":["H4-14","E13-15"],"n":"增資指上市公司在公開發行後，又再發行股票的動作，目的是想透過發行更多股票融資。"},{"i":"H4-15","q":"下列哪項不屬於企業的非公開舉債(Private Debt)？","o":["銀行借款","發行公司債","保單借款","證券金融公司提供的融資"],"a":1,"e":"答案(B)。發行公司債是向公開市場舉債，屬公開舉債；銀行借款、保單借款、證券金融公司提供的融資則屬非公開舉債(Private Debt)。","c":4,"f":3,"ap":["H4-15","E14-15","E19-17"]},{"i":"H4-16","q":"企業想籌措自有資金，透過興櫃、上櫃或上市途徑，發行的金融商品屬於下列何者？","o":["票券","債券","債務憑證","權益證券"],"a":3,"e":"答案(D)。企業透過興櫃、上櫃或上市途徑籌措自有資金所發行的是股票，屬「權益證券」；票券、債券及債務憑證均屬債務工具（外來資金）。","c":4,"f":2,"ap":["H4-16","E15-15"]},{"i":"H4-17","q":"下列哪項資金來源，不屬於企業的外來資金或債務？","o":["股票發行","票券發行","銀行借款","銀行以外的金融機構借款"],"a":0,"e":"答案(A)。發行股票所得資金屬企業的自有資金（股東權益），不是外來資金或債務；票券發行、銀行借款及向銀行以外金融機構借款均屬外來資金（債務）。","c":4,"f":3,"ap":["H4-17","E15-49","E19-50"]},{"i":"H4-18","q":"銀行辦理的短期債務保證，下列哪種項目不屬於此類業務？","o":["記帳稅款","預收定金之返還","預付款之返還","押標金"],"a":0,"e":"答案(A)。依教材，銀行辦理的短期債務保證包括押標金、預付款之返還、預收定金之返還等保證；記帳稅款（如關稅記帳）保證不屬此類短期債務保證業務，故選(A)。","c":4,"f":2,"ap":["H4-18","E14-11"]},{"i":"H4-19","q":"企業授信案件之訂價原則，應考慮下列哪些風險貼水因子？A.信用等級加碼 B.借款期別加碼 C.擔保品成數或比例加碼 D.授信展望加減碼","o":["僅A、C","僅B、D","僅A、B、C","A、B、C、D"],"a":3,"e":"答案(D)。企業授信案件訂價時應考慮的風險貼水因子包括：信用等級加碼、借款期別加碼、擔保品成數或比例加碼、授信展望加減碼，四項皆應考慮，故選ABCD。","c":4,"f":4,"ap":["H4-19","E9-14","E16-9","E22-12"]},{"i":"H4-20","q":"企業金融業務之放款利率＝基準利率＋風險加減碼，有關風險加減碼下列何者錯誤？","o":["信用等級加碼","外匯實績加減碼","存款實績加減碼","借款期別加減碼"],"a":3,"e":"答案(D)。放款利率＝基準利率＋風險加減碼，依教材風險加減碼包含信用等級加碼、外匯實績加減碼、存款實績加減碼等。借款期別屬訂價時的「加碼」因子（期限愈長加碼愈高），教材未將其列為風險加減碼項目，故選(D)。","c":4,"f":3,"ap":["H4-20","E13-11","E16-47"],"g":"與講義第4章第19題將「借款期別加碼」列為風險貼水因子看似矛盾；本題重點應在「借款期別加減碼」此一說法不在教材列舉之風險加減碼中"},{"i":"H4-21","q":"銀行之放款利率＝基準利率＋風險加減碼，關於風險加減碼下列何者錯誤？","o":["信用等級加碼","外匯實績加減碼","存款實績加減碼","產業風險加減碼"],"a":3,"e":"答案(D)。依教材，風險加減碼包括信用等級加碼、外匯實績加減碼及存款實績加減碼等，並視企業經營績效與產業環境而定；「產業風險加減碼」不是教材列舉的風險加減碼項目，故選(D)。","c":4,"f":2,"ap":["H4-21","E10-17"]},{"i":"H4-22","q":"關於信用評等制度，下列何者錯誤？","o":["2007 年之後實施的資本協定，在信用風險的資本計提包括標準法與內部評等法","借款客戶的貸款利率是由基準利率與風險加減碼所構成","基準利率反映市場上的長期資金走勢，非個別銀行所能單獨主導","風險加減碼制度須視企業的經營績效與產業環境而定"],"a":2,"e":"答案(C)。基準利率反映的是市場上「短期」資金走勢，非個別銀行所能單獨主導，(C)寫成長期資金走勢故錯誤。(A)Basel II信用風險資本計提有標準法與內部評等法、(B)貸款利率＝基準利率＋風險加減碼、(D)風險加減碼視經營績效與產業環境而定，皆正確。","c":4,"f":2,"ap":["H4-22","E11-9"]},{"i":"H4-23","q":"有關企業貸款的利率水準，下列敘述何者錯誤？","o":["基準利率旨在反映短期資金市場的走勢，概由個別銀行所主導","基準利率通常決定於信用市場的寬鬆與緊俏","信用等級佳的企業，信用等級加碼低","就相同借戶而言，擔保貸款利率通常低於信用貸款利率"],"a":0,"e":"答案(A)。基準利率反映短期資金市場走勢，通常決定於信用市場的寬鬆與緊俏，「非」個別銀行所能單獨主導，故(A)錯誤。(C)信用等級佳者加碼低、(D)同一借戶擔保貸款利率通常低於信用貸款，皆正確。","c":4,"f":2,"ap":["H4-23","E15-9"]},{"i":"H4-24","q":"有關評等模型的建置方法，下列敘述何者錯誤？","o":["財務評等模型強調，只能蒐集到企業的「財務狀況」，其他構面無法納入模型","基本模型的評等強調，資料來源還包括申貸客戶的授信與外匯往來的利潤貢獻、股價等因素","將授審主管主觀判斷因素納入，作加減分調整，成為「授信戶的個別評等」","授信戶的個別評等，實務上又稱「授信特徵評等」"],"a":3,"e":"答案(D)。授信特徵評等範圍最廣，是在授信戶個別評等之外，再納入政府支持度等其他影響因子，兩者並不相同，故(D)錯誤。(A)財務評等只能涵蓋財務狀況、(B)基本模型資料來源包括往來利潤貢獻與股價等、(C)納入授審主管主觀判斷加減分即為授信戶個別評等，皆正確。","c":4,"f":4,"ap":["H4-24","E9-60","E17-51","E21-51"],"n":"授信特徵評等範圍大於授信戶的個別評等。"},{"i":"H4-25","q":"銀行授信或風險管理主管依主觀經驗與判斷，考量借戶有否警示性財務比率、重複計算定性指標的分數、黑名單等資訊，並做等級調整，屬於何種評等？","o":["基本模型的評等","授信戶的個別評等","授信特徵評等","財務評等"],"a":1,"e":"答案(B)。在基本模型評等之上，由授信或風險管理主管依主觀經驗判斷，考量警示性財務比率、定性指標重複計分、黑名單等資訊做加減分或等級調整，即為「授信戶的個別評等」。","c":4,"f":3,"ap":["H4-25","E12-17","E15-20"]},{"i":"H4-26","q":"透過借款企業的財務報表，建立的評等模式，稱為何種評等？","o":["基本模型之評等","財務評等","授信戶評等","授信特徵評等"],"a":1,"e":"答案(B)。僅透過借款企業的財務報表建立的評等模式稱為「財務評等」，只能涵蓋財務狀況構面，範圍最小；基本模型評等再納入經營管理、產業特性與展望等構面。","c":4,"f":4,"ap":["H4-26","E11-19","E13-19","E23-18"]},{"i":"H4-27","q":"依據銀行公會公佈之大型企業信用評等表，其評分構面不包括下列何者？","o":["財務狀況","經營管理","產業特性暨展望","擔保品流動性展望"],"a":3,"e":"答案(D)。銀行公會企業信用評等表的評分構面為財務狀況、經營管理、產業特性暨展望三項，不包括「擔保品流動性展望」。","c":4,"f":4,"ap":["H4-27","E1-16","E11-10","E20-47"]},{"i":"H4-28","q":"大型企業在信用評分時，「財務狀況」、「經營管理」、「產業特性及展望」等三種構面的比重分別為：","o":["50%、25%、25%","40%、40%、20%","50%、30%、20%","40%、30%、30%"],"a":2,"e":"答案(C)。依銀行公會信用評等表，大型企業三構面比重為：財務狀況50%、經營管理30%、產業特性及展望20%。中小型企業則為40%、40%、20%。","c":4,"f":2,"ap":["H4-28","E9-56"]},{"i":"H4-29","q":"銀行公會針對中小型企業的信用評分，構面包括財務狀況、經營管理，以及產業特性暨展望三項，此三項構面的評分比重為何？","o":["50%、30%及20%","40%、40%及20%","40%、30%及30%","30%、30%及40%"],"a":1,"e":"答案(B)。依銀行公會信用評等表，中小型企業三構面比重為：財務狀況40%、經營管理40%、產業特性暨展望20%。大型企業則為50%、30%、20%。","c":4,"f":2,"ap":["H4-29","E12-19"]},{"i":"H4-30","q":"銀行公會制定之「授信企業信用評等表」，藉由三個構面評分，其中哪兩個構面隨著大型企業與中小型企業差異，將信用評分的比重設定不同？","o":["財務狀況、經營管理","經營管理、產業特性暨展望","財務狀況、產業特性暨展望","獲利情形、經營管理"],"a":0,"e":"答案(A)。大型企業為財務狀況50%、經營管理30%、產業特性暨展望20%；中小型企業為40%、40%、20%。比重不同的是「財務狀況」與「經營管理」兩構面，產業特性暨展望皆為20%。","c":4,"f":2,"ap":["H4-30","E18-18"]},{"i":"H4-31","q":"微型與中小型企業的申貸案件，一般而言信用風險偏高，因此銀行可在分行與總行間成立區域中心分層負責。此外，銀行還可以透過下列何者，以降低風險？","o":["中央存款保險","中央放款保險","中長期債務保證","中小企業信用保證基金"],"a":3,"e":"答案(D)。中小企業信用保證基金旨在對中小企業融資提供信用保證，銀行承作微型與中小企業授信時尋求信保基金保證，可分擔並降低信用風險。中央存款保險保障的是存款人，並非放款信用風險。","c":4,"f":2,"ap":["H4-31","E9-46"],"n":"中小企業信用保證基金旨在提供信用保證，促進中小企業融資目的。"},{"i":"H4-32","q":"中小企業信用保證基金的保證對象，哪類對象不符合申請資格？","o":["經常僱用員工人數200 人以內的公司","實收資本額在1 億元以下的公司","集團企業","微型企業"],"a":2,"e":"答案(C)。信保基金保證對象為符合中小企業認定標準者，例如實收資本額新臺幣1億元以下或經常僱用員工200人以下之公司，微型企業亦屬保證對象；集團企業非屬中小企業範疇，不符申請資格。","c":4,"f":1,"ap":["H4-32"],"n":"集團企業非屬中小企業範疇。"},{"i":"H4-33","q":"有關微型企業的經營屬性與信用風險管理之敘述，下列何者錯誤？","o":["銀行承作此類授信，潛藏高信用風險","專案及批次的信保基金，可降低銀行信用風險","銀行設置「區域中心」，可降低市場風險","銀行延聘電子商務專業知識主管，開拓業績控管風險"],"a":2,"e":"答案(C)。銀行在分行與總行間設置「區域中心」分層負責，目的在強化授信審核、降低「信用風險」，而非市場風險，故(C)錯誤。微型企業授信潛藏高信用風險、信保基金可降低信用風險、延聘專業主管開拓業務控管風險，(A)(B)(D)正確。","c":4,"f":2,"ap":["H4-33","E20-17"],"n":"設置區域中心可降低信用風險。"},{"i":"H4-34","q":"銀行承作中小企業授信時，尋求「中小企業信保基金」給予保證，對於債權銀行的信用風險有何影響？","o":["降低","提高","不變","無關"],"a":0,"e":"答案(A)。銀行承作中小企業授信若取得中小企業信保基金保證，借款人違約時可由信保基金代位清償一定成數，債權銀行承擔的信用風險因而降低。","c":4,"f":4,"ap":["H4-34","E13-16","E17-16","E21-16"]},{"i":"H4-35","q":"聯貸銀行為借款人客製化授信合約時，常將財務承諾條款視為財務健全性之控管點，請問下列何者不屬於正向條款？","o":["維持利息保障倍數大於一定比率","保全處分擔保品","維持資產報酬率大於一定比率","不得出售資產與支付股利"],"a":3,"e":"答案(D)。正向條款是借款人「應達到或應做」的事項，如維持利息保障倍數、資產報酬率大於一定比率、保全擔保品等；「不得出售資產與支付股利」是不能做的事項，屬負面（反面）承諾條款。","c":4,"f":3,"ap":["H4-35","E3-14","E9-16"],"n":"正向條款是指應達到的事項，反面承諾是指不能做的事項。"},{"i":"H4-36","q":"在授信契約的保障條款中，下列何者不屬於正向條款？","o":["借戶須定期陳送財務報表","借戶未獲得債權銀行同意，不得發行新債","借戶的利息保障倍數須大於3","借戶的資產報酬率須大於5%"],"a":1,"e":"答案(B)。「未獲得債權銀行同意，不得發行新債」是限制借戶不得採取的行為，屬負面（否定）條款；定期陳送財務報表、利息保障倍數須大於3、資產報酬率須大於5%皆為應做到的正向條款。","c":4,"f":2,"ap":["H4-36","E14-46"]},{"i":"H4-37","q":"授信契約的負面或否定保障條款強調，借戶如未獲得債權銀行同意，不得採取之理財行為，請問下列何項內容不屬於此類條款？","o":["定期陳送財務報表","發行新債","購買新的固定資產","出售資產與支付股利"],"a":0,"e":"答案(A)。負面保障條款規範借戶未經債權銀行同意不得採取的理財行為，如發行新債、購買新的固定資產、出售資產與支付股利；「定期陳送財務報表」是借戶應做的事項，屬正向條款。","c":4,"f":2,"ap":["H4-37","E19-11"]},{"i":"H4-38","q":"企業發行新債務憑證時，儘管金融環境不變，仍被要求比較高的息票利率，意味該企業的信用等級如何？","o":["無關","不變","提升","降低"],"a":3,"e":"答案(D)。在金融環境不變下，企業發行新債務憑證卻被要求較高的息票利率，代表市場要求較高的信用風險貼水，意味該企業信用等級降低。","c":4,"f":2,"ap":["H4-38","E7-7"]},{"i":"H4-39","q":"有關企業信用地位下滑之徵兆，下列敘述何者錯誤？","o":["企業發行新債務憑證需訂定比較高的票面利率","市場對企業流通在外的股票，長期看跌其價格","信用評等機構調降該企業發行之債務憑證","企業之利息保障倍數高於產業平均水準"],"a":3,"e":"答案(D)。企業利息保障倍數高於產業平均，代表以營運利潤支付利息能力較強，是信用良好的表徵，並非信用地位下滑徵兆，故(D)錯誤。發債須訂較高票面利率、股價長期看跌、信評機構調降評等，皆屬信用下滑徵兆。","c":4,"f":2,"ap":["H4-39","E16-41"]},{"i":"H4-40","q":"關於企業之信用評分，下列敘述何者錯誤？","o":["負責人在業界之評價愈高，則違約機率愈低","企業內部組織運作愈健全，則違約機率愈低","企業跨足陌生產業，可以分散經營風險，所以違約機率可以降低","在業界中扮演龍頭地位之領導企業，其違約機率會較低"],"a":2,"e":"答案(C)。企業跨足陌生產業，缺乏經驗與專業，反而提高經營風險，違約機率可能上升，故(C)錯誤。負責人評價高、內部組織健全、居產業龍頭地位，均使違約機率較低。","c":4,"f":2,"ap":["H4-40","E6-24"]},{"i":"H4-41","q":"依銀行公會的評分標準，下列四種公司組織型態，由高至低的信用得分依序為何？A.股份有限公司、B.股票公開發行公司、C.股票上市公司、D.股票上櫃與興櫃公司","o":["ABCD","BCDA","CDAB","CDBA"],"a":3,"e":"答案(D)。依銀行公會評分標準，公司組織型態的信用得分大致依規模與資訊透明度由高至低為：股票上市公司(C)＞股票上櫃與興櫃公司(D)＞股票公開發行公司(B)＞股份有限公司(A)，即CDBA。","c":4,"f":2,"ap":["H4-41","E18-9"],"n":"規模越大得分越高。"},{"i":"H4-42","q":"A 公司資產負債表之流動資產為新台幣（以下同）6,000 萬元，固定資產及長期投資為6,500萬元，流動負債為9,000 萬元，長期負債及淨值為4,000 萬元，則下列敘述何者正確？","o":["A 公司尚有500 萬元之長期資金可供經常週轉用","A 公司以長期資金流用於固定資產及長期投資之金額達500 萬元","A 公司以短期資金流用於固定資產及長期投資之金額達2,500 萬元","A 公司尚有2,500 萬元之長期資金可供經常週轉用"],"a":2,"e":"答案(C)。長期資金＝長期負債＋淨值＝4,000萬元，而固定資產及長期投資為6,500萬元，長期資金不足以支應，差額6,500－4,000＝2,500萬元須以短期資金支應（以短支長），故(C)正確；公司並無剩餘長期資金可供經常週轉，(A)(B)(D)錯誤。","c":4,"f":2,"ap":["H4-42","E9-55"],"n":"固定資產及長期投資 = 長期資金 + 部分短期資金 6,500 = 4,000 + 部分短期資金"},{"i":"H4-43","q":"衡量公司之短期償債能力，下列何者正確？","o":["速動比率＝速動資產／速動負債","速動比率＝（流動資產－預付費用）／流動負債","速動比率＝速動資產／流動負債","速動比率＝流動資產／速動負債"],"a":2,"e":"答案(C)。速動比率＝速動資產÷流動負債，速動資產為流動資產扣除存貨、預付費用等變現能力較差的資產。(B)只扣除預付費用而未扣除存貨，不正確；並無「速動負債」之說。","c":4,"f":2,"ap":["H4-43","E7-13"]},{"i":"H4-44","q":"企業為改善財務結構，董事會同意以現金出售固定資產，實現處分資產之資本利得，其財務結構將有下列何種變化？","o":["存貨比率下降且流動比率下降","負債比率下降且速動比率上升","應收帳款週轉率上升且速動比率下降","負債比率上升且流動比率上升"],"a":1,"e":"答案(B)。以現金出售固定資產且實現資本利得，現金（速動資產與流動資產）增加，且因利得使總資產與淨值增加，負債不變。負債比率＝負債÷資產下降；速動比率＝速動資產÷流動負債上升（流動比率亦上升），故選(B)，(A)(C)(D)方向錯誤。","c":4,"f":6,"ap":["H4-44","E1-17","E5-19","E6-49","E7-18","E10-43"],"n":"出售固定資產且有資本利得，代表現金增加且整體資產增加。負債比率 = 負債 / 資產，負債不變但資產增加，所以負債比率減少。速動比率 = 速動資產 / 流動負債，速動資產包含現金，因此速動資產增加、流動資產不變， 所以速動比率上升。"},{"i":"H4-45","q":"甲企業2019 年12 月31 日的流動資產為85,951 萬元，其中現金及約當現金35,664 萬元、應收票據及帳款淨額28,180 萬元、存貨10,968 萬元、預付費用125 萬元、其他流動資產11,014萬元。負債總額79,219 萬元，除長期負債38,030 萬元外，其餘為流動負債，請問該公司的速動比率為何？（四捨五入取最接近值）","o":["209%","199%","182%","185%"],"a":2,"e":"答案(C)。速動資產＝流動資產－存貨－預付費用＝85,951－10,968－125＝74,858萬元；流動負債＝負債總額－長期負債＝79,219－38,030＝41,189萬元。速動比率＝74,858÷41,189≈181.7%，最接近182%。","c":4,"f":2,"ap":["H4-45","E12-45"],"n":"速動資產 = 流動資產－存貨、預付費用 = 85,951 - 10,968 - 125 = 74,858 負債總額 = 流動負債 + 長期負債→流動負債 = 79,219 – 38,030 = 41,189 速動比率 = 速動資產 / 流動負債 = 74,858 / 41,189 = Ans"},{"i":"H4-46","q":"甲公司該年度稅後淨利為7 億元，所得稅稅率為17%，股東權益為50 億元，請問甲公司之淨值純益率為多少？","o":["11.97%","16.87%","17.21%","18.00%"],"a":1,"e":"答案(B)。依教材，淨值純益率＝稅前淨利÷股東權益。稅前淨利＝稅後淨利÷(1－稅率)＝7÷(1－17%)≈8.434億元；淨值純益率＝8.434÷50≈16.87%。注意本科教材以「稅前」淨利計算，若誤用稅後淨利7÷50＝14%則不在選項中。","c":4,"f":5,"ap":["H4-46","E5-56","E6-42","E7-50","E10-41"],"n":"稅前淨利 * (1-17%) = 7 億，導出稅前淨利為8.433 億 稅前淨利8.433 / 股東權益50 = Ans"},{"i":"H4-47","q":"甲公司該年度相關財務數字如下：營業收入166 佰萬元、營業成本92 佰萬元、營業外收入5 佰萬元、期初應收帳款淨額13 佰萬元、期末應收帳款淨額28 佰萬元，請計算其應收帳款週轉率為何？","o":["6.1","8.1","10.1","13.1"],"a":1,"e":"答案(B)。應收帳款週轉率＝營業收入÷平均應收帳款。平均應收帳款＝(13＋28)÷2＝20.5佰萬元，週轉率＝166÷20.5≈8.1次。營業成本與營業外收入與本題計算無關。","c":4,"f":2,"ap":["H4-47","E10-42"],"n":"應收帳款週轉率 = 營收 / 平均應收帳款 = 166 / [(13+28)/2] = Ans"},{"i":"H4-48","q":"甲公司的平均應收帳款為1,200 萬元，平均總資產為2 億元，總資產週轉率為0.56 次，請問甲公司的應收帳款週轉率為何？","o":["8.5 次","9.3 次","10.6 次","11.2 次"],"a":1,"e":"答案(B)。總資產週轉率＝營收÷平均總資產，營收＝0.56×2億＝1.12億元。應收帳款週轉率＝營收÷平均應收帳款＝11,200萬÷1,200萬≈9.33次，約9.3次。","c":4,"f":2,"ap":["H4-48","E18-47"],"n":"總資產週轉率 = 營收 / 平均總資產 = 0.56 = 營收 / 2 億→ 營收 = 1.12 億 應收帳款週轉率 = 營收1.12 億 / 平均應收帳款1,200 萬 = Ans"},{"i":"H4-49","q":"關於財務比率分析，下列敘述何者錯誤？","o":["企業預付費用變高而導致速動比率降低時，其短期償債能力即變差","企業財務槓桿比率愈高，承擔之財務風險即愈大","企業存貨週轉率愈高，意味庫存管理能力愈差及資金積壓愈多","企業應收帳款週轉率愈高，意味現金回收速度即越快"],"a":2,"e":"答案(C)。存貨週轉率愈高，代表存貨銷售速度快、庫存管理能力「愈好」且資金積壓愈少，(C)說反而錯誤。(A)預付費用增加使速動比率降低則短期償債能力變差、(B)財務槓桿愈高財務風險愈大、(D)應收帳款週轉率愈高現金回收愈快，皆正確。","c":4,"f":2,"ap":["H4-49","E12-10"]},{"i":"H4-50","q":"衡量企業取得資金之後的經營效能，下列何者錯誤？","o":["存貨週轉率越高，企業經營效能越好","應收帳款週轉率越高，企業經營效能越好","總資產週轉率越高，企業經營效能越好","應付帳款週轉率越高，企業還款壓力越輕"],"a":3,"e":"答案(D)。應付帳款週轉率＝銷貨成本÷平均應付帳款，週轉率越高代表付款越快、付款期間越短，企業還款壓力越「重」，一般以較低為佳，故(D)錯誤。存貨、應收帳款與總資產週轉率越高，經營效能越好。","c":4,"f":2,"ap":["H4-50","E22-10"]},{"i":"H4-51","q":"有關財務比率的敘述，下列何者不適當？","o":["負債對淨值的比率越高，借戶的財務結構越不健全","財務費用率越高，借戶的財務運用越不適當","固定長期適合率小於1，表示借戶「以短支長」，易造成短期資金不足","借戶的淨值報酬率越高，意味獲利表現越好"],"a":2,"e":"答案(C)。固定長期適合率＝(固定資產＋長期投資)÷(淨值＋長期負債)，「大於1」才表示長期資金不足、以短期資金支應長期資產（以短支長），小於1表示長期資金足以支應，故(C)不適當。","c":4,"f":2,"ap":["H4-51","E16-11"]},{"i":"H4-52","q":"丁公司2019 年12 月31 日的流動資產為90,381 萬元、長期投資33,422 萬元、固定資產207,005萬元、流動負債41,189 萬元、長期負債29,000 萬元、淨值或股東權益261,754 萬元，請問該公司的固定長期適合率為多少？","o":["78%","81%","83%","85%"],"a":2,"e":"答案(C)。固定長期適合率＝(固定資產＋長期投資)÷(淨值＋長期負債)＝(207,005＋33,422)÷(261,754＋29,000)＝240,427÷290,754≈82.7%，約83%。","c":4,"f":3,"ap":["H4-52","E11-47","E15-11"],"n":"固定長期適合率 = (固定資產+長期投資) / (淨值+長期負債) = (207,005+33,422) / (261,754+29,000) = Ans"},{"i":"H4-53","q":"仁愛公司2018 年度的營業收入為16,623 萬元，營業成本9,230 萬元，營業費用1,338 萬元，利息費用186 萬元，處分固定資產損失10 萬元，匯兌損失4 萬元，則當年的財務費用率應為多少？","o":["1.20%","8.05%","1.14%","55.53%"],"a":2,"e":"答案(C)。財務費用＝利息費用＋匯兌損失（＋手續費）＝186＋4＝190萬元，處分固定資產損失不屬財務費用。財務費用率＝190÷16,623≈1.14%。","c":4,"f":2,"ap":["H4-53","E9-57"],"n":"財務費用率 = (財務費用/營業收入)*100% 財務費用 = 利息費用 + 匯兌損失 + 手續費"},{"i":"H4-54","q":"乙公司2020 年度損益表的主要會計科目為：營業收入166,228 萬元、營業成本92,304 萬元、營業費用13,384 萬元、利息費用1,858 萬元、處分固定資產損失99 萬元、匯兌損失33 萬元，請問該公司的財務費用率為多少？","o":["0.54%","0.84%","1.04%","1.14%"],"a":3,"e":"答案(D)。財務費用＝利息費用＋匯兌損失＝1,858＋33＝1,891萬元（處分固定資產損失不計入）。財務費用率＝1,891÷166,228≈1.14%。","c":4,"f":2,"ap":["H4-54","E13-46"],"n":"財務費用 = 利息費用 + 匯兌損失 + 手續費 = 1858 + 33 = 1891 萬 財務費用率 = (財務費用/營業收入)*100% = (1891 / 166228)*100% = Ans"},{"i":"H4-55","q":"甲公司該年度相關財務數字如下：銷貨收入7,500 萬元、銷貨毛利2,800 萬元、營業費用2,200萬元、流動資產700 萬元、流動負債220 萬元、利息費用150 萬元、長期資產淨額800 萬元，請計算其利息保障倍數為何？","o":["4.0","5.1","6.3","8.8"],"a":0,"e":"答案(A)。利息保障倍數＝稅前息前盈餘÷利息費用。稅前息前盈餘（營業利益）＝銷貨毛利－營業費用＝2,800－2,200＝600萬元，利息保障倍數＝600÷150＝4.0倍。流動資產、流動負債等為干擾資料。","c":4,"f":2,"ap":["H4-55","E10-44"],"n":"稅前息前盈餘 = 銷貨毛利 – 營業費用 = 2800 – 2200 = 600 萬 利息保障倍數 = 稅前息前盈餘 / 利息費用 = 600 / 150 = Ans"},{"i":"H4-56","q":"A 公司擬擴大財務融資槓桿以支應業務成長之資金，評估舉債經營所創造之報酬將高於舉債利息支出，則在正常情況下，其對淨值報酬率的影響將會如何變動？","o":["上升","下降","不變","不確定，需視融資規模"],"a":0,"e":"答案(A)。舉債經營的報酬率高於借款利率時產生正向財務槓桿效果，增加的利潤歸屬股東而淨值不變，淨值報酬率將上升。","c":4,"f":2,"ap":["H4-56","E7-17"]},{"i":"H4-57","q":"A 公司預估未來一年營收為新臺幣（以下同）1,000 萬元，若其成本費用率為80%，營運週轉期為90 天，應付及預收款項比率為10%，以未來估算法計算A 公司年度平均週轉金約需多少金額？（小數點以下全捨）","o":["97 萬元","100 萬元","146 萬元","197 萬元"],"a":0,"e":"答案(A)。平均營運週轉金＝預估營收×成本費用率×(營運週轉期÷365)－預估營收×應付及預收款項比率＝1,000×80%×(90÷365)－1,000×10%≈197.26－100＝97.26萬元，小數點以下全捨為97萬元。","c":4,"f":2,"ap":["H4-57","E7-57"],"n":"平均營運週轉金：[預估未來一年營收×成本費用率× (營運週轉期÷365)] - (預估未來一年 營收×應付款項及預收款項比率) = [1,000 * 0.8 * (90/365)] – (1,000*0.1) = Ans"},{"i":"H5-1","q":"依據主管機關規定，債務人於全體金融機構之無擔保債務歸戶後之總餘額除以平均月收入，不宜超過多少倍數？","o":["16 倍","18 倍","20 倍","22 倍"],"a":3,"e":"答案(D)。依金管會規定，債務人於全體金融機構之無擔保債務歸戶後總餘額除以平均月收入，不宜超過22倍（俗稱DBR 22倍上限），以避免個人過度負債。","c":5,"f":4,"ap":["H5-1","E5-6","E6-43","E10-19"]},{"i":"H5-2","q":"某甲的月收入平均6萬元，目前的無擔保債務僅有向乙銀行申辦信用卡，刷卡使用尚有的循環信用餘額80萬元。某甲打算再向丙銀行申辦信用貸款，依主管機關規定，請問某甲最高可貸多少金額？","o":["32萬元","42萬元","52萬元","62萬元"],"a":2,"e":"答案(C)。無擔保債務總餘額上限＝平均月收入×22倍＝6萬×22＝132萬元。信用卡循環信用餘額80萬元屬無擔保債務，須扣除，132－80＝52萬元，即最高可再申貸52萬元。","c":5,"f":3,"ap":["H5-2","E14-13","E18-49"],"n":"6 萬*22 倍=132 萬，132-80 = 52 萬。"},{"i":"H5-3","q":"大明在全體金融機構中現有信用貸款餘額85 萬元、房屋擔保貸款餘額100 萬，大明平均月收入為5.5 萬元，擬向銀行申請一筆新增的信用貸款，依據金管會2005 年12 月19 日發函金融機構有關「債務人於全體金融機構之無擔保債務歸戶之總餘額」規範，銀行可以核給大明的信用貸款額度最高為多少？","o":["25 萬","36 萬","51 萬","64 萬"],"a":1,"e":"答案(B)。無擔保債務總餘額上限＝5.5萬×22＝121萬元。房屋擔保貸款屬有擔保債務，不計入；現有信用貸款85萬元須扣除，121－85＝36萬元。","c":5,"f":2,"ap":["H5-3","E15-47"],"n":"5.5萬*22倍=121萬，121-85=36萬。"},{"i":"H5-4","q":"下列何者屬於消費者貸款？A.購置住宅貸款 B.房屋修繕貸款 C.就學貸款 D.公司帳戶透支 (E)信用卡循環貸款","o":["僅ABCD","僅BCDE","僅ACDE","僅ABCE"],"a":3,"e":"答案(D)。消費者貸款是以個人消費為目的，如購置住宅貸款、房屋修繕貸款、就學貸款、信用卡循環貸款等（A、B、C、E）；公司帳戶透支屬企業金融業務，不是消費者貸款。","c":5,"f":2,"ap":["H5-4","E11-11"]},{"i":"H5-5","q":"下列哪項業務非屬消費金融業務？","o":["信用卡循環貸款","汽車貸款","應收帳款融資貸款","房屋修繕貸款"],"a":2,"e":"答案(C)。應收帳款融資貸款是以企業的應收帳款為基礎提供週轉資金，屬企業金融業務；信用卡循環貸款、汽車貸款、房屋修繕貸款則屬消費金融業務。","c":5,"f":2,"ap":["H5-5","E13-13"]},{"i":"H5-6","q":"根據2020 年12 月底的統計數據，消費性貸款中，哪項業務承作金額最多？","o":["購置住宅貸款","房屋修繕貸款","汽車貸款","信用卡循環信用餘額"],"a":0,"e":"答案(A)。依統計數據，消費性貸款中以購置住宅貸款的承作金額最多，遠高於房屋修繕貸款、汽車貸款與信用卡循環信用餘額。","c":5,"f":2,"ap":["H5-6","E12-12"]},{"i":"H5-7","q":"有關消費性放款之信用評分制度，下列敘述何者錯誤？","o":["系統量化評分後，即不准再執行額外人為輔助之加減分異動","借款人容易在申請時隱匿不利之個人資訊，導致違約率上升","銀行依信用評分決定准駁和最高申貸金額","常理上，銀行降低信用評分的准駁標準，會提高信用風險規模"],"a":0,"e":"答案(A)。消費性放款信用評分系統量化評分後，仍「可」由授信人員執行額外人為輔助之加減分調整（如考量模型未涵蓋的資訊），故(A)錯誤。借款人可能隱匿不利資訊、銀行依評分決定准駁與額度、降低准駁標準會提高信用風險，(B)(C)(D)正確。","c":5,"f":2,"ap":["H5-7","E10-22"]},{"i":"H5-8","q":"若客戶的住宅狀況有下列四種：A.為本人或配偶的房屋，且該房屋設定抵押權予本行、B.為本人或配偶的房屋，且該房屋設定抵押權予他人、C.為本人或配偶的房屋，且該房屋未設定他項權利、D.房屋為家族所有。銀行辦理消費性放款的信用評分時，請問評分由高至低依序為何？","o":["ABCD","DABC","CABD","CBAD"],"a":2,"e":"答案(C)。消費性放款評分時，住宅狀況愈能證明借款人擁有完整、未受負擔的自有房屋者分數愈高：本人或配偶所有且未設定他項權利(C)最高；設定抵押予本行(A)次之（本行掌握擔保且了解往來狀況）；設定抵押予他人(B)再次之；房屋為家族所有(D)非本人資產，分數最低。故順序為CABD。","c":5,"f":2,"ap":["H5-8","E14-47"]},{"i":"H5-9","q":"消費金融業務的信用評等與風險管理，下列敘述何者錯誤？","o":["「分期付款」的貸款無法循環動用融資額度","「分期付款」的貸款通常依照契約記載，有還款時間表","「分期付款」的貸款須按期支付本金及利息，不得提前還款","「分期付款」在貸款特性上，屬於「封閉式」的信用貸款"],"a":2,"e":"答案(C)。分期付款屬「封閉式」貸款，有固定還款期限與還款時間表，額度不能循環動用，(A)(B)(D)正確。分期付款雖須按期攤還本息，但借款人原則上仍可提前清償（可能依約收取提前清償違約金），並非「不得提前還款」，故(C)錯誤。","c":5,"f":2,"ap":["H5-9","E11-48"]},{"i":"H5-10","q":"消費金融業務的信用評等與風險管理，下列敘述何者錯誤？","o":["就學貸款屬於消費金融業務","信用卡客戶可申請辦理「預借現金」，此項貸款屬於短期擔保貸款","支票帳戶要享有「透支」額度，須向往來銀行提出申請","支票存款客戶產生的透支餘額，須負擔「利息費用」"],"a":1,"e":"答案(B)。信用卡「預借現金」是持卡人憑信用卡額度借現金，未提供任何擔保品，屬短期「無擔保」貸款（講義：無擔保貸款如信用貸款、信用卡預借現金），並非擔保貸款，故(B)錯誤。就學貸款屬消費金融；支票存款透支須事先申請額度，且透支餘額須負擔利息，(A)(C)(D)正確。","c":5,"f":2,"ap":["H5-10","E17-13"]},{"i":"H5-11","q":"有關消費金融之業務特點，下列敘述何者錯誤？","o":["利率訂價相對具僵硬性且偏高","業務成長循環和景氣榮枯存在高度相關性","因規模經濟導致其作業成本是所有放款項目中最低","借款人普遍對利率變化缺乏敏感性"],"a":2,"e":"答案(C)。消費金融每筆貸款金額小、件數多且客戶條件不一，徵審、撥貸、催收等作業成本相對較高，並非所有放款中最低，故(C)錯誤。消金利率訂價較具僵硬性且偏高、業務循環與景氣高度相關、借款人對利率變化較不敏感，(A)(B)(D)均正確。","c":5,"f":2,"ap":["H5-11","E16-48"],"n":"消費金融每筆金額小且客戶條件不一，作業成本相對較高。"},{"i":"H5-12","q":"購置住宅貸款之借款客戶要降低還本付息壓力時，可在最初幾年申請「寬限期」，辦理下列何者？","o":["付息不還本","還本不付息","不還本不付息","少還本少付息"],"a":0,"e":"答案(A)。房貸「寬限期」是指貸款最初一段期間借款人只需繳付利息、暫不攤還本金（付息不還本），以減輕初期還款壓力；寬限期滿後再開始本息攤還。","c":5,"f":2,"ap":["H5-12","E9-18"]},{"i":"H5-13","q":"有關自用住宅貸款的敘述，下列何者錯誤？","o":["借戶於寬限期只付本金、不付利息","「指數型」房屋貸款的利率，通常浮動計價、而非固定","無自用住宅者購買自用住宅之放款，借款期別可視需要超過30 年","此項貸款通常以房屋作為擔保品，簡稱「抵押貸款」"],"a":0,"e":"答案(A)。寬限期是「只付利息、不還本金」，(A)說成只付本金不付利息，正好相反，故錯誤。指數型房貸(ARM)以指標利率加碼，屬浮動計價；依銀行法第38條，無自用住宅者購買自用住宅之放款不受30年期限限制；房貸以房屋為擔保品，簡稱抵押貸款，(B)(C)(D)正確。","c":5,"f":2,"ap":["H5-13","E12-48"]},{"i":"H5-14","q":"關於房屋貸款之本息平均每月攤還，下列敘述何者正確？","o":["每月攤還的本金固定，但本金餘額隨房貸餘額減少，利息額也會跟著遞減","每月攤還的利息固定，但本金餘額隨房貸餘額減少","每月償還總額固定，時間愈往後本金償還部分愈多，利息償還部分愈少","每月償還總額固定，時間愈往後利息償還部分愈多，本金償還部分愈少"],"a":2,"e":"答案(C)。本息平均攤還法下每月還款總額固定；由於利息依剩餘本金計算，初期本金餘額大、利息占比高，隨本金逐期減少，利息部分愈來愈少、本金償還部分愈來愈多。(A)描述的是「本金平均攤還」（每月本金固定、利息遞減）；(D)方向相反。","c":5,"f":2,"ap":["H5-14","E9-19"]},{"i":"H5-15","q":"假設ARMs 定儲利率指數為2.5%，銀行承作房貸之成本加碼為2.55%，違約風險相關之信用等級加碼為1%，請根據ARMs 房貸之利率訂價方式，計算房貸利率為何？","o":["6.05%","5.05%","3.55%","3.50%"],"a":1,"e":"答案(B)。依講義，ARMs（指數型房貸）利率 = 指標利率（定儲利率指數）+ 成本加碼 = 2.5% + 2.55% = 5.05%。題目中的信用等級加碼1%為干擾項，ARMs訂價公式以指標利率加成本加碼為準；若誤加入即得(A)6.05%。","c":5,"f":2,"ap":["H5-15","E12-47"]},{"i":"H5-16","q":"有關自用住宅抵押貸款，下列敘述何者錯誤？","o":["依據銀行法規定，購買或建造住宅之放款期限不得超過二十年","寬限期係指貸款期間只付利息，不攤還本金","求償順位首先應向借款人求償，次就不足部分才可轉向保證人求償","銀行辦理自用住宅放款，不得要求提供連帶保證人"],"a":0,"e":"答案(A)。依銀行法第38條，銀行對購買或建造住宅之中、長期放款，最長期限不得超過「30年」（無自用住宅者購買自用住宅之放款不在此限），並非20年，故(A)錯誤。寬限期只付息不還本；求償應先向借款人、不足部分再向保證人；銀行不得要求自用住宅放款提供連帶保證人，(B)(C)(D)正確。","c":5,"f":3,"ap":["H5-16","E5-7","E11-12"]},{"i":"H5-17","q":"依銀行法第38 條規定，除對於無自用住宅者購買自用住宅之放款外，銀行對購買或建造住宅使用的建築物，辦理中、長期借款時，最長期限不得超過幾年？","o":["20 年","25 年","30 年","40 年"],"a":2,"e":"答案(C)。銀行法第38條：銀行對購買或建造住宅或企業用建築，得辦理中、長期放款，其最長期限不得超過30年；但對於無自用住宅者購買自用住宅之放款，不在此限。","c":5,"f":2,"ap":["H5-17","E10-18"]},{"i":"H5-18","q":"有關台灣之消費性貸款，下列何者錯誤？","o":["銀行得要求自用住宅放款及消費性放款之借款人提供連帶保證人","借款人已取得足額擔保時，不得要求提供擔保人","辦理授信徵取的保證人，應以一定金額為限","銀行求償時，先向借款人求償，求償不足部分再向保證人求償"],"a":0,"e":"答案(A)。依銀行法第12條之1，銀行辦理自用住宅放款及消費性放款，不得要求借款人提供連帶保證人，故(A)錯誤。同條亦規定：借款人已提供足額擔保者不得要求提供保證人；徵取保證人應以一定金額為限；求償時應先向借款人求償，不足部分再向保證人求償，(B)(C)(D)正確。","c":5,"f":2,"ap":["H5-18","E7-20"]},{"i":"H5-19","q":"消費金融業務的信用評等與風險管理，下列敘述何者錯誤？","o":["銀行與消金客戶發生理賠爭議，會破壞「公平待客」的誠信原則","銀行取得足額擔保時，仍得要求借款人提供「保證人」","銀行辦理「無擔保」授信而徵取的保證人，以「一定保證金額」為限","向保證人求償時，保證人有數人時，各保證人先平均求償"],"a":1,"e":"答案(B)。依銀行法第12條之1，銀行辦理授信時，借款人已提供足額擔保者，不得要求另提供保證人，故(B)錯誤。無擔保授信徵取保證人應以一定金額為限；未來求償應先就借款人求償，不足部分得就各保證人平均求償；理賠爭議有違公平待客原則，(A)(C)(D)正確。","c":5,"f":2,"ap":["H5-19","E15-12"]},{"i":"H5-20","q":"甲以市價新臺幣（以下同）1,000 萬元，向銀行借款800 萬元，若建物之重置成本為500 萬元，則一般而論該建物宜投保火險金額為何？","o":["1,000 萬元","800 萬元","600 萬元","500 萬元"],"a":3,"e":"答案(D)。房貸擔保物投保火險，保險標的是可能毀損的「建物」，保額應以建物的重置成本為準（講義：保額為建物之重置成本），土地不會因火災滅失。故應投保500萬元，而非房屋市價1,000萬元或借款金額800萬元。","c":5,"f":2,"ap":["H5-20","E7-60"]},{"i":"H5-21","q":"有關房屋淨值放款的特性，下列何者錯誤？","o":["求償權居於第二順位","有時稱為二胎房貸，還款方式不屬於「封閉式信用貸款」","以房屋市場價值而非房屋淨值，當作抵押品","房屋淨值是由房屋市場價值與第一順位抵押借款餘額相減而得"],"a":2,"e":"答案(C)。房屋淨值放款是以「房屋淨值」（房屋市場價值－第一順位抵押借款餘額）作為擔保，而非以房屋市場價值當作抵押品，故(C)錯誤。其求償權居第二順位、俗稱二胎房貸，屬可循環動用之開放式貸款（不屬封閉式信用貸款），(A)(B)(D)正確。","c":5,"f":2,"ap":["H5-21","E20-13"]},{"i":"H5-22","q":"有關房屋淨值放款，下列敘述何者錯誤？","o":["所謂房屋淨值係以其公告地價扣除第一順位抵押借款之餘額","實務上第二順位貸款的還款期間應比第一順位短","借款人還清部分房貸後，可申請增加額度","第二順位抵押貸款之信用風險貼水(Premium)會高於第一順位抵押貸款"],"a":0,"e":"答案(A)。房屋淨值 = 房屋「市場價值」－第一順位抵押借款餘額，並非以公告地價扣除，故(A)錯誤。實務上二順位貸款還款期間應比第一順位短；借款人還清部分房貸後可申請增加額度；二順位求償順位較後，信用風險貼水高於一順位，(B)(C)(D)正確。","c":5,"f":2,"ap":["H5-22","E11-14"]},{"i":"H5-23","q":"關於房屋淨值放款，下列敘述何者錯誤？","o":["有時稱為二胎房貸，還款方式不屬於「封閉式信用貸款」","求償權居於第二順位","以房屋市場價值而非房屋淨值，當作抵押品","房屋淨值是由房屋市場價值與第一順位抵押借款餘額相減而得"],"a":2,"e":"答案(C)。房屋淨值放款以房屋淨值（市場價值－第一順位抵押借款餘額）而非房屋市場價值作為抵押品，故(C)錯誤。其又稱二胎房貸、屬開放式（可循環）貸款、求償權居第二順位，(A)(B)(D)正確。","c":5,"f":2,"ap":["H5-23","E12-13"]},{"i":"H5-24","q":"張先生以市價1,200萬的房屋向A銀行貸款，A銀行核予之貸放成數為75%後，張先生再向T銀行申請二胎房貸，T銀行依其風險容忍度以第一順位質權設定金額的15%核予張先生二胎房貸，請問張先生可由A銀行及T銀行獲得的總貸款金額為多少？（依一般實務慣例，第一順位銀行通常會以貸放金額的1.2倍設定質權）","o":["960 萬","1,062 萬","1,080 萬","1,200 萬"],"a":1,"e":"答案(B)。A銀行可貸金額 = 1,200萬 × 75% = 900萬；第一順位質權設定 = 900萬 × 1.2 = 1,080萬；T銀行二胎房貸 = 1,080萬 × 15% = 162萬。總貸款金額 = 900萬 + 162萬 = 1,062萬元。","c":5,"f":2,"ap":["H5-24","E14-48"],"n":"A 銀行可貸金額：1200 萬*75% = 900 萬 A 銀行第一順位質權設定：可貸金額(900 萬)*1.2 = 1080 萬 T 銀行風險容忍度：第一順位質權設定(1080 萬)*15% = 162 萬 可由A 銀行及T 銀行獲得的總貸款金額：900 萬+ 162 萬= Ans"},{"i":"H5-25","q":"某甲的房屋市值1,600萬元，乙銀行對於房屋第一順位抵押貸款的可貸金額為房屋市值的75%，並按照第一順位可貸金額的1.2倍設定質權；另丙銀行對於房屋第二順位抵押貸款的可貸金額為第一順位質權設定金額的20%。若某甲以其房屋依序向乙銀行與丙銀行貸滿第一順位與第二順位的抵押貸款，請問某甲的房屋淨值還剩多少金額？","o":["112萬元","128萬元","144萬元","160萬元"],"a":0,"e":"答案(A)。乙銀行可貸金額 = 1,600萬 × 75% = 1,200萬；第一順位質權設定 = 1,200萬 × 1.2 = 1,440萬；丙銀行二順位可貸 = 1,440萬 × 20% = 288萬。房屋淨值剩餘 = 1,600萬 − 1,200萬 − 288萬 = 112萬元。","c":5,"f":3,"ap":["H5-25","E15-48","E22-48"],"n":"乙銀行可貸金額：1600 萬*75% = 1200 萬 乙銀行第一順位質權設定：可貸金額(1600 萬*75%)*1.2 = 1440 萬 丙銀行可貸金額：第一順位質權設定(1440萬)*20% = 288萬 甲房屋淨值：房屋市值1600萬–1200萬–288萬 = Ans"},{"i":"H5-26","q":"假設「幸福滿屋」之目前房屋市場價值為1,000 萬元，已向甲銀行貸款700 萬元，甲銀行乃該屋之第一胎房貸銀行，並設定該屋之可貸金額為房屋價值的75%，依可貸金額的1.2 倍設定質權。若「幸福滿屋」屋主向乙銀行提出二胎房貸申請，若乙銀行對風險容忍程度在第一順位質權設定的20%，請問「幸福滿屋」可向乙銀行申請之二胎房貸金額上限為多少？","o":["700 萬元","900 萬元","200 萬元","180 萬元"],"a":3,"e":"答案(D)。甲銀行可貸金額 = 1,000萬 × 75% = 750萬；第一順位質權設定 = 750萬 × 1.2 = 900萬；乙銀行二胎房貸上限 = 900萬 × 20% = 180萬元。注意二胎上限是以質權設定金額（非實際借款700萬）為計算基礎。","c":5,"f":2,"ap":["H5-26","E7-45"],"n":"甲銀行第一順位質權設定：可貸金額(1000 萬*75%)*1.2 = 900 萬 乙銀行風險容忍度：第一順位質權設定(900 萬)*20% = Ans"},{"i":"H5-27","q":"假設「幸福滿屋」目前房屋的市場價值為1,000 萬元，已向甲銀行貸款700 萬元，甲銀行為該屋之第一胎房貸銀行，設定該屋之可貸金額為房屋價值的75%，並依可貸金額的1.2 倍設定質權。若「幸福滿屋」屋主向乙銀行提出二胎房貸申請，若乙銀行的風險容忍程度為第一順位質權設定的20%。若「幸福滿屋」依乙銀行對該屋之二胎房貸上限金額進行全額貸款後，請問該屋剩下多少淨值？","o":["300 萬元","250 萬元","120 萬元","70 萬元"],"a":2,"e":"答案(C)。第一順位質權設定 = 1,000萬 × 75% × 1.2 = 900萬；乙銀行二胎上限 = 900萬 × 20% = 180萬。實際總借款 = 甲銀行700萬 + 乙銀行180萬 = 880萬，剩餘淨值 = 1,000萬 − 880萬 = 120萬元。","c":5,"f":2,"ap":["H5-27","E8-45"],"n":"甲銀行第一順位質權設定：可貸金額(1000 萬*75%)*1.2 = 900 萬 乙銀行風險容忍度：第一順位質權設定(900 萬)*20% = 180 萬 已向甲銀行貸款700 萬+乙銀行貸款上限180 萬=共貸880 萬 該屋剩餘淨值：市場價值1000 萬 – 貸款880 萬 = Ans"},{"i":"H5-28","q":"假設「幸福滿屋」之目前房屋市場價值為2,000 萬元，已向甲銀行貸款1,500 萬元，甲銀行乃該屋之第一胎房貸銀行，並設定該屋之可貸金額為房屋價值的75%，並依可貸金額的1.2倍設定質權。若「幸福滿屋」屋主向乙銀行提出二胎房貸申請，若乙銀行對風險容忍程度在第一順位質權設定的20%。若「幸福滿屋」依乙銀行對該屋之二胎房貸上限金額進行全額貸款後，請問該屋之淨值剩下多少？","o":["300 萬元","250 萬元","140 萬元","70 萬元"],"a":2,"e":"答案(C)。第一順位質權設定 = 2,000萬 × 75% × 1.2 = 1,800萬；乙銀行二胎上限 = 1,800萬 × 20% = 360萬。實際總借款 = 甲銀行1,500萬 + 乙銀行360萬 = 1,860萬，剩餘淨值 = 2,000萬 − 1,860萬 = 140萬元。","c":5,"f":2,"ap":["H5-28","E10-45"]},{"i":"H5-29","q":"甲向A 銀行申請房屋修繕貸款新臺幣（以下同）200 萬元，並議定第一年按基準利率加五碼計息，第二年以後加碼幅度提高為六碼，假設A 銀行基準利率第一、二年均為1.5%，則甲第二年之利率為多少？","o":["3%","2.75%","1.75%","3.25%"],"a":0,"e":"答案(A)。1碼 = 0.25%，第二年加碼六碼 = 6 × 0.25% = 1.5%。第二年利率 = 基準利率1.5% + 1.5% = 3%。(B)2.75%是誤用五碼（1.5%+1.25%）的結果。","c":5,"f":2,"ap":["H5-29","E7-59"],"n":"1 碼 = 0.25%，第二年利率=基準利率1.5% + 加碼6 碼(6*0.25%=1.5%) = Ans"},{"i":"H5-30","q":"銀行通常從業務管理與風險管理兩方向訂定所需指標，以管理與監督市場風險之變化，下列敘述何者錯誤？","o":["以輕微壓力與嚴重壓力情境進行壓力測試，屬於風險管理指標","投資部位之停損限額，以單筆持有金額一定比率為門檻，屬於業務管理指標","市場風險之部位概況為一種風險管理指標","掛帳在銀行簿之金融商品，設定最大可能損失或風險容忍度，屬於業務管理指標"],"a":3,"e":"答案(D)。對銀行簿金融商品設定「最大可能損失或風險容忍度」，屬風險管理指標，而非業務管理指標，故(D)錯誤。壓力測試（輕微與嚴重壓力情境）與市場風險部位概況屬風險管理指標；以單筆持有金額一定比率設定停損限額屬業務管理指標，(A)(B)(C)正確。","c":5,"f":3,"ap":["H5-30","E15-58","E20-33"],"n":"設定最大可能損失或風險容忍度屬於風險管理。"},{"i":"H5-31","q":"仁愛銀行辦理信用卡業務時，每名好客戶平均每年創造1,050 元利潤，又知該銀行的再投資報酬率為5%，過去與這類好客戶平均維持3 年的往來，請問該銀行延攬一名好客戶可為其創造多少利潤？","o":["2,659 元","2,759 元","2,859 元","2,959 元"],"a":2,"e":"答案(C)。好客戶的價值為未來3年利潤以再投資報酬率5%折現的現值：1,050/1.05 + 1,050/1.05² + 1,050/1.05³ = 1,000 + 952.38 + 907.03 ≈ 2,859元。","c":5,"f":4,"ap":["H5-31","E9-59","E15-13","E20-48"],"n":"[1050/(1+5%)]+[1050/(1+5%)²]+[1050/(1+5%)³] = 1000+952+907 = Ans"},{"i":"H5-32","q":"銀行辦理信用卡業務之收入來源，包括下列哪些？A.利息收入 B.手續費收入 C.向特約商店收取之折扣費用 D.信託費收入","o":["僅B","僅A、C","僅A、B、C","A、B、C、D"],"a":2,"e":"答案(C)。發卡銀行信用卡業務的三大收入來源為：利息收入（循環信用、預借現金）、手續費收入（年費、預借現金手續費等）、向特約商店收取的折扣費用（商店手續費）。信託費收入屬信託業務，不屬信用卡收入，故選僅A、B、C。","c":5,"f":3,"ap":["H5-32","E6-20","E10-21"]},{"i":"H5-33","q":"發卡銀行辦理信用卡業務，主要有三種收入來源，不包含下列何者？","o":["利息收入","國外刷卡之匯差收入","手續費收入","向特約商店收取折扣費用"],"a":1,"e":"答案(B)。發卡銀行信用卡業務三種主要收入來源為利息收入、手續費收入及向特約商店收取的折扣費用；「國外刷卡之匯差收入」不在三大收入來源之列。","c":5,"f":2,"ap":["H5-33","E7-21"]},{"i":"H5-34","q":"有關信用卡業務，下列敘述何者錯誤？","o":["特約商店係指接收持卡人刷卡消費並簽帳的商店","所有發卡機構均從事代理收付持卡人在特約商店刷卡產生之帳款","正卡申請人應年滿18 歲，並檢附身分證明及還款能力相關資料","國外交易需經由國際清算組織，居間提供發卡機構和收單機構雙方的授權和清算服務"],"a":1,"e":"答案(B)。代理收付特約商店刷卡帳款是「收單業務」，並非所有發卡機構都從事收單業務（發卡與收單為不同業務，可分屬不同機構），故(B)錯誤。特約商店為接受持卡人刷卡之商店；正卡申請人應年滿18歲並檢附身分證明及還款能力資料；國外交易須經國際清算組織提供授權與清算，(A)(C)(D)正確。","c":5,"f":1,"ap":["H5-34"]},{"i":"H5-35","q":"有關信用卡收單機構的收單業務，下列敘述何者正確？","o":["製作新卡、掛失補發與換發到期新卡","辦理持卡人逾期帳款的催繳","代理收付在特約商店簽卡消費的帳款","招募發卡機構成為會員，提供授權與清算之網路服務"],"a":2,"e":"答案(C)。收單業務包括簽訂特約商店及代理收付特約商店信用卡消費帳款，故(C)正確。製作新卡、掛失補發及換發新卡(A)、逾期帳款催繳(B)屬發卡業務；招募發卡機構為會員、提供授權與清算網路(D)是國際信用卡組織（如VISA、Mastercard）的功能。","c":5,"f":2,"ap":["H5-35","E18-13"]},{"i":"H5-36","q":"有關信用卡業務的管理，下列敘述何者錯誤？","o":["發卡銀行核發的信用卡，包括正卡及附卡","發卡銀行的「入帳」扣款日，通常是特約商店辦理請款的收款日","持卡人在銀行扣款日只繳「最低應繳金額」時，須按「刷卡金額」計算利息費用","針對持卡人的利息費用，銀行從「扣款日」的未還清金額起算"],"a":2,"e":"答案(C)。持卡人只繳「最低應繳金額」時，循環利息是按「剩餘未還款項」計算，而非按全部刷卡金額計算，故(C)錯誤。信用卡包括正卡及附卡；入帳扣款日通常是特約商店請款的收款日；利息從扣款（入帳）日就未還清金額起算，(A)(B)(D)正確。","c":5,"f":3,"ap":["H5-36","E13-48","E23-13"],"n":"只繳「最低應繳金額」時，須按「剩餘未還款項」計算利息費用。"},{"i":"H6-1","q":"健全的信用評分制度，應具備下列哪些特質？ A.能降低信用損失 B.了解顧客之人口統計特質 C.增進處理效率 D.可隨時檢視信用評分標準與授信準則是否適當","o":["僅A、B","僅A、B、C","僅A、B、D","A、B、C、D"],"a":3,"e":"答案(D)。健全的信用評分制度應能：降低信用損失（篩除高風險客戶）、了解顧客之人口統計特質、以標準化系統增進處理效率，並可隨時檢視信用評分標準與授信準則是否適當。四項皆屬應具備之特質。","c":6,"f":2,"ap":["H6-1","E9-45"]},{"i":"H6-2","q":"下列關於公司債之敘述，何者正確？","o":["同一發行機構的短期債券評等與長期債券評等並無絕對關係","同一發行機構的短期債券評等較高，則長期債券評等較高","同一發行機構的長期債券評等較高，則短期債券評等較高","公司長期債券評等最重要的因素是，對該公司流動能力優劣的評估"],"a":0,"e":"答案(A)。同一發行機構的短期債券評等著重短期流動性，長期債券評等著重長期償債與付息能力，兩者評估重點不同，並無絕對對應關係，故(A)正確、(B)(C)錯誤。依講義，Moody's評估公司債等級最重要的量化指標為利息保障倍數（次要指標為長期償債能力），而非流動能力，(D)錯誤。","c":6,"f":2,"ap":["H6-2","E8-6"]},{"i":"H6-3","q":"有關信用等級的移轉矩陣，下列敘述何項較不符合此理論？","o":["違約機率越高，信用風險越大，信用等級即越差","信用風險越低時，信用等級加碼宜越少","年初屬於某種等級，年底維持在原來等級，以及移轉至其他等級的機率，相加以後總和為1","常理上，信用等級越佳企業，年底仍在原來等級的比率越低"],"a":3,"e":"答案(D)。信用等級越佳的企業體質越穩定，年底仍維持在原等級的機率通常「越高」，而非越低，故(D)不符理論。違約機率越高信用等級越差、信用風險越低加碼越少、各列移轉機率合計為1，(A)(B)(C)均符合移轉矩陣理論。","c":6,"f":2,"ap":["H6-3","E10-46"]},{"i":"H6-4","q":"下列何者非屬國內信用評等或評分機構？","o":["中華信用評等公司","台灣經濟新報","惠譽公司","金融聯合徵信中心"],"a":2,"e":"答案(C)。國內信用評等或評分機構包括中華信用評等公司、台灣經濟新報(TEJ)及金融聯合徵信中心(JCIC)；惠譽(Fitch)與標準普爾、穆迪同屬國際三大信評機構，非國內機構。","c":6,"f":3,"ap":["H6-4","E17-50","E23-14"]},{"i":"H6-5","q":"借款客戶與所有往來銀行的融資額度與未還清餘額、有否退票、逾期及呆帳等不良紀錄，可在下列何機構取得資訊？","o":["聯合信用卡處理中心","金融聯合徵信中心","財金資訊股份有限公司","臺灣票據交換所"],"a":1,"e":"答案(B)。金融聯合徵信中心(JCIC)彙整各金融機構的授信資料，可查詢借款人在所有往來銀行的融資額度、未還清餘額，以及退票、逾期、呆帳等不良紀錄。聯合信用卡處理中心辦理刷卡收單清算、財金公司負責跨行資訊網路、票據交換所辦理票據交換。","c":6,"f":2,"ap":["H6-5","E18-15"]},{"i":"H6-6","q":"本國銀行篩選與陸資銀行業務往來之信用等級標準，主要為下列何者？","o":["中華信用評等機構給予的信用等級在A 等級以上","中華信用評等機構給予的信用等級在BBB 等級以上","S&P、Moody’s 及Fitch 信用評等機構給予的信用等級在A 等級以上","S&P、Moody’s 及Fitch 信用評等機構給予的信用等級在BBB 等級以上"],"a":3,"e":"答案(D)。依講義，本國銀行篩選與陸資銀行業務往來的信用等級標準，是以國際信評機構S&P、Moody's及Fitch給予的信用等級在BBB等級（投資等級）以上為主，而非以國內中華信評的等級為準。","c":6,"f":2,"ap":["H6-6","E8-7"]},{"i":"H6-7","q":"企業想在國外發行普通公司債、轉換公司債與存託憑證，適宜接觸何種信用評等機構？","o":["Joint Credit Information Center；JCIC","Taiwan Ratings Corp.；TRC","Moody’s","Taiwan Economic Journal；TEJ"],"a":2,"e":"答案(C)。企業赴國外發行普通公司債、轉換公司債或存託憑證，面對國際投資人，應取得國際信評機構（如Moody's、S&P、Fitch）的評等。JCIC（聯徵中心）、TRC（中華信評）、TEJ（台灣經濟新報）均為國內機構。","c":6,"f":2,"ap":["H6-7","E12-14"]},{"i":"H6-8","q":"信用評等機構定期發布的信用等級，下列何項不符合銀行的管理用途？","o":["屬於外部評等","評等資訊有助於篩選外國金融同業","承作國外聯貸案件時，有助於認識借款客戶的信用體質","評等資訊無法提供海外債票券「附買回」或「附賣回」交易對象的篩選"],"a":3,"e":"答案(D)。信評機構發布的等級屬外部評等，可協助銀行篩選外國金融同業、了解國外聯貸借款人的信用體質，也「可以」用來篩選海外債票券附買回或附賣回交易的交易對手，故(D)說「無法提供」不符銀行管理用途。","c":6,"f":2,"ap":["H6-8","E13-50"]},{"i":"H6-9","q":"國際信評機構的評等收費不低，所以借款企業在籌措哪種資金，通常不會申請受評？","o":["在日本發行普通公司債","在英國發行轉換公司債","發行美國存託憑證","向本國銀行融資借款"],"a":3,"e":"答案(D)。國際信評收費高，企業通常在國際資本市場籌資（如在日本發行普通公司債、在英國發行轉換公司債、發行美國存託憑證）時才申請受評，以取信國際投資人；向本國銀行融資借款由銀行自行徵信評等，通常不會申請國際信評。","c":6,"f":2,"ap":["H6-9","E16-15"]},{"i":"H6-10","q":"Moody’s 信評公司衡量受評公司信用風險之方法架構，係為下列何者？","o":["由上而下涵蓋國家風險、產業風險和企業風險","由上而下涵蓋法令遵循、產業風險和企業風險","由下而上涵蓋企業風險、產業風險和外匯風險","由下而上涵蓋企業風險、法令遵循和國家風險"],"a":0,"e":"答案(A)。Moody's衡量受評公司信用風險採「由上而下」(Top-Down)的架構，依序涵蓋國家風險、產業風險和企業風險。法令遵循、外匯風險並非其架構層次，且方向是由上而下而非由下而上。","c":6,"f":2,"ap":["H6-10","E9-23"]},{"i":"H6-11","q":"Moody’s 採取由上而下(Top-Down)的評估方式，檢視受評公司的風險等級。所謂由上而下的評估方式，係指下列何者？","o":["由Aaa 信用等級至C 信用等級","風險層次由國家風險至產業風險，終至企業風險","上自總經理下至各執行部門，逐一檢視各單位風險狀況","由該公司所處產業之營運優劣排序，決定該公司之暴險等級"],"a":1,"e":"答案(B)。Moody's由上而下的評估方式，是指風險層次由總體的國家風險，到產業風險，最後才是個別企業風險。並非指信用等級排列(A)、公司內部組織層級(C)或產業排序(D)。","c":6,"f":2,"ap":["H6-11","E11-16"]},{"i":"H6-12","q":"有關Moody’s 對公司債等級的定量分析，下列何者屬於該定量分析最重要的指標？","o":["短期償債能力","長期償債能力","利息保障倍數","經營效能"],"a":2,"e":"答案(C)。Moody's對公司債等級的定量分析中，主要（最重要）指標為「利息保障倍數」；次要指標為長期償債能力（判斷公司是否舉債過多）。","c":6,"f":2,"ap":["H6-12","E7-39"]},{"i":"H6-13","q":"有關Moody’s 對公司債等級的定量分析，下列敘述何者正確？A.主要指標為利息保障倍數 B.主要指標為經營效能 C.次要指標為短期償債能力，財務指標是負債比率與財務槓桿比率 D.次要指標為長期償債能力，用以判斷公司是否舉債過多","o":["僅AC","僅BC","僅AD","僅CD"],"a":2,"e":"答案(C)。Moody's定量分析：主要指標為利息保障倍數(A正確)；次要指標為「長期償債能力」，用以判斷公司是否舉債過多(D正確)。B錯誤（經營效能非主要指標）；C錯誤，負債比率與財務槓桿比率衡量的是長期償債能力，不是短期償債能力。故選僅AD。","c":6,"f":3,"ap":["H6-13","E12-50","E20-50"]},{"i":"H6-14","q":"有關Moody's信評機構對公司債定量分析之敘述，下列何者錯誤？","o":["主要指標是利息保障倍數","流動與速動比率：比率值愈高，財務風險愈大","負債比率：比率值愈高，財務風險愈大","財務槓桿比率：比率值愈高，長期償債能力愈差"],"a":1,"e":"答案(B)。流動比率與速動比率衡量短期償債能力，比率愈高表示短期償債能力愈強、財務風險愈「小」，(B)說愈大，故錯誤。主要指標為利息保障倍數；負債比率愈高財務風險愈大；財務槓桿比率愈高長期償債能力愈差，(A)(C)(D)正確。","c":6,"f":2,"ap":["H6-14","E14-50"]},{"i":"H6-15","q":"有關信評機構之評估過程，針對受評公司之財務分析的評定敘述，下列何者錯誤？","o":["財務分析即財務風險分析","獲利能力與盈餘保障，反映還款的市場風險","利息保障倍數強調利息費用愈低，越有保障","固定費用的財務保障倍數係衡量公司的成本負擔能力"],"a":1,"e":"答案(B)。獲利能力與盈餘保障反映受評公司的還款能力，即「信用風險」：獲利越好越有能力還款、信用風險越低，並非反映市場風險，故(B)錯誤。財務分析即財務風險分析；利息保障倍數顯示利息費用愈低愈有保障；固定費用保障倍數衡量成本負擔能力，(A)(C)(D)正確。","c":6,"f":3,"ap":["H6-15","E15-50","E21-38"],"n":"通常獲利能力越好，越有可能還錢，信用風險越低。"},{"i":"H6-16","q":"有關受評公司資本結構之長期償債能力，下列何者不宜當作主要衡量指標？","o":["長短期借款／總資產","（長短期借款+或有負債)／（長短期借款+或有負債+股東權益）","資產重估增值（不包括無形資產）","比率值愈小，財務風險愈低"],"a":2,"e":"答案(C)。衡量資本結構長期償債能力（是否舉債過多）的指標，如長短期借款／總資產、（長短期借款＋或有負債）／（長短期借款＋或有負債＋股東權益），比率值愈小財務風險愈低。資產重估增值無法判斷舉債是否過多，不宜當作主要衡量指標。","c":6,"f":2,"ap":["H6-16","E14-49"],"n":"資產重估增值較無法判斷是否舉債過多。"},{"i":"H6-17","q":"Moody’s 信評公司將短期別債券之信用等級分為Prime-1、Prime-2、Prime-3 以及Not-Prime。請問其中Not-Prime 類似於長期債券何項信用等級以下？","o":["Aa1","A1","Baa1","Ba1"],"a":3,"e":"答案(D)。Moody's短期債券評等分為Prime-1、Prime-2、Prime-3及Not-Prime，前三者屬投資等級；Not-Prime相當於長期債券Ba1（非投資等級）以下。","c":6,"f":3,"ap":["H6-17","E9-22","E15-14"]},{"i":"H6-18","q":"依據穆迪信評公司之定義，下列何種等級（含）以上可視為投資等級？","o":["Aaa","A","Baa","Caa"],"a":2,"e":"答案(C)。Moody's長期評等中，Aaa、Aa、A、Baa屬投資等級，Ba以下為非投資（投機）等級。因此Baa（含）以上可視為投資等級。","c":6,"f":3,"ap":["H6-18","E5-22","E16-14"]},{"i":"H6-19","q":"有關標準普爾公司的信用評等制度，下列敘述何者錯誤？","o":["分為長期及短期兩種評等類別","信用等級分為投資級和投機級兩類","不考慮產業和規模差異，實證模型統一適用「一般產業」的評等","同一等級中附加的符號「－」，表示其屬於該信用等級品質最差之類別"],"a":2,"e":"答案(C)。S&P評等會考量不同產業與企業規模的差異，依產業特性採用不同的評估標準，並非不分產業統一適用「一般產業」模型，故(C)錯誤。S&P分長期與短期評等、信用等級分投資級與投機級，等級後附加「－」表示該等級中品質最差者，(A)(B)(D)正確。","c":6,"f":2,"ap":["H6-19","E21-15"]},{"i":"H6-20","q":"有關標準普爾信用評等制度，下列敘述何者錯誤？","o":["查看受評公司之會計師簽證意見，評估會計品質","僅考慮當期經濟環境和競爭型態，推測受評公司之信用程度","受評公司缺乏明確成長目標與機會時，會暴露潛在的經營危機","貸款合約的限制條款是否合理，會影響受評公司之財務彈性"],"a":1,"e":"答案(B)。S&P評等除當期經濟環境與競爭型態外，也會考量未來的產業前景、成長機會與經營策略來推估受評公司信用，並非「僅考慮當期」，故(B)錯誤。會計師簽證意見評估會計品質、缺乏成長目標暴露經營危機、貸款合約限制條款影響財務彈性，(A)(C)(D)正確。","c":6,"f":4,"ap":["H6-20","E5-9","E7-28","E9-24"]},{"i":"H6-21","q":"依據標準普爾信評公司之評等架構，下列哪些因子會影響營運風險之規模？A.產業發展前景 B.產品分散程度 C.市場競爭地位 D.管理階層的領導能力","o":["僅A","僅B、C","僅A、B、C","A、B、C、D"],"a":3,"e":"答案(D)。依S&P評等架構，影響營運（業務）風險規模的因子包括：產業發展前景、產品分散程度、市場競爭地位，以及管理階層的領導能力，四項皆屬之。","c":6,"f":4,"ap":["H6-21","E3-18","E10-24","E14-14"]},{"i":"H6-22","q":"依據標準普爾信用評等機構之觀點，下列哪些指標可以衡量受評公司之現金流量是否足夠？A.營業利益／營業收入 B.長短期借款／總資產C.（正常營業活動的現金流量＋利息費用）／利息費用 D.借款的還本期限","o":["僅CD","僅AD","僅BCD","ABCD"],"a":0,"e":"答案(A)。S&P衡量現金流量是否足夠的指標包括：（正常營業活動現金流量＋利息費用）／利息費用(C)，以及借款的還本期限(D)。營業利益／營業收入(A)屬獲利能力指標；長短期借款／總資產(B)屬資本結構（長期償債能力）指標。故選僅CD。","c":6,"f":2,"ap":["H6-22","E12-49"]},{"i":"H6-23","q":"有關Standard & Poor 信用評等機構的敘述，下列何項內容不適當？","o":["評等過程包括業務及財務兩種層面作分析","定義「自由現金流量」為正常營業活動的現金流量，減去投資總額","將債務憑證等級為AAA 到CCC 者，按品質差異細分相同等級為3 級","將信用等級分為投資級和投機級兩大類別"],"a":2,"e":"答案(C)。S&P是將「AA到CCC」等級以「＋」「－」按品質差異細分為3級，AAA為最高等級不再細分，故(C)說AAA到CCC不適當。評等包括業務及財務分析、自由現金流量定義為營業活動現金流量減投資總額、等級分投資級與投機級，(A)(B)(D)正確。","c":6,"f":3,"ap":["H6-23","E16-49","E23-50"],"n":"AA 到CCC 按品質差異細分相同等級為3 級。"},{"i":"H6-24","q":"根據國際信用評等機構Standard & Poor’s的信用等級分類，下列何者信用等級最佳？","o":["AAA","AA+","A+","BBB"],"a":0,"e":"答案(A)。S&P長期信用等級由高至低為AAA、AA（AA+、AA、AA-）、A、BBB、BB、B、CCC、CC、C、D。AAA為最高等級，優於AA+、A+與BBB。","c":6,"f":2,"ap":["H6-24","E18-14"]},{"i":"H6-25","q":"根據國際信用評等機構Standard & Poor’s的信用等級分類，下列何項長期別債券的信用等級最差？","o":["B","CCC","CC","C"],"a":3,"e":"答案(D)。S&P長期債券等級排序為B > CCC > CC > C，其中C為「風險極高」等級，是選項中最差者（再下即為違約等級D/SD）。","c":6,"f":3,"ap":["H6-25","E11-15","E19-14"]},{"i":"H6-26","q":"根據國際信用評等機構Standard & Poor’s的信用等級分類，下列何項債券信用等級最差？","o":["CCC","C+","C-","D"],"a":3,"e":"答案(D)。S&P等級中「D」代表已違約，為最差等級，低於CCC與C。且S&P只對AA至CCC加「＋」「－」，並無C+、C-之等級。","c":6,"f":2,"ap":["H6-26","E7-26"]},{"i":"H6-27","q":"根據國際信用評等機構 Standard & Poor’s 的信用等級分類，下列何者屬於「投資等級」債券？","o":["BBB＋","BB","B＋","CCC+"],"a":0,"e":"答案(A)。S&P投資等級為BBB-（含）以上，BBB+屬投資等級；BB、B+、CCC+均屬非投資（投機）等級。","c":6,"f":2,"ap":["H6-27","E13-14"]},{"i":"H6-28","q":"依據S&P的國家主權評等，非投資級是指下列何者？","o":["A 等級以下","BBB 等級以下","BB 等級以下","B 等級以下"],"a":2,"e":"答案(C)。S&P投資等級為AAA、AA、A、BBB；非投資級是指「BB等級（含）以下」，即BB、B、CCC、CC、C等。BBB仍屬投資級，故非(B)。","c":6,"f":4,"ap":["H6-28","E2-34","E4-29","E14-21"],"n":"BB 等級以下：代表包含BB 級以下的皆為非投資級。"},{"i":"H6-29","q":"依據標準普爾信評公司(S&P)之國家主權評等，下列哪些評級屬於非投資等級？ (A) C 級 (B) B 級 (C) BB 級 (D) BBB 級","o":["僅(A)","僅(A)(B)(C)","僅(A)(B)(D)","(A)(B)(C)(D)"],"a":1,"e":"答案(B)。S&P非投資等級為BB（含）以下，故C級、B級、BB級皆屬非投資等級；BBB級屬投資等級（最低一級投資級）。所以選僅(A)(B)(C)。","c":6,"f":1,"ap":["H6-29"]},{"i":"H7-1","q":"風險趨避(Risk Averse)的債權銀行，哪項內容不符管理理念？","o":["面對信用等級越佳客戶，給予越高風險限額","期待利息利潤越多越好，但利潤增加到某種程度後，滿足的效用呈現遞減","面對信用等級越佳客戶，儘管能夠賺取可觀利息利潤，也不願提高風險限額","屬於理性的授信行為"],"a":2,"e":"答案(C)。風險趨避的銀行雖追求利潤，但利潤增加到一定程度後邊際效用遞減，屬理性授信行為；對信用等級越佳（風險越低）的客戶，理應給予越高的風險限額。(C)說對優良客戶即使能賺取可觀利潤也不願提高限額，不符理性的風險趨避管理理念。","c":7,"f":2,"ap":["H7-1","E13-18"]},{"i":"H7-2","q":"授信資產的配置，重視「報酬率與風險」構成的效率原則，下列哪項內容符合該原則？","o":["追求短期平均成本最低","追求長期生產成本最低","承擔高風險時，要求對應產生高報酬","低風險時，仍要追求高報酬"],"a":2,"e":"答案(C)。授信資產配置的效率原則是「報酬率與風險」相對應：承擔較高風險時，應要求相對較高的報酬（風險貼水）。(A)(B)屬成本面概念，與風險報酬無關；(D)低風險仍追求高報酬違反風險與報酬對稱原則。","c":7,"f":2,"ap":["H7-2","E14-18"]},{"i":"H7-3","q":"根據銀行法及金融控股公司法，銀行對利害關係人之授信風險限額，下列敘述何者正確？","o":["對同一授信客戶之每筆或累計擔保授信金額達新台幣1 億元以上或淨值1%者，其條件不得優於其他同類授信對象","對同一授信客戶之每筆或累計擔保授信金額達新台幣2億元以上或淨值2%者，其條件不得優於其他同類授信對象","對同一授信客戶之每筆或累計擔保授信金額達新台幣3 億元以上或淨值3%者，其條件不得優於其他同類授信對象","對同一授信客戶之每筆或累計擔保授信金額達新台幣4 億元以上或淨值4%者，其條件不得優於其他同類授信對象"],"a":0,"e":"答案(A)。依銀行法第33條，銀行對其持有實收資本總額5%以上之企業、本行負責人、職員、主要股東或與其有利害關係者為擔保授信，應有十足擔保，且條件不得優於其他同類授信對象；對同一授信客戶每筆或累計擔保授信金額達新臺幣1億元以上或銀行淨值1%（二者孰低）者，並應經董事會三分之二以上董事出席、出席董事四分之三以上同意。講義即以「1億元或淨值1%」為利害關係人授信的限額門檻，(B)(C)(D)的2億/2%、3億/3%、4億/4%都不是法定金額。","c":7,"f":3,"ap":["H7-3","E6-50","E9-26"]},{"i":"H7-4","q":"有關銀行法對「利害關係人」之規範，下列敘述何者錯誤？","o":["對本行負責人、職員或主要股東為擔保授信，應有十足擔保","對同一法人之擔保授信總餘額，不得超過銀行淨值10%","對同一自然人之擔保授信總餘額，不得超過銀行淨值2%","對所有利害關係人之擔保授信總餘額，不得超過銀行淨值二倍"],"a":3,"e":"答案(D)。銀行對所有利害關係人之擔保授信總餘額，不得超過銀行淨值的「1.5倍」，而非二倍，故(D)錯誤。對負責人、職員或主要股東為擔保授信應有十足擔保；對同一法人之擔保授信總餘額不得超過淨值10%、同一自然人不得超過淨值2%，(A)(B)(C)正確。","c":7,"f":3,"ap":["H7-4","E6-28","E9-48"]},{"i":"H7-5","q":"銀行依照授信法規，對「所有利害關係人」的擔保授信總餘額，不得超過銀行淨值多少倍數？","o":["1 倍","1.5 倍","2 倍","2.5 倍"],"a":1,"e":"答案(B)。依銀行法第33條授權規定，銀行對所有利害關係人的擔保授信總餘額，不得超過銀行淨值的1.5倍；另對同一法人不得超過淨值10%、同一自然人不得超過淨值2%。","c":7,"f":3,"ap":["H7-5","E14-16","E16-16"]},{"i":"H7-6","q":"有關授信對象「授信總餘額」之敘述，下列何者錯誤？","o":["同一自然人，不得超過銀行淨值3%","同一法人，不得超過銀行淨值20%","同一關係人，不得超過銀行淨值40%","同一關係人無擔保授信，不得超過銀行淨值10%"],"a":1,"e":"答案(B)。依銀行法第33條之3授權規定，對同一法人之授信總餘額不得超過銀行淨值15%（其中無擔保5%），並非20%，故(B)錯誤。同一自然人授信總餘額不得超過淨值3%；同一關係人授信總餘額不得超過淨值40%、其中無擔保授信不得超過10%，(A)(C)(D)正確。","c":7,"f":3,"ap":["H7-6","E15-16","E19-16"]},{"i":"H7-7","q":"根據銀行法，授信業務對同一自然人之風險限額，下列敘述何者正確？","o":["授信總餘額不得超過銀行淨值的3%，其中無擔保授信總餘額不得超過銀行淨值的1%","授信總餘額不得超過銀行淨值的15%，其中無擔保授信總餘額不得超過銀行淨值的5%","授信總餘額不得超過銀行淨值的40%，其中無擔保授信總餘額不得超過銀行淨值的15%","授信總餘額不得超過銀行淨值的45%，其中無擔保授信總餘額不得超過銀行淨值的15%"],"a":0,"e":"答案(A)。銀行對同一自然人之授信總餘額不得超過銀行淨值3%，其中無擔保授信總餘額不得超過淨值1%。(B)15%/5%是同一法人的限額；(C)40%/15%是同一關係企業的限額。","c":7,"f":4,"ap":["H7-7","E1-25","E8-24","E9-25"]},{"i":"H7-8","q":"根據銀行法，授信業務對同一關係企業之風險限額，下列敘述何者正確？","o":["授信總餘額不得超過銀行淨值的3%，其中無擔保授信總餘額不得超過銀行淨值的1%","授信總餘額不得超過銀行淨值的15%，其中無擔保授信總餘額不得超過銀行淨值的5%","授信總餘額不得超過銀行淨值的40%，其中無擔保授信總餘額不得超過銀行淨值的15%","授信總餘額不得超過銀行淨值的45%，其中無擔保授信總餘額不得超過銀行淨值的15%"],"a":2,"e":"答案(C)。銀行對同一關係企業之授信總餘額不得超過銀行淨值40%，其中無擔保授信總餘額不得超過淨值15%。(A)是同一自然人（3%/1%）、(B)是同一法人（15%/5%）的限額。","c":7,"f":5,"ap":["H7-8","E4-26","E8-20","E10-47","E17-17"]},{"i":"H7-9","q":"已知A 銀行之總資產為6,000 億元和淨值為800 億元，下列敘述何者正確？","o":["A 銀行對同一自然人之授信總餘額不得超過30 億元","A 銀行對同一自然人之無擔保授信總餘額不得超過8 億元","A 銀行對同一法人之授信總餘額不得超過100 億元","A 銀行對同一法人之無擔保授信總餘額不得超過80 億元"],"a":1,"e":"答案(B)。授信限額以銀行「淨值」為基準（與總資產無關）。同一自然人無擔保授信上限 = 800億 × 1% = 8億元，(B)正確。(A)同一自然人授信總餘額上限 = 800億 × 3% = 24億（非30億）；(C)同一法人授信總餘額上限 = 800億 × 15% = 120億（非100億）；(D)同一法人無擔保上限 = 800億 × 5% = 40億（非80億）。","c":7,"f":4,"ap":["H7-9","E6-37","E16-19","E20-18"]},{"i":"H7-10","q":"A 銀行民國108 年底淨值為新臺幣（以下同）1,200 億元，109 年1 月對非為利害關係人之同一法人最高授信總餘額不得超過多少？","o":["60 億元","120 億元","180 億元","240 億元"],"a":2,"e":"答案(C)。銀行對非利害關係人之同一法人授信總餘額，不得超過銀行淨值15%（以上年度決算淨值為準）。1,200億元 × 15% = 180億元。","c":7,"f":2,"ap":["H7-10","E11-20"]},{"i":"H7-11","q":"A 銀行依據甲集團企業之信用評等，核定風險限額為新台幣（以下同）100 億元，目前使用率70%，考量其舉債能力變差，調降限額至80 億元，則剩餘可動用額度為多少元？","o":["10 億元","20 億元","30 億元","80 億元"],"a":0,"e":"答案(A)。原限額100億元、使用率70%，表示已動用100億 × 70% = 70億元。調降限額至80億元後，剩餘可動用額度 = 80億 − 70億 = 10億元。","c":7,"f":4,"ap":["H7-11","E1-26","E6-48","E9-47"],"n":"原風險限額100 億，使用70%代表已用70 億，新風險限額80 億，代表剩80-70=10 可動用。"},{"i":"H7-12","q":"金管會依「臺灣地區與大陸地區金融業務往來及投資許可管理辦法」第12 條之1 規定，銀行對中國的國家風險總額度不得超過下列何者？","o":["上年度決算後資本額的1 倍","上年度決算後資本額的1.5 倍","上年度決算後淨值的1 倍","上年度決算後淨值的1.5 倍"],"a":2,"e":"答案(C)。依「臺灣地區與大陸地區金融業務往來及投資許可管理辦法」第12條之1，臺灣地區銀行對大陸地區之授信、投資及資金拆存總額度，不得超過其上年度決算後「淨值」之1倍。","c":7,"f":2,"ap":["H7-12","E9-29"]},{"i":"H7-13","q":"關於授信對象的風險限額，下列敘述何者錯誤？","o":["視借款金額大小，決定是否需經營業主管和徵信審查程序；融資金額低者，不需授信徵審程序","風險限額設定需考慮擔保程度","借戶的融資額度需控管在風險限額範圍內","實務上，風險限額意旨風險權限、授信總餘額和放款額度"],"a":0,"e":"答案(A)。授信案件不論金額大小，都必須經過徵信及授信審查程序，金額大小只影響核決層級（授權權限），並非金額低就不需徵審，故(A)錯誤。風險限額設定需考慮擔保程度、借戶融資額度需控管在限額內、實務上風險限額即風險權限、授信總餘額和放款額度，(B)(C)(D)正確。","c":7,"f":2,"ap":["H7-13","E8-25"]},{"i":"H7-14","q":"有關授信對象的風險限額之敘述，下列何者錯誤？","o":["承作授信額度的上限稱為風險限額","個別戶的所有案件仍受總風險限額規範","風險限額又稱風險權限","傳統方法訂定的放款額度，衡量風險限額時，能快速反映違約風險，實務上優於「信用風險值」的計算"],"a":3,"e":"答案(D)。傳統方法訂定的放款額度（如依淨值比率或財務數據）較靜態，無法快速反映違約風險變化；以「信用風險值」計算風險限額較能反映違約機率等風險因子，實務上更精確，故(D)錯誤。承作授信額度上限稱為風險限額（又稱風險權限），個別戶所有案件仍受總風險限額規範，(A)(B)(C)正確。","c":7,"f":2,"ap":["H7-14","E18-16"]},{"i":"H7-15","q":"銀行在信用風險集中度的授信架構，將授信對象分成哪三種層面做總風險限額的控管？","o":["自然人、法人與集團企業","大型企業、中型企業與小型企業","優等客戶、一般客戶與高風險客戶","客戶、產業與國家別分類"],"a":3,"e":"答案(D)。依講義，信用風險集中度的授信架構，將授信對象依「客戶別、產業別與國家別」三種層面分類，做總風險限額的控管。","c":7,"f":2,"ap":["H7-15","E12-18"]},{"i":"H7-16","q":"有關資產組合之集中性風險管理，下列哪些屬性可以做為限額訂定之依據？A.產業別 B.地區別 C.信用評等之級別 D.產品別","o":["僅A","僅D","僅B、C","A、B、C、D"],"a":3,"e":"答案(D)。資產組合的集中性風險管理，可以產業別、地區別、信用評等級別及產品別等屬性，作為限額訂定的依據，四者皆可。","c":7,"f":3,"ap":["H7-16","E4-28","E9-27"]},{"i":"H7-17","q":"產業風險的涵蓋層面逐步擴大後，該產業風險將成為系統性風險，因此銀行須針對下列何者訂定授信對象之風險限額？","o":["客戶別","系統別","產業別","國家別"],"a":2,"e":"答案(C)。單一產業風險若涵蓋層面擴大，會演變成影響整體的系統性風險，因此銀行須以「產業別」訂定授信對象的風險限額，以避免授信過度集中於特定產業。","c":7,"f":4,"ap":["H7-17","E4-27","E7-29","E10-26"]},{"i":"H7-18","q":"授信業務的集中性風險，主要針對哪種授信特徵而衡量？","o":["關係企業","利害關係人","產業","國家"],"a":2,"e":"答案(C)。依講義，授信業務的集中性風險主要衡量「產業別」的集中程度，銀行制定不同產業的集中性風險限額時，可參考信評機構公布之產業評等。","c":7,"f":2,"ap":["H7-18","E16-18"]},{"i":"H7-19","q":"銀行制定不同產業的集中性風險時，可參考信評機構公布之下列何種評等機制？","o":["債務發行信用評等","發行人信用評等","特殊用途信用評等","產業評等"],"a":3,"e":"答案(D)。銀行制定不同產業的集中性風險（產業別限額）時，可參考信評機構公布的「產業評等」，以判斷各產業風險高低。債務發行評等、發行人評等是針對個別債務或發行人，非產業層面。","c":7,"f":2,"ap":["H7-19","E8-22"]},{"i":"H7-20","q":"基於風險管理需要，本國銀行和陸資銀行之業務往來，下列哪些應設定限額？A.進口融資墊款 B.出口融資墊款 C.資金拆放 D.保兌墊款","o":["A、C","B、C","B、D","A、B、C、D"],"a":3,"e":"答案(D)。基於風險管理需要，本國銀行與陸資銀行間的各項業務往來，包括進口融資墊款、出口融資墊款、資金拆放及保兌墊款等，均會產生對陸資銀行的暴險，皆應設定限額控管。","c":7,"f":2,"ap":["H7-20","E13-51"]},{"i":"H7-21","q":"授信客戶的國家別歸屬，實務上採法定歸屬。假設本國A 銀行之香港分行對位於新加坡之美商B 公司辦理授信，且由B 公司之美國母公司C 提供保證。請問該授信客戶的國家別歸屬應為何國？","o":["臺灣","中國","新加坡","美國"],"a":3,"e":"答案(D)。國家別歸屬採「法定歸屬」，即以最終承擔償還或保證責任者的法定國籍認定（風險移轉）。本案由美國母公司C提供保證，最終風險承擔者在美國，故歸屬為美國，而非授信分行所在地（香港）或借款公司所在地（新加坡）。","c":7,"f":2,"ap":["H7-21","E17-19"]},{"i":"H7-22","q":"銀行根據風險對象所屬國家加以彙總，以了解國家的信用風險集中度，若信用對象登記在開曼群島時，應：","o":["以該信用風險對象之所有人所屬國別認列","將該信用風險彙整入高風險類之其他國別","將該信用對象之國別風險彙整入開曼群島","以該信用風險對象資金主要使用所在地國別認列"],"a":3,"e":"答案(D)。借款人登記在開曼群島等免稅天堂（境外紙上公司，未實際營運），其風險並不在註冊地，故國家風險統計應以該信用風險對象「資金主要使用所在地」的國別認列，而非彙入開曼群島或所有人所屬國。","c":7,"f":2,"ap":["H7-22","E11-18"]},{"i":"H7-23","q":"有關銀行的信用風險集中度，下列敘述何者錯誤？","o":["分成兩大類別，其一是與授信業務有關的信用風險，另一是授信以外業務的信用風險","與授信業務有關的信用風險，又可細分為客戶別、產業別、國家別，相關風險限額係根據交易對手和投資商品作分類","授信以外業務的信用風險，包含持有固定收益證券、權益證券、衍生性商品、存放央行等","強調「累積衝擊」，所以著眼在各種業務暴露多少總信用風險"],"a":1,"e":"答案(B)。與授信業務有關的信用風險，是依客戶別、產業別、國家別建立集中度限額；「根據交易對手和投資商品種類」建立風險限額的是「授信以外」業務，(B)將兩者混淆，故錯誤。信用風險集中度分為授信與授信以外兩大類；授信以外包含固定收益證券、權益證券、衍生性商品、存放央行等；強調累積衝擊，(A)(C)(D)正確。","c":7,"f":2,"ap":["H7-23","E19-51"]},{"i":"H7-24","q":"有關外幣資產組合管理，當投資標的報酬率間之相關係數為多少時，可使投資組合的風險分散至最低？","o":["1","0.5","0","-1"],"a":3,"e":"答案(D)。投資組合中各標的報酬率的相關係數介於−1與＋1之間，相關係數愈低分散效果愈好；相關係數為−1（完全負相關）時，風險可分散至最低（理論上可完全消除）。相關係數為1則完全無分散效果。","c":7,"f":2,"ap":["H7-24","E15-42"]},{"i":"H8-1","q":"國家風險的演進，大致分為三個階段涵蓋三種風險概念，下列哪項內容不符合此風險概念？","o":["匯率風險","國家風險","外匯移轉風險","主權風險"],"a":0,"e":"答案(A)。國家風險的演進分為三個階段，涵蓋國家風險、外匯移轉風險及主權風險三種概念。匯率風險是匯率變動造成的損失，屬「市場風險」，不屬國家風險演進的概念。","c":8,"f":3,"ap":["H8-1","E12-22","E18-20"],"n":"匯率風險屬於市場風險。"},{"i":"H8-2","q":"對國外企業授信時，碰到授信企業的當地政府外匯短缺或政局不穩，突然宣布全面禁止或限制本息匯出，稱為下列何種風險？","o":["產業風險","匯兌風險","國家風險","政治風險"],"a":2,"e":"答案(C)。對國外企業授信時，當地政府因外匯短缺或政局不穩而突然禁止或限制本息匯出，此損失源自國家主權行為，屬「國家風險」。產業風險與企業所屬產業有關；匯兌風險屬市場風險；政治風險僅為國家風險的一部分。本題選項中有「國家風險」時選之。","c":8,"f":2,"ap":["H8-2","E9-28"]},{"i":"H8-3","q":"對於國外企業的授信若是碰到授信企業的當地政府外匯短缺或政局不穩，突然宣布全面禁止或限制本息匯出，此稱為下列何者？","o":["主權風險","匯兌風險","外匯移轉風險","政治風險"],"a":0,"e":"答案(A)。依考古題官方答案，當地政府因外匯短缺或政局不穩，以主權行為突然宣布全面禁止或限制本息匯出，歸類為「主權風險」（政府主權行為造成的風險）。注意：講義第8章第2題為同一題幹，但選項中有「國家風險」，該題答案為國家風險；本題選項沒有國家風險，因此依官方答案選主權風險。匯兌風險屬於市場風險。","c":8,"f":2,"ap":["H8-3","E10-27"],"g":"題幹描述與「外匯移轉風險」概念亦相近，但考古題(第10屆第27題)官方答案為主權風險，依官方答案作答"},{"i":"H8-4","q":"開發中國家致力於國內基礎建設，為籌措建設資金而向國際資本市場大量舉債，但借款國家經濟良窳影響未來的償債能力。銀行稱此風險為下列何者？","o":["主權風險","匯兌風險","外匯移轉風險","政治風險"],"a":0,"e":"答案(A)。開發中國家政府為基礎建設向國際資本市場大量舉債，未來能否償債取決於借款國家的經濟狀況，此為對「政府（主權）」借款的違約風險，稱為主權風險，也是國家風險演進的第三階段概念。","c":8,"f":3,"ap":["H8-4","E16-20","E20-20"]},{"i":"H8-5","q":"關於國家風險與主權風險之敘述，下列何者錯誤？","o":["外幣舉債所屬國發生政治或社會動亂屬於國家風險","外幣舉債所屬國貨幣大幅貶值屬於國家風險","任何企業的信用等級不得高於該國主權評等","外匯管制或短缺的情況屬於國家風險"],"a":2,"e":"答案(C)。「任何企業的信用等級不得高於該國主權評等」是「主權上限」的概念，並非國家風險或主權風險的定義，故(C)錯誤（講義：主權風險不等於主權上限）。外幣舉債所屬國的政治社會動亂、貨幣大幅貶值、外匯管制或短缺，都屬國家風險，(A)(B)(D)正確。","c":8,"f":2,"ap":["H8-5","E6-31"],"n":"主權風險不等於主權上限，主權上限才是指任何企業之信用等級不得高於該國的主權評等。"},{"i":"H8-6","q":"下列何項內容符合國際信評機構目前的評等慣例？","o":["國家風險的評估，不需考慮社會和諧程度","績效卓越公司發行的債券等級，可能優於國家風險等級","績效卓越公司發行的股票等級，須低於國家風險等級","國際信評機構不發布國家風險等級"],"a":1,"e":"答案(B)。目前國際信評機構的慣例已放寬傳統的主權上限，績效卓越公司（如外幣資產充足、海外收入高者）發行的債券等級，可能優於所屬國家風險等級，故(B)正確。國家風險評估須考慮社會和諧程度(A錯)；股票並無「須低於國家風險等級」之規定(C錯)；信評機構會發布國家主權評等(D錯)。","c":8,"f":3,"ap":["H8-6","E18-50","E23-15"]},{"i":"H8-7","q":"關於國家風險的統計，下列敘述何者錯誤？","o":["總暴險除已動用的放款餘額，還需加計剩餘可用或未動用部份","信用狀保兌按承作金額計算暴險值","已提列資產減損之有價證券投資，直接按減損後之資產價值計算","附賣回證券直接以有價證券之市場價值計算"],"a":3,"e":"答案(D)。附賣回證券是在評估交易對手不履約時，依照可能發生的「損失金額」認列暴險值，而非直接以有價證券市場價值計算，故(D)錯誤。授信總暴險除已動用餘額還需加計未動用額度；信用狀保兌按承作金額計算；已提列減損之有價證券按減損後價值計算，(A)(B)(C)正確。","c":8,"f":3,"ap":["H8-7","E11-21","E17-20"],"n":"附賣回以發生的損失金額計算。"},{"i":"H8-8","q":"國家風險限額的調整時機與特性，下列敘述何者錯誤？","o":["分成靜態核配與動態調整兩大類","借款企業的債務憑證越佳者，銀行優先分配該國風險限額","國家風險限額優先分配給予國家主權評等優良的國家","常理上，銀行在當地設置分行或代表處者，配置國家風險限額的機會，高於尚未設立營業據點的國家"],"a":1,"e":"答案(B)。國家風險限額優先分配給國家主權評等優良的國家，是依「國家」層級的信用狀況而定，並非依借款企業債務憑證的優劣分配，故(B)錯誤。國家風險限額分為靜態核配與動態調整；在當地設有分行或代表處的國家，配置限額機會較高，(A)(C)(D)正確。","c":8,"f":3,"ap":["H8-8","E15-51","E20-52"]},{"i":"H8-9","q":"有關國家風險限額的核配，下列敘述何者錯誤？","o":["依據信評公司之評等核配國家風險額度，稱為靜態核配制度","依據信用違約交換的價格核配國家風險額度，稱為動態核配制度","信用違約交換的價格，原則上應每季檢查一次","當信用違約交換觸及標準，應凍結該國額度"],"a":2,"e":"答案(C)。CDS價格是動態核配國家風險額度的依據，銀行透過系統（如Bloomberg）「每日」檢視一次並留存資料備查，而非每季檢查一次，故(C)錯誤。依信評機構評等核配為靜態核配、依CDS價格核配為動態核配，CDS觸及標準時應凍結該國
