/* ======================= 雲端同步 ======================= */
let pushTimer = null, syncBusy = false;
function setSync(st, txt){ $('#syncDot').className = 'dot ' + st; $('#syncTxt').textContent = txt; }
async function api(body){
  const url = gasUrl();
  if (!url) throw new Error('no-url');
  const res = await fetch(url, { method: 'POST', body: JSON.stringify(body), redirect: 'follow' });
  const j = await res.json();
  if (!j.ok) throw new Error(j.error || 'server');
  return j;
}
function mergeKey(k, local, remote){ // 回傳合併後的值
  if (k === 'stars') { const o = { ...local }; for (const id in remote) if (Math.abs(remote[id]) > Math.abs(o[id] || 0)) o[id] = remote[id]; return o; }
  if (k === 'stats') { const o = { ...local }; for (const id in remote) if (!o[id] || (remote[id][3] || 0) > (o[id][3] || 0)) o[id] = remote[id]; return o; }
  if (k === 'history') { const m = new Map(); [...remote, ...local].forEach(h => m.set(h.time + '|' + h.mode, h)); return [...m.values()].sort((a, b) => a.time - b.time).slice(-300); }
  return null;
}
function applyRemote(state){
  let changed = false;
  KEYS.forEach(k => {
    const r = state[k]; if (!r || !r.v) return;
    let rv; try { rv = JSON.parse(r.v); } catch (e) { return; }
    const merged = mergeKey(k, S[k].v, rv);
    if (merged) {
      const before = JSON.stringify(S[k].v), after = JSON.stringify(merged);
      if (before !== after) { S[k].v = merged; changed = true; saveLocalOnly(k); }
      if (after !== JSON.stringify(rv)) dirty.add(k);
    } else if (r.t > S[k].t) { S[k] = { v: rv, t: r.t }; saveLocalOnly(k); changed = true; }
    else if (S[k].t > r.t) dirty.add(k);
  });
  KEYS.forEach(k => { if (!state[k] && S[k].t) dirty.add(k); });
  return changed;
}
async function syncLogin(){
  if (!gasUrl()) { setSync('', '本機模式'); return; }
  setSync('busy', '同步中');
  try {
    const j = await api({ action: 'login', account: ACC });
    const changed = applyRemote(j.state || {});
    setSync('ok', '已同步');
    if (j.created) toast('已在雲端建立新帳號：' + ACC);
    if (changed) render();
    if (dirty.size) pushNow();
  } catch (e) { setSync('err', e.message === 'no-url' ? '本機模式' : '離線'); }
}
function schedulePush(){ clearTimeout(pushTimer); pushTimer = setTimeout(pushNow, 2500); }
async function pushNow(){
  if (!gasUrl() || !dirty.size || syncBusy) return;
  syncBusy = true; setSync('busy', '同步中');
  const keys = [...dirty]; dirty.clear();
  const data = {}; keys.forEach(k => data[k] = { v: JSON.stringify(S[k].v), t: S[k].t });
  try {
    const j = await api({ action: 'push', account: ACC, data });
    if (applyRemote(j.state || {})) render();
    setSync('ok', '已同步');
  } catch (e) { keys.forEach(k => dirty.add(k)); setSync('err', '離線（稍後重試）'); setTimeout(schedulePush, 15000); }
  finally { syncBusy = false; if (dirty.size) schedulePush(); }
}
function logSession(sess){
  if (!gasUrl()) return;
  api({ action: 'log', account: ACC, session: sess }).catch(() => {});
}
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'hidden') pushNow(); else if (ACC) syncLogin(); });
window.addEventListener('online', () => ACC && pushNow());

/* ======================= 作答引擎 ======================= */
let quiz = null, timerH = null;
function saveQuiz(){ if (!ACC) return; if (quiz && !quiz.finished) localStorage.setItem(lsKey('quiz'), JSON.stringify(quiz)); else localStorage.removeItem(lsKey('quiz')); }
function restoreQuiz(){
  try { const q = JSON.parse(localStorage.getItem(lsKey('quiz'))); if (q && !q.finished && q.ids && q.ids.every(id => Q[id])) { quiz = q; quiz.answeredCount = function(){ return Object.keys(this.ans).length; }; } else quiz = null; }
  catch (e) { quiz = null; }
}
function startMock(){
  const ids = shuffle(EXAM_IDS).slice(0, 60);
  startQuiz({ title: '模擬考', ids, mode: 'batch', scope: '歷屆隨機 60 題', mock: true, timeLimit: 90 * 60, scoring: 'exam' });
}
function startQuiz(o){
  if (quiz && !quiz.finished && quiz.answeredCount() > 0 && !confirm(`目前「${quiz.title}」尚未完成，要放棄並開始新的作答嗎？`)) return;
  if (!o.endless && (!o.ids || !o.ids.length)) { toast('沒有可出的題目'); return; }
  quiz = { ...o, pos: 0, ans: {}, startT: now(), finished: false, recorded: {} };
  if (o.endless) { quiz.deck = shuffle(o.pool); quiz.ids = [quiz.deck.pop()]; }
  quiz.answeredCount = function(){ return Object.keys(this.ans).length; };
  saveQuiz();
  go('quiz');
}
function scoreOf(i){ return i < 40 ? 1.5 : 2; }
function quizTimerTick(){
  if (!quiz || quiz.finished || !quiz.timeLimit) return;
  const left = quiz.timeLimit - (now() - quiz.startT) / 1000;
  const el = $('#qTimer'); if (el) { el.textContent = fmtTime(left); el.classList.toggle('low', left < 300); }
  if (left <= 0) { toast('時間到，自動交卷'); finishQuiz(); }
}
function choose(i){
  const id = quiz.ids[quiz.pos];
  if (quiz.mode === 'instant') {
    if (quiz.ans[quiz.pos] !== undefined) return;
    quiz.ans[quiz.pos] = i;
    const q = Q[id];
    if (q.a >= 0) { record(id, i === q.a); save('stats'); }
    quiz.recorded[quiz.pos] = true;
  } else {
    quiz.ans[quiz.pos] = i;
  }
  saveQuiz();
  renderQuiz();
}
function nextQ(){
  if (quiz.endless) {
    if (!quiz.deck.length) quiz.deck = shuffle(quiz.pool);
    if (quiz.pos === quiz.ids.length - 1) quiz.ids.push(quiz.deck.pop());
  }
  if (quiz.pos < quiz.ids.length - 1) { quiz.pos++; saveQuiz(); renderQuiz(); window.scrollTo(0, 0); }
}
function prevQ(){ if (quiz.pos > 0) { quiz.pos--; renderQuiz(); window.scrollTo(0, 0); } }
function finishQuiz(){
  if (quiz.finished) return;
  if (quiz.mode === 'batch') {
    quiz.ids.forEach((id, p) => { const a = quiz.ans[p]; if (a !== undefined && Q[id].a >= 0) record(id, a === Q[id].a); });
    save('stats');
  }
  quiz.finished = true; quiz.endT = now(); clearInterval(timerH); saveQuiz();
  let total = 0, correct = 0, score = 0, max = 0;
  quiz.ids.forEach((id, p) => {
    const a = quiz.ans[p]; const q = Q[id];
    if (quiz.endless && a === undefined) return;
    total++;
    const ok = q.a < 0 ? a !== undefined : a === q.a; // 一律給分題：有作答即給分
    if (ok) correct++;
    if (quiz.scoring === 'exam') { max += scoreOf(p); if (ok) score += scoreOf(p); }
  });
  quiz.result = { total, correct, score: quiz.scoring === 'exam' ? Math.round(score * 10) / 10 : null, max, seconds: Math.round((quiz.endT - quiz.startT) / 1000) };
  if (total) {
    const sess = { time: quiz.endT, mode: quiz.mock ? '模擬考' : quiz.endless ? '無限模式' : quiz.mode === 'instant' ? '逐題解析' : '整份作答', scope: quiz.scope || quiz.title, total, correct, score: quiz.result.score, seconds: quiz.result.seconds, examNo: quiz.examNo || null };
    S.history.v.push(sess); S.history.v = S.history.v.slice(-300); save('history');
    logSession({ ...sess, detail: quiz.ids.map((id, p) => `${id}:${quiz.ans[p] === undefined ? '-' : L[quiz.ans[p]]}`).join(' ') });
  }
  updateSummary();
  resFilter = 'all';
  go('result');
}
function qHeader(id){
  const q = Q[id];
  const src = q.ap.slice(0, 4).map(srcLabel).join('、') + (q.ap.length > 4 ? ` 等 ${q.ap.length} 處` : '');
  return `<div class="q-meta"><span class="tag">第${q.c}章</span>${q.f >= 3 ? `<span class="tag hot">高頻 ×${q.f}</span>` : ''}<span class="tag" title="${esc(q.ap.map(srcLabel).join('、'))}">${esc(src)}</span></div>`;
}
function expHtml(q, chosen){
  const ok = q.a < 0 ? null : chosen === q.a;
  const head = q.a < 0 ? '<b>官方公告：本題凡作答一律給分</b><br>' : chosen === undefined ? '' : ok ? '<b style="color:var(--ok)">答對了！</b> ' : `<b style="color:var(--bad)">答錯了</b>，你選 (${L[chosen]})，正解 (${L[q.a]})。<br>`;
  return `<div class="exp ${ok === null ? '' : ok ? 'ok' : 'bad'}">${head}${esc(q.e)}${q.n ? `<div class="small muted" style="margin-top:6px">講義補充：${esc(q.n)}</div>` : ''}${q.g ? `<div class="flag">⚠ ${esc(q.g)}</div>` : ''}</div>`;
}
function optsHtml(q, chosen, reveal, disabled){
  return q.o.map((t, i) => {
    let cls = '';
    if (reveal) { if (i === q.a) cls = 'right'; else if (i === chosen) cls = 'wrong'; }
    else if (i === chosen) cls = 'sel';
    return `<button class="opt ${cls}" data-o="${i}" ${disabled ? 'disabled' : ''}><span class="l">${L[i]}</span><span>${esc(t)}</span></button>`;
  }).join('');
}
function renderQuiz(){
  if (!quiz) return go('practice');
  if (quiz.finished) return go('result');
  const id = quiz.ids[quiz.pos], q = Q[id];
  const chosen = quiz.ans[quiz.pos];
  const reveal = quiz.mode === 'instant' && chosen !== undefined;
  const n = quiz.endless ? quiz.ids.length : quiz.ids.length;
  const done = quiz.answeredCount();
  let corr = 0; if (quiz.mode === 'instant') quiz.ids.forEach((qid, p) => { if (quiz.ans[p] !== undefined && (Q[qid].a < 0 || quiz.ans[p] === Q[qid].a)) corr++; });
  const star = isStar(id);
  $('#view').innerHTML = `
  <div class="row small muted">
    <span class="grow"><b style="color:var(--ink)">${esc(quiz.title)}</b>　第 ${quiz.pos + 1}${quiz.endless ? '' : ' / ' + n} 題${quiz.mode === 'instant' ? `　答對 ${corr}/${done}` : `　已答 ${done}/${n}`}</span>
    ${quiz.timeLimit ? `<span>剩餘 <span class="timer" id="qTimer">--:--</span></span>` : ''}
  </div>
  <div class="progress"><i style="width:${quiz.endless ? 100 : pct(quiz.mode === 'instant' ? done : quiz.pos + 1, n)}%"></i></div>
  <div class="card">
    <div class="row" style="align-items:flex-start"><div class="grow">${qHeader(id)}</div>
      <button class="starbtn ${star ? 'on' : ''}" id="starBtn">${star ? '★ 已標記' : '☆ 標記'}</button></div>
    ${quiz.scoring === 'exam' ? `<div class="muted small">本題 ${scoreOf(quiz.pos)} 分</div>` : ''}
    <div class="q-text">${esc(q.q)}</div>
    <div id="opts">${optsHtml(q, chosen, reveal, reveal)}</div>
    ${reveal ? expHtml(q, chosen) : ''}
  </div>
  <div class="sticky-actions">
    <button class="btn" id="prevBtn" ${quiz.pos === 0 ? 'disabled' : ''}>上一題</button>
    ${quiz.mode === 'instant'
      ? `<button class="btn pri grow" id="nextBtn" ${chosen === undefined || (!quiz.endless && quiz.pos === n - 1) ? 'disabled' : ''}>下一題</button>`
      : `<button class="btn pri grow" id="nextBtn" ${quiz.pos === n - 1 ? 'disabled' : ''}>下一題</button>`}
    <button class="btn" id="finBtn">${quiz.mode === 'instant' ? '結束' : '交卷'}</button>
  </div>
  ${quiz.mode === 'batch' ? `<div class="card"><div class="muted small">題號（藍色＝已作答）</div><div class="qnav">${quiz.ids.map((_, p) => `<button data-p="${p}" class="${quiz.ans[p] !== undefined ? 'done' : ''} ${p === quiz.pos ? 'cur' : ''}">${p + 1}</button>`).join('')}</div></div>` : ''}`;
  $$('#opts .opt').forEach(b => b.onclick = () => choose(+b.dataset.o));
  $('#starBtn').onclick = () => { toggleStar(id); renderQuiz(); };
  $('#prevBtn').onclick = prevQ;
  $('#nextBtn').onclick = nextQ;
  $('#finBtn').onclick = () => {
    const left = quiz.endless ? 0 : quiz.ids.length - done;
    if (quiz.mode === 'batch' && left > 0 && !confirm(`還有 ${left} 題未作答，確定交卷？`)) return;
    if (quiz.mode === 'instant' && !quiz.endless && left > 0 && !confirm(`還有 ${left} 題未作答，確定結束？`)) return;
    finishQuiz();
  };
  $$('.qnav button').forEach(b => b.onclick = () => { quiz.pos = +b.dataset.p; renderQuiz(); });
  if (quiz.timeLimit) { clearInterval(timerH); quizTimerTick(); timerH = setInterval(quizTimerTick, 1000); }
}
document.addEventListener('keydown', e => {
  if (TAB !== 'quiz' || !quiz || quiz.finished || e.target.tagName === 'INPUT') return;
  const k = e.key.toUpperCase();
  if ('ABCD'.includes(k) && k.length === 1) choose('ABCD'.indexOf(k));
  else if ('1234'.includes(k) && k.length === 1) choose(+k - 1);
  else if (e.key === 'ArrowRight' || e.key === 'Enter') { const b = $('#nextBtn'); if (b && !b.disabled) nextQ(); }
  else if (e.key === 'ArrowLeft') prevQ();
});

/* ======================= 成績 ======================= */
let resFilter = 'all';
function renderResult(){
  if (!quiz || !quiz.result) return go('practice');
  const r = quiz.result;
  const items = quiz.ids.map((id, p) => ({ id, p, a: quiz.ans[p] })).filter(x => !(quiz.endless && x.a === undefined));
  const isOk = x => Q[x.id].a < 0 ? x.a !== undefined : x.a === Q[x.id].a;
  const shown = items.filter(x => resFilter === 'all' || (resFilter === 'wrong' && !isOk(x)) || (resFilter === 'star' && isStar(x.id)));
  const wrongIds = items.filter(x => !isOk(x)).map(x => x.id);
  const passTxt = r.score != null ? (r.score >= 70 ? '<span class="pass">及格</span>' : '<span class="fail">未達 70 分</span>') : '';
  $('#view').innerHTML = `
  <div class="card" style="text-align:center">
    <div class="muted small">${esc(quiz.title)}</div>
    ${r.score != null ? `<div class="big">${r.score}<span style="font-size:18px"> / ${r.max} 分</span></div><div>${passTxt}</div>` : `<div class="big">${pct(r.correct, r.total)}%</div>`}
    <div class="muted" style="margin-top:6px">答對 ${r.correct} / ${r.total} 題・用時 ${fmtTime(r.seconds)}</div>
    <div class="row" style="justify-content:center;margin-top:12px">
      <button class="btn pri" id="retryWrong" ${wrongIds.length ? '' : 'disabled'}>錯題再練一次（${wrongIds.length}）</button>
      <button class="btn" id="again">回練習設定</button>
    </div>
  </div>
  <div class="seg" style="margin-bottom:12px">${[['all', `全部（${items.length}）`], ['wrong', `答錯（${wrongIds.length}）`], ['star', '星號']].map(([k, t]) => `<button data-rf="${k}" class="${resFilter === k ? 'on' : ''}">${t}</button>`).join('')}</div>
  <div class="card">${shown.length ? shown.map(x => reviewItem(x.id, x.a, x.p + 1)).join('') : '<div class="empty">沒有題目</div>'}</div>`;
  $('#retryWrong').onclick = () => { const ids = [...new Set(wrongIds)]; quiz = null; startQuiz({ title: '錯題再練', ids, mode: 'instant', scope: '本次錯題' }); };
  $('#again').onclick = () => go('practice');
  $$('[data-rf]').forEach(b => b.onclick = () => { resFilter = b.dataset.rf; renderResult(); });
  bindStarButtons(renderResult);
}
function reviewItem(id, chosen, no, showAns = true){
  const q = Q[id];
  const opts = q.o.map((t, i) => `<span class="o ${showAns && i === q.a ? 'c' : ''} ${showAns && chosen === i && i !== q.a ? 'x' : ''}">(${L[i]}) ${esc(t)}${showAns && i === q.a ? ' ✓' : ''}</span>`).join('');
  return `<div class="list-q">
    <div class="row" style="align-items:flex-start"><div class="grow">${qHeader(id)}</div><button class="starbtn ${isStar(id) ? 'on' : ''}" data-star="${id}">${isStar(id) ? '★' : '☆'}</button></div>
    <div><b>${no != null ? no + '. ' : ''}</b>${esc(q.q)}</div>
    <div class="ans-line">${opts}</div>
    ${chosen === undefined && no != null ? '<div class="small" style="color:var(--bad)">未作答</div>' : ''}
    ${showAns ? expHtml(q, chosen) : `<button class="btn sm" data-show="${id}">看答案與解析</button><div data-exp="${id}"></div>`}
  </div>`;
}
function bindStarButtons(rerender){
  $$('[data-star]').forEach(b => b.onclick = () => { const on = toggleStar(b.dataset.star); b.classList.toggle('on', on); b.textContent = on ? '★' : '☆'; });
  $$('[data-show]').forEach(b => b.onclick = () => {
    const id = b.dataset.show, q = Q[id];
    const box = b.parentElement;
    $$('.o', box).forEach((o, i) => { if (i === q.a) { o.classList.add('c'); o.textContent += ' ✓'; } });
    b.remove(); $(`[data-exp="${CSS.escape(id)}"]`, box).innerHTML = expHtml(q, undefined);
  });
}

/* ======================= 複習速讀 ======================= */
const R = { seg: 'stars', ch: 0, src: 'all', q: '', show: true, limit: 30 };
function renderReview(){
  let ids;
  if (R.seg === 'stars') ids = starIds().sort((a, b) => S.stars.v[b] - S.stars.v[a]);
  else if (R.seg === 'wrong') ids = wrongEver().sort((a, b) => (S.stats.v[b][1] - S.stats.v[a][1]) || (S.stats.v[b][3] - S.stats.v[a][3]));
  else ids = R.src === 'handout' ? HANDOUT_IDS : R.src === 'exam' ? EXAM_IDS : R.src === 'hot' ? ALL_IDS.filter(id => Q[id].f >= 3).sort((a, b) => Q[b].f - Q[a].f) : ALL_IDS;
  if (R.ch) ids = ids.filter(id => Q[id].c === R.ch);
  const kw = R.q.trim().toLowerCase();
  if (kw) ids = ids.filter(id => (Q[id].q + Q[id].o.join('') + Q[id].e).toLowerCase().includes(kw));
  const list = ids.slice(0, R.limit);
  $('#view').innerHTML = `
  <div class="seg" style="margin-bottom:12px">${[['stars', `星號題（${starIds().length}）`], ['wrong', `錯題（${wrongEver().length}）`], ['all', '題庫瀏覽']].map(([k, t]) => `<button data-rs="${k}" class="${R.seg === k ? 'on' : ''}">${t}</button>`).join('')}</div>
  <div class="card">
    <div class="grid g2">
      ${R.seg === 'all' ? `<select class="t" id="rSrc"><option value="all">全部來源</option><option value="handout">講義題目</option><option value="exam">歷屆考古題</option><option value="hot">高頻題（≥3 次）</option></select>` : ''}
      <select class="t" id="rCh"><option value="0">全部章節</option>${KP.chapters.map(c => `<option value="${c.ch}">第${c.ch}章 ${esc(c.title)}</option>`).join('')}</select>
    </div>
    <div class="search" style="margin-top:10px"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg><input class="t" id="rQ" placeholder="搜尋題目、選項或解析" value="${esc(R.q)}"></div>
    <div class="row" style="margin-top:10px">
      <label class="row small" style="gap:6px"><input type="checkbox" id="rShow" ${R.show ? 'checked' : ''}> 直接顯示答案與解析（速讀模式）</label>
      <span class="grow"></span>
      ${ids.length ? `<button class="btn sm" id="rPractice">把這 ${ids.length} 題拿來練習</button>` : ''}
    </div>
  </div>
  <div class="card">${list.length ? list.map(id => reviewItem(id, undefined, null, R.show) + (R.seg === 'wrong' && S.stats.v[id] ? `<div class="small muted" style="margin-top:-6px;padding-bottom:6px">答錯 ${S.stats.v[id][1]} 次・答對 ${S.stats.v[id][0]} 次・最近一次${S.stats.v[id][2] ? '答對' : '答錯'}</div>` : '')).join('')
    : `<div class="empty">${R.seg === 'stars' ? '還沒有星號題。作答時按「☆ 標記」把不熟的題目加進來，考前就能在這裡快速瀏覽。' : R.seg === 'wrong' ? '還沒有答錯的題目。' : '找不到符合的題目'}</div>`}
    ${ids.length > R.limit ? `<button class="btn block" id="more">顯示更多（${ids.length - R.limit}）</button>` : ''}
  </div>`;
  $$('[data-rs]').forEach(b => b.onclick = () => { R.seg = b.dataset.rs; R.limit = 30; renderReview(); });
  const rs = $('#rSrc'); if (rs) { rs.value = R.src; rs.onchange = () => { R.src = rs.value; R.limit = 30; renderReview(); }; }
  $('#rCh').value = R.ch; $('#rCh').onchange = () => { R.ch = +$('#rCh').value; R.limit = 30; renderReview(); };
  let t; $('#rQ').oninput = e => { clearTimeout(t); t = setTimeout(() => { R.q = e.target.value; R.limit = 30; const pos = e.target.selectionStart; renderReview(); const n = $('#rQ'); n.focus(); n.setSelectionRange(pos, pos); }, 300); };
  $('#rShow').onchange = e => { R.show = e.target.checked; renderReview(); };
  const m = $('#more'); if (m) m.onclick = () => { R.limit += 30; renderReview(); };
  const rp = $('#rPractice'); if (rp) rp.onclick = () => startQuiz({ title: R.seg === 'stars' ? '星號題練習' : R.seg === 'wrong' ? '錯題練習' : '題庫練習', ids: shuffle(ids), mode: 'instant', scope: R.seg === 'stars' ? '星號題' : R.seg === 'wrong' ? '曾答錯' : '題庫瀏覽' });
  bindStarButtons(renderReview);
}

/* ======================= 統計與設定 ======================= */
function renderMe(){
  const o = overall(), cs = chapterStats();
  const hist = S.history.v.slice().reverse().slice(0, 30);
  const examBest = {}; S.history.v.forEach(h => { if (h.examNo) examBest[h.examNo] = Math.max(examBest[h.examNo] ?? 0, h.score ?? 0); });
  const mocks = S.history.v.filter(h => h.mode === '模擬考');
  $('#view').innerHTML = `
  <div class="card">
    <div class="row"><div class="grow"><div class="muted small">目前帳號</div><b style="font-size:18px">${esc(ACC)}</b></div><button class="btn" id="logout">登出</button></div>
  </div>
  <div class="grid g4" style="margin-bottom:14px">
    <div class="stat"><b>${o.done}</b><span>已練習（共 ${ALL_IDS.length}）</span></div>
    <div class="stat"><b>${o.right + o.wrong}</b><span>累計作答次數</span></div>
    <div class="stat"><b>${o.acc}%</b><span>正確率</span></div>
    <div class="stat"><b>${mocks.length ? Math.max(...mocks.map(m => m.score)) : '—'}</b><span>模擬考最佳（${mocks.length} 次）</span></div>
  </div>
  <div class="card"><h2>各章掌握度</h2>
    ${Object.entries(cs).map(([c, v]) => `<div style="margin:9px 0"><div class="row small"><span class="grow">第${c}章 ${esc(CH_NAMES[c])}</span><span class="muted">${v.done}/${v.total} 題・${v.r + v.w ? pct(v.r, v.r + v.w) + '%' : '—'}</span></div><div class="bar"><i style="width:${pct(v.done, v.total)}%;${v.r + v.w && pct(v.r, v.r + v.w) < 70 ? 'background:#d97706' : ''}"></i></div></div>`).join('')}
    <div class="muted small">長條＝已練習比例；正確率低於 70% 以橘色顯示。</div>
  </div>
  <div class="card"><h2>歷屆考古題整份成績</h2>
    <div class="chips">${DATA.exams.map((_, i) => `<span class="chip" style="${examBest[i + 1] != null ? (examBest[i + 1] >= 70 ? 'background:var(--ok-soft);border-color:#a8d9bb' : 'background:var(--bad-soft);border-color:#efb5b0') : ''}">第${i + 1}屆 ${examBest[i + 1] != null ? examBest[i + 1] + '分' : '未做'}</span>`).join('')}</div>
    <div class="muted small" style="margin-top:6px">在「練習題 > 歷屆考古題」只選一屆、題數「全部」即可整份作答並計分。</div>
  </div>
  <div class="card"><h2>作答紀錄</h2>
    ${hist.length ? `<div class="tblwrap"><table class="t"><tr><th>時間</th><th>模式</th><th>範圍</th><th>結果</th></tr>${hist.map(h => `<tr><td class="small">${dateStr(h.time)}</td><td class="small">${esc(h.mode)}</td><td class="small">${esc(h.scope)}</td><td class="small">${h.correct}/${h.total}${h.score != null ? `・${h.score}分` : ''}</td></tr>`).join('')}</table></div>` : '<div class="muted small">還沒有紀錄</div>'}
  </div>
  <div class="card"><h2>設定</h2>
    <label class="f" for="exDate">考試日期（首頁倒數）</label>
    <input type="date" class="t" id="exDate" value="${esc(S.settings.v.examDate || '')}">
    <label class="f">字體大小</label>
    <div class="seg">${[[15, '小'], [16, '標準'], [18, '大'], [20, '特大']].map(([v, t]) => `<button data-fs="${v}" class="${(S.settings.v.fs || 16) == v ? 'on' : ''}">${t}</button>`).join('')}</div>
    <label class="f" for="gasUrl">GAS 後端網址</label>
    <input class="t small" id="gasUrl" value="${esc(gasUrl())}" placeholder="https://script.google.com/macros/s/…/exec" spellcheck="false">
    <div class="row" style="margin-top:10px"><button class="btn sm" id="saveGas">儲存並同步</button><span class="muted small" id="gasMsg"></span></div>
    <h3>備份</h3>
    <div class="row"><button class="btn sm" id="exp">匯出我的資料</button><label class="btn sm">匯入備份<input type="file" id="imp" accept=".json" class="hidden"></label></div>
  </div>
  <div class="muted small" style="text-align:center">題庫：講義 ${HANDOUT_IDS.length} 題＋歷屆 ${DATA.exams.length} 屆 ${DATA.exams.length * 60} 題（去重後 ${ALL_IDS.length} 題）</div>`;
  $('#logout').onclick = logout;
  $('#exDate').onchange = e => { S.settings.v.examDate = e.target.value; save('settings'); toast('已儲存考試日期'); };
  $$('[data-fs]').forEach(b => b.onclick = () => { S.settings.v.fs = +b.dataset.fs; save('settings'); document.documentElement.style.setProperty('--fs', b.dataset.fs + 'px'); renderMe(); });
  $('#saveGas').onclick = async () => {
    const v = $('#gasUrl').value.trim();
    if (v) localStorage.setItem('rq:gas', v); else localStorage.removeItem('rq:gas');
    $('#gasMsg').textContent = '連線中…';
    KEYS.forEach(k => dirty.add(k));
    await syncLogin();
    $('#gasMsg').textContent = $('#syncTxt').textContent;
  };
  $('#exp').onclick = () => {
    const blob = new Blob([JSON.stringify({ account: ACC, exported: now(), data: S })], { type: 'application/json' });
    const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = `風管刷題備份-${ACC}.json`; a.click();
  };
  $('#imp').onchange = async e => {
    const f = e.target.files[0]; if (!f) return;
    try {
      const j = JSON.parse(await f.text());
      const st = {}; KEYS.forEach(k => { if (j.data && j.data[k]) st[k] = { v: JSON.stringify(j.data[k].v), t: j.data[k].t }; });
      applyRemote(st); KEYS.forEach(k => save(k)); toast('已匯入並合併'); renderMe();
    } catch (err) { toast('檔案格式不正確'); }
  };
}

/* ======================= 啟動 ======================= */
if ('serviceWorker' in navigator && /^https?:$/.test(location.protocol)) navigator.serviceWorker.register('sw.js').catch(() => {});
ACC = localStorage.getItem('rq:current');
if (ACC) startApp(); else showLogin();
</script>
</body>
</html>
