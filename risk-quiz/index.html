額度，(A)(B)(D)正確。","c":8,"f":2,"ap":["H8-9","E10-31"]},{"i":"H8-10","q":"有關信用違約交換(Credit Default Swap；簡稱CDS)的特性與應用，下列敘述何者錯誤？","o":["銀行的CDS 價格主要取自Bloomberg 金融資訊網，透過系統每日檢視一次並留存資料備查","銀行「未核配」國家風險額度的國家，常理上屬於整體風險較高的國家","CDS 越低的國家，國家風險越大","國家風險額度的凍結及解凍，通常由CDS 價格高於和低於101（含）基點(Basis Point)或1.01%作為標準"],"a":2,"e":"答案(C)。CDS價格代表市場對該國違約風險所要求的保護費用，CDS越低表示國家風險越「小」，CDS越高國家風險越大，故(C)錯誤。CDS價格取自Bloomberg並每日檢視；未核配額度的國家通常風險較高；額度凍結與解凍以CDS高於或低於101基點(1.01%)為標準，(A)(B)(D)正確。","c":8,"f":2,"ap":["H8-10","E11-50"]},{"i":"H8-11","q":"有關信用違約交換(Credit Default Swap；簡稱CDS)的特性與應用，下列敘述何者不符合？","o":["該指標可檢視交易對手國於國際金融市場的信用狀況","CDS 加碼101 基點，等於1.01%","單一事件造成某國CDS 價格低於原來標準，且連續發生數日時，銀行可能凍結該國的風險限額","單一事件造成某國CDS 價格高於原來標準，且連續發生數日時，銀行可能凍結該國的風險限額"],"a":2,"e":"答案(C)。CDS價格「高於」原標準且連續數日，代表該國信用風險上升，銀行才可能凍結該國風險限額，故(D)正確、(C)說「低於」不符合。CDS可檢視交易對手國在國際金融市場的信用狀況；101基點 = 1.01%（1基點 = 0.01%），(A)(B)正確。","c":8,"f":2,"ap":["H8-11","E13-21"]},{"i":"H8-12","q":"歐債危機時期，歐豬國家(PIIGS)經濟金融受到明顯衝擊，下列哪個不屬於歐豬國家？","o":["西班牙","捷克","義大利","愛爾蘭"],"a":1,"e":"答案(B)。歐債危機中的歐豬五國(PIIGS)為葡萄牙(Portugal)、義大利(Italy)、愛爾蘭(Ireland)、希臘(Greece)、西班牙(Spain)，捷克不在其中。","c":8,"f":2,"ap":["H8-12","E12-20"]},{"i":"H8-13","q":"為有效控制國家風險，避免外幣債權之風險過度集中在同等級或低等級之風險國家，主管機關要求銀行逐日統計並定期提報董事會，相關說明何者正確？A.授信業務按目前放款餘額計算暴險值B.投資業務分成股權投資、有價證券投資及外匯交易三種，其中股權投資按交割前名目本金計算暴險值C.對國外銀行之資金拆放、同業進出口融資墊款等，按使用餘額計算暴險值","o":["僅AB","僅AC","僅BC","ABC"],"a":1,"e":"答案(B)。A正確：授信業務按目前放款餘額計算暴險值。C正確：對國外銀行之資金拆放、同業進出口融資墊款等按使用餘額計算。B錯誤：股權投資是按「帳列金額」計算暴險值；按交割前名目本金計算的是外匯交易與衍生性金融商品。故選僅AC。","c":8,"f":2,"ap":["H8-13","E14-51"]},{"i":"H8-14","q":"有關各項業務之「暴險值」的計算方法，下列敘述何者正確？A.放款、透支、貼現等授信業務，按照目前的放款餘額計算暴險值，授信額度中除動用的放款餘額外，計算暴險值時，還要加上「未動用的」剩餘額度B.信用狀保兌及轉開信用狀（即開立擔保信用狀，簡稱SLC），則按承作金額計算暴險值C.外匯交易（即期、遠期外匯及換匯交易）和衍生性交易，均按潛在損失金額認列暴險值D.有價證券投資按照證券面額計算暴險值，但對於提列資產減損者，則按減損後之資產價值計算","o":["僅ABC","僅BCD","僅ABD","ABCD"],"a":2,"e":"答案(C)。A正確：授信業務按放款餘額計算，並加上未動用額度。B正確：信用狀保兌及轉開信用狀按承作金額計算。D正確：有價證券按面額計算，已提列減損者按減損後價值計算。C錯誤：外匯交易及衍生性交易是按「交割前的名目本金」計算暴險值，而非潛在損失金額。故選僅ABD。","c":8,"f":2,"ap":["H8-14","E19-52"]},{"i":"H8-15","q":"有關「主權上限」之意義，下列敘述何者正確？","o":["任何企業之信用等級不得高於該國的主權評等","非投資級企業之長期債務評等不得高於該國的主權評等","投資級企業之短期債務評等不得高於該國的主權評等","非主權發行公司的信用等級可能高於主權評等"],"a":0,"e":"答案(A)。「主權上限」(Sovereign Ceiling)的意義是：任何企業的信用等級不得高於其所屬國家的主權評等，因為企業償債仍受該國政府外匯管制等主權行為影響。不限於非投資級企業(B)或短期債務(C)；(D)與主權上限定義相反（實務上雖有放寬，但本題問的是主權上限之定義）。","c":8,"f":3,"ap":["H8-15","E10-29","E22-21"]},{"i":"H8-16","q":"關於國家主權評等之預告機制，下列敘述何者錯誤？","o":["預告機制包括觀察名單和展望兩種制度","觀察名單代表被觀察國家未來一年之信用等級可能變動","正向觀察之國家，其政府部門發行的債券或主權評等可能在短期內被調升","展望機制著眼於政府發行的長期債務，未來一至二年的信用走向"],"a":1,"e":"答案(B)。觀察名單是在有事件發生或即將發生時將國家納入，並在90天（約三個月）內做出評等調整或維持的決定，屬短期預告，並非「未來一年」，故(B)錯誤。預告機制包括觀察名單與展望；正向觀察者短期內可能被調升；展望著眼長期債務未來一至二年的信用走向，(A)(C)(D)正確。","c":8,"f":2,"ap":["H8-16","E9-30"]},{"i":"H8-17","q":"國家主權評等的預告機制，下列敘述何者不適當？","o":["「展望」動態著眼於未來一至二年的信用走向","「觀察名單」關心被觀察國家未來三個月的信用等級變化","「觀察名單」的變化，分成正向、負向與穩定","「展望」的變化，分成正向、負向與穩定"],"a":2,"e":"答案(C)。「展望」的看法分為正向、負向與穩定，(D)正確；「觀察名單」是因特定事件將在短期內（約三個月）可能調整評等，其方向分為正向、負向（或發展中），並無「穩定」之分，故(C)不適當。展望著眼未來一至二年、觀察名單關心未來三個月，(A)(B)正確。","c":8,"f":3,"ap":["H8-17","E18-52","E22-52"]},{"i":"H8-18","q":"國家主權評等的信用等級極可能在三個月內調升時，國際信用評等機構會將該國列於下列何者？","o":["正向觀察名單","正向展望","穩定展望","正向調升名單"],"a":0,"e":"答案(A)。國家主權評等極可能在短期（三個月、90天）內調升時，信評機構會將其列入「正向觀察名單」。「展望」則著眼於未來一至二年的信用走向，屬中長期預告；並無「正向調升名單」的制度。","c":8,"f":4,"ap":["H8-18","E7-31","E14-20","E22-20"]},{"i":"H8-19","q":"S & P 國際信評機構的國家主權評等，攸關等級制度，下列敘述何者正確？A.分成投資級與投機級兩大類B.信用等級介於AA 與CCC 之間者，相同等級再細分三個層級C.旨在反映各國「主權債」的償還能力D.旨在反映各國政府機關所發行「權益證券」的信用品質","o":["僅ABC","僅BCD","僅ABD","ABCD"],"a":0,"e":"答案(A)。S&P國家主權評等：A正確，分為投資級與投機級兩大類；B正確，AA至CCC同等級以＋、－再細分三個層級；C正確，主權評等旨在反映各國「主權債」的償還能力。D錯誤，主權評等是評估政府債務的信用品質，並非政府機關發行的權益證券。故選僅ABC。","c":8,"f":4,"ap":["H8-19","E12-21","E17-52","E19-20"]},{"i":"H9-1","q":"依銀行法規定，下列何者非屬銀行？","o":["保險公司","商業銀行","專業銀行","信託投資公司"],"a":0,"e":"答案(A)。依銀行法第20條，銀行分為三種：商業銀行、專業銀行及信託投資公司。保險公司依保險法設立，屬保險業，不是銀行法所稱之銀行。","c":9,"f":3,"ap":["H9-1","E5-24","E15-22"]},{"i":"H9-2","q":"為使銀行維持適足資本，金管會公告之銀行資本適足性及資本等級管理辦法，是依下列何者法規訂定？","o":["證券交易法","銀行法","洗錢防制法","公司法"],"a":1,"e":"答案(B)。「銀行資本適足性及資本等級管理辦法」是金管會依據銀行法第44條（自有資本與風險性資產比率及資本等級之授權規定）訂定，故其母法為銀行法。","c":9,"f":2,"ap":["H9-2","E18-39"]},{"i":"H9-3","q":"A 銀行買入國庫券新臺幣10 億元，根據「標準法」，該筆國庫券之信用風險性資產為何？","o":["0","2 億元","5 億元","10 億元"],"a":0,"e":"答案(A)。依信用風險標準法，對我國中央政府發行、以新臺幣計價的債權（如國庫券）風險權數為0%，因此信用風險性資產 = 10億元 × 0% = 0。","c":9,"f":2,"ap":["H9-3","E15-30"],"n":"國庫券為政府發行，通常無信用風險。"},{"i":"H9-4","q":"金管會「銀行資本適足性及資本等級管理辦法」第2 條第1 項，定義自有資本與風險性資產之比率應包括哪些項目，下列敘述何者錯誤？","o":["法定資本","資本適足率","普通股權益比率","第一類資本比率"],"a":0,"e":"答案(A)。依「銀行資本適足性及資本等級管理辦法」第2條第1項，自有資本與風險性資產之比率（資本適足比率），指普通股權益比率、第一類資本比率及資本適足率三者，不包括「法定資本」。","c":9,"f":2,"ap":["H9-4","E8-30"]},{"i":"H9-5","q":"原則上，銀行的自有資本對風險性資產的比率愈高時，其承擔的資本風險將如何變化？","o":["愈大","愈小","不變","無關"],"a":1,"e":"答案(B)。自有資本對風險性資產的比率愈高，代表銀行有較多自有資本可吸收風險性資產可能造成的損失，承擔的資本風險愈「小」。","c":9,"f":4,"ap":["H9-5","E7-8","E12-2","E23-41"]},{"i":"H9-6","q":"台灣在實施新的資本適足規範後，對於資本風險的衡量，集中在下列哪四大要項上？A.信用風險 B.市場風險 C.價格風險 D.作業風險 E.流動性風險","o":["ABCD","ABCE","ABDE","BCDE"],"a":2,"e":"答案(C)。依講義，台灣實施新資本適足規範後，資本風險的衡量集中於信用風險、市場風險、作業風險與流動性風險四大要項。價格風險屬市場風險的一部分，不單獨列為要項。","c":9,"f":2,"ap":["H9-6","E14-41"]},{"i":"H9-7","q":"有關資本適足率的意義，下列敘述何者正確？ A.可衡量銀行營運健全性 B.防止風險性資產造成重大損失 C.可衡量經濟成長幅度 D.提供央行調整貨幣政策參考","o":["僅A、B","僅C、D","僅A、C、D","A、B、C、D"],"a":0,"e":"答案(A)。資本適足率用來衡量銀行營運的健全性，並確保銀行有足夠資本防止風險性資產造成重大損失（A、B正確）。衡量經濟成長幅度(C)與提供央行貨幣政策參考(D)並非資本適足率的意義。","c":9,"f":4,"ap":["H9-7","E10-34","E17-24","E21-53"]},{"i":"H9-8","q":"依據銀行自有資本與風險性資產計算方法說明及表格，計提交易簿增額風險之模型信賴區間須達到多少？","o":["90.00%","95.00%","99.00%","99.90%"],"a":3,"e":"答案(D)。依「銀行自有資本與風險性資產計算方法說明及表格」，交易簿增額風險(IRC)之資本計提模型，須以99.9%信賴區間、一年資本期間衡量違約及信用等級遷徙風險。","c":9,"f":2,"ap":["H9-8","E8-57"]},{"i":"H9-9","q":"依金管會「銀行資本適足性及資本等級管理辦法」第2 條第4 項，定義「資本適足率」，係以何種資本除以風險性資產總額而得，下列敘述何者正確？","o":["第一類資本淨額","第二類資本淨額","第三類資本淨額","第一類資本淨額及第二類資本淨額之合計數"],"a":3,"e":"答案(D)。依管理辦法第2條，「資本適足率」= （第一類資本淨額＋第二類資本淨額）／風險性資產總額。僅以第一類資本淨額為分子者為第一類資本比率；現行規範已無第三類資本。","c":9,"f":2,"ap":["H9-9","E11-37"]},{"i":"H9-10","q":"自民國108 年起，銀行的資本適足率不得低於多少？","o":["8%","9%","10%","10.50%"],"a":3,"e":"答案(D)。自民國108年起，銀行資本適足率不得低於10.5%（最低8%＋2.5%留存緩衝資本）；第一類資本比率不得低於8.5%、普通股權益比率不得低於7%。","c":9,"f":3,"ap":["H9-10","E3-59","E6-53"]},{"i":"H9-11","q":"A 銀行的表內項目及表外項目，信用風險性資產分別為新臺幣1,500 億元與500 億元，依現行規定須計提多少資本？","o":["210 億元","160 億元","158 億元","120 億元"],"a":0,"e":"答案(A)。風險性資產 = 表內1,500億 + 表外500億 = 2,000億元。依現行規定資本適足率最低10.5%，應計提資本 = 2,000億 × 10.5% = 210億元。(B)160億為以舊制8%計算的結果。","c":9,"f":2,"ap":["H9-11","E12-56"],"n":"銀行資本適足率最低要求10.5% = 應計提資本/風險性資產 = 應計提資本 / (1500+500) → (1500 + 500) * 10.5% = Ans"},{"i":"H9-12","q":"為避免發生系統性風險，主管機關於必要時得提高資本適足率之最低比率，但最高不得超過多少？","o":["0.50%","1.00%","2.00%","2.50%"],"a":3,"e":"答案(D)。依管理辦法，主管機關為避免系統性風險，必要時得提高資本適足率之最低比率（如抗景氣循環緩衝資本），但最高不得超過2.5%。","c":9,"f":2,"ap":["H9-12","E11-23"]},{"i":"H9-13","q":"「信用風險加權風險性資產」主要是因下列何種狀況導致銀行產生損失？","o":["股票價格下跌","債券價格下跌","債券評等下跌","交易對手不履約"],"a":3,"e":"答案(D)。信用風險加權風險性資產衡量的是交易對手（借款人）不履約，致銀行產生損失的風險。股票、債券價格下跌屬市場風險；債券評等下跌雖與信用有關，但信用風險核心為交易對手違約不履約。","c":9,"f":2,"ap":["H9-13","E12-39"]},{"i":"H9-14","q":"按照資本適足性管理辦法，銀行發行的「長期別次順位債券」，在計算資本適足率時，具有何種資本性質？","o":["普通股股本","第一類資本","第二類資本","不可視為資本使用"],"a":2,"e":"答案(C)。依資本適足性管理辦法，銀行發行的長期次順位債券屬「第二類資本」；第二類資本另包括可轉換之次順位債券、營業準備及備抵呆帳等。","c":9,"f":3,"ap":["H9-14","E11-38","E22-40"]},{"i":"H9-15","q":"第二類資本之合計數額不包含下列哪一種？","o":["長期次順位債券","特別盈餘公積","可轉換之次順位債券","營業準備及備抵呆帳"],"a":1,"e":"答案(B)。第二類資本包括長期次順位債券、可轉換之次順位債券、營業準備及備抵呆帳等。特別盈餘公積屬「普通股權益」（與法定盈餘公積、資本公積、累積盈虧等同列），不屬第二類資本。","c":9,"f":2,"ap":["H9-15","E12-38"]},{"i":"H9-16","q":"銀行發行列入非普通股權益之其他第一類或第二類資本之資本工具者，應於發行日幾個營業日之前，將發行條件報主管機關備查？","o":["3 日","5 日","7 日","9 日"],"a":2,"e":"答案(C)。依規定，銀行發行列入非普通股權益之其他第一類資本或第二類資本的資本工具，應於發行日7個營業日前，將發行條件等相關資料報主管機關備查（考古題第11屆第60題答案亦同）。","c":9,"f":2,"ap":["H9-16","E11-60"]},{"i":"H9-17","q":"依據金管會「銀行資本適足性及資本等級管理辦法」，有關「風險性資產總額」，指信用風險加權風險性資產總額，加計市場風險及作業風險應計提之資本乘以多少之合計數，下列敘述何者正確？","o":["12","12.5","15","18"],"a":1,"e":"答案(B)。風險性資產總額 = 信用風險加權風險性資產總額 + （市場風險應計提資本 + 作業風險應計提資本）× 12.5。乘以12.5（即1/8%）是將應計提資本換算為約當風險性資產。","c":9,"f":2,"ap":["H9-17","E16-60"]},{"i":"H9-18","q":"A 銀行在110 年12 月底之信用風險加權風險性資產為新臺幣（以下同）1,000 億元，市場風險和作業風險應計提資本各為5 億元，請問三種風險合計的加權風險性資產為下列何者？","o":["1,000 億元","1,005 億元","1,010 億元","1,125 億元"],"a":3,"e":"答案(D)。風險性資產總額 = 信用風險加權風險性資產 + （市場風險＋作業風險應計提資本）× 12.5 = 1,000億 + (5億 + 5億) × 12.5 = 1,000億 + 125億 = 1,125億元。","c":9,"f":3,"ap":["H9-18","E14-22","E16-52"],"n":"加權風險性資產=信用風險加權風險性資產總額+ (市場風險及作業風險應計提之資本*12.5) → 1000 + (5+5) * 12.5 = Ans"},{"i":"H9-19","q":"依據銀行資本適足性及資本等級管理辦法，下列何者不得列為普通股權益的第一類資本？","o":["資本公積","可轉換之次順位債券","累積盈虧","普通股"],"a":1,"e":"答案(B)。普通股權益第一類資本包括普通股及其股本溢價、預收股本、資本公積、法定及特別盈餘公積、累積盈虧、非控制權益及其他權益項目。可轉換之次順位債券屬「第二類資本」，不得列為普通股權益。","c":9,"f":3,"ap":["H9-19","E17-53","E21-24"]},{"i":"H9-20","q":"依據銀行資本適足性及資本等級管理辦法，本國銀行之普通股權益比率，自108 年起不得低於多少？","o":["6.375%","7.00%","8.50%","10.50%"],"a":1,"e":"答案(B)。自民國108年起，本國銀行普通股權益比率不得低於7%（4.5%＋2.5%留存緩衝資本）；第一類資本比率不得低於8.5%，資本適足率不得低於10.5%。","c":9,"f":3,"ap":["H9-20","E12-23","E18-24"]},{"i":"H9-21","q":"普通股權益之合計數，不包含下列哪種？","o":["庫藏股","預收股本","資本公積","累積盈餘"],"a":0,"e":"答案(A)。普通股權益之合計數包括普通股及其股本溢價、預收股本、資本公積、法定及特別盈餘公積、累積盈虧等。庫藏股是銀行買回自家股份，屬權益減項，應自資本中扣除，不包含在合計數內。","c":9,"f":3,"ap":["H9-21","E13-39","E14-40"]},{"i":"H9-22","q":"銀行為提高普通股權益比率，可採用下列哪些措施？A.現金增資 B.盈餘轉增資 C.不動產重估 D.發行可轉換次順位債券","o":["僅AB","僅CD","僅BCD","ABCD"],"a":0,"e":"答案(A)。依講義，現金增資(A)與盈餘轉增資(B)是提高普通股權益比率的方式：現金增資直接增加普通股股本；盈餘轉增資將盈餘轉為普通股股本（講義列為提高方式）。不動產重估(C)的重估增值不得列入普通股權益（僅部分可列入第二類資本）；發行可轉換次順位債券(D)屬第二類資本，均無法提高普通股權益比率。故選僅AB。","c":9,"f":4,"ap":["H9-22","E12-51","E14-24","E23-23"],"g":"盈餘轉增資實務上是把累積盈餘轉為股本，兩者都屬普通股權益，合計數不變；本題依講義與官方答案將其列為提高普通股權益比率之方式"},{"i":"H9-23","q":"依據銀行資本適足性及資本等級管理辦法，所稱槓桿比率係指下列何者？","o":["第一類資本淨額／暴險總額","第一類資本淨額／總資產","合格資本／暴險總額","總負債／總資產"],"a":0,"e":"答案(A)。依「銀行資本適足性及資本等級管理辦法」，槓桿比率＝第一類資本淨額÷暴險總額，最低要求3%，目的在補充以風險衡量為基礎之最低資本要求。(B)分母應為暴險總額而非總資產；(C)分子為第一類資本淨額，不是合格資本；(D)總負債÷總資產為負債比率。","c":9,"f":4,"ap":["H9-23","E2-38","E4-34","E11-22"]},{"i":"H9-24","q":"銀行的資本適足性公式中，「第一類資本淨額，除以暴險總額」，係指下列何者？","o":["普通股權益比率","第一類資本比率","槓桿比率","資本適足率"],"a":2,"e":"答案(C)。第一類資本淨額÷暴險總額即為槓桿比率（最低3%）。(A)普通股權益比率＝普通股權益第一類資本淨額÷風險性資產；(B)第一類資本比率＝第一類資本淨額÷風險性資產；(D)資本適足率＝(第一類＋第二類資本淨額)÷風險性資產，三者分母皆為風險性資產總額。","c":9,"f":2,"ap":["H9-24","E19-40"]},{"i":"H9-25","q":"有關槓桿比率，下列敘述何者錯誤？","o":["目的係用來補充以風險衡量為基礎之最低資本要求","槓桿比率之分子為第一類資本淨額","槓桿比率之分母為暴險總額","槓桿比率最低要求為6%"],"a":3,"e":"答案(D)。槓桿比率最低要求為3%，不是6%。(A)槓桿比率用以補充以風險衡量為基礎之最低資本要求，正確；(B)分子為第一類資本淨額、(C)分母為暴險總額，皆正確。","c":9,"f":2,"ap":["H9-25","E10-36"]},{"i":"H9-26","q":"根據我國最新的「銀行資本適足性及資本等級管理辦法」，「槓桿比率」最低要求為下列何者？","o":["3%","5%","7%","9%"],"a":0,"e":"答案(A)。依現行「銀行資本適足性及資本等級管理辦法」，槓桿比率（第一類資本淨額÷暴險總額）不得低於3%。","c":9,"f":2,"ap":["H9-26","E11-40"]},{"i":"H9-27","q":"計算Basel II 之「表內」風險性資產與信用風險的資本計提額，銀行之資本適足率(BIS)須滿足三條件，銀行之合格資本$4,500,000，下列敘述何者錯誤？","o":["槓桿比率＝核心資本÷總資產≧4%","第一類資本÷風險性資產≧4%","(第一類資本＋第二類資本＋第三類資本) ÷ 風險性資產≧8%","如總資產$100,000,000，則槓桿比率＝4%"],"a":3,"e":"答案(D)。講義整理Basel II表內三條件：(A)槓桿比率＝核心資本÷總資產≧4%、(B)第一類資本÷風險性資產≧4%、(C)(第一類＋第二類＋第三類資本)÷風險性資產≧8%，均正確。(D)錯誤：槓桿比率分子為核心資本（第一類資本），題目只給合格資本4,500,000（含第二、三類資本），無法據以算出槓桿比率；即使直接相除，4,500,000÷100,000,000＝4.5%，也不是4%。","c":9,"f":3,"ap":["H9-27","E4-45","E10-55"]},{"i":"H9-28","q":"依銀行資本適足性及資本等級管理辦法規定，銀行本行及合併之資本適足比率，在第一類資本比率上應符合下列何者？","o":["不得低於7%","不得低於8.5%","不得低於9.5%","不得低於10.5%"],"a":1,"e":"答案(B)。銀行本行及合併之資本適足比率須符合：普通股權益比率不得低於7%、第一類資本比率不得低於8.5%、資本適足率不得低於10.5%。(A)7%為普通股權益比率標準，(D)10.5%為資本適足率標準。","c":9,"f":2,"ap":["H9-28","E16-39"]},{"i":"H9-29","q":"某銀行的資本適足率為9.5%、第一類資本比率為8.0%、普通股權益比率7.5%，依據銀行資本等級劃分標準，應為下列何者？","o":["資本適足","資本不足","資本顯著不足","資本嚴重不足"],"a":1,"e":"答案(B)。資本適足須同時符合普通股權益比率≧7%、第一類資本比率≧8.5%、資本適足率≧10.5%。本題資本適足率9.5%＜10.5%、第一類資本比率8.0%＜8.5%，未達法定標準，屬資本不足；但資本適足率9.5%仍高於8.5%，未落入資本顯著不足（2%以上未達8.5%），故為資本不足。","c":9,"f":3,"ap":["H9-29","E13-53","E23-25"],"n":"資本適足率8.5%<9.5%<10.5%，第一類資本比率8.0%<8.5%，屬於資本不足等級。"},{"i":"H9-30","q":"根據2025 年起的法規，銀行的資本等級被劃分為「資本顯著不足」，表示此銀行：","o":["資本適足比率達2%以上，但未達8.5%","資本適足比率未達2%","資本適足比率達9%","資本適足比率達10%"],"a":0,"e":"答案(A)。資本等級劃分：資本適足＝符合7%／8.5%／10.5%三項標準；資本不足＝未達法定標準；資本顯著不足＝資本適足率達2%以上、未達8.5%；資本嚴重不足＝資本適足率低於2%（淨值占資產總額低於2%者亦視為嚴重不足）。(B)為資本嚴重不足；(C)(D)未達10.5%者屬資本不足，並非顯著不足。","c":9,"f":2,"ap":["H9-30","E20-39"]},{"i":"H9-31","q":"依銀行資本適足性及資本等級管理辦法規定，銀行的資本等級被劃分為「資本嚴重不足」，表示此銀行：","o":["資本適足比率未達2%","資本適足比率達2%以上但未達8.5%","資本適足比率達8.5%以上但未達10.5%","資本適足比率達10.5%"],"a":0,"e":"答案(A)。資本嚴重不足指資本適足率低於2%；另銀行淨值占資產總額比率低於2%者，亦視為資本嚴重不足，主管機關應自列入之日起90日內派員接管。(B)為資本顯著不足；(C)資本適足率8.5%以上未達10.5%屬資本不足；(D)達10.5%（且其他比率亦符合）為資本適足。","c":9,"f":2,"ap":["H9-31","E16-40"]},{"i":"H9-32","q":"臺灣的銀行資本分為四個等級，倘若銀行計劃使用「現金」分配盈餘，或以「現金」買回其流通在外股份，必須達到下列何種等級以上？","o":["資本適足","資本不足","資本顯著不足","資本嚴重不足"],"a":0,"e":"答案(A)。依銀行法規定，資本等級為資本不足、顯著不足或嚴重不足之銀行，不得以現金分配盈餘或買回其股份；因此須達「資本適足」等級，才能以現金分配盈餘或以現金買回流通在外股份。","c":9,"f":2,"ap":["H9-32","E10-33"]},{"i":"H9-33","q":"針對銀行發行「金融債券」，資本適足率應達到的標準，下列何者錯誤？","o":["普通股權益比率達百分之七","第一類資本比率達百分之八點五","資本適足比率達百分之十一點五","未達資本適足率最低標準，但經主管機關核准發行最低面額新臺幣一千萬元"],"a":2,"e":"答案(C)。銀行發行金融債券，其資本適足比率應達法定標準：普通股權益比率7%、第一類資本比率8.5%、資本適足率10.5%，(C)所稱11.5%錯誤。(A)(B)正確；(D)未達最低標準者，須經主管機關核准方得發行，且最低面額為新臺幣一千萬元，亦為題目所列之正確規定。","c":9,"f":2,"ap":["H9-33","E15-53"]},{"i":"H9-34","q":"臺灣的主管機關對於資本等級不同的銀行，規範的業務項目也跟著不同，下列敍述何者錯誤？","o":["資本適足等級之銀行，可辦理「財富管理」業務","要在中國大陸設立代表人辦事處，最近半年的資本適足率須達到10%以上","銀行呈現資本不足時，主管機關便得「限制或禁止」其與利害關係人之授信或其他交易","銀行的資本等級若屬於資本不足、顯著不足或嚴重不足，主管機關可命令銀行或其負責人在期限內，提出資本重建或其他財務業務改善計畫"],"a":2,"e":"答案(C)。依銀行法第44條之2，「限制或禁止與利害關係人相關之授信或其他交易」屬於資本「顯著不足」時的監理措施；資本不足時，主管機關係命令提出資本重建或財務業務改善計畫、限制新增風險性資產等，故(C)錯誤。(A)資本適足者可辦理財富管理業務；(B)在中國大陸設立代表人辦事處，須最近半年資本適足率達10%以上（教材所列標準，參見第3屆第34題）；(D)資本不足、顯著不足或嚴重不足者，主管機關均可命令限期提出資本重建或改善計畫，皆正確。","c":9,"f":2,"ap":["H9-34","E8-33"]},{"i":"H9-35","q":"有關銀行業務限制，下列敘述何者錯誤？","o":["資本不足者，主管機關得限制新增風險性資產","資本顯著不足者，主管機關得限制轉投資","資本不足者，主管機關得禁止與利害關係人授信或其他交易","資本顯著不足者，主管機關得限制存款利率不得超過其他銀行同性質存款"],"a":2,"e":"答案(C)。限制或禁止與利害關係人之授信或其他交易，是對「資本顯著不足」銀行的措施，不是資本不足。(A)資本不足者得限制新增風險性資產，正確；(B)限制轉投資、(D)限制存款利率不得超過其他銀行同性質存款，皆屬資本顯著不足之措施，正確。","c":9,"f":2,"ap":["H9-35","E11-52"]},{"i":"H9-36","q":"銀行因資本適足率而受到之業務規範與限制，下列敘述何者正確？ A.投資金融相關事業，其屬同一業別者，以一家為限 B.資本適足等級之銀行可發行現金儲值卡，惟金管會可限制該資本適足等級之銀行，只辦「避險」目的之衍生性業務，不可承作「交易目的」 C.申請轉投資金融相關事業的資本計提，自2020 年開始改採國際作法，細分成重大投資、非重大投資及交叉持股三部分 D.銀行的資本等級屬於資本顯著不足，不得使用現金分配盈餘，惟可以現金買回流通在外股份","o":["僅AC","僅BC","僅AD","僅CD"],"a":0,"e":"答案(A)。A正確：依銀行法第74條，銀行投資金融相關事業屬同一業別者，除配合政府政策經核准外，以一家為限。C正確：轉投資金融相關事業之資本計提，2020年起改採國際作法，分為重大投資、非重大投資及交叉持股三部分。B錯誤：「只能承作避險目的、不得承作交易目的衍生性商品」是對資本適足率未達標準銀行的限制，不會加諸於資本適足等級之銀行。D錯誤：依銀行法第44條之1，資本不足以下等級（含顯著不足）既不得以現金分配盈餘，也不得以現金買回其股份。","c":9,"f":3,"ap":["H9-36","E12-53","E21-25"]},{"i":"H9-37","q":"依銀行法第74 條規定，銀行得投資「金融相關事業」及「非金融相關事業」，下列何者錯誤？","o":["投資總額不得超過投資時銀行淨值之百分之四十","投資非金融相關事業之總額不得超過投資時淨值之百分之十","投資金融相關事業，其屬同一業別者，除配合政府政策，經主管機關核准者外，以一家為限","投資非金融相關事業，對每一事業之投資金額不得超過該被投資事業實收資本總額或已發行股份總數之百分之三"],"a":3,"e":"答案(D)。依銀行法第74條，商業銀行投資非金融相關事業，對每一事業之投資金額不得超過該被投資事業實收資本總額或已發行股份總數之5%，不是3%。(A)投資總額不得超過投資時淨值40%、(B)其中投資非金融相關事業總額不得超過淨值10%、(C)金融相關事業同一業別以一家為限，皆正確。","c":9,"f":3,"ap":["H9-37","E15-52","E18-25"],"n":"商業銀行投資非金融相關事業，對每一事業之投資金額不得超過該被投資事業實收資本總額 或已發行股份總數之百分之五。"},{"i":"H9-38","q":"有關金融控股公司之合格資本，應包括下列哪些項目？A.普通股 B.特別股 C.商譽 D.按持股比例乘於子公司合格資本 E.次順位債券","o":["僅AE","僅ABE","僅ACD","ABCDE"],"a":1,"e":"答案(B)。金融控股公司之合格資本＝普通股、特別股、次順位債券、預收資本、公積、累積盈虧及其他權益之合計，減除商譽及其他無形資產、遞延資產及庫藏股後之餘額。故A普通股、B特別股、E次順位債券屬之；C商譽為「減除」項目；D按持股比例乘子公司合格資本，屬計算「集團」合格資本淨額之項目，不是金控公司本身之合格資本。","c":9,"f":3,"ap":["H9-38","E16-54","E19-27"]},{"i":"H9-39","q":"金融控股公司的資本適足率管理，須符合下列哪些？A.子公司應符合各業別資本適足性之相關規範 B.金融控股公司資本適足率須大於100% C.金融控股公司槓桿比率須大於6% D.金融控股公司負債比率小於100%","o":["僅A、B","僅A、B、C","僅B、C、D","A、B、C、D"],"a":0,"e":"答案(A)。依「金融控股公司合併資本適足性管理辦法」，A金控之子公司應符合各業別資本適足性規範、B集團資本適足率（集團合格資本淨額÷集團法定資本需求）不得低於100%。C槓桿比率大於6%、D負債比率小於100%均非該辦法之規定。","c":9,"f":3,"ap":["H9-39","E10-38","E22-54"]},{"i":"H9-40","q":"臺灣「金融控股公司合併資本適足性管理辦法」，除要求金融控股公司之子公司，應符合各業別資本適足性之相關規範，還要求整個集團的資本適足率，不得低於下列何者？","o":["100%","150%","200%","250%"],"a":0,"e":"答案(A)。金控公司以合併基礎計算之資本適足率＝集團合格資本淨額÷集團法定資本需求，不得低於100%，且各子公司應符合各業別資本適足性規範。","c":9,"f":2,"ap":["H9-40","E9-34"]},{"i":"H9-41","q":"金融控股公司申請辦理各子公司的共同行銷業務，其資本適足率至少須達多少以上？","o":["100%","120%","150%","200%"],"a":0,"e":"答案(A)。金融控股公司申請辦理各子公司間之共同行銷業務，其最近一次申報以合併基礎計算之資本適足率須達100%以上。","c":9,"f":2,"ap":["H9-41","E9-35"]},{"i":"H9-42","q":"有關金融控股公司的資本適足率與業務限制，下列敘述何者錯誤？","o":["計算集團子公司之合格資本，如屬信託業、期貨業及創業投資事業，則以帳列淨值計算","申請辦理集團子公司間的共同行銷業務，金融控股公司必須最近一次申報之以合併基礎計算之資本適足率未低於150%","計算集團子公司之法定資本需求，如屬信託業、期貨業及創業投資事業，係以全部自有資產總額減除應收稅款及預付稅款後之50%","「金融控股公司合併資本適足性管理辦法」，定義金控公司以合併基礎計算資本適足率，且其子公司應符合各業別資本適足性之相關規範"],"a":1,"e":"答案(B)。金控公司申請辦理子公司間共同行銷，其合併基礎資本適足率須未低於100%，不是150%。(A)信託業、期貨業及創業投資事業之合格資本以帳列淨值計算；(C)其法定資本需求以全部自有資產總額減除應收稅款及預付稅款後之50%計算；(D)金控以合併基礎計算資本適足率且子公司應符合各業別規範，皆為辦法之規定。","c":9,"f":3,"ap":["H9-42","E8-43","E20-54"]},{"i":"H9-43","q":"有關「金融機構合併法」與「金融控股公司法」，下列敘述何者錯誤？","o":["「金融機構合併法」旨在規範金融同業的合併","「金融控股公司法」旨在規範金融「異業」的合併","金控公司可為各金融子公司的一人股東，排除公司法對公開發行公司「股東須在7 人以上」的規定","要成為金控公司的「銀行、證券及保險子公司」，持股須在20%以上，或擁有三分之一以上董事席次"],"a":3,"e":"答案(D)。依金融控股公司法第4條，「控制性持股」係指持有一銀行、保險公司或證券商已發行有表決權股份總數或資本總額超過25%，或直接、間接選任或指派其過半數之董事；(D)所稱20%以上或三分之一董事席次錯誤（講義註記50%或二分之一，實為「其他子公司」之標準）。(A)合併法規範同業合併、(B)金控法規範異業整合、(C)金控可為子公司之一人股東、排除公司法股東人數規定，皆正確。","c":9,"f":3,"ap":["H9-43","E5-36","E6-44"],"n":"持股須在50%以上，或擁有2 分之一以上董事席次。","g":"講義註記「持股50%以上」與金控法第4條（銀行/保險/證券子公司為超過25%或過半數董事）不符；答案(D)不受影響"},{"i":"H9-44","q":"金融控股公司的資本適足率管理未達標準，主管機關得採行下列哪些措施？A.盈餘不得以現金分配、B.限制給付董事、監察人酬勞、C.命令限期裁撤子公司之分支機構或部門、D.命令其於一定期間內處分所持有被投資事業之股份","o":["僅A","僅A、B","僅B、C、D","A、B、C、D"],"a":3,"e":"答案(D)。金控公司合併資本適足率未達標準時，主管機關得視情節採取：A盈餘不得以現金分配、B限制給付董事、監察人酬勞、C命令限期裁撤子公司之分支機構或部門、D命令於一定期間內處分所持有被投資事業之股份等措施，四項皆屬之。","c":9,"f":2,"ap":["H9-44","E13-26"]},{"i":"H9-45","q":"有關金控集團合格資本淨額各項扣除數，下列扣除對象的敘述，何者正確？A.依創業投資公司之方法計算者，該子公司之「資本溢額」B.依保險公司計算自有資本之子公司來自資本性質債券之資本溢額，補充其他保險業資本缺額後之數額的三分之一C.已自集團合格資本總額中扣除之投資帳列金額，不再計入集團法定資本需求","o":["僅AB","僅AC","僅BC","ABC"],"a":1,"e":"答案(B)。依「金融控股公司合併資本適足性管理辦法」第4條，集團合格資本淨額之扣除項目包括：A依創業投資事業方法計算之子公司「資本溢額」；C已自集團合格資本總額中扣除之投資帳列金額，不再計入集團法定資本需求。B錯誤：保險子公司來自資本性質債券之資本溢額，補充其他保險業資本缺額後之數額，應扣除「二分之一」而非三分之一。","c":9,"f":2,"ap":["H9-45","E18-54"],"n":"金融控股公司合併資本適足性管理辦法第4 條 ……補充其他保險業資本缺額後之數額之二分之一……"},{"i":"H9-46","q":"有關金控公司之敘述，下列何者正確？A.金控公司對信託子公司持股至少50%，才具有控制權B.金控公司對所有非金融相關事業總投資，不得超過金控公司淨值15% C.金控公司對創業投資子公司的持股，不得超過被投資公司股份總數10%","o":["僅AB","僅AC","僅BC","ABC"],"a":0,"e":"答案(A)。A正確：信託子公司屬金控法第4條之「其他子公司」，須持有已發行有表決權股份或資本總額超過50%（或過半數董事）才具控制權。B正確：依金控法第37條，金控投資非金融相關事業之投資總額不得超過金控淨值15%。C錯誤：依金控法第36條，金控公司可投資創業投資事業，並無持股不得超過10%之限制。","c":9,"f":2,"ap":["H9-46","E14-26"],"n":"根據金融控股公司法第36 條，金控公司可投資創業投資事業，無限制持股總數規定。"},{"i":"H10-1","q":"保險業使用下列何者衡量資本適足率？","o":["風險基礎資本額","槓桿比率","負債比率","固定長期適合率"],"a":0,"e":"答案(A)。保險業以「風險基礎資本額」(RBC)制度衡量資本適足率，即自有資本÷風險資本之比率。(B)槓桿比率主要用於銀行；(C)負債比率、(D)固定長期適合率為一般財務結構指標，非保險業資本適足率之衡量方式。","c":10,"f":2,"ap":["H10-1","E10-51"]},{"i":"H10-2","q":"關於保險公司申請從事衍生性金融商品交易之資格，請問其資本適足率至少須達多少以上？","o":["150%","200%","250%","300%"],"a":2,"e":"答案(C)。依「保險業從事衍生性金融商品交易管理辦法」第5條，保險業從事增加投資效益目的之衍生性金融商品交易，自有資本與風險資本之比率須達資本適足法定標準之1.25倍以上；出題當時（舊制RBC）法定標準為200%，故為200%×1.25＝250%。(A)150%為舊制資本不足區間下限、(B)200%為舊制法定最低標準、(D)300%為舊制「資本充裕」門檻，均非本題門檻。","c":10,"f":1,"ap":["H10-2"],"n":"保險業從事衍生性金融商品交易管理辦法第5條：自有資本與風險資本之比率，達資本適足之法定標準1.25倍以上，得從事增加投資效益目的之衍生性金融商品交易。","g":"本題依舊制RBC（法定標準200%）作答；2026年起保險業改採TW-ICS新制，資本適足法定標準改為100%（講義資本等級表採新制：適足100%以上、不足50%～未達100%、顯著不足25%～未達50%、嚴重不足低於25%），若依新制換算門檻將不同，考試以官方答案(C)為準"},{"i":"H10-3","q":"票券金融公司資本適足率低於6%者，主管機關可採行下列哪些措施？A.解除負責人職務 B.命令取得或處分特定資產，應先經主管機關核准C.命令處分特定資產 D.命令對負責人之報酬予以降低","o":["僅A","僅A、D","僅B、C、D","A、B、C、D"],"a":3,"e":"答案(D)。票券金融公司資本適足率低於6%者，主管機關得視情節輕重採取：解除負責人職務、命令取得或處分特定資產應先經核准、命令處分特定資產、限制轉投資或部分業務、命令對負責人之報酬予以降低等措施，A、B、C、D皆屬之。","c":10,"f":4,"ap":["H10-3","E5-50","E6-45","E9-32"]},{"i":"H10-4","q":"票券金融公司的資本適足率，不得低於多少？","o":["7.00%","8.00%","10.50%","13.00%"],"a":1,"e":"答案(B)。票券金融公司之資本適足率不得低於8%；未達8%者不得設立分公司、不得以現金分配盈餘或買回股份。(C)10.5%為商業銀行資本適足率標準；(D)13%為票券保證背書可達淨值5.5倍之門檻。","c":10,"f":2,"ap":["H10-4","E19-25"]},{"i":"H10-5","q":"台灣的票券金融公司資本適足率未達多少時，不得設立分公司？","o":["未達6%","未達8%","未達10%","未達12%"],"a":1,"e":"答案(B)。票券金融公司資本適足率不得低於8%，未達8%者不得設立分公司、不得以現金分配盈餘或買回其股份，且不得對負責人發放報酬以外之給付。","c":10,"f":3,"ap":["H10-5","E13-22","E15-23"]},{"i":"H10-6","q":"票券金融公司的資本適足率在6%以上，未達8%，主管機關得採行下列哪些措施？A.不得以現金分配盈餘 B.不得以現金買回流通在外股份C.限期提出資本重建計畫 D.限期提出財務業務改善計畫","o":["僅ABC","僅CD","僅BCD","ABCD"],"a":3,"e":"答案(D)。資本適足率6%以上未達8%，即低於8%法定標準：A不得以現金分配盈餘、B不得以現金買回股份；主管機關並得C、D命令限期提出資本重建或其他財務業務改善計畫，以及限制新增風險性資產、限制短期票券保證背書業務等，四項皆屬之。","c":10,"f":2,"ap":["H10-6","E16-24"]},{"i":"H10-7","q":"票券金融公司之資本適足率須達到多少以上，才可辦理外幣債券及股權商品的投資？","o":["8%","9%","10%","12%"],"a":2,"e":"答案(C)。依講義整理，票券金融公司資本適足率須達10%以上，才可辦理外幣債券及股權商品之投資。(A)8%是票券金融公司資本適足率的法定最低標準（未達者不得設立分公司、不得以現金分配盈餘）；(B)9%、(D)12%均非規定門檻（另13%為短期票券保證背書總餘額可達淨值5.5倍之門檻）。","c":10,"f":4,"ap":["H10-7","E8-32","E17-23","E22-23"]},{"i":"H10-8","q":"A 票券金融公司之資本適足率為13%，其辦理短期票券之保證、背書總餘額不得超過其淨值多少？","o":["5.5 倍","5 倍","4.5 倍","4 倍"],"a":0,"e":"答案(A)。依講義整理，票券金融公司資本適足率達13%者，其辦理短期票券之保證、背書總餘額不得超過其淨值之5.5倍。","c":10,"f":3,"ap":["H10-8","E8-53","E16-53"]},{"i":"H10-9","q":"證券商資本適足率計算範圍包括下列哪些？A.市場風險 B.交易對象風險 C.執行業務疏誤所生之風險 D.流動性風險","o":["僅A","僅A、B","僅A、B、C","A、B、C、D"],"a":2,"e":"答案(C)。證券商資本適足率之計算範圍包括市場風險、交易對象風險、作業風險（即執行業務疏誤所生之風險）及基礎風險，A、B、C屬之；D流動性風險不在計算範圍內。","c":10,"f":2,"ap":["H10-9","E10-50"]},{"i":"H10-10","q":"證券商的資本適足率，計算的風險範圍包括下列哪些？A.市場風險 B.交易對象風險 C.基礎風險 D.財富管理通路風險","o":["僅A","僅AB","僅ABC","ABCD"],"a":2,"e":"答案(C)。證券商資本適足率計算之風險範圍為市場風險、交易對象風險、作業風險及基礎風險，故A、B、C正確；D財富管理通路風險並非計算項目。","c":10,"f":2,"ap":["H10-10","E21-54"]},{"i":"H10-11","q":"就臺灣證券商的資本適足率辦法規定，證券金融公司的資本適足率須至少高於下列何者？","o":["100%","150%","200%","250%"],"a":1,"e":"答案(B)。依講義整理，證券金融公司／證券商之資本適足率須至少高於150%；低於150%時主管機關得暫緩其增加新種業務。","c":10,"f":4,"ap":["H10-11","E9-33","E17-26","E21-26"]},{"i":"H10-12","q":"關於證券商之資本適足率規範，下列敘述何者錯誤？","o":["資本適足率會影響包銷有價證券的規模","資本適足率連續3 個月達250%以上，對客戶的融資總金額可達淨值的400%","資本適足率低於150%時，主管機關得暫緩增加新種業務","資本適足率連續6 個月均超過250%時，可申請經營衍生性金融商品業務"],"a":3,"e":"答案(D)。證券商申請經營衍生性金融商品業務，條件為最近6個月資本適足率均超過200%，不是250%。(A)資本適足率影響包銷有價證券規模、(B)連續3個月達250%以上，對客戶融資總金額可達淨值400%、(C)低於150%時主管機關得暫緩增加新種業務，皆正確。","c":10,"f":2,"ap":["H10-12","E8-34"]},{"i":"H10-13","q":"證券商辦理衍生性金融商品業務，須符合資格為下列何者？","o":["最近3 個月資本適足率均超過100%","最近3 個月資本適足率均超過150%","最近6 個月資本適足率均超過150%","最近6 個月資本適足率均超過200%"],"a":3,"e":"答案(D)。證券商辦理衍生性金融商品業務，須最近6個月資本適足率均超過200%。(A)(B)(C)之期間或比率均不符規定。","c":10,"f":2,"ap":["H10-13","E10-53"]},{"i":"H10-14","q":"有關證券業在不同資本適足率下之業務規範及限制，下列敘述何者錯誤？","o":["證券商申請辦理有價證券借貸業務、有價證券買賣融資融券、證券業務借貸款項時，申請日前半年的資本適足率應達150%以上","證券商申請合併，合併前6 個月的資本適足率，均須達到200%以上，且申請前1 個月之「擬制性合併」的資本適足率應達200%以上","證券商包銷有價證券時，包銷總金額不得超過其流動資產減流動負債後餘額之20 倍；自有資本適足率低於120%時，不得超過10 倍","證券商辦理融資融券時，若資本適足率連續3個月達250%以上時，可以提高承作規模至融資或融券的總金額，分別不得超過淨值的 400%"],"a":2,"e":"答案(C)。證券商包銷有價證券，包銷總金額不得超過其流動資產減流動負債後餘額之15倍；自有資本適足率低於120%時，不得超過5倍。(C)所稱20倍、10倍錯誤。(A)(B)(D)為講義所列之正確規範（融資融券連續3個月達250%以上時，融資或融券總金額分別不得超過淨值400%）。","c":10,"f":3,"ap":["H10-14","E8-9","E20-27"]},{"i":"H10-15","q":"證券商資本適足率高於100%，但低於120% ，應提列多少比率的特別盈餘公積？","o":["10%","20%","30%","40%"],"a":3,"e":"答案(D)。證券商特別盈餘公積提列：資本適足率未達100%者，全部結餘數提列；100%～未達120%者提列40%；120%～未達150%者提列20%。故高於100%但低於120%應提列40%。","c":10,"f":2,"ap":["H10-15","E11-53"]},{"i":"H11-1","q":"依據「金融機構存款及其他各種負債準備金調整及查核辦法」，有關銀行存款負債應提「存款準備金」的敘述，下列何者不應納入？","o":["支票存款","活期存款","定期存款","庫存現金"],"a":3,"e":"答案(D)。依「金融機構存款及其他各種負債準備金調整及查核辦法」第3條，應提存準備金之存款範圍為支票存款、活期存款、儲蓄存款及定期存款。庫存現金是「實際準備金」的構成資產（第7條），不是應提準備之存款負債。","c":11,"f":2,"ap":["H11-1","E8-51"]},{"i":"H11-2","q":"銀行「存款準備金」之構成項目中，下列項目何者錯誤？","o":["儲蓄存款","庫存現金","在臺灣銀行開立「票據交換清算帳戶」之存款","在央行或受託管理機構開立之存款準備金甲戶與乙戶之存款"],"a":0,"e":"答案(A)。依辦法第7條，實際準備金以庫存現金、在央行或受託收管機構所開準備金帳戶（甲戶、乙戶）之存款，以及經央行認可之結算／清算專戶存款為限，故(B)(C)(D)屬之。(A)儲蓄存款是「應提」準備金的存款負債，不是準備金的構成項目。","c":11,"f":2,"ap":["H11-2","E8-39"]},{"i":"H11-3","q":"下列何者不屬於「存款準備」部位的項目？","o":["庫存現金","存款負債","存款準備金帳戶餘額","跨行業務清算基金專戶的存款"],"a":1,"e":"答案(B)。存款準備部位（實際準備）由庫存現金、存款準備金帳戶餘額、跨行業務結算（清算）專戶存款等資產構成；(B)存款負債是計算「應提準備」的基礎（負債面），不屬於準備部位。","c":11,"f":4,"ap":["H11-3","E8-40","E18-37","E23-59"]},{"i":"H11-4","q":"下列哪項「會計科目」屬於負債，不可當作流動準備的資產項目？","o":["金融業互拆淨貸差","金融業互拆淨借差","超額準備","持有政府公債"],"a":0,"e":"答案(A)。會計上「借差」為借方餘額（拆出大於拆入，屬資產），「貸差」為貸方餘額（拆入大於拆出，屬負債）。故金融業互拆淨貸差屬負債，不能作為流動準備資產；(B)互拆淨借差、(C)超額準備、(D)政府公債皆可列為流動準備資產。","c":11,"f":6,"ap":["H11-4","E5-47","E8-41","E10-60","E14-36","E20-59"]},{"i":"H11-5","q":"新臺幣存款的類別中，支票存款的法定準備率為何？","o":["9.75%","10.025%","10.75%","11.00%"],"a":3,"e":"答案(D)。依講義所列新臺幣存款準備率：支票存款11%、活期存款10.025%、活期儲蓄存款5.75%、定期存款5.25%、定期儲蓄存款4.25%，故支票存款為11.00%。(B)10.025%是活期存款的準備率；(C)10.75%是2011年1月至2022年6月的支票存款準備率；(A)9.75%無對應規定。注意：央行其後於2022/10/1、2024/7/1、2024/10/1各再調升1碼（0.25個百分點），2024/10/1起支票存款為11.75%、活期存款為10.775%，但應試仍以題庫答案(D)作答。","c":11,"f":2,"ap":["H11-5","E16-36"],"n":"各類新臺幣存款準備率：支票存款11%、活期存款10.025%、活期儲蓄存款5.75%、定期存 款5.25%、定期儲蓄存款4.25%。","g":"存款準備率已再調整：講義的11%為2022/7/1起的數字，之後2022/10/1、2024/7/1、2024/10/1各調升1碼，現行支票存款11.75%、活期存款10.775%（央行「存款及其他各種負債準備率」表）；本題依題庫答案作答"},{"i":"H11-6","q":"主管機關為強化銀行風險承擔能力，規定本國銀行辦理購置住宅加計修繕貸款及建築貸款餘額之備抵呆帳提存比率，屬於「不動產」的貸款須提列多少比率？","o":["1%","1.5%","2%","2.5%"],"a":1,"e":"答案(B)。主管機關為強化本國銀行不動產貸款之風險承擔能力，要求購置住宅加計修繕貸款及建築貸款餘額之備抵呆帳提存比率應至少達1.5%。","c":11,"f":3,"ap":["H11-6","E8-54","E11-39"],"n":"為強化本國銀行不動產貸款風險承擔能力，不動產貸款備抵呆帳提存比率應至少達1.5%。"},{"i":"H11-7","q":"下列哪種金融工具本質上屬於「見票即付」的支付工具？","o":["本票","匯票","支票","所有票據"],"a":2,"e":"答案(C)。支票為見票即付之「支付工具」，發票人委託金融業者於見票時無條件支付；匯票與本票通常可記載到期日，屬「信用工具」，故(A)(B)(D)不正確。","c":11,"f":2,"ap":["H11-7","E17-10"],"n":"匯票、本票屬於信用工具。"},{"i":"H12-1","q":"信用風險的產生，主要係因下列何者或交易對手的經營體質出現惡化或發生其他不利因素（如企業與往來對象發生糾紛），導致客戶不依契約內容履行其付款義務，而使銀行產生違約損失的風險？","o":["存款人","借款人","保證人","擔保品提供人"],"a":1,"e":"答案(B)。信用風險係指借款人或交易對手因經營體質惡化或其他不利因素，不依契約履行付款義務，使銀行產生違約損失的風險。(A)存款人是銀行的債權人，不構成銀行信用風險；(C)(D)保證人、擔保品提供人屬於債權保障（回收風險）面向。","c":12,"f":4,"ap":["H12-1","E2-42","E4-41","E10-39"]},{"i":"H12-2","q":"有關信用風險的資產分類與風險權數，下列敘述何者錯誤？","o":["借款期間愈長，信用風險愈低","借款期間愈長，信用風險愈高","借款人的信用評等不同，即以「風險權數」反映其差異","若借款人提供抵押品，計提自有資本時，可「向下」調整風險性資產"],"a":0,"e":"答案(A)。借款期間愈長，不確定性愈高，信用風險「愈高」，故(A)錯誤、(B)正確。(C)借款人信用評等不同即以風險權數反映差異；(D)提供合格抵押品時，計提自有資本可向下調整風險性資產，皆正確。","c":12,"f":2,"ap":["H12-2","E8-11"]},{"i":"H12-3","q":"有關表內業務的信用風險的敘述，下列何者錯誤？","o":["備抵呆帳覆蓋率的值越大，銀行信用風險越低","風險權數越高的授信資產，銀行的信用風險越低","借戶的信用等級越差，表示銀行的信用風險越大","借戶提供合格擔保品時，銀行會隨著信用風險降低，而減少風險性資產與自有資本的計提"],"a":1,"e":"答案(B)。風險權數越高的授信資產，代表銀行承擔的信用風險越「高」，故(B)錯誤。(A)備抵呆帳覆蓋率越大，承受損失能力越強；(C)借戶信用等級越差，信用風險越大；(D)提供合格擔保品可降低風險性資產與資本計提，皆正確。","c":12,"f":2,"ap":["H12-3","E21-31"]},{"i":"H12-4","q":"辦理客戶申貸時，為確保債權及降低信用損失，會要求客戶提供相關文件，下列敘述何者錯誤？","o":["要求客戶提供硬式資訊，如薪資所得、職位等","要求客戶提供軟式資訊，如往來關係、借款者願景等","將硬式資訊及軟式資訊轉換成制度性文件，即為授信契約","接受客戶高階主管個人作保當作抵押，稱為內部抵押(Inside Collateral)"],"a":3,"e":"答案(D)。內部抵押是銀行要求企業提供本身的不動產或動產當擔保品；要求企業高階主管個人作保屬於「外部抵押」，故(D)錯誤。(A)硬式資訊如薪資所得、職位，(B)軟式資訊如往來關係、借款者願景，(C)將兩者轉換成制度性文件即授信契約，皆正確。","c":12,"f":2,"ap":["H12-4","E16-55"]},{"i":"H12-5","q":"銀行辦理授信業務時，何者屬於借戶的軟式資訊(Soft Information)？","o":["年齡","薪資所得","營業收入","經營理念"],"a":3,"e":"答案(D)。軟式資訊是難以量化的質性資訊，如往來關係、借款者願景、經營理念；(A)年齡、(B)薪資所得、(C)營業收入可客觀量化，屬硬式資訊。","c":12,"f":2,"ap":["H12-5","E17-11"]},{"i":"H12-6","q":"銀行授信時，除內部抵押，通常在何種情況會要求外部抵押？","o":["申貸企業信用風險明顯降低","債權銀行信用風險明顯降低","申貸企業信用風險明顯提高","債權銀行信用風險明顯提高"],"a":2,"e":"答案(C)。銀行一般以內部抵押（企業本身資產）為主要擔保途徑；當借款企業經營體質轉差、信用風險明顯提高時，才會另外要求外部抵押，例如要求企業高階主管作保。","c":12,"f":2,"ap":["H12-6","E11-46"]},{"i":"H12-7","q":"自2017 年12 月31 日起，借款人以自用住宅做為十足擔保，設定抵押權於債權銀行以取得資金者，有關「風險權數」之敘述，下列何者正確？","o":["一律僅適用45%風險權數","貸放比率在75%以下之貸款，適用25%的風險權數","貸放比率在75%以下之貸款，適用35%的風險權數","貸放比率在75%以上之貸款，適用55%的風險權數"],"a":2,"e":"答案(C)。依講義，自2017年12月31日起，以自用住宅十足擔保之貸款，貸放比率(LTV)在75%以下者，適用35%風險權數。(A)一律45%、(B)25%、(D)55%均不符規定。","c":12,"f":3,"ap":["H12-7","E13-30","E21-30"]},{"i":"H12-8","q":"依主管機關現行資本適足率規定，以「非自用住宅」當作擔保品，其風險權數應如何訂定？","o":["一律以貸放比率(Loan to Value；LTV)為基礎劃分","一律適用100%風險權數","一律適用75%風險權數","一律適用45%風險權數"],"a":2,"e":"答案(C)。依講義所列現行規定，以「非自用住宅」當作擔保品之貸款，一律適用75%風險權數，不以貸放比率區分；以LTV劃分權數（75%以下適用35%）是自用住宅之規定。","c":12,"f":2,"ap":["H12-8","E11-29"]},{"i":"H12-9","q":"金融機構業務上所謂的「KYC」為下列何者？","o":["Know Your Customer","Know Your Clerk","Know Your Case","Know Your Circumstance"],"a":0,"e":"答案(A)。KYC即Know Your Customer（充分了解客戶），常與KYP（Know Your Product，充分瞭解商品）搭配，以確保銷售給客戶之商品或服務適合該客戶。","c":12,"f":2,"ap":["H12-9","E15-37"]},{"i":"H12-10","q":"有關財富管理業務的特性，下列何項內容不適當？","o":["評等對象是借款客戶","執行「Know Your Customer；KYC」步驟在於瞭解客戶風險等級","進行「KYP」步驟在於說明金融商品的風險等級","業務適合度係依客戶的KYC 與KYP 來認定"],"a":0,"e":"答案(A)。財富管理業務的評等對象是財富管理（投資）客戶，評估其風險承受等級，而不是借款客戶，故(A)不適當。(B)KYC瞭解客戶風險等級、(C)KYP說明商品風險等級、(D)依KYC與KYP認定業務適合度，皆正確。","c":12,"f":3,"ap":["H12-10","E11-17","E21-50"],"n":"評等對象是財富管理客戶。"},{"i":"H12-11","q":"IFRS 9的估計方式以下列何者為基礎？","o":["歷史損失經驗模式","有限損失認列模式","預期信用損失模式","實際損失認列模式"],"a":2,"e":"答案(C)。IFRS 9以「預期信用損失模式」(Expected Credit Loss)估計減損，取代IAS 39的已發生損失模式，須前瞻性地提列預期損失。","c":12,"f":2,"ap":["H12-11","E12-40"]},{"i":"H12-12","q":"客戶的「直接放款風險」，通常使用下列何者衡量暴露風險？","o":["借款金額","還款金額","未還清餘額","融資額度"],"a":2,"e":"答案(C)。直接放款的暴露風險以客戶目前的「未還清餘額」衡量，即違約時銀行實際暴露的金額；(A)原借款金額、(D)融資額度均不等於當下暴險，(B)還款金額已非暴險。","c":12,"f":3,"ap":["H12-12","E13-27","E20-56"]},{"i":"H12-13","q":"下列金融業務何者較不會衍生信用風險？","o":["應收帳款承購業務","財富管理業務","自用住宅貸款業務","擔保信用狀業務"],"a":1,"e":"答案(B)。財富管理業務以收取手續費為主，銀行不直接承擔客戶違約的付款義務，較不會衍生信用風險；(A)應收帳款承購、(C)自用住宅貸款、(D)擔保信用狀，銀行都承擔借款人或被保證人違約之信用暴險。","c":12,"f":3,"ap":["H12-13","E16-28","E21-56"]},{"i":"H12-14","q":"學理上，當借款企業之總資產低於總負債時，可能逐漸無法「還本付息」，接著出現逾期、催收與呆帳、宣告破產；此種可能發生的違約事件，將使銀行承擔鉅額的信用損失。此類違約事件，發生初期屬於下列何種性質？","o":["經濟違約","技術性違約","借款人未符合契約要求","負債價值低於資產"],"a":0,"e":"答案(A)。借款企業總資產（市值）低於總負債，即市場淨值為負，屬「經濟違約」，是違約事件發生初期的性質，之後才可能出現逾期、催收、呆帳及破產。(B)技術性違約指未遵守契約條款；(D)負債價值低於資產為正常狀態。","c":12,"f":2,"ap":["H12-14","E9-37"]},{"i":"H12-15","q":"銀行經營業務面對違約行為的挑戰，下列敘述何者錯誤？","o":["客戶的市場「淨值」為負，稱為經濟違約","逾期放款、催收款及呆帳，屬於尚未履行付款義務之違約","交易對手未遵守契約規定的違約，稱為技術性違約","掌握擔保品的處分權與第三人的保證，即無違約問題"],"a":3,"e":"答案(D)。擔保品處分權與第三人保證只能在違約時降低損失（屬回收風險管理），無法消除違約的發生，故(D)錯誤。(A)市場淨值為負為經濟違約、(B)逾期放款、催收款及呆帳屬尚未履行付款義務之違約、(C)未遵守契約規定為技術性違約，皆正確。","c":12,"f":2,"ap":["H12-15","E13-54"]},{"i":"H12-16","q":"已知借款客戶的帳面價值為100 億元，總資產的市場價值為60 億元，總負債的市場價值為75 億元，請問銀行產生的違約類型如何？","o":["會產生經濟違約","會產生技術性違約","會產生流動性違約","不會有任何影響"],"a":0,"e":"答案(A)。判斷經濟違約看市場價值：總資產市值60億元－總負債市值75億元＝－15億元，市場淨值為負，故產生經濟違約；帳面價值100億元與判斷無關。","c":12,"f":2,"ap":["H12-16","E18-29"]},{"i":"H12-17","q":"下列何種違約屬於「尚未履行付款義務」的違約？","o":["逾期放款","經濟違約","技術性違約","預借現金"],"a":0,"e":"答案(A)。「尚未履行付款義務」之違約包括逾期放款、催收款及呆帳。(B)經濟違約為市場淨值為負；(C)技術性違約為未遵守契約規定；(D)預借現金為信用卡業務，並非違約類型。","c":12,"f":2,"ap":["H12-17","E8-44"]},{"i":"H12-18","q":"下列何種違約屬於「尚未履行付款義務」的違約？A.逾期放款 B.經濟違約 C.技術性違約 D.預借現金 E.催收款","o":["僅AB","僅AE","僅ACD","僅CDE"],"a":1,"e":"答案(B)。尚未履行付款義務之違約，包括逾期放款、催收款及呆帳，故A逾期放款與E催收款屬之；B經濟違約（市場淨值為負）、C技術性違約（未遵守契約條款）不屬之，D預借現金不是違約。","c":12,"f":3,"ap":["H12-18","E12-27","E16-29"]},{"i":"H12-19","q":"銀行透過5P 衡量申貸客戶之信用品質，5P不包含下列何者？","o":["Performance","Purpose","Prospective","People"],"a":0,"e":"答案(A)。授信5P為People（借款戶）、Purpose（資金用途）、Payment（償還來源）、Protection（債權保障）、Perspective/Prospective（授信展望），不包含Performance。","c":12,"f":3,"ap":["H12-19","E6-14","E10-15"]},{"i":"H12-20","q":"下列哪項內容不符合消費金融的授信5P 原則？","o":["資產取得或債務償還屬於「資金用途」的說明範圍","客戶所得來源屬於「還款來源」的說明範圍","申貸時有否提供擔保品或請第三人保證，屬於「債權保障」的說明範圍","客戶的責任感、發展潛力和其他特質，屬於「授信展望」的說明範圍"],"a":3,"e":"答案(D)。客戶的責任感、發展潛力和其他特質屬於「借款戶(People)」的說明範圍；「授信展望(Perspective)」是預估貸放後的基本風險與預期報酬。(A)資金用途、(B)還款來源、(C)債權保障之敘述皆正確。","c":12,"f":2,"ap":["H12-20","E13-47"]},{"i":"H12-21","q":"銀行授信業務使用的信用評等，分成哪兩種來源？","o":["國內評等與國際評等","標準評等法與進階評等法","內部評等與外部評等","自我評等與公開評等"],"a":2,"e":"答案(C)。銀行授信使用的信用評等來源分為「內部評等」（銀行自建模型）與「外部評等」（信用評等機構）兩種。(B)標準法與內部評等法是資本計提方法，非評等來源。","c":12,"f":2,"ap":["H12-21","E9-21"]},{"i":"H12-22","q":"臺灣自哪一年開始，信用風險的資本計提，可以使用「內部評等法」？","o":["2005 年","2006 年","2007 年","2008 年"],"a":2,"e":"答案(C)。依講義，臺灣自2007年起，信用風險之資本計提包括標準法與內部評等法，銀行可使用內部評等法。","c":12,"f":4,"ap":["H12-22","E2-48","E4-46","E9-39"]},{"i":"H12-23","q":"有關信用風險的「標準法」，下列敘述何者錯誤？","o":["「標準法」是依授信對象之信用等級，決定風險權數","授信對象之信用等級，隨著違約機率而改變","授信對象之違約機率，反映市場風險大小","資產規模、市場展望等因素，皆可作為估算違約機率之重要指標"],"a":2,"e":"答案(C)。授信對象之違約機率反映的是「信用風險」大小，不是市場風險，故(C)錯誤。(A)標準法依授信對象信用等級決定風險權數、(B)信用等級隨違約機率而改變、(D)資產規模、市場展望等可作為估算違約機率之指標，皆正確。","c":12,"f":2,"ap":["H12-23","E13-29"]},{"i":"H12-24","q":"下列何者屬於正確的風險管理概念？","o":["經濟資本又稱風險資本，屬於官方協助建立模型計提的資本需求額","不論競爭情勢是否激烈，金融業務成本均須納入「風險成本」項目","標準法計提的資本需求額，稱為「管制資本」或「法定資本」","實務上，「資本風險」又稱「風險資本」或「償債能力風險」"],"a":2,"e":"答案(C)。依主管機關標準法計提的資本需求額稱為「管制資本」或「法定資本」，正確。(A)經濟資本由銀行依自身風險胃納以內部模型估算，非官方協助建立；(B)「不論競爭情勢」一律納入風險成本過於絕對；(D)資本風險指資本不足以支應損失（償債能力）之風險，「風險資本」則是承擔風險所需資本，兩者不同。","c":12,"f":2,"ap":["H12-24","E6-2"]},{"i":"H12-25","q":"信用風險標準法設定的風險權數，遵循「信用等級越差，權數越高」原則，當授信對象為政府機關時，有關信用等級與適用權數，下列何者錯誤？","o":["AAA 至AA─，0%","A+至A─，10%","BBB+至BBB─，50%","BB+至B─，100%"],"a":1,"e":"答案(B)。標準法對政府機關之風險權數：AAA至AA－為0%、A+至A－為20%、BBB+至BBB－為50%、BB+至B－為100%、CCC+以下150%、未評等100%。(B)A級應為20%，不是10%。","c":12,"f":2,"ap":["H12-25","E14-29"]},{"i":"H12-26","q":"信用風險的標準法，風險權數的大小，遵循「信用等級越差，風險權數越高」原則，當授信對象為一般企業時，有關信用等級與適用權數，下列何者錯誤？","o":["AAA 至AA-，0%","A+至A-，50%","BBB+至BB-，100%","BB-以下，150%"],"a":0,"e":"答案(A)。標準法對一般企業債權，AAA至AA－之風險權數為20%，不是0%（0%是對AAA至AA－政府機關的權數），故(A)錯誤。A+至A－為50%，(B)正確；依Basel II，BBB+至BB－為100%、BB－以下為150%，(C)(D)為題目所列之舊制權數。","c":12,"f":2,"ap":["H12-26","E19-31"],"g":"講義表列新制企業BBB級權數為75%，依新制(C)亦不完全正確；以Basel II舊制作答，(A)為最明確錯誤"},{"i":"H12-27","q":"銀行的授信客戶集中在信用等級不佳的企業，常理上使用何種方法，計提的資本額較少？","o":["內部模型法","內部評等法","標準法","與計提方法無關"],"a":2,"e":"答案(C)。標準法之風險權數有上限（最高150%，未評等100%），而內部評等法依個別客戶違約機率估算，信用等級不佳者的權數可能遠高於標準法；因此授信客戶集中在信用不佳企業時，採標準法計提的資本額較少。(A)內部模型法用於市場風險。","c":12,"f":4,"ap":["H12-27","E7-34","E12-55","E20-31"]},{"i":"H12-28","q":"銀行自行建立的內部評等法，優點中未包括下列何者？","o":["反應個別客戶之違約風險","反應個別客戶之暴露風險","反應個別客戶之回收風險","反應個別客戶之作業風險"],"a":3,"e":"答案(D)。內部評等法的優點在於能反應個別客戶的違約風險、暴露風險及回收風險（即信用風險的三種組成風險）；作業風險屬另一類風險，並非信用風險內部評等法所反映。","c":12,"f":2,"ap":["H12-28","E13-3"]},{"i":"H12-29","q":"信用風險的「內部評等法」，依據授信對象的「信用等級」，決定「風險權數」；目前國內銀行常用的信用等級資訊來源，下列敘述何者錯誤？","o":["公開資訊觀測站資訊","信用評等機構的信用資訊","銀行自行建立的信用評分模型","金融聯合徵信中心(JCIC)提供的「信用資料庫」"],"a":0,"e":"答案(A)。國內銀行常用的信用等級資訊來源為信用評等機構、金融聯合徵信中心(JCIC)信用資料庫，以及銀行自行建立的信用評分模型；公開資訊觀測站提供公司揭露之財務及重大訊息，並非信用等級資訊來源。","c":12,"f":3,"ap":["H12-29","E18-28","E22-28"]},{"i":"H12-30","q":"Basel II 及III在世界各國推動以來，國際性銀行即朝向標準法和內部評等法併行發展，但實施內部評等法的銀行估計違約機率時，須搭配多少年以上之授信資料？","o":["2 年","5 年","7 年","10 年"],"a":1,"e":"答案(B)。依Basel規範，實施內部評等法的銀行估計違約機率時，須搭配至少5年以上的授信（歷史）資料。","c":12,"f":2,"ap":["H12-30","E12-46"]},{"i":"H12-31","q":"資本適足率為10.5%的大直銀行，使用內部評等法，對AAA 級授信客戶，設定14%風險權數，低於標準法使用的20%，若該銀行承作此客戶10 億元「無擔保授信」，請問兩種方法相差多少資本計提額？","o":["0.6 億元","0.063 億元","0.112 億元","0.128 億元"],"a":1,"e":"答案(B)。資本計提額＝授信金額×風險權數×資本適足率。兩法差額＝10億×(20%－14%)×10.5%＝10億×6%×10.5%＝0.063億元。","c":12,"f":2,"ap":["H12-31","E11-55"],"n":"10 億 × (20%-14%) × 10.5% = 0.063"},{"i":"H12-32","q":"銀行為發揮內部評等制度法(Internal Rating-Based Approach, IRB)的管理功能，除了必須建立信用評等制度的機制外，尚需建立之制度，下列敘述何者錯誤？","o":["風險調整後之資本報酬率(RaROC)","風險資本(Capital at Risk)","法定資本","經濟資本(Economic Capital, EC)"],"a":2,"e":"答案(C)。銀行為發揮內部評等法(IRB)的管理功能，除信用評等機制外，還需建立風險調整後資本報酬率(RaROC)、風險資本、經濟資本等制度；「法定資本」是依主管機關標準法計提的資本，並非IRB需另外建立的制度。","c":12,"f":4,"ap":["H12-32","E4-43","E5-44","E11-25"]},{"i":"H12-33","q":"下列何者不屬於內部評等制度法(Internal Rating-Based Approach, IRB)之信用風險資本計提的決定因素？","o":["違約機率","存續期間","違約損失率","信用暴險值"],"a":1,"e":"答案(B)。依講義，內部評等法信用風險資本計提的決定因素為違約機率(PD)、違約損失率(LGD)及信用暴險值(EAD)；存續期間（衡量利率敏感度之指標）不屬之。補充：Basel IRB另有「有效到期期間(M)」參數，應注意區別。","c":12,"f":2,"ap":["H12-33","E11-26"],"g":"Basel IRB公式另含有效到期期間(M)，若將「存續期間」解讀為到期期間則有爭議；依講義答(B)"},{"i":"H12-34","q":"銀行根據風險胃納、策略及管理所需建立之損失機率範圍，進一步計算非預期損失的資本需求額，名稱為下列何者？","o":["法定資本","經濟資本","已投入資本","緩衝資本"],"a":1,"e":"答案(B)。經濟資本是銀行依自身風險胃納、策略及管理需要建立之損失機率範圍（信賴水準），計算「非預期損失」所需的資本。(A)法定資本依主管機關規定計提；(C)已投入資本為實際投入之資本。","c":12,"f":2,"ap":["H12-34","E14-42"]},{"i":"H12-35","q":"為避免承擔過高的信用風險，銀行會以客戶和產業為對象訂定風險限額。經由銀行內部自建的評等模型，計算出「表內業務」的風險限額稱為下列何者？","o":["信用風險值","授信總餘額","融資額度","信用暴險額"],"a":0,"e":"答案(A)。銀行藉由內部自建評等模型，綜合違約機率、信用暴險額及違約損失率計算出的風險限額，稱為「信用風險值」。(B)授信總餘額、(C)融資額度、(D)信用暴險額皆非模型計算之風險限額。","c":12,"f":2,"ap":["H12-35","E16-17"]},{"i":"H12-36","q":"銀行藉由內部評等模型計算出的風險限額，稱為下列何者？","o":["信用風險值","違約機率","逾放比率","市場風險值"],"a":0,"e":"答案(A)。藉由內部評等模型計算出的風險限額稱為「信用風險值」。(B)違約機率是模型投入參數；(C)逾放比率為資產品質指標；(D)市場風險值衡量市場風險。","c":12,"f":2,"ap":["H12-36","E12-15"]},{"i":"H12-37","q":"有關信用風險值，下列哪些敘述正確？A.計算過程需考慮違約機率、信用曝險額和違約損失率 B.信賴水準高低會影響信用風險值大小 C.無法反映未來的潛在風險 D.可以公允衡量授信主管應承擔之授信權利和責任","o":["僅 A、C","僅 A、B、C","僅 A、B、D","僅 B、C、D"],"a":2,"e":"答案(C)。A計算信用風險值需考慮違約機率、信用暴險額與違約損失率；B信賴水準越高，信用風險值越大；D可公允衡量授信主管應承擔之授信權利和責任，皆正確。C錯誤：信用風險值是對未來可能損失的預估，正可反映未來潛在風險。","c":12,"f":3,"ap":["H12-37","E9-49","E22-51"]},{"i":"H12-38","q":"下列何種風險不包括在客戶「信用風險值」的計算過程？","o":["違約風險(Default Risk)","回收風險(Recovery Risk)","暴露風險(Exposure Risk)","作業風險(Operation Risk)"],"a":3,"e":"答案(D)。信用風險值由信用風險的三種組成風險計算：違約風險、暴露風險與回收風險；作業風險屬另一類風險，不在信用風險值計算過程中。","c":12,"f":5,"ap":["H12-38","E13-2","E15-7","E17-1","E19-1"]},{"i":"H12-39","q":"授信業務的系統性信用風險，不包括哪項影響因素？","o":["產業環境","總體環境","政治及社會因素","個別借款客戶"],"a":3,"e":"答案(D)。系統性信用風險來自產業環境、總體經濟、政治及社會等共同因素；個別借款客戶因素屬「非系統性」信用風險。","c":12,"f":3,"ap":["H12-39","E14-17","E20-19"]},{"i":"H12-40","q":"銀行的交易對手發現，衍生性交易明顯不利於自己時，可能選擇「不履約」，稱為下列何種風險？","o":["交割日風險","交割前的風險","直接放款風險","間接放款風險"],"a":1,"e":"答案(B)。交割前風險（交割日之前的風險）係指從事衍生性交易時，交易對手發現交易明顯不利於自己，基於自利選擇不履約，使銀行承受重置成本損失。(A)交割日風險是交割當時對手未履約，可能損失全額名目本金。","c":12,"f":2,"ap":["H12-40","E20-28"]},{"i":"H12-41","q":"有關信用風險的衡量類型，不包含下列何者？","o":["直接放款風險","或有風險（如承兌）","交割日風險","交割後風險"],"a":3,"e":"答案(D)。信用風險的衡量類型包括直接放款風險、或有風險（如承兌、保證）、交割日風險及交割前風險；交割完成後代表雙方已履約，不再有信用風險，故無「交割後風險」。","c":12,"f":3,"ap":["H12-41","E14-28","E22-56"],"n":"交割後代表履約，無信用風險。"},{"i":"H12-42","q":"有關信用風險之類型，下列敘述何者錯誤？","o":["直接放款風險：係指借款人或債券發行公司於還本利息到期時，無法兌現債務承諾的風險","或有負債：係指借款人的債務承諾，於還款到期時可能無法履約構成之風險","交割日風險：係指銀行與交易對手，從事衍生性商品交易，遇有價格大幅變動，交易對手基於自利或誠信不足，選擇不履約，而使銀行承受信用損失之風險","信用風險區分為借貸風險或發行者風險與交易對手風險"],"a":2,"e":"答案(C)。(C)所述「價格大幅變動時交易對手基於自利選擇不履約」是交割「前」風險的定義；交割日風險是指交易對手未能依約在交割時履行義務，使銀行可能發生與名目本金相同金額之損失。(A)直接放款風險、(B)或有負債、(D)信用風險分為借貸／發行者風險與交易對手風險，皆正確。","c":12,"f":2,"ap":["H12-42","E19-55"],"n":"C為交割日之前的風險，交割日風險定義為：交易對手未能依照契約規定，在交割時間履行 義務，導致銀行發生與名目本金相同金額的損失。"},{"i":"H12-43","q":"國際清算銀行(Bank for International Settlements, BIS)之巴賽爾委員會推動資本適足管理，針對授信業務的風險管理制度，除傳統指標外，透過內部評等法(Internal Rating-Based Approach, IRB)開始重視風險量化指標，但不包括下列何者？","o":["違約風險","暴露風險","回收風險","市場風險"],"a":3,"e":"答案(D)。巴賽爾委員會透過內部評等法重視的信用風險量化指標為違約風險、暴露風險及回收風險（對應PD、EAD、LGD）；市場風險屬另一類風險，不在授信業務信用風險量化指標內。","c":12,"f":4,"ap":["H12-43","E9-36","E16-27","E19-28"]},{"i":"H12-44","q":"下列何種風險不屬於描述客戶信用風險的「風險值」計算種類？","o":["違約風險(Default Risk)","回收風險(Recovery Risk)","暴露風險(Exposure Risk)","作業風險(Operation Risk)"],"a":3,"e":"答案(D)。描述客戶信用風險的風險值，由違約風險、回收風險及暴露風險構成；作業風險不屬於信用風險值的計算種類。","c":12,"f":3,"ap":["H12-44","E3-1","E11-1"]},{"i":"H12-45","q":"銀行爰用「信用風險值」當作放款權限設置準則時，下列何者屬於無法反映的個別客戶風險？","o":["市場風險","違約風險","暴露風險","回收風險"],"a":0,"e":"答案(A)。信用風險值由個別客戶的違約風險、暴露風險及回收風險計算而得，因此以其作為放款權限設置準則時，無法反映市場風險（利率、匯率等市場價格變動之風險）。","c":12,"f":2,"ap":["H12-45","E14-1"]},{"i":"H12-46","q":"下列何者不屬於回收風險的構成因素？","o":["擔保品","息票利率","第三人保證","契約保障條款"],"a":1,"e":"答案(B)。回收風險的構成因素為擔保品、第三人保證及契約保障條款，均攸關違約後可回收金額；息票利率是債券／借款之計息條件，與違約後回收無關。","c":12,"f":3,"ap":["H12-46","E15-41","E17-7"]},{"i":"H12-47","q":"實務上，銀行的「債權管理」存在回收風險，該回收風險包括下列何者？A.擔保品風險 B.第三人保證的風險 C.簽訂的法律契約風險","o":["僅A","僅B","僅C","ABC"],"a":3,"e":"答案(D)。銀行債權管理之回收風險來自三方面：擔保品風險（價值、變現性）、第三人保證的風險（保證人履約能力）及簽訂之法律契約（契約保障條款）風險，A、B、C皆屬之。","c":12,"f":2,"ap":["H12-47","E21-28"]},{"i":"H12-48","q":"有關授信業務之回收風險構成因素及其效益，不包含下列何者？","o":["契約保障條款：效益為積極採取法律行動矯正","擔保品：效益為將信用風險移轉為資產風險","建立拍賣市場：效益為損失回收","第三人保證：效益為風險由借款人移轉為借款人與保證人"],"a":2,"e":"答案(C)。回收風險構成因素及效益：契約保障條款－積極採取法律行動矯正；擔保品－將信用風險移轉為資產風險；第三人保證－風險由借款人移轉為借款人與保證人。「建立拍賣市場」並非回收風險的構成因素。","c":12,"f":2,"ap":["H12-48","E17-56"]},{"i":"H12-49","q":"為降低回收風險，某銀行採用以下作法：甲、完全採用信評機構的估計值；乙、降低借款人的貸放比率(Loan-To-Value)；丙、以無次級市場的實質資產當作擔保品；丁、只接受借款人提供之擔保品，不須連帶保證。上述哪些作法不適當？","o":["甲乙丙","乙丙丁","甲乙丁","甲丙丁"],"a":3,"e":"答案(D)。甲：完全採用信評機構估計值，未依自身資料評估，不適當；乙：降低貸放比率(LTV)可提高擔保保障，適當；丙：以無次級市場的實質資產為擔保品，難以變現，不適當；丁：只接受擔保品而不要求連帶保證，減少債權保障，不適當。故甲丙丁不適當。","c":12,"f":2,"ap":["H12-49","E9-54"]},{"i":"H12-50","q":"有關授信案之回收風險，下列敘述何者錯誤？","o":["銀行訴諸法律，用意在請求法院裁定財產之處分權，以回收相關借款","擔保品及第三人保證，是因應違約發生採取之債權保障措施，為備而不用之風險管理制度","客戶違約時，銀行沒收或出售擔保品，以降低或消除信用損失，同時將信用風險移轉為回收風險與資產價值風險","回收風險具體反映在擔保品之帳面價值"],"a":3,"e":"答案(D)。回收風險取決於違約時擔保品可處分變現的市場價值（及保證人清償能力），而非擔保品的帳面價值，故(D)錯誤。(A)訴諸法律在請求法院裁定財產處分權、(B)擔保品與保證為備而不用之債權保障、(C)處分擔保品將信用風險移轉為回收風險與資產價值風險，皆正確。","c":12,"f":4,"ap":["H12-50","E12-54","E15-28","E20-55"]},{"i":"H12-51","q":"有關信用風險的類型與暴露風險，下列敘述何者錯誤？","o":["土建融案件之擔保品風險使用擔保成數衡量，亦即實際貸款額佔可貸值的比率(Loan-to-Value)，擔保成數越高，銀行債權保障越低","授信客戶未依還款計畫逕自提前還款，構成「提前還款風險」(Prepayment Risk)，性質類似「再投資風險」","衍生性業務之「當期暴險額」，反映目前的暴露風險，有別於反映未來可能存在風險之「潛在暴險額」","信用額度內未被動用之授信資產，稱為「放款承諾」，此項承諾使銀行承擔或有之「再投資風險」"],"a":3,"e":"答案(D)。信用額度內未動用之授信資產（放款承諾），客戶隨時可能動用，使銀行承擔或有的「再融資風險」（須籌資因應動用），不是再投資風險，故(D)錯誤。(A)擔保成數越高債權保障越低、(B)提前還款風險類似再投資風險、(C)當期暴險額反映目前暴險而潛在暴險額反映未來風險，皆正確。","c":12,"f":2,"ap":["H12-51","E14-55"]},{"i":"H12-52","q":"假設借款客戶的信用暴險額及違約損失率已知，只有違約機率是變動且未知時，關於衡量回收風險之信用損失，下列敘述何者正確？","o":["信用損失＝信用暴險額×違約機率－違約損失率","信用損失＝信用暴險額×違約機率×（1－回收率）","信用損失＝信用暴險額×違約機率－回收率","信用損失＝信用暴險額×違約機率"],"a":1,"e":"答案(B)。信用損失＝信用暴險額×違約機率×違約損失率，而違約損失率＝1－回收率，故信用損失＝信用暴險額×違約機率×(1－回收率)。(A)(C)以「減」計算錯誤；(D)未考慮回收部分。","c":12,"f":2,"ap":["H12-52","E8-36"]},{"i":"H12-53","q":"已知某借款客戶的信用暴險額為100 億元，預估違約機率為5%，呆帳回收率為80%，則該借款客戶預估的信用損失應為多少？","o":["1 億元","2 億元","3 億元","4 億元"],"a":0,"e":"答案(A)。信用損失＝信用暴險額×違約機率×(1－回收率)＝100億×5%×(1－80%)＝100億×0.05×0.2＝1億元。","c":12,"f":2,"ap":["H12-53","E11-54"],"n":"100 億 × 5% × (1 – 80%) = Ans"},{"i":"H12-54","q":"銀行有四個借款戶A、B、C、D，借款金額相同，其違約機率分別為0.3%、0.5%、0.8%、1%，回收率分別為50%、20%、30%、70%，在其他因素均一樣下，四個客戶之信用風險高低為何？","o":["C>B>D>A","D>C>B>A","D>C>A>B","D>A>C>B"],"a":0,"e":"答案(A)。以預估信用損失比較（借款金額相同）：A＝0.3%×(1－50%)＝0.0015；B＝0.5%×(1－20%)＝0.004；C＝0.8%×(1－30%)＝0.0056；D＝1%×(1－70%)＝0.003。由高到低C(0.0056)＞B(0.004)＞D(0.003)＞A(0.0015)。","c":12,"f":3,"ap":["H12-54","E15-54","E17-29"],"n":"A 預估的信用損失：借款金額 × 0.3% × (1-50%) = 借款金額 × 0.0015 B 預估的信用損失：借款金額 × 0.5% × (1-20%) = 借款金額 × 0.004 C 預估的信用損失：借款金額 × 0.8% × (1-30%) = 借款金額 × 0.0056 D 預估的信用損失：借款金額 × 1.0% × (1-70%) = 借款金額 × 0.003"},{"i":"H12-55","q":"A銀行的信用等級為AAA─，B銀行的信用等級為A+，當B銀行買入A銀行發行之七年期金融債券新臺幣1億元時，B銀行持有此筆金融債券，構成多少信用風險性資產？","o":["1 億元","0.5 億元","0.2 億元","0"],"a":2,"e":"答案(C)。金融債券屬對本國銀行之債權，依發行銀行（A銀行，AAA－級）之信用等級適用20%風險權數；持有銀行（B銀行）自身的等級與權數無關。風險性資產＝1億×20%＝0.2億元。","c":12,"f":2,"ap":["H12-55","E14-30"],"n":"金融債券為對本國銀行之債權，風險權數為20% 表內項目計提信用風險之計算：風險性資產 = 資產1 億×風險權數20% = Ans"},{"i":"H12-56","q":"依Basel II 估計表外非衍生性商品的風險性資產時，下列敘述何者錯誤？","o":["信用相當額＝交易金額×信用轉換係數","風險性資產＝信用相當額×風險權數","信用轉換係數有0%、20%、50%、100%","風險權數有0%、20%、50%、100%"],"a":3,"e":"答案(D)。表外非衍生性項目：(A)信用相當額＝交易金額×信用轉換係數，(B)風險性資產＝信用相當額×風險權數，(C)信用轉換係數有0%、20%、50%、100%，皆正確。(D)錯誤：依講義，估計表外非衍生性商品的風險性資產時，風險權數只有0%、20%、100%三種，(D)多列了50%，勿與(C)信用轉換係數的四級混淆。","c":12,"f":1,"ap":["H12-56"]},{"i":"H12-57","q":"衍生性業務的「當期暴險額」，加上「潛在暴險額」後，等於什麼金額？","o":["風險性資產","信用相當額","衍生性的帳面金額","衍生性的名目金額"],"a":1,"e":"答案(B)。衍生性業務之信用相當額＝當期暴險額＋潛在暴險額；再乘以風險權數才得出(A)風險性資產。當期暴險額為正的重置成本，潛在暴險額＝名目本金×計算權數。","c":12,"f":2,"ap":["H12-57","E8-37"]},{"i":"H12-58","q":"有關非衍生性業務之信用風險性資產，計算過程不包括下列何者？","o":["信用相當額","交易金額","當期暴險與潛在暴險額","風險權數"],"a":2,"e":"答案(C)。非衍生性表外業務：信用相當額＝交易金額×信用轉換係數，風險性資產＝信用相當額×風險權數，故(A)(B)(D)皆在計算過程中；「當期暴險額＋潛在暴險額」是衍生性業務計算信用相當額的方式。","c":12,"f":2,"ap":["H12-58","E19-32"]},{"i":"H12-59","q":"甲銀行（賣方）與乙銀行（買方）承作CDS 合約，名目本金為100 元，若逐日清算價值(mark-to-market)為-3 元，則衍生性金融商品當期暴險額為多少？","o":["0 元","-3 元","+3 元","+100 元"],"a":0,"e":"答案(A)。當期暴險額依市價評估之重置成本計算，重置成本為正數者以該數額計，為負數或零者以零計算。本題逐日清算價值為－3元（重置成本為負），故當期暴險額為0元。","c":12,"f":2,"ap":["H12-59","E7-54"]},{"i":"H12-60","q":"C 銀行有一筆對一般企業之長期授信承諾新臺幣10 億元，已知信用轉換係數為0.5，風險權數為100%，另有當期暴險額為1 億元，則該筆承諾之信用風險性資產為下列何者？","o":["10 億元","5 億元","1 億元","0"],"a":1,"e":"答案(B)。授信承諾屬非衍生性表外項目：信用相當額＝10億×0.5＝5億元；風險性資產＝5億×100%＝5億元。題目中的「當期暴險額1億元」只適用於衍生性業務，屬干擾資訊，不納入計算。","c":12,"f":2,"ap":["H12-60","E10-54"]},{"i":"H12-61","q":"某銀行承做兩筆衍生性金融交易，其一為名目本金$200,000，期別5 年的利率交換契約，計算權數為0.005，當期暴險額為5,000，另一筆為名目本金$100,000，期別3 年的外匯交換契約，計算權數為0.05，當期暴險額為3,000，請問該銀行的潛在暴險額為何？","o":["3,000","6,000","7,000","14,000"],"a":1,"e":"答案(B)。潛在暴險額＝名目本金×計算權數之合計＝200,000×0.005＋100,000×0.05＝1,000＋5,000＝6,000。當期暴險額不計入潛在暴險額。","c":12,"f":2,"ap":["H12-61","E15-56"],"n":"潛在暴險額 = 200,000 × 0.005 + 100,000 × 0.05 = Ans"},{"i":"H12-62","q":"某銀行承做兩筆衍生性金融交易，其一為名目本金$200,000，期別5年的利率交換契約，計算權數為0.005，當期暴險額為$5,000。另一筆為名目本金$100,000，期別3年的外匯交換契約，計算權數為0.05，當期暴險額為$3,000，請問該銀行的信用相當額為何？","o":["3,000 元","6,000 元","7,000 元","14,000 元"],"a":3,"e":"答案(D)。當期暴險額＝5,000＋3,000＝8,000；潛在暴險額＝200,000×0.005＋100,000×0.05＝1,000＋5,000＝6,000；信用相當額＝當期暴險額＋潛在暴險額＝8,000＋6,000＝14,000元。","c":12,"f":3,"ap":["H12-62","E14-56","E17-57"],"n":"當期暴險額 = 5,000 + 3,000 = 8,000 潛在暴險額 = 200,000 × 0.005 + 100,000 × 0.05 = 6,000 信用相當額 = 當期暴險額 + 潛在暴險額 = 8,000 + 6,000 = Ans"},{"i":"H12-63","q":"D 銀行承作二筆衍生性金融交易：其一為名目本金新臺幣100 億元之五年期利率交換契約，適用計算權數為0.005；其二為名目本金新臺幣10 億元之三年期外匯交換契約，適用計算權數為0.05。假設利率交換契約與外匯交換契約之結算價（視為二項交換契約之當期暴險額）分別為1 億元與0.5 億元，而衍生性金融商品之風險權數為50%，則該二筆交換契約之信用風險性資產為下列何者？","o":["2.5 億元","1.25 億元","0.25 億元","0.125 億元"],"a":1,"e":"答案(B)。當期暴險額＝1＋0.5＝1.5億元；潛在暴險額＝100億×0.005＋10億×0.05＝0.5＋0.5＝1億元；信用相當額＝1.5＋1＝2.5億元；風險性資產＝2.5億×50%＝1.25億元。","c":12,"f":4,"ap":["H12-63","E11-56","E16-56","E21-57"],"n":"當期暴險額 = 1 億+0.5 億 = 1.5 億 潛在暴險額 = 100 億 × 0.005 + 10 億 × 0.05 = 1 億 信用相當額 = 當期暴險額 + 潛在暴險額 = 1.5 + 1 = 2.5 億 風險性資產 = 信用相當額 × 風險權數 = 2.5 × 0.5 = Ans"},{"i":"H12-64","q":"有關信用風險之暴險部位，下列敘述何者錯誤？","o":["暴險部位依業務性質，分成表內與表外暴險","信用額度內尚未動用的授信資產，客戶隨時可能動用，致使銀行承擔「或有」的再融資風險，但此項餘額免列示於公開說明書","表內業務之暴險部位，係指客戶目前使用之融資餘額","計提信用風險資本需求額的標準法，係以表內項目之「帳面金額」乘以風險權數，來表達「風險性資產」"],"a":1,"e":"答案(B)。信用額度內尚未動用之授信資產，客戶隨時可能動用，使銀行承擔或有的再融資風險，屬表外暴險，仍應揭露，並非免列示於公開說明書，故(B)錯誤。(A)暴險分表內與表外、(C)表內暴險為客戶目前使用之融資餘額、(D)標準法以帳面金額乘以風險權數得風險性資產，皆正確。","c":12,"f":2,"ap":["H12-64","E12-29"]},{"i":"H12-65","q":"依據銀行自有資本與風險性資產計算方法說明及表格，有關市價評估交易對手風險損失(CVA)，下列敘述何者錯誤？","o":["屬於店頭市場衍生性金融商品交易均應計提","計算風險期間為1 年","交易對手之外部信用評等愈好，則適用權數愈高","因避險目的所購買之信用違約交換，具風險抵減效果"],"a":2,"e":"答案(C)。計算CVA（市價評估交易對手信用風險損失）時，交易對手之外部信用評等愈好，適用權數愈「低」，故(C)錯誤。(A)店頭衍生性商品交易均應計提、(B)計算風險期間為1年、(D)避險目的購買之信用違約交換具風險抵減效果，皆正確。","c":12,"f":2,"ap":["H12-65","E7-37"]},{"i":"H12-66","q":"依規定授信資產分成五類，並依授信資產債權餘額一定比率提列放款損失準備，下列何者錯誤？","o":["第一類正常授信者，無須計提損失準備","第二類應予注意者，2%","第三類可望收回者，10%","第五類收回無望者，100%"],"a":0,"e":"答案(A)。依「銀行資產評估損失準備提列及逾期放款催收款呆帳處理辦法」，第一類正常授信資產須提列債權餘額（扣除對我國政府機關債權）之1%，並非無須提列。第二類2%、第三類10%、第四類50%、第五類100%，故(B)(C)(D)正確。","c":12,"f":4,"ap":["H12-66","E13-55","E17-30","E19-30"]},{"i":"H12-67","q":"2014 年1 月1 日以後，第一類屬於正常的授信資產要計提的放款損失準備，為該類授信資產債權餘額的多少比率？","o":["0.50%","1%","2%","10%"],"a":1,"e":"答案(B)。自2014年1月1日起，第一類正常授信資產應按其債權餘額（扣除對我國政府機關之債權餘額）之1%提列備抵呆帳。(C)2%為第二類、(D)10%為第三類之提列比率。","c":12,"f":3,"ap":["H12-67","E4-47","E9-44"]},{"i":"H12-68","q":"有關不良授信資產，下列述敘何者錯誤？","o":["不良授信資產比率為不良授信資產除以總授信資產之比率","不良授信資產係指第三類可望收回者至第五類收回無望者之授信資產合計","逾期放款比率為逾期放款（依法認列，還包括催收款及呆帳）對放款總額之比率","備抵呆帳覆蓋率為備抵呆帳對逾期放款（依法認列，還包括催收款及呆帳）之比率"],"a":1,"e":"答案(B)。授信資產五類中，除第一類（正常授信）外，第二類至第五類皆為不良授信資產，(B)只計第三類至第五類錯誤。(A)不良授信資產比率、(C)逾期放款比率、(D)備抵呆帳覆蓋率之定義皆正確。","c":12,"f":2,"ap":["H12-68","E16-31"]},{"i":"H12-69","q":"依據借款客戶還本付息的逾期長短分類，下列敘述何者正確？","o":["本息賒欠超過1 年者，稱為「呆帳」","本息賒欠超過6 個月者，稱為「呆帳」","本息賒欠超過3 個月者，稱為「逾期放款」","本息賒欠超過6 個月者，稱為「逾期放款」"],"a":2,"e":"答案(C)。積欠本金或利息超過清償期3個月者，稱為「逾期放款」，故(C)正確、(D)6個月錯誤。(A)(B)以逾期1年或6個月定義呆帳不正確；呆帳是經評估無法回收、依規定轉銷之債權。","c":12,"f":3,"ap":["H12-69","E7-9","E21-41"]},{"i":"H12-70","q":"有關違約、違約風險及違約事件，下列敘述何者錯誤？","o":["違約風險係由違約事件的發生機率加以描述","交易對手未遵守契約規定之違約，屬於技術性違約","逾期放款係指屆清償期達六個月以上，仍無法繳交本金或利息者","經濟違約，係指授信客戶總資產市值低於總負債市值"],"a":2,"e":"答案(C)。逾期放款係指積欠本金或利息超過清償期「3個月」者，不是6個月，故(C)錯誤。(A)違約風險以違約事件發生機率描述、(B)未遵守契約規定為技術性違約、(D)總資產市值低於總負債市值為經濟違約，皆正確。","c":12,"f":2,"ap":["H12-70","E14-54"]},{"i":"H12-71","q":"客戶申貸時，提供第三人保證可提升銀行或有債權，假設借款人與保證人的違約機率分別為1%與0.5%，隨著第三人保證，承貸銀行的違約機率成為下列何者？","o":["1.50%","1.00%","0.01%","0.005%"],"a":3,"e":"答案(D)。有第三人保證時，銀行須在借款人與保證人「同時」違約才會發生損失（假設兩者獨立），違約機率＝1%×0.5%＝0.01×0.005＝0.00005＝0.005%。","c":12,"f":3,"ap":["H12-71","E12-28","E15-29"],"n":"隨著第三人保證，客戶與第三人同時違約的機率為1%*0.5%。"},{"i":"H12-72","q":"主管機關為強化銀行對大陸地區授信暴險之風險承擔能力，要求本國銀行對大陸地區之授信餘額之備抵呆帳提存率於民國104 年年底以前應至少達到多少比率？","o":["1%","1.5%","2%","2.5%"],"a":1,"e":"答案(B)。主管機關要求本國銀行對大陸地區授信餘額之備抵呆帳提存率，於民國104年年底以前應至少達1.5%，與不動產貸款之1.5%要求相同。","c":12,"f":2,"ap":["H12-72","E9-50"]},{"i":"H12-73","q":"銀行除授信資產提列損失準備外，扣除對政府機關之債權，其餘債權統稱為非授信資產，此非授信資產亦依損失程度分成五類，有關損失準備率，下列何者錯誤？","o":["第一類為1%","第二類為2%","第三類為10%","第四類為50%"],"a":0,"e":"答案(A)。非授信資產（扣除對政府機關債權）同樣分為五類，依講義其損失準備率第一類為0%，第二類2%、第三類10%、第四類50%、第五類100%，故(A)第一類1%錯誤（1%是「授信」資產第一類之提列比率）。","c":12,"f":2,"ap":["H12-73","E16-30"],"n":"「非授信」資產損失準備率第一類為0。"},{"i":"H13-1","q":"下列何者不是市場風險的來源？","o":["利率風險","外匯風險","價格風險","法律風險"],"a":3,"e":"答案(D)。市場風險來自市場價格變動，包括利率風險、外匯（匯率）風險、價格風險（股價、商品價格）等；法律風險屬作業風險或其他風險範疇，不是市場風險的來源。","c":13,"f":2,"ap":["H13-1","E7-49"]},{"i":"H13-2","q":"當市場之利率、匯率與生產因素的價格改變，或其波動性產生變化時，這些部位的市場價值跟著下降，導致財務盈餘減少、投資損失提高者，稱為下列何種風險？","o":["操作風險","道德風險","信用風險","市場風險或價格風險"],"a":3,"e":"答案(D)。市場之利率、匯率與生產因素價格改變或其波動性變化，使部位市場價值下降、盈餘減少或投資損失提高者，稱為市場風險（價格風險）。(C)信用風險源自交易對手違約；(A)操作（作業）風險源自內部流程、人員、系統缺失或外部事件。","c":13,"f":2,"ap":["H13-2","E9-52"]},{"i":"H13-3","q":"不論單一金融商品、組合部位或全行資產負債觀點，衡量「市場風險」最常見的市場因素不包括下列何者？","o":["利率","匯率","生產要素成本","非生產要素的固定成本"],"a":3,"e":"答案(D)。衡量市場風險最常見的市場因素為利率、匯率、生產要素（商品）價格及股價等會隨市場波動之價格；「非生產要素的固定成本」不隨市場價格變動，不屬於市場風險因素。","c":13,"f":2,"ap":["H13-3","E14-57"]},{"i":"H13-4","q":"市場利率變動，導致資產負債之經濟價值跟著變動的風險，係稱為下列何種風險？","o":["再投資風險","再融資風險","市場價值風險","信用風險"],"a":2,"e":"答案(C)。市場利率變動，導致資產負債之經濟價值跟著變動的風險，稱為市場價值風險（屬利率風險）。(A)再投資風險是利率下降時再投資收益降低；(B)再融資風險是重新融資時成本上升；(D)信用風險源自交易對手違約。","c":13,"f":5,"ap":["H13-4","E5-30","E6-13","E10-13","E20-6"]},{"i":"H13-5","q":"全行的「市場風險」，依據巴賽爾委員會與金管會規範，係指資產負債表的表內及表外部位，因市場價格變動，而可能產生的已實現和未實現的損失。所稱市場價格之變動，下列敘述何者錯誤？","o":["市場利率","市場匯率","股票價格","金融負債短部位"],"a":3,"e":"答案(D)。市場風險是指利率、匯率、股價及商品價格等「市場價格」變動，使表內外部位產生已實現或未實現損失的風險，故(A)市場利率、(B)市場匯率、(C)股票價格都是市場價格變動的來源。(D)「金融負債短部位」是一種持有部位的型態，不是市場價格本身，所以錯誤。","c":13,"f":5,"ap":["H13-5","E2-49","E12-57","E17-58","E22-33"]},{"i":"H13-6","q":"中國外匯交易中心公布人民幣兌美元中間價為6.2298 元，較前一交易日重貶1.9%，此對於外國銀行在當地之授信或投資會衍生何種類型風險？","o":["信用風險","外匯風險","作業風險","流動性風險"],"a":1,"e":"答案(B)。人民幣兌美元中間價大幅貶值1.9%，代表以人民幣計價的放款或投資換回美元時價值減少，這是匯率波動造成的外匯（匯率）風險。信用風險是交易對手違約；作業風險源自人員、系統、內部作業或外部事件；流動性風險是資金調度不足，都和匯率變動沒有直接關係。","c":13,"f":3,"ap":["H13-6","E5-57","E8-31"]},{"i":"H13-7","q":"銀行基於規避匯率風險，最好保持每種幣別的資產與負債相同。所謂資產與負債相同，不包括下列何者？","o":["金額大小力求相近","到期日結構力求相近","匯率與利率走勢力求相近","平均期限(Duration)力求相近"],"a":2,"e":"答案(C)。依教材，銀行要規避匯率風險，最好讓每種幣別的資產與負債「金額、到期日結構、平均期限(Duration)」都力求相近，使匯率變動時資產與負債的價值變動互相抵銷。匯率與利率的走勢是市場決定的外生因素，銀行無法讓它「相近」，所以(C)不包括在內。","c":13,"f":3,"ap":["H13-7","E7-11","E14-7"]},{"i":"H13-8","q":"常理上銀行的「跨國授信」，不包括下列何種風險？","o":["利率風險","匯率風險","信用風險","財務風險"],"a":3,"e":"答案(D)。跨國授信以外幣貸放給國外借款人，會面臨利率變動的利率風險、幣別兌換的匯率風險，以及借款人違約的信用風險（另有國家風險）。「財務風險」一般指企業本身因融資、資本結構等財務活動產生的風險，並非銀行承作跨國授信所承擔的典型風險類型，故選(D)。","c":13,"f":3,"ap":["H13-8","E7-40","E18-21"]},{"i":"H13-9","q":"有關銀行的風險管理，下列敘述何者錯誤？","o":["表外業務須於資產負債表附註揭露","資產負債到期期限相等，銀行即不存在利率風險","透過內部模型推估風險值，須進行回溯測試","銀行應採取多軌制FTP 系統降低財務風險"],"a":1,"e":"答案(B)。資產與負債到期期限相等，不代表利率風險就不存在，例如一方是固定利率、一方是浮動利率，或重新訂價時點與基準不同，仍有重新訂價風險和基差風險，所以(B)錯誤。(A)表外業務須在附註揭露、(C)內部模型推估的風險值須做回溯測試、(D)多軌制FTP有助於降低財務風險，這三項都正確。","c":13,"f":2,"ap":["H13-9","E7-38"]},{"i":"H13-10","q":"銀行財務部門的交易員，因參與資金調撥或買賣過程，須承擔價格風險責任，則下列敘述何者錯誤？","o":["交易員通常依資金部位之交易對象和商品種類區分","交易員依交易對象區分，可分為同業互拆交易員和公司戶交易員","交易員依商品種類區分，可分為固定收益證券交易員、權益證券交易員和外匯交易員","當交易發生違約，相關交易員不須承擔信用風險，但須承擔價格風險"],"a":3,"e":"答案(D)。交易對手違約屬於信用風險，交易員對交易對手的違約仍須承擔信用風險責任，不是只承擔價格風險，所以(D)錯誤。(A)交易員通常依交易對象與商品種類區分；(B)依交易對象可分為同業互拆交易員與公司戶交易員；(C)依商品可分為固定收益證券、權益證券與外匯交易員，三項都正確。","c":13,"f":2,"ap":["H13-10","E12-59"],"n":"違約主要跟信用風險有關。"},{"i":"H13-11","q":"下列何者不屬於銀行實務上所稱「買入負債」的融資行為？","o":["在債券市場，買入「金融債券」","在貨幣市場，發行「可轉讓定期存單」","在同業拆款市場，籌措「同業融資」","在重貼現及短期融通市場，辦理「央行融資」"],"a":0,"e":"答案(A)。「買入負債」是銀行主動向市場借入資金的融資行為，例如(B)發行可轉讓定期存單、(C)籌措同業融資、(D)辦理央行融資，銀行拿到資金並支付利息。(A)買入金融債券是銀行把資金拿去投資，屬於資產，不是負債融資。","c":13,"f":4,"ap":["H13-11","E11-7","E19-7","E22-2"],"n":"買入金融債券，屬於資產。"},{"i":"H13-12","q":"下列何種資金來源，屬於銀行「非自主性」的債務？","o":["央行融資","同業融資","權益資金","存款負債"],"a":3,"e":"答案(D)。存款負債由存戶決定何時存入或提領，銀行無法主動控制金額與時點，所以屬於「非自主性」債務。(A)央行融資、(B)同業融資是銀行主動籌措的「買入負債」，屬於自主性資金來源；(C)權益資金是自有資本，不是債務。","c":13,"f":3,"ap":["H13-12","E15-32","E20-35"],"n":"存戶的資金(存款負債)較無法隨意動用。"},{"i":"H13-13","q":"銀行發行的票券或債券商品，流通在外的「未到期」餘額，實務上稱為下列何者？","o":["買入票券或債券","金融資產","金融負債","長部位"],"a":2,"e":"答案(C)。依教材，銀行自己發行的票券或債券商品，仍流通在外、尚未到期的餘額，屬於銀行要還款的債務，實務上稱為「金融負債」。(A)買入票券或債券、(B)金融資產都是銀行持有的資產；(D)長部位是指買入大於賣出的部位。","c":13,"f":2,"ap":["H13-13","E19-34"]},{"i":"H13-14","q":"銀行的資產負債大部分是金融資產與金融負債，下列何者不屬於金融資產與金融負債？","o":["利率部位","外匯部位","權益證券部位","貴金屬（不包括黃金）"],"a":3,"e":"答案(D)。利率部位、外匯部位與權益證券部位，都是由金融工具構成的金融資產或金融負債。貴金屬（不包括黃金）屬於商品部位，是實體商品，不是金融資產或金融負債。黃金在巴塞爾規範中比照外匯處理，所以題目特別把它排除。","c":13,"f":4,"ap":["H13-14","E5-3","E6-12","E7-10"]},{"i":"H13-15","q":"銀行的外匯資產遠大於國外債務時，其外匯淨部位，簡稱為下列何者？","o":["長部位","短部位","美金部位","歐元部位"],"a":0,"e":"答案(A)。外匯資產大於外匯負債（累積買入大於賣出）時，外匯淨部位為正，稱為「長部位」（買超部位）。反之，負債大於資產稱為(B)短部位（賣超部位）。(C)(D)是幣別名稱，不是部位型態。","c":13,"f":3,"ap":["H13-15","E7-6","E16-2"]},{"i":"H13-16","q":"本國銀行的美金部位為短部位時，市場出現美金貶值，則該銀行的匯率風險將如何變化？","o":["無關","不變","降低","提高"],"a":2,"e":"答案(C)。短部位是賣出大於買入，也就是外幣負債大於外幣資產。美元貶值時，要償還的美元負債換算成新臺幣反而變少，銀行會有匯兌利益，所以匯率風險降低。短部位真正怕的是外幣升值。","c":13,"f":4,"ap":["H13-16","E1-9","E2-15","E8-18"]},{"i":"H13-17","q":"銀行對外舉借期限一年、年利率1%的債務，支應兩年、年報酬率2%的資產，第一年結束，銀行在該年有利息利潤還是利息損失？原來債務一年後到期，需要重新舉債，隱含再融資風險，如果第二年新債務的年利率為3%，第二年產生利息利潤還是利息損失？","o":["第一年：1%利息利潤，第二年：1%利息損失","第一年：1%利息損失，第二年：1%利息利潤","第一年：1%利息利潤，第二年：2%利息損失","第一年：1%利息損失，第二年：2%利息利潤"],"a":0,"e":"答案(A)。第一年資產報酬率2%、負債成本1%，利差＋1%，是利息利潤。第二年舊債到期，必須以3%重新舉債，資產仍只賺2%，利差變成2%−3%＝−1%，是利息損失。這就是「借短貸長」隱含的再融資風險。","c":13,"f":2,"ap":["H13-17","E14-45"]},{"i":"H13-18","q":"甲銀行投資1 億元債券，年利率3%，同時發行1 億元定期存單，年利率2%，請問此交易一季的淨利息利潤為多少？","o":["$250,000","$1,000,000","$1,500,000","$1,750,000"],"a":0,"e":"答案(A)。淨利息利潤＝本金×利差×期間＝1億×(3%−2%)×1/4＝100,000,000×1%×0.25＝250,000元。(B)$1,000,000是一整年的淨利息，沒有換算成一季。","c":13,"f":3,"ap":["H13-18","E12-42","E19-46"],"n":"1億本金 * 年利率差額(3%-2%) * 一季(1/4) = Ans"},{"i":"H13-19","q":"本國A 銀行於承作5,000 萬美元放款時，同時發行4,500 萬美元定期存單，借貸相抵後該行擁有多少美元外幣部位？","o":["短部位500 萬美元","短部位5,000 萬美元","長部位500 萬美元","長部位5,000 萬美元"],"a":2,"e":"答案(C)。放款對銀行來說是美元資產（買入），定期存單是美元負債（賣出）。淨部位＝5,000萬−4,500萬＝＋500萬美元，買入大於賣出，所以是長部位500萬美元。","c":13,"f":3,"ap":["H13-19","E11-43","E16-1"],"n":"放款對銀行來說屬於買入資產(因放款可賺利息) 因此：買入放款5000 萬美元>賣出定存單4500 萬美元 = 長部位500 萬美元。"},{"i":"H13-20","q":"本國銀行承作1 億美元放款時，並發行0.8 億美元定期存單，若美元升值則對其會計帳會有何影響？","o":["出現匯兌獲利","出現匯兌損失","備抵呆帳需增加","備抵呆帳需減少"],"a":0,"e":"答案(A)。美元放款1億大於美元定存單0.8億，淨美元資產為＋0.2億美元，是長部位。美元升值時，這0.2億美元換算成新臺幣的價值增加，所以會出現匯兌獲利。備抵呆帳和借款人的信用品質有關，和匯率無關，(C)(D)錯誤。","c":13,"f":2,"ap":["H13-20","E11-8"],"n":"放款金額>定期存單，多放款0.2 億在外(為長部位)。假設美金比台幣原為1:30，美元升值變成1:32，代表1 美元可換更多台幣。因此本國銀行在美元升值時會有匯兌獲利。"},{"i":"H13-21","q":"下列哪項指標不是市場風險的衡量指標？","o":["利率敏感性係數","匯率敏感性係數","利率波動的敏感性係數","信用轉換係數"],"a":3,"e":"答案(D)。依教材，市場風險的衡量指標包括(A)利率敏感性係數、(B)匯率敏感性係數、(C)利率波動的敏感性係數。(D)信用轉換係數(CCF)是把表外項目轉換成信用約當金額時使用的係數，屬於信用風險的計提工具，不是市場風險指標。","c":13,"f":3,"ap":["H13-21","E1-47","E6-40"]},{"i":"H13-22","q":"衡量市場風險時，有關主要部位或個別金融商品的「價格波動」，是指市場因素在特定時間內，上下偏離平均水準，導致部位價值產生變動的程度，在統計學上稱為部位價值的變動率，此波動程度之衡量不包括下列何者？","o":["標準差","變異數","變異係數","敏感性係數"],"a":3,"e":"答案(D)。依教材，「價格波動」是部位價值偏離平均水準的程度，統計上用(A)標準差、(B)變異數、(C)變異係數等離散程度指標衡量。(D)敏感性係數是衡量市場因素變動一單位時，部位價格變動多少的指標，不是波動程度本身的衡量。","c":13,"f":6,"ap":["H13-22","E1-44","E2-50","E4-48","E5-26","E10-40"]},{"i":"H13-23","q":"計算市場風險之主要部位變動幅度，當利率、匯率或石油價格等市場因素變動「一單位」時，觀察目標部位或金融商品的價格，變動多少幅度，以下風險指標何者錯誤？","o":["風險係數","波動幅度","向下風險","敏感性係數"],"a":0,"e":"答案(A)。依教材，市場因素變動「一單位」時，目標部位價格變動幅度的衡量指標有(B)波動幅度、(C)向下風險、(D)敏感性係數。(A)「風險係數」不在其中，所以錯誤。","c":13,"f":2,"ap":["H13-23","E8-12"]},{"i":"H13-24","q":"實務上，觀察市場利率變動1 單位，對目標部位或金融商品價格的影響，此1 單位依市場慣例係指多少？","o":["0.01%","0.10%","1%","2%"],"a":0,"e":"答案(A)。依市場慣例，利率變動「1單位」是指1個基點(basis point, bp)，也就是0.01%。例如敏感性係數為5的資產，利率變動1bp，價格約變動5×0.01%＝0.05%。","c":13,"f":2,"ap":["H13-24","E8-28"]},{"i":"H13-25","q":"原為10,000 元的債券，敏感性係數為5 時，殖利率上升1 個基本點(Basis Point)，請問此時的債券價格應為多少元？","o":["9,950 元","9,500 元","9,995 元","500 元"],"a":2,"e":"答案(C)。殖利率上升1bp＝0.01%＝0.0001，價格變動率＝−敏感性係數×Δy＝−5×0.0001＝−0.05%。新價格＝10,000×(1−0.0005)＝9,995元。殖利率上升使債券價格下跌，(A)9,950是把變動算成10bp的結果。","c":13,"f":2,"ap":["H13-25","E10-59"],"n":"10,000 × [1-(5×0.0001)] = Ans"},{"i":"H13-26","q":"下列資產何者的「利率敏感性」最低？","o":["現金","股票","期貨","債券"],"a":0,"e":"答案(A)。現金沒有票面利率，也沒有未來現金流量要折現，市場利率變動不會改變它的價值，所以利率敏感性最低。債券價格與殖利率反向變動，敏感性最高；股票與期貨的價格也會受利率透過折現率或持有成本影響。","c":13,"f":2,"ap":["H13-26","E14-35"]},{"i":"H13-27","q":"當「利率敏感性係數」為5，且殖利率上升0.01%時，原來為1 百萬元的債券，市場價格將變為下列何者？","o":["999,500 元","1,000,500 元","999,100 元","1,000,100 元"],"a":0,"e":"答案(A)。價格變動率＝−5×0.01%＝−0.05%。新價格＝1,000,000×(1−0.0005)＝1,000,000−500＝999,500元。殖利率上升使債券價格下跌，所以不是(B)的1,000,500元。","c":13,"f":2,"ap":["H13-27","E13-57"]},{"i":"H13-28","q":"已知債券市值為10,000 元，PVBP(Present Value of One Basis Point)為5。利率若上升10 基點(basis point)，債券價格將成為下列何者？","o":["9,995 元","9,950 元","10,005 元","10,050 元"],"a":1,"e":"答案(B)。PVBP是殖利率變動1個基點時債券價格的變動金額，本題PVBP＝5元。利率上升10bp，價格約下跌10×5＝50元，新價格＝10,000−50＝9,950元。(A)9,995只算了1bp；(C)(D)把方向弄反，利率上升時債券價格應下跌。","c":13,"f":3,"ap":["H13-28","E12-32","E21-58"],"n":"PVBP 公式：△價格/1 基點，代表每變動1 基點(bp)價格變化程度。"},{"i":"H13-29","q":"有關市場風險中，主要部位之價格風險，下列敘述何者正確？","o":["假設債券之利率敏感係數為5，利率若變動0.01%，債券價格將變動0.05%","債券之敏感性因子主要是指利率，也就是債券之票面利率","「PVBP」係指利率變動1%，債券價格將變動多少數額","有一10,000 元之債券，敏感性係數為5，殖利率上升0.01%，將使債券價格上升5 元，成為10,005 元"],"a":0,"e":"答案(A)。敏感性係數5、利率變動0.01%，價格約變動5×0.01%＝0.05%，所以(A)正確。(B)債券的敏感性因子是市場殖利率，不是固定的票面利率；(C)PVBP是利率變動1個基點(0.01%)時價格變動的金額，不是1%；(D)殖利率上升時價格應下跌5元，變成9,995元，不是上升到10,005元。","c":13,"f":2,"ap":["H13-29","E15-57"]},{"i":"H13-30","q":"藉由「向下風險」衡量市場風險時，下列敘述何者錯誤？","o":["向下風險，著重在不利方向之變動，對部位價值之影響","以盈餘指標衡量時，向下風險係在容忍水準假設下，估算最差情況剩下多少盈餘","市場風險值=損失波動幅度×波動倍數","操作越保守，市場風險的容忍度越高，越期待投資時避免損失超過門檻"],"a":3,"e":"答案(D)。操作越保守，代表能承受的損失越小，對市場風險的容忍度應該「越低」，而且越希望投資損失不要超過門檻，所以(D)說容忍度越高是錯的。(A)向下風險著重不利方向的變動；(B)以盈餘衡量時，估算容忍水準下最差情況還剩多少盈餘；(C)市場風險值＝損失波動幅度×波動倍數，三項都正確。","c":13,"f":2,"ap":["H13-30","E13-32"]},{"i":"H13-31","q":"金融商品的賣價減去買價大於0 時，實務上如何看待？","o":["該交易呈現「資本損失」","該交易有「利息收入」","該交易有「證券交易所得」","該交易存在「價格風險」"],"a":2,"e":"答案(C)。賣價減買價大於0，表示交易有價差利得，實務上稱為「證券交易所得」（資本利得）。(A)資本損失是賣價低於買價；(B)利息收入是持有期間的孳息，和買賣價差無關；(D)價格風險是持有期間價格變動的不確定性，不是用來描述已實現的利得。","c":13,"f":5,"ap":["H13-31","E1-50","E4-53","E11-32","E16-37"]},{"i":"H13-32","q":"有關市場風險之管理指標，不包含下列何者？","o":["市場風險部位概況","市場風險之評價損益概況","市場走勢","敏感性風險因子及權益證券之市場風險值"],"a":2,"e":"答案(C)。依教材，市場風險管理指標包括(A)市場風險部位概況、(B)評價損益概況、(D)敏感性風險因子及權益證券的市場風險值。(C)「市場走勢」是外部市場的狀況，不是銀行用來管理自身市場風險的指標。","c":13,"f":2,"ap":["H13-32","E13-33"]},{"i":"H13-33","q":"依據巴賽爾委員會規範，與市場風險有關的「主要部位」不包括下列何者？","o":["外匯部位","權益證券部位","擔保放款部位","固定收益證券部位"],"a":2,"e":"答案(C)。依巴塞爾規範與教材，與市場風險有關的主要部位是交易簿的(A)外匯部位、(B)權益證券部位、(D)固定收益證券（利率）部位（另有商品部位）。(C)擔保放款屬於銀行簿的授信資產，主要承擔信用風險，不是市場風險的主要部位。","c":13,"f":3,"ap":["H13-33","E9-51","E19-33"]},{"i":"H13-34","q":"有關Basel Ⅱ之修訂重點，下列敘述何者正確？ A.以授信資產之信用等級決定風險權數 B.增訂商譽風險的資本計提標準 C.使用內部模型法計提市場風險的資本需求額 D.增列壓力測試下之增額資本計提標準","o":["僅AC","僅BC","僅BCD","ABCD"],"a":0,"e":"答案(A)。依教材，Basel II的修訂重點是「A.以授信資產的信用等級決定風險權數」，以及「C.使用內部模型法計提市場風險資本」，所以僅AC正確。B.巴塞爾協定沒有「商譽風險」的資本計提標準；D.壓力情境下的增額資本計提（如壓力風險值）是2009年後Basel 2.5／III才增訂，不屬於Basel II的修訂重點。","c":13,"f":2,"ap":["H13-34","E11-51"]},{"i":"H13-35","q":"有關市場風險標準法與內部模型法，下列敘述何者錯誤？","o":["標準法在正常情形，可使市場風險之門檻設計及風險配置更加精緻","銀行可使用內部模型法，計算各部位之市場風險值與資本計提額","常理上，內部模型法在風險衡量精細程度優於標準法，計提的資本需求額也較標準法少","銀行可使用標準法計算各部位之市場風險限額與資本計提額"],"a":0,"e":"答案(A)。標準法用主管機關訂定的固定公式與權數計提資本，比較粗略，所以使市場風險門檻設計與風險配置更精緻的是內部模型法，不是標準法，(A)錯誤。(B)(D)銀行可以用內部模型法或標準法計算風險值、限額與資本計提額；(C)一般來說，內部模型法衡量較精細，計提的資本也比標準法少，三項都正確。","c":13,"f":2,"ap":["H13-35","E14-58"]},{"i":"H13-36","q":"銀行之金融交易部有四個科，分配個別的市場風險限額如下：固定收益證券科20億元、資金調撥科10億元、權益證券科40億元、外匯商品科30億元。其中固定收益證券科再分配給二位交易員5億元及15億元，權益證券科再分配給三位交易員20億元、15億元及5億元，請問金融交易部之總市場風險限額為下列何者？","o":["100億元","80億元","70億元","60億元"],"a":0,"e":"答案(A)。總市場風險限額＝四個科的限額相加＝20億＋10億＋40億＋30億＝100億元。固定收益證券科分給交易員的5億＋15億＝20億，權益證券科分給交易員的20億＋15億＋5億＝40億，都是科內再分配，不能重複加計。","c":13,"f":2,"ap":["H13-36","E16-58"],"n":"固定收益證券科20億 + 資金調撥科10億 + 權益證券科40億 + 外匯商品科30億。"},{"i":"H13-37","q":"下列哪項部位不須提列個別市場風險的資本需求額？","o":["固定收益證券部位","利率商品部位","外匯商品部位","權益證券部位"],"a":2,"e":"答案(C)。依教材，外匯由各國央行發行，沒有個別發行人的信用或特性風險，所以外匯部位不必計提「個別市場風險」，只計提一般市場風險。固定收益證券、利率商品與權益證券部位，則須同時計提個別風險與一般市場風險。","c":13,"f":4,"ap":["H13-37","E8-56","E11-31","E15-33"]},{"i":"H13-38","q":"有關市場風險，下列敘述何者錯誤？","o":["外匯由各國央行發行，因此外匯無個別市場風險，毋須計提此類風險的資本需求額，只計提一般市場風險的資本需求額","一般市場風險反映總體經濟產生的價格波動","個別市場風險反映金融工具產生的價格波動","石油、貴金屬的價格波動風險，係由個別市場風險及一般市場風險構成"],"a":3,"e":"答案(D)。依教材，只有利率類（固定收益）與權益證券部位才分成個別市場風險和一般市場風險。外匯與商品（如石油、貴金屬）部位只計提一般市場風險，不再區分個別風險，所以(D)錯誤。(A)外匯無個別風險、(B)一般市場風險反映總體經濟造成的波動、(C)個別市場風險反映個別金融工具本身的波動，三項都正確。","c":13,"f":2,"ap":["H13-38","E12-41"]},{"i":"H13-39","q":"為避免投資人交易匯率類複雜性較高之商品，導致重大風險，主管機構限制此類的契約期限不得超過下列何者？","o":["三個月","六個月","一年","五年"],"a":2,"e":"答案(C)。依「銀行辦理衍生性金融商品業務內部作業制度及程序管理辦法」第25條之1，銀行提供客戶的複雜性高風險商品中，屬匯率類者契約期限不得超過一年，以避免投資人長期暴露在重大匯率風險中。","c":13,"f":2,"ap":["H13-39","E13-37"],"n":"銀行辦理衍生性金融商品業務內部作業制度及程序管理辦法第25-1 條 屬匯率類之複雜性高風險商品：契約期限不得超過一年。"},{"i":"H13-40","q":"假設英國政府發行5 年期的純折扣債券，到期一次還本，面額為100 英鎊，殖利率為6%，若殖利率上升1%，試問此債券價值將降低多少幅度？","o":["下跌352 英鎊","下跌35.2 英鎊","下跌3.52 英鎊","下跌0.352 英鎊"],"a":2,"e":"答案(C)。債券現值＝100/1.06^5≈74.73英鎊。存續期間＝5（零息債券的存續期間等於到期期限），修正存續期間＝5/1.06≈4.717。殖利率上升1%時，ΔP≈−4.717×74.73×1%≈−3.52英鎊，所以選(C)。若直接重新折現，100/1.07^5−100/1.06^5≈71.30−74.73≈−3.43，最接近的也是(C)。","c":13,"f":3,"ap":["H13-40","E8-47","E19-58"],"n":"[100 / (1.07)^5] – [100 / (1.06)^5] = Ans"},{"i":"H13-41","q":"假設英國政府發行5 年期零息債券，到期一次還本、面額1 百萬英鎊，市場顯示相同風險等級之5 年期殖利率為6%。當殖利率上升1%時，由敏感性係數估算之債券價值變化，下列何者正確？","o":["約-35,200 英鎊","約+35,200 英鎊","約-37,400 英鎊","約+37,400 英鎊"],"a":0,"e":"答案(A)。現值＝1,000,000/1.06^5≈747,258英鎊，修正存續期間＝5/1.06≈4.717。以敏感性係數估算，ΔP≈−4.717×747,258×1%≈−35,248，約−35,200英鎊。殖利率上升，價格下跌，所以是負號。(C)−37,400是直接用存續期間5、沒有除以1.06的結果。","c":13,"f":2,"ap":["H13-41","E12-58"],"n":"解法跟前一題一樣，只是換說法把純折扣債券寫成零息債券、把面額100 換成100 萬。"},{"i":"H13-42","q":"假設英國政府發行5 年期純折扣債券，到期一次還本、面額1 百萬英鎊，市場顯示相同風險等級之5 年期殖利率為6%。假設英鎊對美元為1:1.3 時，則英國公債之美元現值為下列何者？","o":["約971,435","約916,448","約1,029,721","約1,091,373"],"a":0,"e":"答案(A)。英鎊現值＝1,000,000/(1.06)^5≈747,258英鎊。換算成美元：747,258×1.3≈971,436，約971,435美元，所以選(A)。","c":13,"f":2,"ap":["H13-42","E10-58"],"n":"計算債券英鎊現值：100W / (1+0.06)^5 = 74.725W 英鎊 1 英鎊=1.3 美元，因此74.725W 英鎊*1.3 = Ans"},{"i":"H13-43","q":"五年期的英國純折扣債券，面額為100 英鎊，市場顯示相同風險等級的五年期殖利率為3%。若英鎊對美元的匯率為1：1.3310，則當英鎊貶值1%，債券價值將變動多少幅度？","o":["增加0.84 美元","增加0.86 美元","減少5.57 美元","減少5.74 美元"],"a":1,"e":"答案(B)。依教材的算法，債券英鎊現值＝100/(1.03)^5≈86.26，乘以英鎊貶值的1%，得到86.26×1%≈0.86，所以官方答案為(B)「增加0.86美元」。不過要注意，若按1英鎊＝1.3310美元換算，債券的美元價值約114.81，英鎊貶值1%時，美元價值應減少約1.15美元。這題的推理和變動方向都有疑義，考試時記住官方答案(B)即可。","c":13,"f":2,"ap":["H13-43","E11-58"],"n":"[100 / (1+3%)^5] = 86.26 * 0.01(貶值1%) = 0.86 美元","g":"官方算法86.26×1%＝0.86，但英鎊貶值時以美元計的價值應減少（約1.15美元），題意與變動方向有疑義"},{"i":"H13-44","q":"假設小王購買了一張期別2 年、AA 等級、平價發行的本國債券，該債券票面價值$100,000 且票面利率為每年4%，若經過一年後，該債券被信用評等機構調降評等，導致該債券的市場殖利率從原本的4%上升至5%，請問該債券因遭調降評等致債券市場價值變動多少？","o":["減少$962","減少$952","增加$952","增加$962"],"a":1,"e":"答案(B)。一年後債券剩一年到期，到期時可收到本息100,000＋4,000＝104,000元。殖利率升到5%後，價格＝104,000/1.05≈99,048元；殖利率維持4%時是平價100,000元。所以變動＝99,048−100,000≈−952，減少約$952。","c":13,"f":2,"ap":["H13-44","E7-44"],"n":"票面利率4%，利息為100,000 * 4% = 4,000 若經過一年市場殖利率不變，平價發行的債券價格為100,000 但若市場殖利率上升1% = 4 + 1 = 5%，則債券市場價值：4,000/1.05 + 100,000/1.05 = 99,047 因此債券市場價值變動為99,047 – 100,000 = Ans"},{"i":"H13-45","q":"假設A 銀行之資產負債表中，資產部分除有一個本金$10,000、票面利率固定為5%之5 年期債券，其餘為現金；負債部分只有每年發行一年到期的定期存單，存單固定發行金額為$8,000，第一年發行之存單固定利率為2%，到期後新存單利率隨市場利率調整，並預期未來無另外的資產成長。若市場利率在第一年年底，上升了50 個基準點，請問淨利息利潤於第二年年底相較第一年年底變動多少？","o":["減少$50","減少$40","增加$40","增加$50"],"a":1,"e":"答案(B)。資產端是5年期固定利率5%的債券，利息收入不受市場利率影響。負債端定存單每年重新訂價，第二年利率＝2%＋50bp＝2.5%，利息支出增加8,000×(2.5%−2%)＝8,000×0.5%＝40元，所以淨利息利潤減少$40。","c":13,"f":3,"ap":["H13-45","E1-12","E9-42"],"n":"第二年銀行因為發行定期存單利率從2%再增加50 個基準點(0.01%*50) = 2.5% 因此要多付8,000 * (2.5 – 2)% = $40，也就是說淨利息利潤較第一年減少$40。而因為持有的債券為5 年期固定利率，所以市場利率變動也不需考慮此部分。"},{"i":"H13-46","q":"大衛是美國的投資者，購買一張德國債券1,000 歐元，購買當時的即期匯率為1 歐元兌換1.25美元，經過了一年，歐元升值至1 歐元兌換1.5385 美元，請問此投資者來自匯率變動的損益如何？","o":["獲利288.5 美元","損失288.5 美元","獲利288.5 歐元","損失288.5 歐元"],"a":0,"e":"答案(A)。購入時的美元成本＝1,000×1.25＝1,250美元；一年後的美元價值＝1,000×1.5385＝1,538.5美元。匯率變動損益＝1,538.5−1,250＝＋288.5美元，是獲利。損益要用投資者的本國貨幣美元衡量，所以不是(C)(D)的歐元。","c":13,"f":3,"ap":["H13-46","E12-3","E22-42"],"n":"美國人持有德國債券→ 若美元升值則會有虧損，代表德國債券換得的美金會變少。已知德國債券原始價值1,000 歐元，匯率為1 歐元可換1.25 美元，因此價值1,250 美元 一年後1 歐元可換1.5385 美元，因此價值1,538.5 美元。1,538.5 - 1,250 = Ans"},{"i":"H13-47","q":"傑克在1 歐元兌換1.25 美元時，購買德國債券1,000 歐元，持有至市價884 歐元、匯率為1歐元兌換1.5385 美元時賣出，在不考慮其他收益下，請問此投資者的損益為何？","o":["損失116 美元","獲利360 美元","獲利110 美元","損失178 美元"],"a":2,"e":"答案(C)。購入成本＝1,000×1.25＝1,250美元；賣出所得＝884×1.5385≈1,360美元。損益＝1,360−1,250≈＋110美元，是獲利。雖然債券價格以歐元計虧損了116歐元，但歐元升值的匯兌利益大於這筆價格損失。","c":13,"f":4,"ap":["H13-47","E7-41","E11-44","E18-7"]},{"i":"H13-48","q":"銀行藉由「損失波動幅度」與「波動倍數」的相乘，估算部位的何種指標？","o":["信用風險值或限額","市場風險值或限額","作業風險值或限額","信用損失的期望值與標準差"],"a":1,"e":"答案(B)。依教材，市場風險值(VaR)＝0−Z×β×σ，也就是損失波動幅度(σ)乘以容忍水準對應的波動倍數(Z)，用來估算部位的市場風險值，並作為市場風險限額。信用風險和作業風險不是用這個公式估算。","c":13,"f":2,"ap":["H13-48","E5-46"]},{"i":"H13-49","q":"計算銀行市場風險值(VaR)，係以「損失波動幅度」(σ)與「波動倍數」（容忍水準%）相乘，因此估計各部位的VaR=0－Z×β×(σ)，β 為敏感性係數，假設債券部位的投資損失符合常態分配，則單尾容忍水準2.5%的損失門檻，殖利率標準差為0.5%，β 為敏感性係數為1，下列敘述何者正確？","o":["VaR=0－1.96×1×0.005","VaR=0－1.96×1×0.025","VaR=0－1.645×1×0.005","VaR=0－2.325×1×0.005"],"a":0,"e":"答案(A)。單尾容忍水準2.5%對應的Z值是1.96（1%對應2.325、5%對應1.645）。σ＝殖利率標準差0.5%＝0.005，β＝1，所以VaR＝0−1.96×1×0.005。(B)把容忍水準2.5%誤當成σ；(C)(D)用錯了Z值。","c":13,"f":5,"ap":["H13-49","E1-48","E2-51","E5-45","E10-57"]},{"i":"H13-50","q":"假設容忍水準為1%，殖利率的標準差為0.6%，敏感性係數β 為0.5，則下列敘述何者正確？","o":["VaR=0－2.325×0.5×0.005","VaR=0－2.325×0.6×0.005","VaR=0－2.325×0.5×0.01","VaR=0－2.325×0.5×0.006"],"a":3,"e":"答案(D)。單尾容忍水準1%對應Z＝2.325，β＝0.5，σ＝0.6%＝0.006，所以VaR＝0−2.325×0.5×0.006。(A)把σ寫成0.005；(B)把β和σ的數字弄錯；(C)把容忍水準1%誤當成σ。","c":13,"f":2,"ap":["H13-50","E8-48"]},{"i":"H13-51","q":"假設債券部位的投資損失符合常態分配，則單尾容忍水準2.5%的損失門檻，殖利率的標準差為0.5%，敏感性係數為1 時，下列市場風險值(VaR)的敘述何者正確？","o":["VaR=0－1.96×1×0.005","VaR=0－1.96×1×0.025","VaR=0－1.645×1×0.005","VaR=0－2.325×1×0.005"],"a":0,"e":"答案(A)。單尾容忍水準2.5%對應Z＝1.96，敏感性係數β＝1，σ＝0.5%＝0.005，所以VaR＝0−1.96×1×0.005。(B)把2.5%誤當成σ；(C)的1.645對應5%；(D)的2.325對應1%。","c":13,"f":2,"ap":["H13-51","E8-38"]},{"i":"H13-52","q":"王先生持有市值500 萬元與大盤風險類似的股票組合，年報酬標準差為20%，一年假設250個交易日。假設報酬率變動彼此獨立符合常態分配，且波動具同質性。在單尾容忍水準5%下，一天的市場風險值(VaR)最接近下列何者？","o":["10 萬元","12 萬元","165 萬元","196 萬元"],"a":0,"e":"答案(A)。日標準差＝年標準差/√250＝20%/15.811≈1.265%。單尾5%對應Z＝1.645。一天VaR＝500萬×1.645×1.265%≈104,039元，約10萬元。(C)165萬元是沒有換算成日標準差、直接用年標準差算出的結果。","c":13,"f":2,"ap":["H13-52","E8-58"],"n":"(500W × 1.645 × 0.2 × 250^0.5) / 250 = (5,000,000 × 1.645 × 0.2 × 15.811) / 250 = Ans。風險值 VaR 算式：S₀ × Zα × σ × √Δt；S₀：投資部位的現值；Zα：在α信賴水準下的標準常態變數Z；σ：投資部位的風險(標準差)；Δt：投資部位的持有時間。"},{"i":"H14-1","q":"金融商品的流動性，是指下列何種特性？","o":["獲利能力","變現能力","償債能力","違約機率"],"a":1,"e":"答案(B)。金融商品的流動性，是指在不明顯折價的情況下，迅速轉換成現金的能力，也就是變現能力。(A)獲利能力是報酬面的概念；(C)償債能力是指企業清償債務的能力；(D)違約機率屬於信用風險。","c":14,"f":2,"ap":["H14-1","E13-36"]},{"i":"H14-2","q":"銀行的存款負債瀰漫著鉅額且異常的提領，可能帶來下列何種風險？","o":["再投資風險","流動性風險","信用風險","市場風險"],"a":1,"e":"答案(B)。存款被鉅額且異常提領時，銀行必須在短時間內籌足現金，可能來不及以合理成本籌資或變現資產，甚至引發擠兌，這是流動性風險。再投資風險是到期資金只能以較低利率再運用的風險，信用風險是借款人違約，都不是本題情境。","c":14,"f":5,"ap":["H14-2","E2-16","E4-12","E10-14","E16-3"]},{"i":"H14-3","q":"有關流動性危機與流動性風險的描述，下列何者錯誤？","o":["銀行對外籌措資金窒礙難行時，流動性風險即明顯提高","當銀行的擠兌風險一發不可收拾時，擴散效果將逐步蔓延至其他金融機構，殃及該地區的金融市場，形成全面性的金融恐慌","借款客戶出現嚴重違約，只能提高銀行的信用風險，不致影響其流動性風險","大部分客戶異常提領款項時，該銀行可能隨著流動性漸次不足而面臨擠兌"],"a":2,"e":"答案(C)。借款客戶嚴重違約時，除了信用風險提高，放款收不回來會使資金回流減少，還可能引發存戶的不安和擠兌，所以也會提高流動性風險，(C)說「不致影響」是錯的。(A)對外籌資窒礙難行、(B)擠兌擴散造成金融恐慌、(D)客戶異常提領導致擠兌，三項都正確。","c":14,"f":2,"ap":["H14-3","E8-49"]},{"i":"H14-4","q":"投資人可由何種現象觀察銀行是否存在嚴重的流動性風險？","o":["銀行發生擠兌","銀行存款增加","銀行增購股票","銀行增購公債"],"a":0,"e":"答案(A)。銀行發生擠兌，代表存戶大量提領，銀行可能沒有足夠資金支應，是流動性風險嚴重最明顯的現象。(B)存款增加會讓資金更充裕；(C)(D)增購股票或公債代表銀行有閒置資金可運用，尤其公債還是高流動性資產，都不代表流動性風險嚴重。","c":14,"f":2,"ap":["H14-4","E15-36"]},{"i":"H14-5","q":"下列哪項敘述，無法反映該銀行存在嚴重的流動性風險？","o":["借款客戶出現嚴重違約，銀行發生擠兌","銀行的資產與負債項目，面臨期限結構不一致，且隨著時間演進而擴大「負」缺口部位","存在超額準備，且流動準備比率維持在15%以上","銀行對外籌措資金窒礙難行"],"a":2,"e":"答案(C)。存在超額準備，而且流動準備比率維持在15%以上，已經高於法定最低的10%，代表銀行資金充裕，無法反映流動性風險嚴重。(A)借款客戶違約引發擠兌、(B)期限結構不一致且負缺口擴大、(D)對外籌資窒礙難行，都是教材所列發生流動性風險的原因。","c":14,"f":3,"ap":["H14-5","E11-33","E22-59"]},{"i":"H14-6","q":"觀察銀行是否存在嚴重的流動性風險，下列敘述何者錯誤？","o":["對外籌資窒礙難行，組織內部彼此牽制，推動困難","借款客戶嚴重違約，導致銀行發生擠兌，宣告破產","存款客戶嚴重違約，導致銀行發生擠兌，宣告破產，俗稱致命性風險(Fatal Risk)","銀行資產負債項目，長短期結構不一致，呈現負缺口部位愈來愈大"],"a":2,"e":"答案(C)。會「違約」的是借款客戶，不是存款客戶。存款客戶是銀行的債權人，只會大量提領，不會違約，所以(C)錯誤。依教材，借款客戶嚴重違約導致擠兌，(B)正確；(A)對外籌資窒礙難行、(D)長短期結構不一致使負缺口擴大，也都反映流動性風險。","c":14,"f":2,"ap":["H14-6","E12-60"]},{"i":"H14-7","q":"重新訂價的缺口又稱「資金缺口」，有關資金缺口的敘述，下列何者錯誤？","o":["是某天期的敏感性資產與敏感性負債相減而得","敏感性資產除以敏感性負債大於0時，稱為「正」資金缺口","利率由高往低下滑時，適合採用「負」資金缺口策略","利率處於最高點或最低點時，適合採用「零」資金缺口策略"],"a":1,"e":"答案(B)。資金缺口＝敏感性資產−敏感性負債，(A)正確。若用比率表示，敏感性資產÷敏感性負債「大於1」（不是大於0）才是正資金缺口，所以(B)錯誤。利率下滑時宜採(C)負缺口，利率處於最高點或最低點時宜採(D)零缺口，兩項都正確。","c":14,"f":4,"ap":["H14-7","E11-34","E16-59","E21-59"]},{"i":"H14-8","q":"銀行出現顯著異常的「負」流動性缺口，意味何種風險可能提高？","o":["再融資風險","再投資風險","信用風險","作業風險"],"a":0,"e":"答案(A)。負流動性缺口代表在該期間內，到期的負債大於可變現的資產，銀行必須以新的利率重新籌資來償還到期債務，所以再融資風險提高。(B)再投資風險則是資產先到期、資金必須以較低利率再運用的風險，和負缺口的情況相反。","c":14,"f":3,"ap":["H14-8","E8-13","E21-37"]},{"i":"H14-9","q":"檢視銀行之流動性風險管理，下列敘述何者正確？","o":["兼顧資產與負債的部位","以「單一金融商品」為主","注重「個別的資產負債部位」","兼顧資產與負債的現金流量部位"],"a":3,"e":"答案(D)。依教材，流動性風險管理要兼顧資產與負債的「現金流量」部位，也就是看未來各期間的現金流入與流出是否相符。(A)只看部位餘額，沒有看現金流量；(B)(C)只看單一商品或個別部位，都不夠周全。","c":14,"f":2,"ap":["H14-9","E8-29"]},{"i":"H14-10","q":"銀行之流動性風險與利率風險管理的監督指標，下列敘述何者錯誤？","o":["存款準備與流動準備，係與利率風險有關的準備部位","存款準備與流動準備，係與流動性風險有關的準備部位","利率風險以資產負債的「利率敏感性和非敏感性」為基準","流動性風險以現金流入與流出相減的「淨現金流量」為基礎"],"a":0,"e":"答案(A)。存款準備與流動準備是確保銀行有足夠資金應付提領的準備部位，和流動性風險有關，不是利率風險，所以(A)錯誤、(B)正確。(C)利率風險以資產負債的利率敏感性與非敏感性為基準，(D)流動性風險以淨現金流量為基礎，兩項都正確。","c":14,"f":4,"ap":["H14-10","E1-51","E6-59","E8-50"]},{"i":"H14-11","q":"巴塞爾資本協定增訂之流動性風險指標，下列敘述何者錯誤？","o":["流動性覆蓋比率係指高品質的流動資產除以30 天期之淨現金流出","流動性覆蓋比率大於100%，意指銀行在監理機關嚴峻的流動性管理下，有足夠能力處分資產、換取現金","淨穩定資金比率係指法定穩定資金除以可取得的穩定資金","淨穩定資金比率強調支應資產和業務活動的資金，至少須一定比率來自於穩定的負債"],"a":2,"e":"答案(C)。淨穩定資金比率(NSFR)＝可取得的穩定資金÷應有（法定）穩定資金，(C)把分子分母寫反了，所以錯誤。(A)LCR＝高品質流動資產÷未來30天的淨現金流出；(B)LCR大於100%代表壓力情境下有足夠資產可變現；(D)NSFR強調資產與業務資金須有一定比率來自穩定負債，三項都正確。","c":14,"f":1,"ap":["H14-11"]},{"i":"H14-12","q":"依銀行流動性覆蓋比率實施標準，有關流動性覆蓋比率，下列敘述何者錯誤？","o":["自108年起不得低於100%","輸出入銀行、外國銀行在臺分行，不適用本標準","指合格高品質流動性資產總額除以未來60個日曆日之淨現金流出總額","銀行應按月計算並申報流動性覆蓋比率"],"a":2,"e":"答案(C)。依「銀行流動性覆蓋比率實施標準」第2條，LCR是合格高品質流動性資產總額，除以未來「30個」日曆日內的淨現金流出總額，不是60個日曆日，所以(C)錯誤。(A)自108年起不得低於100%；(B)輸出入銀行與外國銀行在臺分行不適用；(D)銀行應按月計算並申報，三項都正確。","c":14,"f":3,"ap":["H14-12","E14-53","E20-24"],"n":"銀行流動性覆蓋比率實施標準第2 條 本標準所稱流動性覆蓋比率，係指合格高品質流動性資產總額除以未來三十個日曆日內之淨 現金流出總額。"},{"i":"H14-13","q":"有關淨穩定資金比率，下列敘述何者錯誤？","o":["為短期流動性量化指標","定義為可取得的穩定資金除以法定穩定資金","強調支應業務活動的資金，須一定比率來自穩定負債","自107 年1 月1 日實施"],"a":0,"e":"答案(A)。淨穩定資金比率(NSFR)衡量的是一年期間的資金結構穩定度，屬於「長期」流動性量化指標，短期指標是流動性覆蓋比率(LCR)，所以(A)錯誤。(B)NSFR＝可取得穩定資金÷法定穩定資金；(C)強調資金須有一定比率來自穩定負債；(D)自107年1月1日實施，三項都正確。","c":14,"f":3,"ap":["H14-13","E12-52","E13-52"]},{"i":"H14-14","q":"依據銀行淨穩定資金比率實施標準，自民國107 年1 月1 日起，淨穩定資金比率之最低標準為下列何者？","o":["70%","80%","90%","100%"],"a":3,"e":"答案(D)。依「銀行淨穩定資金比率實施標準」，NSFR自民國107年1月1日起實施，最低標準為100%，也就是可取得的穩定資金至少要等於法定（應有）穩定資金。","c":14,"f":2,"ap":["H14-14","E8-55"]},{"i":"H14-15","q":"從2011 年10 月起，台灣的流動準備法定比率是多少？並如何計提？","o":["7%；按日","7%；按月","10%；按日","10%；按月"],"a":2,"e":"答案(C)。中央銀行自2011年（民國100年）10月起，將金融機構的法定流動準備比率由7%提高為10%，並改為按日計提。(A)(B)的7%是調整前的比率。","c":14,"f":2,"ap":["H14-15","E11-35"]},{"i":"H14-16","q":"有關銀行的放款對存款之比率（簡稱存放比率），下列敘述何者錯誤？","o":["存放比率愈高，意味銀行的流動性愈低","存放比率愈高，意味銀行的流動能力愈強","存放比率愈高，意味銀行的流動性風險愈大","存放款業務為主的銀行，存放比率仍具相當參考價值"],"a":1,"e":"答案(B)。存放比率愈高，代表愈多存款被拿去放款，可隨時動用的資金愈少，所以流動性愈低、流動性風險愈大，(A)(C)正確，(B)說流動能力愈強是錯的。(D)以存放款業務為主的銀行，存放比率仍是觀察流動性的重要指標。","c":14,"f":3,"ap":["H14-16","E12-33","E15-35"]},{"i":"H14-17","q":"有關 BaselⅡ之三大支柱，不包括下列何者？","o":["最低資本需求額","監理審查","公司治理","市場紀律"],"a":2,"e":"答案(C)。Basel II的三大支柱是：第一支柱「最低資本需求」、第二支柱「監理審查」、第三支柱「市場紀律」。(C)公司治理雖然重要，但不是三大支柱之一。","c":14,"f":2,"ap":["H14-17","E10-49"]},{"i":"H14-18","q":"Basel III 規範各國金融監理機關依據該國銀行信用擴張的情形，要求銀行額外計提資本以限制信用過度擴張，此規範稱為下列何者？","o":["早期監理審查介入","抗循環資本緩衝","順循環資本擴張","市場紀律介入"],"a":1,"e":"答案(B)。Basel III要求監理機關依國內信用擴張的程度（如授信／GDP缺口），要求銀行額外計提資本，以抑制信用過度擴張，這稱為「抗循環資本緩衝」(Countercyclical Capital Buffer)。這項規範的目的是逆著景氣循環操作，不是(C)順循環擴張。","c":14,"f":2,"ap":["H14-18","E10-35"]},{"i":"H14-19","q":"有關Basel 監理委員會2010 年12 月16 日發布的資本協定第三版(Basel III)，下列敘述何者錯誤？","o":["除了法定的資本計提額，另外增訂「緩衝資本2.5%」","提高「普通股權益資本的比率」由2013 年起逐步調高至2015 年的4.5%","為防範景氣循環帶來衝擊，設計「額外緩衝資本」0~2.5%，但建議各國政府自行決定緩衝幅度","增訂長期的淨穩定資金率(Net Stable Funding Ratio)，目前該比率以「大於或等於120%」作為門檻"],"a":3,"e":"答案(D)。Basel III的淨穩定資金比率(NSFR)門檻是「大於或等於100%」，不是120%，所以(D)錯誤。(A)增訂2.5%的留存緩衝資本；(B)普通股權益比率自2013年逐步提高到2015年的4.5%；(C)抗循環緩衝資本為0～2.5%，由各國自行決定，三項都正確。","c":14,"f":1,"ap":["H14-19"]},{"i":"H14-20","q":"主管機關於必要時，得要求銀行提列抗景氣循環的緩衝資本，並以普通股權益第一類資本支應，下列何者為計提比率的限制？","o":["最低不得小於2%","最高不超過2%","最高不超過2.5%","最低不得小於3%"],"a":2,"e":"答案(C)。依我國資本適足性相關規定與Basel III，主管機關必要時得要求銀行提列抗景氣循環緩衝資本，以普通股權益第一類資本支應，計提比率在0%～2.5%之間，也就是最高不超過2.5%。","c":14,"f":2,"ap":["H14-20","E14-39"]},{"i":"H14-21","q":"巴塞爾資本協定三為強化銀行體系穩健性，防範景氣循環帶來的衝擊，新增下列何種制度？","o":["信用評價調整風險","交易簿增額風險之資本計提","增提額外緩衝資本","遞延所得稅資產自資本扣除"],"a":2,"e":"答案(C)。Basel III為了防範景氣循環的衝擊，新增留存緩衝資本與抗循環緩衝資本，也就是增提額外緩衝資本。(A)信用評價調整(CVA)風險和(B)交易簿增額風險資本，是針對交易對手風險和市場風險的強化措施；(D)遞延所得稅資產自資本扣除是資本品質的規範，三者都不是為了因應景氣循環。","c":14,"f":1,"ap":["H14-21"]},{"i":"H14-22","q":"為限制信用過度擴張，Basel III規範銀行額外計提資本，此規範的用意為何？","o":["早期介入監理審查","防範景氣循環的衝擊","順應景氣循環的擴張","市場紀律介入"],"a":1,"e":"答案(B)。Basel III要求銀行在信用過度擴張時額外計提資本（抗循環資本緩衝），景氣好時累積資本，景氣反轉時釋放，用意是防範景氣循環對銀行體系的衝擊。它是逆循環的設計，不是(C)順應景氣擴張。","c":14,"f":2,"ap":["H14-22","E20-23"]},{"i":"H14-23","q":"從銀行全行的角度觀察，銀行的利率風險不包括下列何者？","o":["破產風險","再融資風險","再投資風險","市場價值變化的風險"],"a":0,"e":"答案(A)。從全行的角度看，銀行的利率風險包括(B)再融資風險、(C)再投資風險和(D)市場價值變化的風險。(A)破產風險是各種風險累積可能造成的最終結果，不是利率風險的類型。","c":14,"f":4,"ap":["H14-23","E3-11","E4-10","E10-11"]},{"i":"H14-24","q":"「借短貸長」的資金部位，可能存在何種風險？","o":["再投資風險","再融資風險","市場價值風險","信用風險"],"a":1,"e":"答案(B)。「借短貸長」是用短期負債支應長期資產，負債先到期，就必須以當時的利率重新借款。如果利率上升，融資成本提高但資產收益固定，利差縮小，這就是再融資風險。","c":14,"f":4,"ap":["H14-24","E4-11","E6-11","E9-11"]},{"i":"H14-25","q":"「借長貸短」的資金部位，可能存在何種風險？","o":["再投資風險","再融資風險","市場價值風險","信用風險"],"a":0,"e":"答案(A)。「借長貸短」是用長期負債支應短期資產，資產先到期，收回的資金必須以當時的利率重新運用。如果利率下降，再運用的收益低於固定的負債成本，這就是再投資風險。","c":14,"f":5,"ap":["H14-25","E7-5","E12-1","E15-2","E19-8"]},{"i":"H14-26","q":"銀行的資產與負債，呈現到期期別及流動性不同時，可能造成下列何種風險？","o":["信用風險","作業風險","利率風險","回收風險"],"a":2,"e":"答案(C)。資產與負債的到期期別和流動性不同時，兩者重新訂價的時點不一致，市場利率變動會使淨利息收入和經濟價值跟著改變，造成利率風險（包括再融資風險和再投資風險）。","c":14,"f":5,"ap":["H14-26","E2-14","E5-17","E6-10","E22-1"]},{"i":"H14-27","q":"美國的儲蓄貸款機構於1980 年代出現倒閉風潮，係受到下列何種風險威脅金融機構的例證？","o":["國家風險","再融資風險","再投資風險","市場價值風險"],"a":1,"e":"答案(B)。1980年代美國儲貸機構以短期存款支應長期固定利率房貸，屬於「借短貸長」。當時市場利率大幅上升，存款成本高於房貸收益，出現大量虧損與倒閉，是再融資風險的典型例子。","c":14,"f":3,"ap":["H14-27","E9-12","E20-7"]},{"i":"H14-28","q":"銀行對外借入期限1 年、利率1.5%的債務，取得2 年期、年報酬率3%之資產，請問債務1 年到期後再舉債時，下列哪一個利率水位會發生再融資風險？","o":["0.50%","1.00%","1.50%","2.00%"],"a":3,"e":"答案(D)。原本的負債成本是1.5%，資產報酬率是3%。一年後重新舉債時，若新利率高於原本的1.5%（例如2.00%），融資成本上升、利差縮小，就發生再融資風險。0.50%與1.00%低於原利率，反而使利差擴大；1.50%則和原利率相同，利差不變。","c":14,"f":4,"ap":["H14-28","E10-12","E16-42","E20-45"]},{"i":"H14-29","q":"有關銀行之利率風險管理，下列敘述何者錯誤？","o":["主要工具以「資產管理」為主","須評估銀行的資金成本與運用收益","主要工具以「重新訂價缺口模型」為主","透過資產負債表探討資金來源與資金運用項目的系統分析"],"a":0,"e":"答案(A)。銀行利率風險管理的主要工具是「重新訂價缺口模型」，要同時檢視資產和負債兩邊（資產負債管理），不是只以「資產管理」為主，所以(A)錯誤，(C)正確。(B)須評估資金成本與運用收益、(D)透過資產負債表系統性分析資金來源與運用，兩項都正確。","c":14,"f":2,"ap":["H14-29","E8-14"]},{"i":"H14-30","q":"金融機構的資產與負債，缺口部位越大時，則：","o":["利率風險的波動越小","利率風險的波動越大","利率風險不變","作業風險越低"],"a":1,"e":"答案(B)。重新訂價缺口（敏感性資產−敏感性負債）越大，市場利率變動時淨利息收入的變動也越大，所以利率風險的波動越大。缺口和作業風險沒有直接關係，(D)錯誤。","c":14,"f":2,"ap":["H14-30","E13-59"]},{"i":"H14-31","q":"有關利率風險管理的重新訂價缺口指標，下列敘述何者錯誤？","o":["類似流動性缺口指標是以不同天期「累計」概念衡量","實務上，利率風險的缺口指標，適合觀察個別營業單位","實務上，利率風險的缺口指標，均以全行或其銀行簿的部位為主","部位幣別以新臺幣與美金計價兩種為主，人民幣計價的部位為輔"],"a":1,"e":"答案(B)。依教材，實務上利率風險的缺口指標都以全行或銀行簿的部位為主，不適合拿來觀察個別營業單位，所以(B)錯誤，(C)正確。(A)和流動性缺口一樣以不同天期累計衡量；(D)幣別以新臺幣與美元為主、人民幣為輔，兩項都正確。","c":14,"f":2,"ap":["H14-31","E12-35"]},{"i":"H14-32","q":"基於獲利性考量，市場利率由低往高攀升時，銀行宜逐步擴大哪種缺口部位？","o":["負缺口部位","正缺口部位","零缺口部位","市場利率與缺口部位無關"],"a":1,"e":"答案(B)。市場利率上升時，敏感性資產的收益會比敏感性負債的成本更早或更多地調升。所以擴大正缺口（敏感性資產＞敏感性負債），可以讓淨利息收入增加。利率下降時才適合負缺口，利率在高點或低點時適合零缺口。","c":14,"f":4,"ap":["H14-32","E2-57","E13-35","E17-59"]},{"i":"H14-33","q":"有關利率風險管理與重新訂價缺口模型，預期利率上升時，銀行應該如何因應？","o":["增加利率敏感性負債","減少匯率敏感性負債","增加利率敏感性資產","減少利率敏感性資產"],"a":2,"e":"答案(C)。預期利率上升時，銀行應擴大正缺口，也就是增加利率敏感性資產（或減少利率敏感性負債），讓資產收益隨利率上調。(A)增加敏感性負債會使成本上升更多；(D)減少敏感性資產會錯失利率上升的好處；(B)匯率敏感性和利率缺口無關。","c":14,"f":2,"ap":["H14-33","E14-59"]},{"i":"H14-34","q":"銀行若能正確預測未來的利率水準，當市場利率由低往高攀升時，應採取之資金策略為何？A.應採用「正缺口部位」管理資金B.應採用「負缺口部位」管理資金C.最好增加持有「敏感性資產」和「非敏感性負債」D.最好減少持有「敏感性資產」和「非敏感性負債」","o":["僅AC","僅AD","僅BC","僅BD"],"a":0,"e":"答案(A)。利率上升時應採「正缺口」管理資金（A對、B錯），做法是增加敏感性資產，讓收益隨利率上調；同時持有非敏感性負債，鎖住固定的低成本（C對、D錯）。所以僅AC正確。","c":14,"f":2,"ap":["H14-34","E18-59"]},{"i":"H15-1","q":"新巴賽爾資本協定於2004 年6 月，將「作業風險」的「最低資本需求」，納入資本適足率的第一支柱。依據金管會定義作業風險，係起因於哪些不當因素，造成銀行損失之風險，下列敘述何者錯誤？","o":["人員","系統","內部作業與外部事件","策略風險與信譽風險"],"a":3,"e":"答案(D)。依金管會的定義，作業風險是因內部作業、人員及系統的不當或失誤，或外部事件造成損失的風險，所以(A)人員、(B)系統、(C)內部作業與外部事件都包括在內。(D)策略風險與信譽風險被明確排除在作業風險之外（法律風險則包括在內）。","c":15,"f":2,"ap":["H15-1","E11-36"]},{"i":"H15-2","q":"作業風險管理之涵蓋範圍，包括下列哪些項目？A.內部人員作業失誤、B.電腦系統當機、C.組織變革與創新、D.破壞環境生態","o":["僅A、B","僅C、D","僅A、B、C","A、B、C、D"],"a":0,"e":"答案(A)。A.內部人員作業失誤屬於「人員／內部作業」，B.電腦系統當機屬於「系統」，都在作業風險的涵蓋範圍內。C.組織變革與創新偏向策略面的決策，D.破壞環境生態屬於環境與社會風險，都不在作業風險的範圍內，所以僅A、B。","c":15,"f":3,"ap":["H15-2","E13-24","E22-53"]},{"i":"H15-3","q":"下列何者非屬作業風險損失事件的項目？","o":["詐欺","盜用公款","股價下跌","挪用客戶資金"],"a":2,"e":"答案(C)。(A)詐欺、(B)盜用公款、(D)挪用客戶資金，都是人員或內外部詐欺造成的作業風險損失事件。(C)股價下跌是市場價格變動，屬於市場風險。","c":15,"f":2,"ap":["H15-3","E17-38"]},{"i":"H15-4","q":"下列何種方法不屬於作業風險的資本計提方法？","o":["進階衡量法","內部模型法","標準法","基本指標法"],"a":1,"e":"答案(B)。作業風險的資本計提方法有：基本指標法、標準法（或選擇性標準法）、進階衡量法。(B)內部模型法是市場風險的資本計提方法，不要和作業風險的方法混淆。","c":15,"f":6,"ap":["H15-4","E4-58","E7-35","E8-15","E15-38","E19-60"]},{"i":"H15-5","q":"下列何者不是計提作業風險資本需求額的方法？","o":["標準法","風險值法","進階衡量法","基本指標法"],"a":1,"e":"答案(B)。作業風險的資本計提方法是基本指標法、標準法（選擇性標準法）和進階衡量法。(B)風險值法(VaR)是市場風險內部模型常用的衡量方法，不是作業風險的法定計提方法。","c":15,"f":4,"ap":["H15-5","E14-37","E18-60","E23-38"]},{"i":"H15-6","q":"有關各種風險之資本計提，下列敘述何者錯誤？","o":["信用風險加權風險性資產，係衡量交易對手不履約，致銀行產生損失的風險","市場風險應計提之資本，則衡量市場價格波動，致銀行資產產生損失之風險，所需計提之資本","風險性資產總額則為信用風險加權風險性資產，加計市場風險及作業風險應計提之資本乘以12.5 之合計數","作業風險應計提之資本，旨在衡量銀行因內部作業、人員及系統之不當或失誤，造成損失之風險，所需計提之資本，但不包含外部事件造成損失之風險"],"a":3,"e":"答案(D)。作業風險的定義包括內部作業、人員及系統的不當或失誤，「以及外部事件」造成的損失，所以(D)說不包含外部事件是錯的。(A)信用風險衡量交易對手不履約的風險、(B)市場風險衡量市場價格波動的風險、(C)風險性資產總額＝信用風險加權風險性資產＋(市場風險＋作業風險應計提資本)×12.5，三項都正確。","c":15,"f":2,"ap":["H15-6","E10-32"]},{"i":"H15-7","q":"有關作業風險之資本計提，標準法是依業務別設定計提指標，並與對應且權數固定的β 值相乘求得資本計提額，下列敘述何者錯誤？","o":["將銀行業務活動分為八大類別","八類業務均以「營業毛利」作為計提標準","八類業務均以「營業利益」作為計提標準","風險係數β值，依業務屬性與暴險程度，定在12%至18%之間"],"a":2,"e":"答案(C)。作業風險標準法把銀行業務分為八大類，各類業務都以「營業毛利」作為計提指標，乘以12%～18%的β值，所以(A)(B)(D)正確。(C)說以「營業利益」作為計提標準是錯的。","c":15,"f":5,"ap":["H15-7","E1-53","E8-52","E17-60","E18-38"]},{"i":"H15-8","q":"有關作業風險的標準法，下列敘述何者錯誤？","o":["依八種業務類別，設定計提指標","每種業務類別均以「營業毛利」作為計提指標","風險係數介於12%與18%之間","利用各類業務之營業利益，乘以對應的風險係數，作為「資本計提額」"],"a":3,"e":"答案(D)。標準法的資本計提額是用各類業務的「營業毛利」乘以對應的風險係數β，不是「營業利益」，所以(D)錯誤。(A)八種業務類別、(B)以營業毛利為計提指標、(C)風險係數介於12%～18%，三項都正確。","c":15,"f":4,"ap":["H15-8","E3-57","E12-37","E20-60"]},{"i":"H15-9","q":"原則上，採用「標準法」計提作業風險的資本額，相較於「基本指標法」，通常對資本計提的影響為：","o":["較少","較多","相同","兩者間無法比較"],"a":0,"e":"答案(A)。基本指標法是以全行營業毛利統一乘以15%。標準法則依業務別乘以12%～18%的β值，像零售銀行、資產管理等低風險業務的係數只有12%。所以依教材，標準法通常計提的資本較少。","c":15,"f":2,"ap":["H15-9","E13-60"]},{"i":"H15-10","q":"有關銀行的作業風險管理，從監督管理層面觀察有三道防線，下列敘述何者錯誤？","o":["第一道防線，指營業單位的自評及自行查核","第二道防線，包括總行業務管理單位、風險管理及法令遵循部門","第三道防線，包括銀行董事會轄下的稽核處","第三道防線，不包括董事會轄下的風險管理委會、監事會"],"a":3,"e":"答案(D)。依講義，第一道防線為營業單位的自評及自行查核，第二道防線為總行業務管理單位、風險管理及法令遵循部門，第三道防線包括董事會轄下的稽核處，負責評估前二道防線之程序是否有效，故(A)(B)(C)正確。依本題官方答案，董事會轄下的風險管理委員會、監事會等獨立監督機制亦屬第三道防線，(D)說「不包括」是錯的。","c":15,"f":2,"ap":["H15-10","E15-60"]},{"i":"H15-11","q":"下列何者非屬金融機構的作業風險監督機構？","o":["金管會銀行局","金管會檢查局","中央銀行","內政部警政署"],"a":3,"e":"答案(D)。金融機構作業風險的監督機構包括(A)金管會銀行局（監理）、(B)金管會檢查局（金融檢查）、(C)中央銀行（金融穩定與檢查）。(D)內政部警政署負責治安與刑案偵辦，不是金融監理或作業風險的監督機構。","c":15,"f":2,"ap":["H15-11","E12-36"]},{"i":"H15-12","q":"關於信用卡之偽冒詐欺事件，應歸類為下列何種風險型態？","o":["信用風險","市場風險","作業風險","流動性風險"],"a":2,"e":"答案(C)。依教材，信用卡偽冒詐欺是第三人以偽造或冒用的方式造成的損失，屬於外部詐欺事件，歸類為作業風險。這不是持卡人無力還款，所以不是(A)信用風險。","c":15,"f":2,"ap":["H15-12","E9-20"]},{"i":"H15-13","q":"下列何者屬於銀行的表外非衍生性業務？","o":["金融交換","遠期契約","擔保信用狀","不動產證券化契約"],"a":2,"e":"答案(C)。表外非衍生性業務是不涉及衍生工具的或有承諾，例如擔保信用狀、放款承諾、循環式包銷融資等，所以選(C)。(A)金融交換、(B)遠期契約都是表外的衍生性業務；(D)不動產證券化契約屬資產證券化交易，不是講義所列的表外非衍生性業務項目。","c":15,"f":6,"ap":["H15-13","E2-12","E4-9","E8-3","E15-1","E21-1"]},{"i":"H15-14","q":"有關表外業務之信用風險，分為衍生性與非衍生性兩類，其中衍生性業務不包括下列何者？","o":["股票(Stock)","期貨(Futures)","選擇權(Option)","金融交換(Swap)"],"a":0,"e":"答案(A)。表外衍生性業務包括(B)期貨、(C)選擇權、(D)金融交換，以及遠期契約等。(A)股票是基礎的權益證券，持有時列在資產負債表內，不是表外的衍生性商品。","c":15,"f":2,"ap":["H15-14","E6-38"]},{"i":"H15-15","q":"商業銀行會衍生信用風險的金融業務，包括表內的企業金融業務與消費金融業務及表外的衍生性和非衍生性業務。關於表外非衍生性業務的種類，下列敘述何者錯誤？","o":["選擇權","擔保信用狀","未動用額度的「承諾協議書」","循環式包銷融資"],"a":0,"e":"答案(A)。依教材，表外非衍生性業務包括(B)擔保信用狀、(C)未動用額度的放款承諾（承諾協議書）、(D)循環式包銷融資(RUFs)等。(A)選擇權是衍生性金融商品，屬於表外的衍生性業務，所以錯誤。","c":15,"f":2,"ap":["H15-15","E11-28"]},{"i":"H15-16","q":"商業銀行的業務種類中，信用風險可以區分為表內業務的風險及表外業務的風險，下列何者屬於表外業務的風險？A.承作「非衍生性業務」的「放款承諾」 B.房屋貸款C.學生貸款 D.開立擔保信用狀E.提供商業本票的貼現","o":["僅BC","僅ABC","僅AD","ABCDE"],"a":2,"e":"答案(C)。表外業務是指沒有實際動撥資金、不列入資產負債表的或有承諾，例如A.非衍生性的放款承諾、D.開立擔保信用狀。B.房屋貸款、C.學生貸款、E.商業本票貼現，都已經實際撥出資金，列為表內的放款或貼現資產，所以僅AD。","c":15,"f":2,"ap":["H15-16","E18-56"]},{"i":"H15-17","q":"與信用風險有關之業務項目，下列敘述何者錯誤？","o":["表內(On-The-Balance-Sheet)與表外(Off-The-Balance-Sheet)項目皆可能產生信用風險","表內(On-The-Balance-Sheet) 泛指企業金融業務，消費金融業務則被歸類在表外(Off-The-Balance-Sheet)","表外(Off-The-Balance-Sheet)的非衍生性業務項目如循環式包銷融通(Revolving Underwriting Facility; RUFs)","表外(Off-The-Balance-Sheet)的衍生性業務項目如金融交換(SWAP)，可能同時存在市場風險與信用風險"],"a":1,"e":"答案(B)。表內業務包括企業金融業務和消費金融業務（例如房貸、信用貸款都列在資產負債表內），消費金融業務不是表外業務，所以(B)錯誤。(A)表內與表外都可能產生信用風險；(C)RUFs屬於表外非衍生性業務；(D)SWAP同時存在市場風險與信用風險，三項都正確。","c":15,"f":2,"ap":["H15-17","E17-55"]},{"i":"H15-18","q":"有關信用風險之表外業務暴險部位，下列何者錯誤？","o":["表外業務之暴險，主要來自於集中市場","表外業務的暴險部位，可能同時存在信用風險與市場風險","從事衍生性業務時，銀行可能因客戶信用惡化而承受暴險","衍生性部位之每日清算價值(Mark-to-Market)為正，會使銀行所承擔之信用風險升高"],"a":0,"e":"答案(A)。表外業務（特別是衍生性商品）的暴險主要來自店頭市場(OTC)的雙邊交易。集中市場有結算機構與保證金制度，交易對手風險較低，所以(A)錯誤。(B)可能同時存在信用與市場風險；(C)客戶信用惡化會使銀行承受暴險；(D)每日評價為正，代表對方欠銀行，信用風險升高，三項都正確。","c":15,"f":2,"ap":["H15-18","E18-55"]},{"i":"H15-19","q":"銀行將資金貸放給違約機率高者，卻未順勢提高其借款利率的授信行為，稱為下列何者？","o":["不確定性","
