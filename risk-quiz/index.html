選僅A、B、C。","c":10,"f":1,"ap":["E13-25"]},{"i":"E13-28","q":"負責授信業務的清算、交割與保全任務的作業中心或債權管理部門，扮演信用風險的何種角色？","o":["前台","中台","後台","與信用風險無關"],"a":2,"e":"答案(C)。負責授信業務清算、交割與保全任務的作業中心或債權管理部門，屬於信用風險管理的後台。前台是承作業務的單位；中台負責風險衡量與監控（如估算損益、風險值）。","c":1,"f":1,"ap":["E13-28"]},{"i":"E13-31","q":"假設容忍水準為1%，標準差為0.6%，敏感性係數β為0.5，下列敘述何者正確？","o":["VaR = 0 － 2.325 × 0.5 × 0.005","VaR = 0 － 2.325 × 0.6 × 0.006","VaR = 0 － 2.325 × 0.5 × 0.01","VaR = 0 － 2.325 × 0.5 × 0.006"],"a":3,"e":"答案(D)。VaR＝0－Z×β×σ，容忍水準1%對應Z＝2.325，β＝0.5，σ＝0.6%＝0.006，所以VaR＝0－2.325×0.5×0.006。(A)σ誤用成0.005，(B)β誤用成0.6，(C)σ誤用成0.01。","c":13,"f":1,"ap":["E13-31"]},{"i":"E13-34","q":"有關銀行之利率風險管理，下列敘述何者錯誤？","o":["「資產管理」為主要工具，不重視「負債管理」","須評估銀行的資金成本與運用收益","「重新訂價缺口模型」為主要分析工具","透過資產負債表，探討資金來源與資金運用項目的系統分析"],"a":0,"e":"答案(A)。利率風險管理要同時兼顧資產與負債兩邊，透過資產負債管理分析資金來源與運用，不能只重視資產管理而忽略負債管理，所以(A)錯誤。(B)評估資金成本與運用收益、(C)以重新訂價缺口模型為主要分析工具、(D)透過資產負債表做系統分析，均正確。","c":14,"f":1,"ap":["E13-34"]},{"i":"E13-38","q":"金管會「銀行資本適足性及資本等級管理辦法」第2 條第1 項，定義自有資本與風險性資產之比率不包括下列哪個項目？","o":["法定資本","資本適足率","普通股權益比率","第一類資本比率"],"a":0,"e":"答案(A)。管理辦法第2條所稱「自有資本與風險性資產之比率」，是指普通股權益比率、第一類資本比率及資本適足率三者，(B)(C)(D)均屬之；「法定資本」不在其列，故選(A)。","c":9,"f":1,"ap":["E13-38"]},{"i":"E13-40","q":"第二類資本之合計數，不包含下列哪種？","o":["長期次順位債券","特別盈餘公積","可轉換之次順位債券","營業準備及備抵呆帳"],"a":1,"e":"答案(B)。第二類資本包括長期次順位債券、可轉換之次順位債券、營業準備及備抵呆帳等。特別盈餘公積屬於普通股權益（第一類資本）的項目，不在第二類資本內。","c":9,"f":2,"ap":["E13-40","E15-39"]},{"i":"E13-44","q":"銀行的營業單位遇到資金剩餘時，透過聯行往來供應資金適用的利率，係指下列何者？","o":["供應利率","借用利率","補貼利率","懲罰利率"],"a":0,"e":"答案(A)。營業單位資金有剩餘時，透過聯行往來提供多餘資金給總行（資金中心），適用的是「供應利率」；資金不足、向聯行取得資金時，適用的是「借用利率」。","c":2,"f":1,"ap":["E13-44"]},{"i":"E13-49","q":"公司債等級之決定因素，攸關「定量分析」時，下列何者最為重要？","o":["利息保障倍數","短期償債能力","長期償債能力","獲利能力"],"a":0,"e":"答案(A)。信評機構在公司債等級的定量分析中，最重要的主要指標是利息保障倍數；次要指標是長期償債能力，用來判斷公司是否舉債過多。短期償債能力與獲利能力只是輔助參考。","c":6,"f":2,"ap":["E13-49","E20-15"]},{"i":"E13-56","q":"甲銀行（賣方）與乙銀行（買方）承作CDS 合約，名目本金為100 元，逐日清算價值(mark-to-market) 若為 -3 元，則衍生性金融商品的當期暴險額為多少？","o":["0 元","-3 元","+3 元","+100 元"],"a":0,"e":"答案(A)。衍生性商品的當期暴險額是以逐日清算價值（重置成本）計算，重置成本為正數才計入；重置成本為負數或零時，以零計算。本題逐日清算價值為－3元，所以當期暴險額為0元。","c":12,"f":1,"ap":["E13-56"]},{"i":"E13-58","q":"假設英國政府發行5 年期純折扣債券，到期一次還本、面額1 百萬英鎊，市場顯示相同風險等級之5 年期殖利率為6%。假設英鎊對美元為1:1.3 時，英國公債之美元現值為下列何者（取最接近值）？","o":["約971,435","約916,448","約1,029,721","約1,091,373"],"a":0,"e":"答案(A)。英鎊現值＝1,000,000÷(1.06)^5≈747,258英鎊；按1英鎊＝1.3美元換算，美元現值≈747,258×1.3≈971,436美元，最接近(A)約971,435。","c":13,"f":2,"ap":["E13-58","E22-58"]},{"i":"E14-2","q":"關於風險管理的組織運作方式，下列敘述何者錯誤？","o":["強調風險產生單位與監督單位宜相互隸屬","風險管理的決策過程，涵蓋「從上而下」與「由下往上」兩種","不論哪種風險均應詳細釐清前台、中台及後台的職掌，集中控制、分權營運","業務管理部門須定期評估所有營業單位的營業概況，包括不同業務的收支、利潤與風險承擔"],"a":0,"e":"答案(A)。風險管理組織強調風險產生單位與監督單位「不宜」相互隸屬，以維持獨立性，使用的風險管理指標和標準也應不同，所以(A)錯誤。(B)決策過程兼顧「從上而下」與「由下往上」、(C)釐清前中後台職掌並集中控制、分權營運、(D)業務管理部門定期評估各營業單位收支、利潤與風險承擔，均正確。","c":1,"f":1,"ap":["E14-2"]},{"i":"E14-3","q":"有關資產負債管理委員會之權責，下列敘述何者錯誤？","o":["審核全行作業風險的緊急應變計畫","審核流動性管理指標的門檻標準","審核利率風險之避險策略","審核金融同業的拆款額度"],"a":0,"e":"答案(A)。資產負債管理委員會(ALCO)的權責是審核流動性管理指標門檻、利率風險避險策略、金融同業拆款額度、聯行往來利率等。全行作業風險的緊急應變計畫屬於作業風險管理範疇，不歸ALCO審核，所以(A)錯誤。","c":1,"f":4,"ap":["E14-3","E16-45","E18-41","E22-46"]},{"i":"E14-4","q":"關於成本中心，下列敘述何者錯誤？","o":["成本中心的主管僅能控制成本或費用","成本中心以追求產品或服務成本最低為其努力目標","成本中心主管無權參與選擇各項投入資源的標準及來源","成本中心適用的單位，「無權決定」產量或服務多寡，以及產量或服務售價"],"a":2,"e":"答案(C)。成本中心只對成本或費用負責，以追求產品或服務成本最低為目標，適用於對產量、服務多寡及售價「無權決定」的單位，故(A)(B)(D)正確。成本中心主管雖僅能控制成本或費用，但「有權」參與選擇各項投入資源的標準及來源，(C)說「無權參與」錯誤。","c":2,"f":1,"ap":["E14-4"]},{"i":"E14-5","q":"轉投資類型的投資中心，宜使用下列何者當作績效衡量指標？","o":["銷售額","內外部損益","資本或股權投資的報酬率","可控制成本"],"a":2,"e":"答案(C)。投資中心既對成本、收入和利潤負責，又須對投資效果負責，轉投資類型的投資中心最適合以投資報酬率（資本或股權投資的報酬率）作為績效衡量指標。(A)銷售額適用收入中心，(B)內外部損益、可控制利益適用利潤中心，(D)可控制成本適用成本中心。","c":2,"f":1,"ap":["E14-5"]},{"i":"E14-6","q":"經濟移轉價格通常考量下列哪些因子？ A.作業成本 B.與資金來源有關的借款成本 C.與流動性風險有關的流動性貼水 D.與信用風險有關的呆帳準備","o":["僅B","僅A、B","僅B、C、D","A、B、C、D"],"a":2,"e":"答案(C)。擬定經濟移轉價格(Economic Transfer Prices)需考量的因子為：與資金來源有關的借款成本(B)、與流動性風險有關的流動性貼水(C)、與信用風險有關的呆帳準備(D)。作業成本(A)不屬於經濟移轉價格的構成因子，故選僅B、C、D。","c":2,"f":3,"ap":["E14-6","E18-44","E22-43"]},{"i":"E14-8","q":"假設小王購買一張期別2 年、AA 等級、平價發行的本國債券，該債券的票面價值$100,000 且票面利率為每年4%，經過一年以後，該債券被信用評等機構調降評等，導致該債券的市場殖利率從原本的4%上升至5%，請問該債券遭調降評等，導致市場價值變動多少？","o":["減少$962","減少$952","增加$952","增加$962"],"a":1,"e":"答案(B)。經過一年後債券剩一年到期，到期時可收本金加最後一期利息：100,000＋100,000×4%＝104,000。殖利率升至5%時價格＝104,000÷1.05≒99,048；原本殖利率4%（平價）價值為100,000。價值變動＝99,048－100,000≒－952，即減少$952。殖利率上升，債券價格下跌，故(C)(D)錯誤。","c":13,"f":2,"ap":["E14-8","E22-41"]},{"i":"E14-9","q":"衡量公司之短期償債能力，下列何者正確？","o":["速動比率＝速動資產／速動負債","速動比率＝（流動資產－預付費用）／速動負債","速動比率＝速動資產／流動負債","速動比率＝流動資產／速動負債"],"a":2,"e":"答案(C)。速動比率＝速動資產／流動負債，速動資產為流動資產扣除存貨、預付費用等變現性較差的項目，用以衡量企業的短期償債能力。財務報表中並無「速動負債」，分母應為流動負債，故(A)(B)(D)錯誤。","c":4,"f":2,"ap":["E14-9","E23-12"]},{"i":"E14-12","q":"發卡銀行辦理的信用卡業務，主要有三種收入來源，不包含下列何者？","o":["利息收入","國外刷卡之匯差收入","手續費收入","向特約商店收取折扣費用"],"a":1,"e":"答案(B)。發卡銀行辦理信用卡業務的三種主要收入來源為：利息收入（循環信用利息）、手續費收入（如預借現金、年費等）、以及向特約商店收取的折扣費用。國外刷卡之匯差收入不屬於這三種主要收入來源。","c":5,"f":1,"ap":["E14-12"]},{"i":"E14-19","q":"授信客戶的國家別歸屬，實務上採法定歸屬。假設本國A 銀行之香港分行對位於新加坡之美商Ｂ公司辦理授信，且由B 公司之美國母公司C 提供保證。請問該授信客戶的國家別歸屬應為何國？","o":["臺灣","中國","新加坡","美國"],"a":3,"e":"答案(D)。授信客戶的國家別歸屬實務上採「法定歸屬」，以承擔最終償還責任或保證責任者的法定國籍認定。本題B公司的授信由其美國母公司C提供保證，最終風險落在美國，故國家別歸屬為美國；承作分行所在地（香港）或借款人所在地（新加坡）、銀行本國（臺灣）都不是判斷依據。","c":7,"f":1,"ap":["E14-19"]},{"i":"E14-23","q":"有關槓桿比率，下列敘述何者錯誤？","o":["目的係用來補充以風險衡量為基礎之最低資本要求","槓桿比率之分子為第一類資本淨額","槓桿比率之分母為暴險總額","最低要求的槓桿比率為6%"],"a":3,"e":"答案(D)。槓桿比率＝第一類資本淨額／暴險總額，目的在補充以風險為基礎的最低資本要求，避免銀行過度擴張槓桿，故(A)(B)(C)正確。依巴塞爾資本協定三及我國「銀行資本適足性及資本等級管理辦法」，槓桿比率最低要求為3%，不是6%，故(D)錯誤。","c":9,"f":1,"ap":["E14-23"]},{"i":"E14-25","q":"保險業的資本適足率多少時，會被視為資本顯著不足？","o":["最近二期淨值比率均未達百分之三且其中至少一期在百分之二以上","200%以上，未達250%","150%以上，未達200%","50%以上，未達150%；最近二期淨值比率均未達2%且在0 以上"],"a":3,"e":"答案(D)。依保險法第143-4條及保險業資本適足性管理辦法，資本顯著不足是指資本適足率在50%以上、未達150%，或最近二期淨值比率均未達2%且在0以上。(A)「最近二期淨值比率均未達3%且其中至少一期在2%以上」與(C)「150%以上未達200%」屬資本不足；資本適足須達200%以上，(B)屬適足區間。","c":10,"f":1,"ap":["E14-25"],"g":"本題依舊制RBC作答（舊制：適足200%以上、不足150%～未達200%、顯著不足50%～未達150%、嚴重不足低於50%）；2026年起保險業改採TW-ICS新制，資本適足法定標準改為100%（講義資本等級表採新制：適足100%以上、不足50%～未達100%、顯著不足25%～未達50%、嚴重不足低於25%）"},{"i":"E14-27","q":"實務上，銀行的「債權管理」會發生回收風險，該回收風險不包括下列何者？","o":["擔保品風險","第三人保證的風險","簽訂的法律契約風險","違約機率固定且已知的風險"],"a":3,"e":"答案(D)。回收風險是借款人違約後債權能回收多少的風險，影響因素包括擔保品、第三人保證及契約保障條款（簽訂的法律契約），故(A)(B)(C)都屬於回收風險。「違約機率」屬於違約風險的範疇，與回收風險無關，故(D)不包括在內。","c":12,"f":1,"ap":["E14-27"]},{"i":"E14-31","q":"假設債券部位的投資損失符合常態分配，單尾的容忍水準2.5%當作損失門檻，殖利率的標準差為0.5%，敏感性係數為1 時，下列市場風險值(VaR)的敘述何者正確？","o":["VaR=0－1.96×1×0.005","VaR=0－1.96×1×0.025","VaR=0－1.645×1×0.005","VaR=0－2.325×1×0.005"],"a":0,"e":"答案(A)。市場風險值VaR＝0－Z×β×σ，Z為波動倍數，β為敏感性係數，σ為損失波動幅度（殖利率標準差）。單尾容忍水準2.5%對應Z＝1.96，β＝1，σ＝0.5%＝0.005，故VaR＝0－1.96×1×0.005。(B)把容忍水準2.5%誤當成σ；(C)的1.645對應5%；(D)的2.325對應1%。","c":13,"f":2,"ap":["E14-31","E20-58"]},{"i":"E14-32","q":"銀行藉由「損失波動幅度」與「波動倍數」的相乘，估算部位何種風險指標？","o":["信用風險值或限額","市場風險值或限額","作業風險值或限額","信用損失的期望值與標準差"],"a":1,"e":"答案(B)。市場風險值(VaR)＝損失波動幅度(σ)×波動倍數(Z，依容忍水準決定)×敏感性係數，是估算市場風險值或市場風險限額的方法。信用風險值是由違約機率、信用暴險額與違約損失率計算；作業風險及信用損失期望值也不是用這種方式估算。","c":13,"f":1,"ap":["E14-32"]},{"i":"E14-33","q":"王先生持有與大盤風險類似的股票組合市值500 萬元，年報酬的標準差為20%，假設一年有250 個交易日，報酬率彼此獨立，且波動同質的常態分配，在單尾容忍水準5%下，一天的市場風險值(VaR)最接近下列何者？【標準常態值：N(0.95)=1.65，N(0.975)=1.96】","o":["10 萬元","12 萬元","165 萬元","196 萬元"],"a":0,"e":"答案(A)。日標準差＝年標準差÷√250＝20%÷√250≒1.265%。單尾5%對應Z＝1.65，一天VaR＝500萬×1.265%×1.65≒10.4萬元，最接近10萬元。(C)165萬元與(D)196萬元是直接用年標準差計算的一年期VaR（500×20%×1.65、500×20%×1.96），不是一天VaR。","c":13,"f":1,"ap":["E14-33"]},{"i":"E14-34","q":"銀行「存款準備金」之構成項目中，下列項目何者錯誤？","o":["儲蓄存款","庫存現金","開立在臺灣銀行的「票據交換清算帳戶」存款","開立在央行或受託管理機構之存款準備金甲戶與乙戶之存款"],"a":0,"e":"答案(A)。存款準備金的構成項目（可充當準備金的資產）包括：庫存現金、在央行或受託管理機構開立之準備金甲戶與乙戶存款、在臺灣銀行開立的「票據交換清算帳戶」存款。儲蓄存款是銀行須依法提存準備金的「存款負債」，不是準備金的構成項目，故(A)錯誤。","c":11,"f":2,"ap":["E14-34","E21-36"]},{"i":"E14-38","q":"有關金融機構的作業風險，下列何者非屬主要監督機構？","o":["金管會銀行局","金管會檢查局","中央銀行","內政部警政署"],"a":3,"e":"答案(D)。金融機構作業風險的主要監督機構為金管會（銀行局負責監理、檢查局負責金融檢查）及中央銀行（金融檢查及支付系統監管）。內政部警政署負責治安與刑案偵辦，不是金融機構作業風險的主管或監督機構。","c":15,"f":1,"ap":["E14-38"]},{"i":"E14-43","q":"有關作業基礎成本制度(Activity-Based Costing, ABC)，下列敘述何者正確？","o":["金融服務業面對的是人的交易行為，人的慣性行為使得「標準」作業很容易設定","ABC 制度的各項作業成本，是由作業動因的作業量除以「動因費率」計算而得","ABC 制度的作業成本，不須納入每項作業的「風險成本」","ABC 成本制度的特色之一，在於能夠區分個別業務及客戶的績效差異"],"a":3,"e":"答案(D)。作業基礎成本制度(ABC)的特色之一是能將成本合理歸屬到個別業務與客戶，區分其績效差異，(D)正確。(A)人的慣性行為使「標準」作業「不容易」設定；(B)作業成本是作業動因的作業量「乘以」動因費率；(C)ABC的作業成本「須」納入每項作業的風險成本。","c":2,"f":2,"ap":["E14-43","E20-43"]},{"i":"E14-44","q":"A 銀行目前提供客戶約1%的存款利率，而對客戶的貸款利率為2.5%，若該行存放比率為80%。請問該行每吸收1,000 萬元存款後將其貸出時，在不考慮相關成本下，可獲得多少利潤？","o":["25 萬元","15 萬元","12 萬元","10 萬元"],"a":2,"e":"答案(C)。存放比率80%表示1,000萬元存款可貸出800萬元。依官方答案，利潤以貸出部分的存放款利差計算：800萬×(2.5%－1%)＝12萬元。若嚴格計算，全部1,000萬元存款都要付息，利潤應為800萬×2.5%－1,000萬×1%＝20萬－10萬＝10萬元（即(D)）；官方以(C)為準，作答時依官方算法即可。","c":2,"f":1,"ap":["E14-44"],"g":"官方算法只計貸出800萬的利差；若計入未貸出200萬存款的利息成本，結果為10萬元(D)，題意有爭議"},{"i":"E14-52","q":"臺灣的主管機關對於資本等級不同的銀行，規範的業務項目跟著不同，下列敘述何者錯誤？","o":["資本適足等級之銀行，可辦理「財富管理」業務","資本適足等級之銀行，資本適足率依規定加計，可轉投資「非金融」相關事業","銀行呈現資本不足時，主管機關便得「限制或禁止」其與利害關係人之授信或其他交易","銀行的資本等級屬於資本不足、顯著不足或嚴重不足時，主管機關可命令銀行或其負責人在期限內，提出資本重建或其他財務業務改善計畫"],"a":2,"e":"答案(C)。資本適足等級的銀行可辦理財富管理等業務，資本適足率依規定加計後可轉投資非金融相關事業；資本不足、顯著不足或嚴重不足時，主管機關都可命令銀行或其負責人限期提出資本重建或其他財務業務改善計畫，故(A)(B)(D)正確。依銀行法第44-2條，「限制或禁止與利害關係人之授信或其他交易」是資本「顯著不足」時才適用的措施；資本不足時只能命令提出改善計畫、限制新增風險性資產等，故(C)錯誤。","c":9,"f":1,"ap":["E14-52"]},{"i":"E14-60","q":"根據2022 年起的法規，銀行的資本等級被劃分為「資本顯著不足」，表示此銀行：","o":["資本適足比率達2%以上，但未達8.5%","資本適足比率未達2%","資本適足比率達9%","資本適足比率達10%"],"a":0,"e":"答案(A)。依現行「銀行資本適足性及資本等級管理辦法」，「資本顯著不足」是指資本適足率在2%以上、未達8.5%；未達2%(B)屬「資本嚴重不足」。總資本適足率最低要求為10.5%（含緩衝資本），故(C)9%及(D)10%都屬於「資本不足」，不是顯著不足的定義。","c":9,"f":1,"ap":["E14-60"]},{"i":"E15-4","q":"關於營運利潤、財務利潤與會計利潤之關係，下列敘述何者錯誤？","o":["會計利潤為營運利潤與財務利潤相加","財務利潤為內部移轉價格與市場價格的差額","營運利潤為顧客價格與內部移轉價格的差額","會計利潤為內部損益與外部損益的合計，不同營業單位的內部損益相抵銷時，合計數通常不為零"],"a":3,"e":"答案(D)。營運利潤＝顧客價格－內部移轉價格，包含內部損益與外部損益；財務利潤＝內部移轉價格－市場價格；會計利潤＝營運利潤＋財務利潤，故(A)(B)(C)正確。內部損益是銀行各單位間依內部轉撥價格互計的損益，彙總全行時會互相抵銷，合計數應為零，因此(D)說「合計數通常不為零」錯誤。","c":2,"f":1,"ap":["E15-4"]},{"i":"E15-10","q":"企業金融業務的信用評分與評等制度，下列敘述何者錯誤？","o":["信用評分越高，信用等級越佳","「5P 授信原則」的構成項目，包括借戶的還款來源與債權保障，但未包括資金用途","信用等級加計一碼，意指借戶的貸款利率加計0.25%","授信展望係依據授信戶的發展潛力加以衡量"],"a":1,"e":"答案(B)。授信5P原則包括借款戶(People)、資金用途(Purpose)、還款來源(Payment)、債權保障(Protection)及授信展望(Perspective)，「資金用途」是5P的構成項目之一，故(B)說未包括資金用途錯誤。信用評分越高等級越佳，一碼＝0.25%，授信展望依授信戶的發展潛力衡量，(A)(C)(D)正確。","c":4,"f":1,"ap":["E15-10"]},{"i":"E15-17","q":"為避免承擔過高的信用風險，銀行會以客戶和產業為對象訂定風險限額。經由銀行內部自建的評等模型，計算出的風險限額稱為下列何者？","o":["信用風險值","授信總餘額","融資額度","信用暴險額"],"a":0,"e":"答案(A)。信用風險值是銀行以內部自建的評等模型，依違約機率、信用暴險額與違約損失率計算的風險指標，可作為客戶與產業風險限額及授信權限的依據。授信總餘額、融資額度是授信金額，信用暴險額或潛在暴險額只是暴險金額，都不是由評等模型算出的風險限額。","c":12,"f":1,"ap":["E15-17"]},{"i":"E15-18","q":"銀行彙總授信對象所隸屬國家，可了解國家風險的高低。若授信對象登記在開曼群島時，應：","o":["以該授信對象之所有人所屬國別認列","將該授信對象彙整入高風險類之其他國別","將該授信對象之國別風險彙整入開曼群島","以該授信對象資金主要使用所在地國別認列"],"a":3,"e":"答案(D)。授信對象若登記在開曼群島、英屬維京群島等免稅地區（多為紙上公司，未實際營運），登記地無法反映真實風險，實務上應以該授信對象資金主要使用所在地的國別認列國家風險；若有保證人，則依承擔保證責任者的法定國籍歸屬。","c":7,"f":1,"ap":["E15-18"]},{"i":"E15-19","q":"銀行公會的信用評分制度，不包括申貸企業哪項構面或內容？","o":["產業特性暨展望","經營管理","授信與外匯往來的利潤貢獻","財務狀況"],"a":2,"e":"答案(C)。銀行公會的企業信用評分制度，評估構面包括財務狀況、經營管理、產業特性暨展望等。申貸客戶的授信與外匯往來利潤貢獻、股價等，屬於銀行自建「基本模型評等」可另外納入的資料來源，不在銀行公會信用評分的構面之內。","c":4,"f":2,"ap":["E15-19","E19-18"]},{"i":"E15-21","q":"依據標準普爾信評公司(S&P)之國家主權評等，下列哪些評級屬於非投資等級？ (A) C 級 (B) B 級 (C)BB 級 (D) BBB 級","o":["僅(A)","僅(A)(B)(C)","僅(A)(B)(D)","(A)(B)(C)(D)"],"a":1,"e":"答案(B)。S&P的長期評等以BBB－（含）以上為投資等級，BB+（含）以下為非投資等級（投機級）。因此C級、B級、BB級都屬非投資等級，BBB級屬投資等級，答案為僅(A)(B)(C)。","c":8,"f":2,"ap":["E15-21","E23-20"]},{"i":"E15-24","q":"A 銀行於110 年12 月31 日之資本適足率、第一類資本比率和普通股權益比率分別為9%、8%和6.5%，依銀行資本適足性及資本等級管理辦法之資本等級劃分標準，應歸類為下列何者？","o":["資本適足","資本不足","資本顯著不足","資本嚴重不足"],"a":1,"e":"答案(B)。現行最低標準為：普通股權益比率7%、第一類資本比率8.5%、資本適足率10.5%（均含2.5%緩衝資本）。A銀行資本適足率9%＜10.5%、第一類資本比率8%＜8.5%、普通股權益比率6.5%＜7%，未達最低標準；但資本適足率9%仍在8.5%以上，未落入顯著不足（2%以上未達8.5%）區間，故屬「資本不足」。","c":9,"f":1,"ap":["E15-24"]},{"i":"E15-25","q":"巴塞爾資本協定增訂之流動性風險指標，下列敘述何者錯誤？","o":["流動性覆蓋比率係指高品質的流動資產除以30 天期之淨現金流出","流動性覆蓋比率大於100%，意指銀行在監理機關嚴峻的流動性管理下，有足夠能力處分資產、換取現金","淨穩定資金比率係指法定穩定資金除以可取得的穩定資金","淨穩定資金比率強調支應資產和業務活動的資金，至少須一定比率來自於穩定的負債"],"a":2,"e":"答案(C)。淨穩定資金比率(NSFR)＝可取得的穩定資金÷法定（應有）穩定資金，(C)把分子分母寫反了。流動性覆蓋比率(LCR)＝高品質流動資產÷未來30天淨現金流出，大於100%表示在嚴峻壓力情境下可處分資產換取現金；NSFR強調支應資產和業務活動的資金至少須有一定比率來自穩定負債，(A)(B)(D)正確。","c":14,"f":1,"ap":["E15-25"]},{"i":"E15-27","q":"有關保險公司的資本適足率與業務限制，下列敘述何者錯誤？","o":["人身保險業之資本適足率達200%以上者，可申請辦理外幣收付之非投資型人身保險業務","最近一年的資本適足率達200%以上時，得申請設立國外子公司或分公司","保險公司的資本適足率達300%以上時，得申請從事增加投資效益之衍生性金融商品交易","財務和業務健全的財產保險公司，最近一年之資本適足率達200%時，可申請「傷害保險」及「健康保險」"],"a":2,"e":"答案(C)。依「保險業從事衍生性金融商品交易管理辦法」，保險業從事增加投資效益目的之衍生性金融商品交易，資本適足率須達法定標準（200%）的1.25倍，即250%以上，不是300%，故(C)錯誤。(A)人身保險業辦理外幣收付非投資型保險、(B)設立國外子公司或分公司、(D)財產保險業申請經營傷害保險及健康保險，門檻都是資本適足率200%以上。","c":10,"f":3,"ap":["E15-27","E18-26","E22-26"],"g":"本題依舊制RBC（法定標準200%、300%以上視為資本充裕）作答；2026年起保險業改採TW-ICS新制，資本適足法定標準改為100%（講義資本等級表採新制：適足100%以上、不足50%～未達100%、顯著不足25%～未達50%、嚴重不足低於25%）"},{"i":"E15-31","q":"衡量市場風險時，常見之市場因素不包含下列何者？","o":["利率","國際政治情勢","匯率","生產要素成本"],"a":1,"e":"答案(B)。衡量市場風險時，常見的市場因素包括利率、匯率、股價及商品價格（含生產要素成本）等可在市場觀察、會使部位價值變動的價格因子。國際政治情勢屬於國家風險或政治風險的範疇，不是衡量市場風險的市場因素。","c":13,"f":1,"ap":["E15-31"]},{"i":"E15-34","q":"利率攀升時，銀行應該採用何種資金管理策略？","o":["零缺口部位","負缺口部位","正缺口部位","不須採用任何策略"],"a":2,"e":"答案(C)。利率敏感性缺口＝利率敏感性資產－利率敏感性負債。預期利率攀升時，應擴大正缺口部位（敏感性資產＞敏感性負債），讓資產收益重新訂價的幅度大於負債成本，淨利息收入因而增加。負缺口適合利率下跌時使用；零缺口只能避險，無法從升息中獲利。","c":14,"f":1,"ap":["E15-34"]},{"i":"E15-40","q":"根據我國最新的「銀行資本適足性及資本等級管理辦法」，「槓桿比率」的最低要求為下列何者？","o":["3%","5%","7%","9%"],"a":0,"e":"答案(A)。依我國「銀行資本適足性及資本等級管理辦法」，槓桿比率（第一類資本淨額÷暴險總額）的最低要求為3%，與巴塞爾資本協定三的國際標準一致。","c":9,"f":1,"ap":["E15-40"]},{"i":"E15-55","q":"有關信用風險各項指標的計算，下列何項計算公式錯誤?","o":["表外非衍生性業務的信用相當額 = 交易金額 × 信用轉換係數","表外衍生性業務的信用相當額 = 當期暴險額 + 潛在暴險額","資本適足率 = 第一類合格資本／風險性資產","損失準備覆蓋率 = 損失準備／不良授信資產"],"a":2,"e":"答案(C)。資本適足率＝合格自有資本淨額（第一類資本淨額＋第二類資本淨額）÷風險性資產總額；只用第一類資本計算的是第一類資本比率，故(C)錯誤。表外非衍生性業務信用相當額＝交易金額×信用轉換係數，衍生性業務信用相當額＝當期暴險額＋潛在暴險額，損失準備覆蓋率＝損失準備÷不良授信資產，(A)(B)(D)正確。","c":12,"f":1,"ap":["E15-55"]},{"i":"E15-59","q":"銀行之流動性風險與利率風險管理的監督指標，下列敘述何者錯誤？","o":["存款準備與流動準備，係與利率風險有關的準備部位","存款準備與流動準備，係與流動性風險有關的準備部位","全行的利率風險以資產負債的「利率敏感性和非敏感性」為基準，設置缺口指標","流動性風險以現金流入與流出相減的「淨現金流量」為基礎，設置缺口指標"],"a":0,"e":"答案(A)。存款準備與流動準備是確保銀行有足夠資金應付提領的準備部位，與「流動性風險」有關，不是與利率風險有關，故(A)錯誤，(B)正確。利率風險以資產負債的利率敏感性與非敏感性設置缺口指標；流動性風險以現金流入減流出的淨現金流量設置缺口指標，(C)(D)正確。","c":14,"f":2,"ap":["E15-59","E20-37"]},{"i":"E16-6","q":"有關營運利潤、會計利潤和財務利潤，下列敘述何者正確？","o":["財務利潤=營運利潤+會計利潤","會計利潤=營運利潤+財務利潤","營運利潤=財務利潤+會計利潤","三者非屬相同會計基礎，無法衡量"],"a":1,"e":"答案(B)。營運利潤是顧客價格與內部移轉價格的差額，財務利潤是內部移轉價格與市場價格的差額，兩者相加就是銀行本期損益，也就是會計利潤：會計利潤＝營運利潤＋財務利潤。三者基礎一致、可以衡量，故(A)(C)(D)錯誤。","c":2,"f":1,"ap":["E16-6"]},{"i":"E16-7","q":"銀行整合組織目標與部門目標之管理機制，下列敘述何者錯誤？","o":["單軌制的內部轉撥價格相較於多軌制的內部轉撥價格更能正確反映資金成本與政策目標","根據風險資本的配置系統(Capital Allocation System)，應將營業單位、業務項目和交易活動的所有風險，緊密地與銀行自有資本搭配","按照「風險值」衡量各項業務及主管的風險權限，可更客觀研判風險資本的配置與績效目標有否達成","總行財務處可以使用聯行往來的資金調撥系統，剖析分行等營業單位的營運利潤，並引導各項業務配合全行的經營政策"],"a":0,"e":"答案(A)。多軌制的內部轉撥價格，會依不同資金來源與去路、期別訂定不同利率，比單軌制更能正確反映資金成本與政策目標，故(A)說單軌制較佳錯誤。(B)風險資本配置系統要使各單位、業務及交易的風險與自有資本緊密搭配；(C)以風險值衡量風險權限；(D)財務處透過聯行往來資金調撥系統剖析營運利潤，都正確。","c":2,"f":1,"ap":["E16-7"]},{"i":"E16-8","q":"有關應收帳款代收融資，下列何者正確？","o":["應收帳款管理商無法向商品勞務供應者，追回墊付帳款時，稱為有追索權之應收帳款承購","有追索權的授信對象為應收帳款的讓與者（即商品勞務的賣方），無追索權的授信對象為應收帳款的還款者（即商品勞務的買方）","辦理應收帳款承購業務的銀行承擔過高流動性風險與信用風險時，可將部分應收帳款在初級市場轉售予其他銀行","辦理應收帳款承購業務的銀行發現商品勞務買方存在明顯不同的信用等級時，無須自行負擔保險費用（一般無法要求應收帳款讓與者額外負擔保險費用），即可降低信用風險"],"a":1,"e":"答案(B)。應收帳款承購有追索權時，銀行可向應收帳款讓與者（賣方）追索，授信對象為賣方；無追索權時，銀行承擔買方的信用風險，授信對象為還款者（買方），(B)正確。(A)無法向賣方追回墊款是「無追索權」；(C)應收帳款轉售予其他銀行是在「次級市場」；(D)買方信用等級差異大時，銀行可要求應收帳款讓與者額外負擔保險費用以降低信用風險，敘述錯誤。","c":4,"f":1,"ap":["E16-8"]},{"i":"E16-10","q":"針對授信契約的保障條款，下列何者不屬於正向條款？","o":["借戶須定期陳送財務報表","借戶未獲得債權銀行同意，不得發行新債","借戶的利息保障倍數須大於3","借戶的資產報酬率須大於5%"],"a":1,"e":"答案(B)。正向條款（積極承諾）是借款人「應達到」的事項，例如定期陳送財務報表、利息保障倍數須大於3、資產報酬率須大於5%。「未經債權銀行同意，不得發行新債」是禁止借款人做某些事的規定，屬於負向條款（反面承諾），不是正向條款。","c":4,"f":1,"ap":["E16-10"]},{"i":"E16-12","q":"購置住宅貸款之借款客戶要降低還本付息壓力，可在最初幾年申請「寬限期」，意指這段期間的還款方式為下列何者？","o":["付息不還本","還本不付息","不還本不付息","少還本少付息"],"a":0,"e":"答案(A)。購屋貸款的「寬限期」是指貸款最初幾年只繳利息、不攤還本金，以降低借款人前期的還款壓力；寬限期結束後再開始本息攤還。","c":5,"f":1,"ap":["E16-12"]},{"i":"E16-13","q":"假設ARMs 定儲利率指數為2.5%，銀行承作房貸之成本加碼為2.55%，企業金融業務有關違約風險之信用等級加碼為1%，請根據ARMs 房貸之利率訂價方式，計算房貸利率為何？","o":["6.05%","5.05%","3.55%","3.50%"],"a":1,"e":"答案(B)。ARMs（指數型房貸）利率＝指標利率＋成本加碼＝2.5%＋2.55%＝5.05%。企業金融業務的信用等級加碼不適用於ARMs房貸的訂價，不應加入；若誤加1%會得到(A)6.05%。","c":5,"f":2,"ap":["E16-13","E20-49"]},{"i":"E16-21","q":"有關信用違約交換（Credit Default Swap;簡稱CDS）的特性與應用，下列敘述何者不合理？","o":["該指標可檢視交易對手國於國際金融市場的信用狀況","CDS 加碼101 基點，等於1.01%","單一事件造成某國CDS 價格低於原來標準，且連續發生數日時，銀行可能凍結該國的風險限額","單一事件造成某國CDS 價格高於原來標準，且連續發生數日時，銀行可能凍結該國的風險限額"],"a":2,"e":"答案(C)。CDS價格越高，代表市場認為該國違約風險越大；單一事件造成某國CDS價格「高於」原來標準且連續數日時，銀行可能凍結該國風險限額，所以(D)合理，(C)說「低於」標準要凍結不合理。CDS可檢視交易對手國在國際金融市場的信用狀況，1基點＝0.01%，101基點＝1.01%，(A)(B)正確。","c":8,"f":1,"ap":["E16-21"]},{"i":"E16-22","q":"依據銀行資本適足性及資本等級管理辦法，槓桿比率係指下列何者？","o":["第一類資本淨額 / 暴險總額","第一類資本淨額 / 總資產","合格資本 / 暴險總額","總負債 / 總資產"],"a":0,"e":"答案(A)。依「銀行資本適足性及資本等級管理辦法」，槓桿比率＝第一類資本淨額÷暴險總額。暴險總額包括表內資產、衍生性金融商品、有價證券融資交易及表外項目的暴險，不只是帳上總資產，故(B)錯誤；(C)合格資本是計算資本適足率用；(D)總負債÷總資產是一般的負債比率。","c":9,"f":1,"ap":["E16-22"]},{"i":"E16-23","q":"有關銀行的業務限制，下列敘述何者錯誤？","o":["資本不足者，主管機關得限制新增風險性資產","資本顯著不足者，主管機關得限制轉投資","資本不足者，主管機關得禁止與利害關係人授信或其他交易","資本顯著不足者，主管機關得限制存款利率不得超過其他銀行同性質存款"],"a":2,"e":"答案(C)。依銀行法第44-2條，資本不足者，主管機關得命令提出資本重建或財務業務改善計畫、限制新增風險性資產等，(A)正確。限制或禁止與利害關係人的授信或其他交易、限制轉投資、限制存款利率不得超過其他銀行同性質存款等，是資本「顯著不足」時才適用的措施，故(B)(D)正確、(C)錯誤。","c":9,"f":2,"ap":["E16-23","E21-22"]},{"i":"E16-26","q":"保險公司申請從事衍生性金融商品交易之資格，請問其資本適足率至少須達多少以上？","o":["150%","200%","250%","300%"],"a":2,"e":"答案(C)。依「保險業從事衍生性金融商品交易管理辦法」第5條，保險業從事增加投資效益目的之衍生性金融商品交易，自有資本與風險資本之比率須達資本適足法定標準之1.25倍以上；出題當時（舊制RBC）法定標準為200%，故為200%×1.25＝250%。(A)150%為舊制資本不足區間下限、(B)200%為舊制法定最低標準、(D)300%為舊制「資本充裕」門檻，均非本題門檻。","c":10,"f":1,"ap":["E16-26"],"g":"本題依舊制RBC（法定標準200%）作答；2026年起保險業改採TW-ICS新制，資本適足法定標準改為100%（講義資本等級表採新制：適足100%以上、不足50%～未達100%、顯著不足25%～未達50%、嚴重不足低於25%），若依新制換算門檻將不同，考試以官方答案(C)為準"},{"i":"E16-32","q":"銀行發行的票券或債券商品，迄今仍流通在外的餘額，實務上稱為下列何者？","o":["買入票券或債券","金融資產","金融負債","長部位"],"a":2,"e":"答案(C)。銀行發行票券或債券商品後，迄今仍流通在外（未到期）的餘額，是銀行未來須償還的債務，實務上稱為金融負債。(A)買入票券或債券與(B)金融資產是銀行持有的資產；(D)長部位是外匯資產大於負債的淨部位。","c":13,"f":1,"ap":["E16-32"]},{"i":"E16-34","q":"藉由「向下風險」衡量市場風險時，下列敘述何者錯誤？","o":["向下風險，著重在不利方向變動時，對部位價值之影響","以盈餘指標衡量時，向下風險係在容忍水準假設下，估算最差情況剩下多少盈餘","市場風險值=損失波動幅度 ﹡波動倍數","操作越保守，市場風險的容忍度越高，越期待投資時避免損失超過門檻"],"a":3,"e":"答案(D)。操作越保守，對市場風險的容忍度越「低」，越期待避免損失超過門檻，故(D)說「容忍度越高」錯誤。向下風險著重不利方向變動對部位價值的影響，以盈餘指標衡量時是估算在容忍水準下最差情況還剩多少盈餘；市場風險值＝損失波動幅度×波動倍數，(A)(B)(C)正確。","c":13,"f":2,"ap":["E16-34","E19-35"]},{"i":"E16-35","q":"觀察銀行是否存在嚴重的流動性風險，下列敘述何者錯誤？","o":["對外籌資窒礙難行，組織內部彼此牽制，推動困難","借款客戶嚴重違約，導致銀行發生擠兌，宣告破產","存款客戶嚴重違約，導致銀行發生擠兌，宣告破產，俗稱致命性風險(Fatal Risk)","銀行的資產負債項目，因長短期結構不一致，而使負缺口部位愈來愈大"],"a":2,"e":"答案(C)。存款客戶是銀行的債權人，沒有「違約」的問題，(C)說存款客戶嚴重違約導致擠兌錯誤。嚴重流動性風險的徵兆包括：對外籌資窒礙難行、借款客戶嚴重違約造成損失而引發擠兌甚至破產、資產負債長短期結構不一致使負缺口愈來愈大，(A)(B)(D)正確。","c":14,"f":2,"ap":["E16-35","E20-36"]},{"i":"E16-38","q":"採用「標準法」計提作業風險的資本需求額時，該方法相較於「基本指標法」，通常對資本計提的影響為：","o":["較少","較多","相同","兩者間無法比較"],"a":0,"e":"答案(A)。作業風險標準法依八大業務類別，以各類業務的營業毛利乘以對應的風險係數β（12%～18%）計提；基本指標法以全行營業毛利乘以固定的15%計提。因許多業務適用的β值低於15%，相較於基本指標法，標準法通常對資本計提的影響較少（計提額較低）。","c":15,"f":2,"ap":["E16-38","E20-38"]},{"i":"E16-43","q":"以資金調撥做為核心職掌的單位，其業務活動應聚焦在下列哪些？ A.積極擴大衍生性商品部位 B.同業拆款 C.提高黃金商品多頭部位，抵抗通膨風險 D.票債券管理","o":["僅AC","僅BD","僅ABD","僅BCD"],"a":1,"e":"答案(B)。以資金調撥為核心職掌的單位（如財務處資金調撥科），主要負責全行資金的流動性管理與調度，業務應聚焦在同業拆款(B)與票債券管理(D)。積極擴大衍生性商品部位(A)、提高黃金多頭部位(C)屬於交易或投資性質的業務，不是資金調撥的核心職掌，故選僅BD。","c":14,"f":1,"ap":["E16-43"]},{"i":"E16-44","q":"營業單位給予客戶的平均放款利率為5%，銀行牌告的存款利率為3%，若存放款資金的移轉價格(FTP)相同，常理上，下列何者為營業單位營運利潤之計算公式？","o":["放款×(5%-FTP)+存款×(FTP-3%)","放款×(5%-FTP)-存款×(FTP-3%)","放款×(FTP-5%)+存款×(FTP-3%)","放款×(FTP-5%)-存款×(FTP-3%)"],"a":0,"e":"答案(A)。營業單位的營運利潤＝放款利差＋存款利差。放款部分：營業單位向總行以FTP借用資金後以5%貸出，利差為放款×(5%－FTP)；存款部分：以3%吸收存款後以FTP供應給總行，利差為存款×(FTP－3%)。兩者相加：放款×(5%－FTP)＋存款×(FTP－3%)。","c":2,"f":2,"ap":["E16-44","E21-44"]},{"i":"E16-46","q":"丙公司發行一張由商業銀行允諾承兌的匯票，面額500 萬元，180 天到期，貼現率為6%，請問銀行承兌匯票的發行價格為何？","o":["470 萬元","475.21 萬元","485.21 萬元","480.21 萬元"],"a":2,"e":"答案(C)。銀行承兌匯票採貼現方式發行，發行價格＝面額×(1－貼現率×天數/365)＝500萬×(1－6%×180/365)＝500萬×(1－0.029589)≒485.21萬元。","c":4,"f":1,"ap":["E16-46"]},{"i":"E16-50","q":"有關信用等級的移轉矩陣，下列敘述何項不符合此理論？","o":["違約機率越高，信用風險越大，信用等級即越差","信用風險越低時，信用等級加碼宜越少","年初屬於某種等級，年底維持在原來等級，以及移轉至其他等級的機率，相加以後總和為1","常理上，信用等級越佳企業，年底仍在原來等級的比率越低"],"a":3,"e":"答案(D)。依信用等級移轉矩陣，信用等級越佳的企業越穩定，年底仍維持原等級的比率越「高」，故(D)說越低錯誤。違約機率越高信用等級越差、信用風險越低加碼越少、年初某等級年底維持原等級及移轉至其他等級的機率總和為1，(A)(B)(C)正確。","c":6,"f":2,"ap":["E16-50","E22-15"]},{"i":"E16-51","q":"有關國家主權評等之預告機制，下列敘述何者錯誤？","o":["預告機制包括觀察名單和展望兩種制度","觀察名單反映被觀察國家未來一年，信用等級可能朝向哪種變動","觀察國家為正向者，政府部門發行的債券或主權評等在短期內可能調升","展望機制著眼於政府發行的中長期債務，未來一至二年的信用走向"],"a":1,"e":"答案(B)。國家主權評等的預告機制包括觀察名單與展望。觀察名單是在有事件發生或即將發生時，將國家納入觀察，通常在90天（約三個月）內作出評等調整或維持，反映的是短期變動，不是「未來一年」，故(B)錯誤。正向觀察者其政府債券或主權評等短期內可能調升；展望著眼於中長期債務未來一至二年的信用走向，(A)(C)(D)正確。","c":8,"f":2,"ap":["E16-51","E21-21"]},{"i":"E16-57","q":"下列哪項指標非屬市場風險的衡量指標？","o":["利率敏感性係數","匯率敏感性係數","利率波動的敏感性係數","信用轉換係數"],"a":3,"e":"答案(D)。利率敏感性係數、匯率敏感性係數、利率波動的敏感性係數，都是衡量市場因素變動一單位時部位價值變動多少的市場風險指標。信用轉換係數(CCF)是將表外業務轉為信用相當額的係數，屬於信用風險的衡量工具，不是市場風險指標。","c":13,"f":1,"ap":["E16-57"]},{"i":"E17-8","q":"本國銀行為承作1 億美元放款，發行0.8 億美元定期存單，若美元升值，其對會計損益會有何種影響？","o":["出現匯兌獲利","出現匯兌損失","備抵呆帳需增加","備抵呆帳需減少"],"a":0,"e":"答案(A)。銀行承作1億美元放款（外幣資產）、發行0.8億美元定期存單（外幣負債），外幣資產大於負債，淨部位為0.2億美元的長部位（買超）。美元升值時，美元資產換算成臺幣的價值增加幅度大於負債，產生匯兌獲利。備抵呆帳是信用風險的提列，與匯率變動無直接關係，(C)(D)錯誤。","c":13,"f":1,"ap":["E17-8"]},{"i":"E17-9","q":"甲公司的年度財務數字如下：賒銷產生的營業收入166 佰萬元、營業成本92 佰萬元、營業外收入5 佰萬元、期初應收帳款淨額13 佰萬元、期末應收帳款淨額28 佰萬元，請計算該公司的應收帳款週轉率約為何？","o":["6.1","8.1","10.1","13.1"],"a":1,"e":"答案(B)。應收帳款週轉率＝賒銷營業收入÷平均應收帳款。平均應收帳款＝(13＋28)÷2＝20.5佰萬元，週轉率＝166÷20.5≒8.1次。營業成本與營業外收入和本題計算無關。","c":4,"f":1,"ap":["E17-9"]},{"i":"E17-14","q":"有關公司債之敘述，下列何者正確？","o":["同一發行機構的短期債券評等與長期債券評等並無絕對關係，意味信用等級不一定相同","同一發行機構的短期債券評等較高，則長期債券評等較高","同一發行機構的長期債券評等較高，則短期債券評等較高","公司長期債券評等的最重要因素是評估該公司的流動能力"],"a":0,"e":"答案(A)。信評機構對同一發行機構的短期債券評等與長期債券評等，評估重點及期間不同（短期著重流動性，長期著重長期償債與獲利能力），兩者沒有絕對的對應關係，信用等級不一定相同，故(B)(C)錯誤。公司長期債券評等的定量分析以利息保障倍數最為重要（長期償債能力為次要指標），不是流動能力，(D)錯誤。","c":6,"f":1,"ap":["E17-14"]},{"i":"E17-15","q":"依據標準普爾信用評等機構之觀點，下列哪些指標可以衡量受評公司之現金流量是否足夠？ A.營業利益/營業收入 B.長短期借款/總資產 C. (正常營業活動的現金流量+利息費用)/利息費用 D.借款的還本期限","o":["僅CD","僅AD","僅BCD","ABCD"],"a":0,"e":"答案(A)。依S&P的觀點，衡量受評公司現金流量是否足夠的指標包括：(正常營業活動的現金流量＋利息費用)÷利息費用(C)，以及借款的還本期限(D)。A營業利益÷營業收入是獲利能力指標，B長短期借款÷總資產是財務結構或槓桿指標，故選僅CD。","c":6,"f":2,"ap":["E17-15","E22-50"]},{"i":"E17-18","q":"有關信用風險值，下列哪些敘述正確？ A.計算過程需考慮違約機率、信用暴險額和違約損失率 B.信賴水準高低會影響信用風險值大小 C.無法反映未來的潛在風險 D.可以公允衡量授信主管應承擔之授信權利和責任","o":["僅AC","僅ABC","僅ABD","僅BCD"],"a":2,"e":"答案(C)。信用風險值的計算需考慮違約機率、信用暴險額與違約損失率(A)；信賴水準的高低會影響信用風險值的大小(B)；可公允衡量授信主管應承擔的授信權利與責任(D)。信用風險值是對未來可能損失的估計，可以反映未來的潛在風險，C錯誤，故選僅ABD。","c":12,"f":1,"ap":["E17-18"]},{"i":"E17-22","q":"A 銀行於111 年12 月31 日之資本適足率、第一類資本比率和普通股權益比率分別為9.5%、8%和6.5%，依銀行資本適足性及資本等級管理辦法之資本等級劃分標準，應歸類為下列何者？","o":["資本適足","資本不足","資本顯著不足","資本嚴重不足"],"a":1,"e":"答案(B)。現行最低標準為：普通股權益比率7%、第一類資本比率8.5%、資本適足率10.5%（均含2.5%緩衝資本）。A銀行資本適足率9.5%＜10.5%、第一類資本比率8%＜8.5%、普通股權益比率6.5%＜7%，未達最低標準；但資本適足率仍在8.5%以上，未落入顯著不足（2%以上未達8.5%）區間，故屬「資本不足」。","c":9,"f":1,"ap":["E17-22"]},{"i":"E17-25","q":"有關銀行業的槓桿比率，下列敘述何者錯誤？","o":["目的係用來補充以風險衡量為基礎之最低資本要求","槓桿比率之分子為第一類資本淨額","槓桿比率之分母為暴險總額","最低要求的槓桿比率為6%"],"a":3,"e":"答案(D)。槓桿比率＝第一類資本淨額／暴險總額，目的在補充以風險為基礎的最低資本要求，避免銀行過度擴張槓桿，故(A)(B)(C)正確。依巴塞爾資本協定三及我國「銀行資本適足性及資本等級管理辦法」，槓桿比率最低要求為3%，不是6%，故(D)錯誤。","c":9,"f":1,"ap":["E17-25"]},{"i":"E17-27","q":"證券商的資本適足率，計算的風險範圍包括下列哪些？ A.市場風險 B.信用風險 C.作業風險 D.財富管理通路風險","o":["僅A","僅AB","僅ABC","ABCD"],"a":2,"e":"答案(C)。證券商的自有資本適足比率，計算的風險範圍包括市場風險、交易對象風險（信用風險）、作業風險及基礎風險，故A、B、C都包括在內。「財富管理通路風險」不在證券商資本適足率的計算範圍，故選僅ABC。","c":10,"f":1,"ap":["E17-27"]},{"i":"E17-28","q":"當銀行知悉授信客戶之信用暴險額及違約損失率，但未知違約發生機率時，可藉由「簡化」公式估算客戶的信用損失，下列公式何者錯誤？","o":["信用損失=信用暴險額*違約機率*違約損失率","信用損失=信用暴險額*違約機率*(1 ﹣回收率)","信用損失=信用暴險額*違約機率*呆帳準備率","信用損失=信用暴險額*違約機率 ﹣回收金額"],"a":2,"e":"答案(C)。信用損失＝信用暴險額×違約機率×違約損失率，違約損失率＝1－回收率，故(A)(B)正確；信用暴險額×違約機率代表預期違約金額，扣除回收金額也是信用損失，(D)正確。呆帳準備率是會計上的提列比率，不等於違約損失率，因此(C)不能用來估算信用損失。","c":12,"f":1,"ap":["E17-28"]},{"i":"E17-31","q":"依主管機關2017 年12 月31 日起的資本適足率規定，以「非自用住宅」當作擔保品，適用的風險權數應如何訂定？","o":["一律以貸放比率(Loan to Value; LTV)為基礎劃分","一律適用100%風險權數","一律適用75%風險權數","一律適用45%風險權數"],"a":2,"e":"答案(C)。依主管機關2017年12月31日起實施的資本適足率規定，以「自用住宅」為擔保的貸款，依貸放比率(LTV)劃分風險權數（例如LTV在75%以下適用35%）；以「非自用住宅」為擔保者，不分LTV一律適用75%的風險權數。(A)是自用住宅的作法，(B)(D)的權數不正確。","c":12,"f":1,"ap":["E17-31"]},{"i":"E17-32","q":"銀行藉由「損失波動幅度」與「波動倍數」的相乘，估算哪種風險部位的限額門檻？","o":["信用風險值或限額","市場風險值或限額","作業風險值或限額","信用損失的期望值與標準差"],"a":1,"e":"答案(B)。市場風險值(VaR)＝損失波動幅度(σ)×波動倍數(Z，依容忍水準決定)×敏感性係數，是估算市場風險值或市場風險限額的方法。信用風險值是由違約機率、信用暴險額與違約損失率計算；作業風險及信用損失期望值也不是用這種方式估算。","c":13,"f":1,"ap":["E17-32"]},{"i":"E17-33","q":"評估債券之「利率敏感性係數」，是以「Present Value of Basis Point；PVBP」指標為代表，試問實務上所稱1 BP為下列何者？","o":["0.001%","0.01%","0.1%","1%"],"a":1,"e":"答案(B)。1個基點(Basis Point, BP)＝0.01%＝0.0001。PVBP(Present Value of a Basis Point)是殖利率變動1個基點時，債券價格（現值）的變動金額，用來衡量債券的利率敏感性。","c":13,"f":1,"ap":["E17-33"]},{"i":"E17-34","q":"當「利率敏感性係數」為5，且殖利率上升0.01%時，原來1 百萬元的債券，市場價格（值）變為下列何者？","o":["1,000,500 元","1,000,100 元","999,500 元","999,100 元"],"a":2,"e":"答案(C)。價格變動率≒－利率敏感性係數×殖利率變動＝－5×0.01%＝－0.05%。債券價格＝1,000,000×(1－0.05%)＝1,000,000－500＝999,500元。殖利率上升債券價格下跌，故(A)(B)錯誤；(D)誤算成下跌900元。","c":13,"f":1,"ap":["E17-34"]},{"i":"E17-36","q":"有關銀行的放款對存款之比率（簡稱存放比率），下列敘述何者錯誤？","o":["存放比率愈高，銀行的流動性愈低","存放比率愈高，銀行的流動能力愈強","存放比率愈高，銀行的流動性風險愈大","存放款業務為主的銀行，存放比率仍具相當參考價值"],"a":1,"e":"答案(B)。存放比率＝放款÷存款。存放比率愈高，表示資金大量貸出、可動用的資金愈少，流動性愈低、流動性風險愈大，所以(A)(C)正確、(B)說流動能力愈強錯誤。對以存放款業務為主的銀行或分行來說，存放比率仍是相當有參考價值的流動性指標，(D)正確。","c":14,"f":1,"ap":["E17-36"]},{"i":"E17-37","q":"依「金融機構存款及其他各種負債準備金調整及查核辦法」規定，有關存款負債應提「存款準備金」的敘述，下列何者不應納入？","o":["支票存款","活期存款","定期存款","庫存現金"],"a":3,"e":"答案(D)。依「金融機構存款及其他各種負債準備金調整及查核辦法」，支票存款、活期存款、定期存款等存款負債都須提存準備金。庫存現金是可充當準備金的資產（準備金的構成項目），不是應提準備的存款負債，故不應納入。","c":11,"f":1,"ap":["E17-37"]},{"i":"E17-39","q":"IFRS 9 的損失估計方式，以下列何者為基礎？","o":["歷史損失經驗模式","有限損失認列模式","預期信用損失模式","實際損失認列模式"],"a":2,"e":"答案(C)。IFRS 9以「預期信用損失模式」(Expected Credit Loss)估計減損，依信用風險是否顯著增加，分階段提列12個月或存續期間的預期信用損失。舊制IAS 39採「已發生損失模式」，以實際發生的損失事件認列，(A)(B)(D)都不是IFRS 9的基礎。","c":12,"f":2,"ap":["E17-39","E21-40"]},{"i":"E17-40","q":"依據銀行淨穩定資金比率實施標準規定，自民國107 年1 月1 日起，淨穩定資金比率之最低標準為下列何者？","o":["70%","80%","90%","100%"],"a":3,"e":"答案(D)。依「銀行淨穩定資金比率實施標準」，自民國107年1月1日起實施淨穩定資金比率(NSFR)，最低標準為100%，即可取得的穩定資金不得低於法定（應有）穩定資金。NSFR屬於長期流動性的量化指標。","c":14,"f":1,"ap":["E17-40"]},{"i":"E17-41","q":"銀行根據風險胃納、策略及管理所需建立之損失機率範圍，藉由內部風險管理部門，計算非預期損失的資本需求額，名稱為下列何者？","o":["法定資本","經濟資本","已投入資本","緩衝資本"],"a":1,"e":"答案(B)。經濟資本是銀行依自己的風險胃納、策略與管理需要，訂定損失機率範圍（信賴水準），由內部風險管理部門計算涵蓋非預期損失所需的資本，又稱風險資本。法定資本是依主管機關規定計提的資本，已投入資本是股東實際投入的資本，(A)(C)(D)不符。","c":12,"f":2,"ap":["E17-41","E18-1"]},{"i":"E17-42","q":"銀行的董事會將授信管理處定義為利潤中心時，其權責宜包括下列哪些？ A.信用風險的監督管理 B.承擔授信績效的使命 C.監控資本適足率的任務 D.訂定風險胃納制度","o":["僅A","僅AB","僅ABC","ABCD"],"a":1,"e":"答案(B)。董事會將授信管理處定義為利潤中心時，其權責包括信用風險的監督管理(A)與承擔授信績效的使命(B)。監控資本適足率(C)及訂定風險胃納制度(D)屬於風險管理單位、資產負債管理委員會或董事會層級的權責，不在授信管理處的範圍，故選僅AB。","c":2,"f":3,"ap":["E17-42","E18-42","E22-7"]},{"i":"E17-43","q":"銀行的聯行往來利率，應由下列哪一個單位核定？","o":["資產負債管理委員會","風險管理委員會","授信審查委員會","董事會"],"a":0,"e":"答案(A)。資產負債管理委員會(ALCO)的權責包括審核流動性管理指標門檻、利率風險避險策略、金融同業拆款額度及聯行往來利率等，因此聯行往來利率應由資產負債管理委員會核定。風險管理委員會、授信審查委員會與董事會不負責核定內部資金利率。","c":1,"f":1,"ap":["E17-43"]},{"i":"E17-47","q":"乙公司2022 年度損益表的主要會計科目為：營業收入166,228 萬元、營業成本92,304 萬元、營業費用13,384萬元、利息費用1,858 萬元、處分固定資產損失99 萬元、匯兌損失33 萬元，請問該公司的財務費用率為多少？","o":["0.54%","0.84%","1.04%","1.14%"],"a":3,"e":"答案(D)。財務費用率＝財務費用÷營業收入×100%，財務費用＝利息費用＋匯兌損失＋手續費＝1,858＋33＝1,891萬元。財務費用率＝1,891÷166,228×100%≒1.14%。處分固定資產損失不屬於財務費用；若只算利息費用會得到約1.12%。","c":4,"f":1,"ap":["E17-47"]},{"i":"E17-48","q":"有關房屋淨值貸款的敘述，下列敘述何者錯誤？","o":["房屋淨值係指房屋市價減去公告現值的餘額","辦理「二胎房貸」時，此申貸之房屋未必有淨值，屬於信用貸款成分居多","房屋淨值貸款又稱第二順位房屋抵押貸款","「二胎房貸」的額度可隨借隨還、循環動用"],"a":0,"e":"答案(A)。房屋淨值是房屋市場價值減去第一順位抵押借款餘額，不是市價減公告現值，故(A)錯誤。房屋淨值貸款又稱二胎房貸（第二順位房屋抵押貸款），屬開放式貸款，額度可隨借隨還、循環動用；二胎房貸的房屋未必有足夠淨值，信用貸款成分居多，(B)(C)(D)正確。","c":5,"f":1,"ap":["E17-48"]},{"i":"E17-49","q":"有關「指數型」住宅貸款的產品特性，下列哪項內容不適當？","o":["授信對象以自然人為主","屬於固定利率計息，借款人須每月還本付息","搭配「指標利率」計算貸款利率，但此指標須貸放機構不能直接操控","除承貸銀行事先約定外，該類貸款仍可提前還款"],"a":1,"e":"答案(B)。「指數型」住宅貸款(ARM)是以指標利率加成本加碼訂價的機動（浮動）利率貸款，利率會隨指標利率調整，不是固定利率，故(B)不適當。其授信對象以自然人為主，指標利率須是貸放機構無法直接操控的利率，除事先約定外仍可提前還款，(A)(C)(D)正確。","c":5,"f":2,"ap":["E17-49","E22-49"]},{"i":"E17-54","q":"金融控股公司的資本適足率未達標準時，主管機關得採行下列哪些措施？ A.盈餘不得以現金分配 B.限制給付董事、監察人酬勞 C.命令限期裁撤子公司之分支機構或部門 D.命令其於一定期間內處分所持有被投資事業之股份","o":["僅A","僅AB","僅BCD","ABCD"],"a":3,"e":"答案(D)。依金融控股公司法，金控公司的資本適足率未達標準時，主管機關得視情節輕重採取下列措施：盈餘不得以現金分配(A)、限制給付董事及監察人酬勞(B)、命令限期裁撤子公司之分支機構或部門(C)、命令於一定期間內處分所持有被投資事業之股份(D)等，四項都屬可採行措施。","c":9,"f":1,"ap":["E17-54"]},{"i":"E18-2","q":"下列何者是合理的風險管理觀念？","o":["不宜使用相同風險標準看待所有員工，但部屬的責任要大於主管","組織的前台與中台部門均要面對風險挑戰，只有後台部門不用","風險管理的決策，「從上而下」比「由下往上」的重要","風險產生單位與監督單位不宜相互隸屬，使用的風險管理指標和標準也宜儘量不同"],"a":3,"e":"答案(D)。合理的風險管理組織運作，強調風險產生單位與監督單位不宜互相隸屬，使用的風險管理指標和標準也應不同，以確保獨立監督。(A)應是主管的責任大於部屬；(B)前、中、後台部門都要面對風險；(C)風險管理決策涵蓋「從上而下」與「由下往上」，兩者都重要。","c":1,"f":1,"ap":["E18-2"]},{"i":"E18-3","q":"關於成本中心，下列敘述何者錯誤？","o":["成本中心的主管僅能控制成本或費用","成本中心以追求產品或服務成本最低為努力目標","成本中心主管無權參與選擇各項投入資源的標準及來源","適用成本中心的單位，「無權決定」產量或服務多寡，以及產量或服務售價"],"a":2,"e":"答案(C)。成本中心只對成本或費用負責，以追求產品或服務成本最低為目標，適用於對產量、服務多寡及售價「無權決定」的單位，故(A)(B)(D)正確。成本中心主管雖僅能控制成本或費用，但「有權」參與選擇各項投入資源的標準及來源，(C)說「無權參與」錯誤。","c":2,"f":1,"ap":["E18-3"]},{"i":"E18-5","q":"關於營運利潤、財務利潤與會計利潤之關係，下列敘述何者錯誤？","o":["會計利潤為營運利潤與財務利潤相加","財務利潤為內部移轉價格與市場價格的差額","營運利潤為顧客價格與內部移轉價格的差額","會計利潤為內部損益與外部損益的合計，將不同營業單位的內部損益相抵銷，合計數通常不為零"],"a":3,"e":"答案(D)。營運利潤＝顧客價格－內部移轉價格，包含內部損益與外部損益；財務利潤＝內部移轉價格－市場價格；會計利潤＝營運利潤＋財務利潤，故(A)(B)(C)正確。內部損益是銀行各單位間依內部轉撥價格互計的損益，彙總全行時會互相抵銷，合計數應為零，因此(D)說「合計數通常不為零」錯誤。","c":2,"f":1,"ap":["E18-5"]},{"i":"E18-8","q":"有關銀行的風險管理，下列敘述何者錯誤？","o":["表外業務須揭露於資產負債表的附註","資產負債的到期期限相等，銀行即不存在利率風險","透過內部模型推估的風險值，須進行回溯測試","銀行應採取多軌制FTP 系統，以降低財務風險、反映資金成本"],"a":1,"e":"答案(B)。資產負債的到期期限相等，仍可能因重新訂價時點不同、基差變動、利率曲線變動等存在利率風險，所以不能說不存在利率風險，(B)錯誤。表外業務須於資產負債表附註揭露，內部模型推估的風險值須進行回溯測試，銀行宜採多軌制FTP以降低財務風險並反映資金成本，(A)(C)(D)正確。","c":13,"f":2,"ap":["E18-8","E23-3"]},{"i":"E18-11","q":"A 公司全年的營業收入為新臺幣（以下同）1.2 億元，其中內銷占九成，其應收款項（含應收票據）週轉次數2 次，該公司在其他行庫辦理票據融資額度為3,000 萬元，假定A 公司預期未來一年營業及收款條件無明顯變化，銀行墊付成數最高為八成，則A 公司可獲核定之客票融資額度以不超過多少金額為宜？","o":["1,320 萬元","1,800 萬元","2,500 萬元","3,000 萬元"],"a":0,"e":"答案(A)。最高客票融資額度＝全年內銷金額÷週轉次數×貸放成數－其他行庫票據融資額度。全年內銷金額＝1.2億×90%＝10,800萬元，10,800÷2＝5,400萬元，×80%＝4,320萬元，再扣除他行3,000萬元，得1,320萬元。","c":4,"f":1,"ap":["E18-11"]},{"i":"E18-17","q":"為避免承擔過高的信用風險，銀行經由違約機率、信用暴險額與違約損失率建立的評等模型，計算的風險限額，稱為下列何者？","o":["信用風險值","授信總餘額","融資額度","潛在暴險額"],"a":0,"e":"答案(A)。信用風險值是銀行以內部自建的評等模型，依違約機率、信用暴險額與違約損失率計算的風險指標，可作為客戶與產業風險限額及授信權限的依據。授信總餘額、融資額度是授信金額，信用暴險額或潛在暴險額只是暴險金額，都不是由評等模型算出的風險限額。","c":12,"f":2,"ap":["E18-17","E22-18"]},{"i":"E18-19","q":"銀行授信主管考量借戶有否警示性財務比率、重複計算定性指標的分數、黑名單等資訊，而調整信用等級，實務上稱為何種評等？","o":["基本模型的評等","授信戶的個別評等","授信特徵評等","財務評等"],"a":1,"e":"答案(B)。授信或風險管理主管依主觀經驗與判斷，考量借戶是否有警示性財務比率、重複計算定性指標的分數、黑名單等資訊，對基本模型評等加減分調整後的結果，稱為「授信戶的個別評等」。基本模型評等不含主管主觀調整；授信特徵評等範圍更廣，還納入政府支持度等因子；財務評等只依財務報表。","c":4,"f":1,"ap":["E18-19"]},{"i":"E18-22","q":"台灣的票券金融公司在資本適足率未達多少時，不得設立分公司？","o":["未達6%","未達8%","未達10%","未達12%"],"a":1,"e":"答案(B)。票券金融公司的資本適足率不得低於8%；未達8%者，不得設立分公司、不得以現金分配盈餘或買回其股份，也不得對負責人發放報酬以外的給付，主管機關並得命令其限期提出資本重建或財務業務改善計畫。","c":10,"f":1,"ap":["E18-22"]},{"i":"E18-23","q":"A 銀行在112 年12 月底之信用風險加權風險性資產為新臺幣（以下同）1,000 億元，市場風險和作業風險應計提資本各為5 億元，請問三種風險合計的加權風險性資產為下列何者？","o":["1,000 億元","1,005 億元","1,010 億元","1,125 億元"],"a":3,"e":"答案(D)。市場風險與作業風險的應計提資本須乘以12.5（即÷8%）換算成加權風險性資產。合計加權風險性資產＝信用風險1,000億＋(5億＋5億)×12.5＝1,000億＋125億＝1,125億元。(B)(C)是直接把計提資本加到風險性資產上，未乘以12.5轉換。","c":9,"f":1,"ap":["E18-23"]},{"i":"E18-27","q":"證券商的資本適足率高於100%，但低於120% ，應提列節餘數多少比率當作特別盈餘公積？","o":["10%","20%","30%","40%"],"a":3,"e":"答案(D)。證券商依自有資本適足比率提列特別盈餘公積：未達100%者，須將全部節餘數提列；100%以上、未達120%者，提列40%；120%以上、未達150%者，提列20%。本題介於100%與120%之間，應提列40%。","c":10,"f":1,"ap":["E18-27"]},{"i":"E18-30","q":"銀行除授信資產提列損失準備外，扣除對政府機關之債權，其餘債權衍生的「非授信資產」，依照損失程度將損失準備率分成五類，有關損失準備率之敘述，下列何者錯誤？","o":["第一類為1%","第二類為2%","第三類為10%","第四類為50%"],"a":0,"e":"答案(A)。依「銀行資產評估損失準備提列及逾期放款催收款呆帳處理辦法」，非授信資產依損失程度分為五類，損失準備率為：第一類0%、第二類2%、第三類10%、第四類50%、第五類100%。第一類非授信資產不須提列損失準備，(A)「1%」是授信資產第一類（正常授信）的提列比率，故錯誤。","c":12,"f":1,"ap":["E18-30"]},{"i":"E18-31","q":"某銀行承作兩筆衍生性金融交易，其一為名目本金$200,000，期別5 年的利率交換契約，計算權數為0.005，當期暴險額為5,000 元，另一筆為名目本金$100,000，期別3 年的外匯交換契約，計算權數為0.05，當期暴險額為3,000 元，請問該銀行的潛在暴險額為何？","o":["3,000 元","6,000 元","7,000 元","14,000 元"],"a":1,"e":"答案(B)。潛在暴險額＝名目本金×潛在暴險額計算權數。利率交換：200,000×0.005＝1,000元；外匯交換：100,000×0.05＝5,000元；合計6,000元。當期暴險額（5,000＋3,000＝8,000元）是重置成本，加上潛在暴險額後才是信用相當額（14,000元），不屬於潛在暴險額。","c":12,"f":1,"ap":["E18-31"]},{"i":"E18-32","q":"A 銀行買入國庫券新臺幣10 億元，根據「標準法」的風險權數設計，該筆國庫券之信用風險性資產為何？","o":["0","2 億元","5 億元","10 億元"],"a":0,"e":"答案(A)。依信用風險標準法，對我國中央政府發行的國庫券適用0%風險權數，因政府債權通常視為無信用風險，所以信用風險性資產＝10億元×0%＝0。","c":9,"f":1,"ap":["E18-32"]},{"i":"E18-34","q":"市場風險係指資產負債表之表內及表外部位，隨著市場價格的變動，而出現已實現和未實現的損失，這裡所指的市場價格不包含下列何者？","o":["利率","匯率","加密貨幣","商品價格"],"a":2,"e":"答案(C)。市場風險是指資產負債表表內及表外部位，因利率、匯率、權益證券價格及商品價格等市場價格變動，而產生已實現及未實現損失的風險。加密貨幣不在主管機關定義的市場風險市場價格範圍內。","c":13,"f":1,"ap":["E18-34"]},{"i":"E18-35","q":"針對金融商品部位之價格風險，有關市場風險的敘述，下列何者正確？","o":["假設債券之利率敏感係數為5，利率若變動0.01%，債券價格將變動0.05%","債券之敏感性因子主要是指利率，也就是債券之票面利率","「PVBP」係指利率變動1%，債券價格將變動多少數額","假設10,000 元債券的敏感性係數為5，殖利率上升0.01%時，債券價格將上升5 元，成為10,005 元"],"a":0,"e":"答案(A)。利率敏感係數5表示利率變動1%，價格變動約5%；利率變動0.01%，價格變動約5×0.01%＝0.05%，(A)正確。(B)敏感性因子是市場利率（殖利率），不是票面利率；(C)PVBP是利率變動「1個基點（0.01%）」時的價格變動；(D)殖利率上升價格應下跌5元，變成9,995元。","c":13,"f":2,"ap":["E18-35","E22-35"]},{"i":"E18-40","q":"「資本適足比率」的分子分母項目，為下列何者？","o":["負債與風險性資產之比率","固定資產與風險性資產之比率","自有資本與固定資產之比率","自有資本與風險性資產之比率"],"a":3,"e":"答案(D)。資本適足比率＝自有資本（合格自有資本淨額）÷風險性資產總額，用來衡量銀行自有資本是否足以承擔信用、市場及作業風險的損失。負債、固定資產都不是其分子或分母項目。","c":9,"f":1,"ap":["E18-40"]},{"i":"E18-43","q":"銀行的營業單位遇到資金剩餘時，透過聯行往來供應資金給予總行財務處統一運用，適用的利率係指下列何者？","o":["供應利率","借用利率","補貼利率","懲罰利率"],"a":0,"e":"答案(A)。營業單位資金有剩餘時，透過聯行往來把多餘資金提供給總行財務處統一運用，適用的是「供應利率」；營業單位資金不足、向總行取得資金時，適用的是「借用利率」。","c":2,"f":1,"ap":["E18-43"]},{"i":"E18-46","q":"基於規避匯率風險，銀行最好保持每種幣別的資產與負債相同。所謂資產與負債相同，不包括下列何者？","o":["金額大小力求相近","到期日結構力求相近","匯率與利率走勢力求相近","平均期限(Duration)力求相近"],"a":2,"e":"答案(C)。規避匯率風險時，每種幣別的資產與負債最好在金額大小、到期日結構、平均期限(Duration)上力求相近，讓匯率變動對資產與負債的影響互相抵銷。匯率與利率走勢是外生的市場變數，不是銀行資產負債配置可控制的項目，故不包括(C)。","c":13,"f":1,"ap":["E18-46"]},{"i":"E18-48","q":"有關房貸業務的保證人規範，下列敘述何者正確？","o":["銀行可要求自用住宅放款及消費性放款的借款人提供連帶保證人","銀行取得足額擔保時，不得要求借款人提供保證人","銀行無擔保授信而徵取的保證人，其保證金額無上限","銀行求償時應同時向借款人與保證人求償，以利債權回收"],"a":1,"e":"答案(B)。依銀行法第12條之1，銀行辦理自用住宅放款及消費性放款，已取得足額擔保時，不得要求借款人提供保證人，(B)正確。(A)錯誤：銀行不得要求自用住宅放款及消費性放款的借款人提供連帶保證人；(C)錯誤：銀行辦理授信徵取保證人時，保證責任應以一定金額為限；(D)錯誤：銀行應先向借款人求償，不足部分才向保證人求償。","c":5,"f":1,"ap":["E18-48"]},{"i":"E18-51","q":"銀行在信用風險集中度的授信架構，將授信對象分成哪三種層面控管總風險限額？","o":["自然人、法人與集團企業","大型企業、中型企業與小型企業","優等客戶、一般客戶與高風險客戶","客戶、產業與國家別分類"],"a":3,"e":"答案(D)。信用風險集中度的授信架構，是將授信對象依客戶（含集團企業）、產業與國家別三種層面分類，進行總風險限額的控管，避免授信過度集中在單一客戶、單一產業或單一國家。","c":7,"f":3,"ap":["E18-51","E19-19","E23-19"]},{"i":"E18-53","q":"銀行投資「金融相關事業」時，資本計提採國際作法，其中「重大投資者」係指在被投資公司持有表決權股份總數或資本總額______；銀行普通股權益比率為7%時______，以上空格應分別填入下列何者？","o":["百分之八；不得申設國外分支機構","百分之八；可申設國外分支機構","百分之十；不得申設國外分支機構","百分之十；可申設國外分支機構"],"a":3,"e":"答案(D)。依銀行投資金融相關事業的資本計提國際作法，「重大投資」是指持有被投資公司已發行表決權股份總數或資本總額超過10%。銀行普通股權益比率7%已達法定最低標準（7%），可申設國外分支機構，故選「百分之十；可申設國外分支機構」。","c":9,"f":1,"ap":["E18-53"]},{"i":"E18-57","q":"資本適足率為10.5%的大直銀行，使用內部評等法，對AAA 級授信客戶，設定14%風險權數，低於標準法使用的20%，若該銀行承作此客戶10 億元「無擔保授信」，請問兩種方法計算的資本計提額相差多少？","o":["0.6 億元","0.063 億元","0.112 億元","0.128 億元"],"a":1,"e":"答案(B)。資本計提額＝授信金額×風險權數×資本適足率。標準法：10億×20%×10.5%＝0.21億；內部評等法：10億×14%×10.5%＝0.147億。兩者相差10億×(20%－14%)×10.5%＝0.063億元。(A)0.6億是只算風險性資產的差額，未乘以資本適足率。","c":12,"f":2,"ap":["E18-57","E22-31"]},{"i":"E18-58","q":"與市場風險有關之主要部位，計算變動幅度時，具體涵義係指利率、匯率或石油價格等市場因素變動「一單位」時，觀察目標部位或金融商品的價格，變動多少幅度，針對風險指標的名稱，下列何者錯誤？","o":["風險係數","波動幅度","向下風險","敏感性係數"],"a":0,"e":"答案(A)。當利率、匯率或石油價格等市場因素變動一單位時，衡量目標部位或金融商品價格變動幅度的風險指標，包括波動幅度、向下風險與敏感性係數。「風險係數」是作業風險標準法中各業務類別的β值（12%～18%），不屬於此處的市場風險指標名稱。","c":13,"f":1,"ap":["E18-58"]},{"i":"E19-4","q":"有關「作業活動」的標準處理時間，合理方法論為下列何者？","o":["依據作業人員專家經驗訂定","依據會計部門訂定全行一致性單一標準","以碼錶多次測試，計算平均作業時間","徵詢外部顧問公司建議"],"a":2,"e":"答案(C)。衡量作業活動標準處理時間的合理方法，是以碼錶多次實際測試，計算平均作業時間，較客觀。專家經驗訂定或徵詢外部顧問偏主觀，會計部門訂定全行一致的單一標準則無法反映各作業差異，都不合適。","c":2,"f":1,"ap":["E19-4"]},{"i":"E19-5","q":"銀行的策略目標若是要強化吸收活期性存款、減少定期性存款時，可採行下列何種激勵策略？","o":["活期性存款的供應利率優於定期性存款，但不一定前者高於後者","活期性存款的供應利率低於定期性存款","短期放款的借用利率高於長期放款","短期放款的借用利率低於長期放款"],"a":0,"e":"答案(A)。透過聯行往來利率（FTP）引導營業單位行為：若要強化吸收活期性存款、減少定期性存款，總行對活期性存款給予的供應利率，應相對優於定期性存款（相對其對客戶的付息成本，給予較優的利差），但絕對水準不一定要高於定存。(B)無法產生激勵效果；(C)(D)放款的借用利率屬於授信業務的誘導，與存款結構目標無關。","c":2,"f":1,"ap":["E19-5"]},{"i":"E19-6","q":"下列何者不屬於回收風險的影響因素？","o":["擔保品","息票利率","第三人保證","契約保障條款"],"a":1,"e":"答案(B)。回收風險的影響因素包括擔保品、第三人保證及契約保障條款等違約後的債權保障措施。息票利率是債券的票面利率，不屬於回收風險的構成因素。","c":12,"f":1,"ap":["E19-6"]},{"i":"E19-10","q":"有關應收帳款代收融資業務，下列敘述何者錯誤？","o":["係根據企業尚未收妥的應收帳款，提供週轉資金並賺取利息收入","有追索權的應收帳款管理商，得向商品或勞務供應者追討墊付之帳款","無追索權的授信對象為商品或勞務的提供者","銀行可要求應收帳款讓與者額外負擔保險費用，以降低信用風險"],"a":2,"e":"答案(C)。無追索權的應收帳款承購，銀行承擔買方的信用風險，授信對象為商品或勞務的「買方」（還款者），不是提供者（賣方），故(C)錯誤。應收帳款融資是依企業尚未收妥的應收帳款提供週轉資金並賺取利息；有追索權時可向供應者追討墊款；銀行可要求讓與者額外負擔保險費用以降低信用風險，(A)(B)(D)正確。","c":4,"f":1,"ap":["E19-10"]},{"i":"E19-12","q":"仁愛公司2024 年度的營業收入為16,623 萬元，營業成本9,230 萬元，營業費用1,338 萬元，利息費用186萬元，處分固定資產損失 10 萬元，匯兌損失 4 萬元，則當年的財務費用率應為多少？","o":["1.20%","8.05%","1.14%","55.53%"],"a":2,"e":"答案(C)。財務費用率＝財務費用÷營業收入×100%，財務費用＝利息費用＋匯兌損失＋手續費＝186＋4＝190萬元。財務費用率＝190÷16,623×100%≒1.14%。處分固定資產損失不計入財務費用。","c":4,"f":1,"ap":["E19-12"]},{"i":"E19-13","q":"下列哪項不適合當作「指數型」住宅貸款的指標利率？","o":["多家銀行一年期定期儲蓄存款利率的平均","央行的短期融通利率","票券次級市場的殖利率","承貸銀行的基準利率"],"a":3,"e":"答案(D)。指數型房貸的指標利率必須是貸放機構無法直接操控的公開利率，例如多家銀行一年期定儲利率平均、央行短期融通利率、票券次級市場殖利率等。承貸銀行的基準利率由銀行自行訂定，貸方可直接操控，不適合當指標利率。","c":5,"f":1,"ap":["E19-13"]},{"i":"E19-15","q":"穆迪信評公司(Moody’s Investors Service)評估公司債信用等級所使用之量化財務指標，下列何者最為重要？","o":["利息保障倍數","流動比率","資產報酬率","負債比率"],"a":0,"e":"答案(A)。穆迪(Moody's)評估公司債信用等級的量化財務指標中，最主要也最重要的是利息保障倍數（稅前息前盈餘÷利息費用）；次要指標為長期償債能力指標（如負債比率、財務槓桿比率），用以判斷公司是否舉債過多。","c":6,"f":1,"ap":["E19-15"]},{"i":"E19-21","q":"信用違約交換（Credit Default Swap；簡稱CDS）的1 加碼基點(Basis Point)，換算為多少？","o":["1%","0.1%","0.01%","0.25%"],"a":2,"e":"答案(C)。1個基點(Basis Point)＝0.01%。CDS報價以基點表示，例如101基點＝1.01%，實務上常以CDS價格高於或低於101基點作為國家風險額度凍結與解凍的標準。","c":8,"f":1,"ap":["E19-21"]},{"i":"E19-22","q":"有關「金融機構合併法」與「金融控股公司法」，下列敘述何者錯誤？","o":["「金融機構合併法」旨在規範金融同業的合併","「金融控股公司法」旨在規範金融異業的合併","金控公司可為各金融子公司的一人股東，排除公司法對公開發行公司「股東須在7 人以上」的規定","要成為金控公司轄下的「銀行、證券及保險子公司」，持股須在20%以上，或擁有三分之一以上董事席次"],"a":3,"e":"答案(D)。金融機構合併法規範金融同業合併，金融控股公司法規範金融異業整合，金控公司可為子公司的一人股東，排除公司法對股東人數的限制，(A)(B)(C)正確。依金融控股公司法，銀行、保險、證券子公司須為金控公司具「控制性持股」者，即持有已發行有表決權股份總數或資本總額超過25%，或直接、間接選任或指派過半數董事，不是20%或三分之一董事席次，故(D)錯誤。","c":9,"f":1,"ap":["E19-22"]},{"i":"E19-23","q":"臺灣的主管機關對於資本等級不同的銀行，規範的業務項目跟著不同，下列敘述何者錯誤？","o":["資本適足等級之銀行，可辦理「財富管理」業務","資本適足等級之銀行，資本適足率依規定加計1%以上，可轉投資「非金融」相關事業","銀行呈現資本不足時，主管機關便得「限制或禁止」其與利害關係人之授信或其他交易","銀行的資本等級屬於資本不足、顯著不足或嚴重不足時，主管機關可命令銀行或其負責人在期限內，提出資本重建或其他財務業務改善計畫"],"a":2,"e":"答案(C)。資本適足等級的銀行可辦理財富管理業務，資本適足率依規定加計1%以上可轉投資非金融相關事業；資本不足、顯著不足或嚴重不足時，主管機關都可命令銀行或其負責人限期提出資本重建或其他財務業務改善計畫，故(A)(B)(D)正確。依銀行法第44-2條，「限制或禁止與利害關係人之授信或其他交易」是資本「顯著不足」時才適用的措施；資本不足時只能命令提出改善計畫、限制新增風險性資產等，故(C)錯誤。","c":9,"f":1,"ap":["E19-23"]},{"i":"E19-24","q":"巴塞爾資本協定三為強化銀行體系穩健性，防範景氣循環帶來的衝擊，新增下列何種制度？","o":["信用評價調整風險","交易簿增額風險之資本計提","增提額外緩衝資本","遞延所得稅資產自資本扣除"],"a":2,"e":"答案(C)。巴塞爾資本協定三為防範景氣循環帶來的衝擊，新增「額外緩衝資本」（抗景氣循環緩衝資本0～2.5%，由各國自行決定），另外增訂2.5%的留存緩衝資本。信用評價調整(CVA)風險、交易簿增額風險資本計提、遞延所得稅資產扣除等，雖也是資本規範的強化項目，但不是針對景氣循環所設計。","c":9,"f":1,"ap":["E19-24"]},{"i":"E19-29","q":"商業銀行的信用風險，來自表內的企業金融業務與消費金融業務及表外的衍生性和非衍生性業務。有關表外非衍生性業務的種類，下列敘述何者錯誤？","o":["選擇權","擔保信用狀","未動用額度的「承諾協議書」","循環式包銷融資"],"a":0,"e":"答案(A)。表外非衍生性業務包括擔保信用狀、未動用額度的承諾（放款承諾）、循環式包銷融資(RUFs)等。選擇權是衍生性金融商品，屬於表外「衍生性」業務，不是非衍生性業務。","c":12,"f":1,"ap":["E19-29"]},{"i":"E19-36","q":"有關分行的放款對存款之比率（簡稱存放比率），下列敘述何者錯誤？","o":["存放比率愈高，分行的流動性愈低","存放比率愈高，分行的流動能力愈強","存放比率愈高，分行的流動性風險愈大","存放款業務為主的分行，存放比率仍具相當參考價值"],"a":1,"e":"答案(B)。存放比率＝放款÷存款。存放比率愈高，表示資金大量貸出、可動用的資金愈少，流動性愈低、流動性風險愈大，所以(A)(C)正確、(B)說流動能力愈強錯誤。對以存放款業務為主的銀行或分行來說，存放比率仍是相當有參考價值的流動性指標，(D)正確。","c":14,"f":1,"ap":["E19-36"]},{"i":"E19-37","q":"銀行在利率攀升時，應該朝向何種資金管理部位？","o":["零缺口部位","負缺口部位","正缺口部位","不須採用任何策略"],"a":2,"e":"答案(C)。利率敏感性缺口＝利率敏感性資產－利率敏感性負債。預期利率攀升時，應擴大正缺口部位（敏感性資產＞敏感性負債），讓資產收益重新訂價的幅度大於負債成本，淨利息收入因而增加。負缺口適合利率下跌時使用；零缺口只能避險，無法從升息中獲利。","c":14,"f":1,"ap":["E19-37"]},{"i":"E19-38","q":"為避免投資人在交易匯率類複雜性較高之商品，導致重大風險，主管機構限制此類的契約期限不得超過下列何者？","o":["三個月","六個月","一年","五年"],"a":2,"e":"答案(C)。依「銀行辦理衍生性金融商品業務內部作業制度及程序管理辦法」第25-1條，屬匯率類的複雜性高風險商品，契約期限不得超過一年，以避免投資人承受重大風險。","c":13,"f":1,"ap":["E19-38"]},{"i":"E19-39","q":"依銀行資本適足性及資本等級管理辦法規定，銀行之資本適足比率，應符合下列何者？","o":["不得低於13%","不得低於10.5%","不得低於8.5%","不得低於7%"],"a":1,"e":"答案(B)。依「銀行資本適足性及資本等級管理辦法」，自108年起銀行資本適足率不得低於10.5%（8%法定最低加2.5%留存緩衝資本），第一類資本比率不得低於8.5%，普通股權益比率不得低於7%。","c":9,"f":1,"ap":["E19-39"]},{"i":"E19-43","q":"作業基礎成本制度(Activity-Based Costing, ABC)的執行步驟，包括：A.訂定每項作業的成本動因、B.界定作業活動、C.作業活動乘以對應之動因費率、D.衡量活動頻率或數量，請問其執行先後次序為下列何者？","o":["ABCD","BACD","BADC","ADBC"],"a":2,"e":"答案(C)。作業基礎成本制度(ABC)的執行步驟依序為：先界定作業活動(B)，再訂定每項作業的成本動因(A)，接著衡量活動頻率或數量(D)，最後將活動量乘以對應的動因費率得出作業成本(C)，即B→A→D→C。","c":2,"f":1,"ap":["E19-43"]},{"i":"E19-44","q":"有關資金移轉價格(FTP)，下列敘述何者錯誤？","o":["用以調撥各部門的剩餘或不足資金","聯行往來的供應利率一定等於借用利率","訂價策略應反映營運目標及市場狀況","內部移轉價格與市場價格之差構成「財務利潤」"],"a":1,"e":"答案(B)。資金移轉價格用以調撥各部門的剩餘或不足資金，訂價應反映營運目標及市場狀況，內部移轉價格與市場價格的差額構成財務利潤，(A)(C)(D)正確。聯行往來的供應利率與借用利率可依策略目標分別訂定（多軌制），不一定相等，故(B)錯誤。","c":2,"f":1,"ap":["E19-44"]},{"i":"E19-48","q":"甲向A 銀行申請房屋修繕貸款新臺幣（以下同）200 萬元，並議定第一年按基準利率加五碼計息，第二年以後加碼幅度提高為六碼，假設A 銀行的第一、二年基準利率均為1.5%，則甲第二年之利率為多少？","o":["3%","2.75%","1.75%","3.25%"],"a":0,"e":"答案(A)。1碼＝0.25%，第二年加碼六碼＝6×0.25%＝1.5%。第二年利率＝基準利率1.5%＋1.5%＝3%。(B)2.75%是第一年的利率（1.5%＋5×0.25%）。","c":5,"f":1,"ap":["E19-48"]},{"i":"E19-49","q":"張先生以房屋市價 1,200 萬元向A 銀行貸款，且核予貸放成數75%。其後，張先生再向T 銀行申請二胎房貸，T 銀行以第一順位質權設定金額的15%核予張先生二胎房貸，請問張先生由A 銀行及T 銀行獲得的總貸款金額為多少？（依一般實務慣例，第一順位銀行通常會以貸放金額的1.2 倍設定質權）","o":["960 萬元","1,062 萬元","1,080 萬元","1,200 萬元"],"a":1,"e":"答案(B)。A銀行貸款＝1,200萬×75%＝900萬元；第一順位質權設定＝900萬×1.2＝1,080萬元。T銀行二胎房貸＝1,080萬×15%＝162萬元。總貸款金額＝900萬＋162萬＝1,062萬元。","c":5,"f":1,"ap":["E19-49"]},{"i":"E19-53","q":"有關淨穩定資金比率(NSFR)，下列敘述何者錯誤？","o":["為短期別的流動性量化指標","定義為可取得的穩定資金除以法定穩定資金","強調支應資產和業務活動的資金，須一定比率來自穩定負債","推動初期設定的比率門檻為大於100%"],"a":0,"e":"答案(A)。淨穩定資金比率(NSFR)是「長期」的流動性量化指標（衡量一年期的資金穩定性），短期指標是流動性覆蓋比率(LCR)，故(A)錯誤。NSFR＝可取得的穩定資金÷法定穩定資金，強調支應資產和業務活動的資金須有一定比率來自穩定負債，門檻為100%以上，(B)(C)(D)正確。","c":14,"f":1,"ap":["E19-53"]},{"i":"E19-56","q":"已知某借款客戶的信用暴險額為100 億元，違約機率預估為5%，呆帳回收率為80%，則該借款客戶預估的信用損失應為多少？","o":["1 億元","2 億元","3 億元","4 億元"],"a":0,"e":"答案(A)。信用損失＝信用暴險額×違約機率×違約損失率，違約損失率＝1－回收率＝1－80%＝20%。信用損失＝100億×5%×20%＝1億元。","c":12,"f":1,"ap":["E19-56"]},{"i":"E19-57","q":"某銀行承做兩筆衍生性金融交易，其一為名目本金$200,000，期別5 年的利率交換契約，計算權數為0.005，當期暴險額為5,000 元，另一筆為名目本金$100,000，期別3 年的外匯交換契約，計算權數為0.05，當期暴險額為3,000 元，請問該銀行的潛在暴險額為何？","o":["3,000 元","6,000 元","7,000 元","14,000 元"],"a":1,"e":"答案(B)。潛在暴險額＝名目本金×潛在暴險額計算權數。利率交換：200,000×0.005＝1,000元；外匯交換：100,000×0.05＝5,000元；合計6,000元。當期暴險額（5,000＋3,000＝8,000元）是重置成本，加上潛在暴險額後才是信用相當額（14,000元），不屬於潛在暴險額。","c":12,"f":2,"ap":["E19-57","E23-31"]},{"i":"E19-59","q":"預期市場利率將上升時，銀行根據重新訂價缺口模型，應該如何因應？","o":["增加利率敏感性負債","減少匯率敏感性負債","增加利率敏感性資產","減少利率敏感性資產"],"a":2,"e":"答案(C)。依重新訂價缺口模型，預期利率上升時應採「正」缺口策略，即增加利率敏感性資產（或減少利率敏感性負債），使資產先於負債重新訂價、擴大淨利息收入。(A)增加利率敏感性負債會擴大負缺口，利率上升時淨利息收入減少；(D)減少敏感性資產方向相反；(B)匯率敏感性與利率缺口無關。","c":14,"f":1,"ap":["E19-59"]},{"i":"E20-3","q":"銀行分行（營業單位）主要的收入來源，不包括下列何者？","o":["調撥資金產生之財務投資收入","手續費收入","承作授信業務的放款利息收入","供應多餘內部資金時，按照供應利率賺取的利息收入"],"a":0,"e":"答案(A)。分行（營業單位）收入來源包括手續費收入、放款利息收入，以及將多餘資金透過聯行往來供應總行、按「供應利率」賺取的利息收入。調撥資金所產生的財務投資收入屬於財務處（資金調撥單位）的收入，不是分行的收入來源。","c":2,"f":1,"ap":["E20-3"]},{"i":"E20-8","q":"有關市場風險的特性，下列敘述何者錯誤？","o":["個別市場風險反映金融工具產生的價格波動","一般市場風險反映總體經濟產生的價格波動","外匯由各國央行發行，因此外匯無個別市場風險，毋須計提此類風險的資本需求額，只計提一般市場風險的資本需求額","石油、貴金屬的價格波動風險，係由個別市場風險及一般市場風險構成"],"a":3,"e":"答案(D)。一般市場風險反映總體經濟造成的價格波動，個別市場風險反映個別金融工具（發行人）造成的價格波動，故(A)(B)正確。外匯由各國央行發行，沒有個別市場風險，只計提一般市場風險，(C)正確。石油、貴金屬等商品同樣沒有發行人，其價格風險屬於一般市場風險，並非由個別與一般市場風險共同構成，故(D)錯誤。","c":13,"f":1,"ap":["E20-8"]},{"i":"E20-9","q":"有關企業信用地位下滑之徵兆，下列敘述何者錯誤？","o":["企業發行新債務憑證需訂定比較高的票面利率","市場對企業流通在外的股票，長期看跌其價格","信用評等機構調降該企業發行之債務憑證","企業之利息保障倍數呈現提高情況"],"a":3,"e":"答案(D)。企業信用地位下滑時，發行新債要付較高票面利率(A)、股價長期看跌(B)、信評機構調降評等(C)。利息保障倍數提高代表付息能力變好，是信用改善的訊號，不是信用下滑的徵兆，故(D)錯誤。","c":4,"f":1,"ap":["E20-9"]},{"i":"E20-10","q":"銀行辦理有追索權的應收帳款融資業務，授信對象為何？","o":["商品勞務的買方","商品勞務的賣方或應收帳款讓與者","承作該業務的銀行","應收帳款管理商"],"a":1,"e":"答案(B)。有追索權的應收帳款融資，若買方到期不付款，銀行可向應收帳款讓與者（商品勞務的賣方）追索，所以授信對象是賣方／讓與者。無追索權時，銀行承擔買方的信用風險，授信對象才是商品勞務的買方。","c":4,"f":1,"ap":["E20-10"]},{"i":"E20-11","q":"有關企業貸款的利率水準，下列敘述何者錯誤？","o":["信用等級佳的企業，信用等級加碼低","基準利率通常決定於信用市場的寬鬆與緊俏","基準利率旨在反映短期資金市場的走勢，概由個別銀行所主導","就相同借戶而言，擔保貸款利率通常低於信用貸款利率"],"a":2,"e":"答案(C)。基準利率反映短期資金市場走勢，並取決於信用市場的寬鬆或緊俏，不是個別銀行能單獨主導的，故(C)「概由個別銀行所主導」錯誤。信用等級佳者加碼低(A)，擔保貸款利率通常低於信用貸款(D)，兩者皆正確。","c":4,"f":1,"ap":["E20-11"]},{"i":"E20-12","q":"丁公司2024 年12 月31 日的流動資產為90,381 萬元、長期投資33,422 萬元、固定資產207,005 萬元、流動負債41,189 萬元、長期負債29,000 萬元、淨值或股東權益261,754 萬元，請問該公司的固定長期適合率為多少？","o":["78%","81%","83%","85%"],"a":2,"e":"答案(C)。固定長期適合率＝(固定資產＋長期投資)÷(淨值＋長期負債)＝(207,005＋33,422)÷(261,754＋29,000)＝240,427÷290,754≒82.7%，最接近83%。比率小於1，代表長期資金足以支應長期資產，沒有「以短支長」的情形。","c":4,"f":1,"ap":["E20-12"]},{"i":"E20-14","q":"有關受評公司資本結構之長期償債能力，下列何者不宜當作主要衡量指標？","o":["長短期借款／總資產","比率值愈小，財務風險愈低","資產重估增值（不包括無形資產）","（長短期借款+或有負債）／（長短期借款+或有負債+股東權益）"],"a":2,"e":"答案(C)。衡量資本結構與長期償債能力時，主要看負債比重，例如長短期借款÷總資產(A)，或(長短期借款＋或有負債)÷(長短期借款＋或有負債＋股東權益)(D)，比率愈小代表財務風險愈低(B)。資產重估增值只是資產帳面增值，看不出是否舉債過多，不適合作為主要衡量指標。","c":6,"f":1,"ap":["E20-14"]},{"i":"E20-16","q":"依照授信法規，銀行對於「所有利害關係人」的擔保授信總餘額，不得超過銀行淨值多少倍數？","o":["1 倍","1.5 倍","2 倍","2.5 倍"],"a":1,"e":"答案(B)。依銀行法第33條授權規定，銀行對所有利害關係人的擔保授信總餘額，不得超過銀行淨值的1.5倍。","c":7,"f":1,"ap":["E20-16"]},{"i":"E20-21","q":"為有效控制國家風險，避免外幣債權之風險過度集中在同等級或低等級之風險國家，主管機關要求銀行逐日統計並定期提報董事會，相關說明何者正確？ A.主要授信業務按照目前的放款餘額計算暴險值 B.投資業務分成股權投資、有價證券投資及外匯交易三種，其中股權投資按交割前名目本金計算暴險值 C.對國外銀行之資金拆放、同業進出口融資墊款等，按使用餘額計算暴險值","o":["僅AB","僅AC","僅BC","ABC"],"a":1,"e":"答案(B)。依國家風險暴險值的計算方式，授信業務按目前放款餘額計算暴險值（另加計未動用額度），(A)正確；對國外銀行的資金拆放、同業進出口融資墊款等按使用餘額計算，(C)正確。(B)錯誤：股權投資是按「帳列金額」計算暴險值，「交割前名目本金」是外匯交易及衍生性金融商品的計算方式。故選僅AC。","c":8,"f":1,"ap":["E20-21"]},{"i":"E20-22","q":"票券金融公司的資本適足率低於6%者，主管機關可採行下列哪些措施？ A.解除負責人職務 B.命令取得或處分特定資產，應先經主管機關核准 C.命令處分特定資產 D.命令對負責人之報酬予以降低","o":["僅A","僅AD","僅BCD","ABCD"],"a":3,"e":"答案(D)。票券金融公司資本適足率低於6%時，主管機關可視情節輕重採取：解除負責人職務、命令取得或處分特定資產應先經核准、命令處分特定資產、限制轉投資或部分業務，以及命令降低負責人報酬等措施。A、B、C、D皆屬之，故選ABCD。","c":10,"f":1,"ap":["E20-22"]},{"i":"E20-25","q":"票券金融公司的資本適足率在6%以上，未達8%時，主管機關得採行下列哪些措施？ A.不得以現金分配盈餘 B.不得以現金買回流通在外股份 C.限期提出資本重建計畫 D.限期提出財務業務改善計畫","o":["僅ABC","僅CD","僅BCD","ABCD"],"a":3,"e":"答案(D)。票券金融公司資本適足率不得低於8%。在6%以上、未達8%時，不得以現金分配盈餘(A)、不得以現金買回股份(B)，主管機關並得命其限期提出資本重建計畫(C)或財務業務改善計畫(D)，故選ABCD。","c":10,"f":1,"ap":["E20-25"]},{"i":"E20-26","q":"保險公司的資本適足率至少須達多少以上，才可申請從事衍生性金融商品交易之業務？","o":["150%","200%","250%","300%"],"a":2,"e":"答案(C)。依「保險業從事衍生性金融商品交易管理辦法」第5條，保險業從事增加投資效益目的之衍生性金融商品交易，自有資本與風險資本之比率須達資本適足法定標準之1.25倍以上；出題當時（舊制RBC）法定標準為200%，故為200%×1.25＝250%。(A)150%為舊制資本不足區間下限、(B)200%為舊制法定最低標準、(D)300%為舊制「資本充裕」門檻，均非本題門檻。","c":10,"f":1,"ap":["E20-26"],"g":"本題依舊制RBC（法定標準200%）作答；2026年起保險業改採TW-ICS新制，資本適足法定標準改為100%（講義資本等級表採新制：適足100%以上、不足50%～未達100%、顯著不足25%～未達50%、嚴重不足低於25%），若依新制換算門檻將不同，考試以官方答案(C)為準"},{"i":"E20-29","q":"有關信用風險的資本計提，下列何者不屬於內部評等法(Internal Rating-Based Approach, IRB)的決定因素？","o":["違約機率","存續期間","違約損失率","信用暴險值"],"a":1,"e":"答案(B)。依講義，內部評等法(IRB)計提風險資本的決定因素是違約機率(PD)、違約損失率(LGD)及信用暴險值(EAD)。「存續期間」(duration)是衡量利率敏感度的指標，不是IRB的決定因素，故選(B)。","c":12,"f":1,"ap":["E20-29"],"g":"Basel IRB公式另含有效到期期間(M)；本題依講義以PD、LGD、EAD為準，選項「存續期間」(duration)非M"},{"i":"E20-30","q":"表外的非衍生性商品，估計其風險性資產時，下列敘述何者錯誤？","o":["信用相當額＝交易金額×信用轉換係數","風險性資產＝信用相當額×風險權數","信用轉換係數有0%、20%、50%、100%","風險權數有0%、20%、50%、100%"],"a":3,"e":"答案(D)。表外非衍生性商品的計算：信用相當額＝交易金額×信用轉換係數(A)，風險性資產＝信用相當額×風險權數(B)，信用轉換係數有0%、20%、50%、100%(C)，三者皆正確。依講義，估計表外非衍生性商品的風險性資產時，風險權數只有0%、20%、100%三種（交易對手外部評等愈好，權數愈低），沒有50%；(D)把信用轉換係數的級距套到風險權數上，故錯誤。","c":12,"f":1,"ap":["E20-30"]},{"i":"E20-32","q":"有關信用風險的資產分類與風險權數，下列敘述何者錯誤？","o":["借款期間愈長，信用風險愈低","借款期間愈長，信用風險愈高","借款人的信用評等不同，即以「風險權數」反映其差異","若借款人提供抵押品，計提合格資本時，可「向下」調整風險性資產"],"a":0,"e":"答案(A)。借款期間愈長，不確定性愈高，信用風險愈「高」，不是愈低，故(A)錯誤、(B)正確。借款人信用評等不同時，以風險權數反映差異(C)；提供合格擔保品可抵減信用風險，向下調整風險性資產(D)。","c":12,"f":1,"ap":["E20-32"]},{"i":"E20-34","q":"有關市場風險之管理指標，不包含下列何者？","o":["市場風險的部位概況","市場風險之評價損益概況","市場走勢","敏感性風險因子及權益證券之市場風險值"],"a":2,"e":"答案(C)。市場風險管理指標包括：市場風險部位概況、評價損益概況、敏感性風險因子及權益證券的市場風險值等。「市場走勢」是外在環境資訊，不是銀行內部的市場風險管理指標。","c":13,"f":1,"ap":["E20-34"]},{"i":"E20-40","q":"主管機關於必要時，得要求銀行提列抗景氣循環的緩衝資本，並以第一類資本的普通股權益支應，下列何者為計提比率的限制？","o":["最低不得小於2%","最高不超過2%","最高不超過2.5%","最低不得小於3%"],"a":2,"e":"答案(C)。依銀行資本適足性及資本等級管理辦法，主管機關必要時可要求銀行提列抗景氣循環緩衝資本，以普通股權益第一類資本支應，計提比率為0%至2.5%，即最高不超過2.5%。","c":9,"f":1,"ap":["E20-40"]},{"i":"E20-41","q":"有關風險管理體質的檢視步驟，下列何者正確？","o":["風險策略→風險組織→風險衡量→風險監控→風險願景","風險組織→風險策略→風險衡量→風險監控→風險願景","風險策略→風險衡量→風險組織→風險監控→風險願景","風險策略→風險組織→風險願景→風險衡量→風險監控"],"a":0,"e":"答案(A)。檢視風險管理體質的步驟依序為：風險策略→風險組織→風險衡量→風險監控→風險願景。也就是先訂策略，再建組織，接著衡量並監控風險，最後達成風險願景。","c":1,"f":1,"ap":["E20-41"]},{"i":"E20-44","q":"有關績效評估的觀念，下列何者正確？","o":["銀行的營業單位或分行最好使用每股盈餘、資產報酬率及淨值報酬率，衡量其管理績效","績效管理的重點，應擺在「不可控制」的成本項目","績效管理的良窳，端視管理者對「可控制成本」的掌控能力而定","銀行使用的所有績效管理指標，均應納入全部服務成本"],"a":2,"e":"答案(C)。績效管理的好壞，取決於管理者對「可控制成本」的掌控能力，(C)正確。(A)錯誤：分行宜用可控制利益等指標，不宜用每股盈餘、ROA、ROE等全行性指標；(B)錯誤：重點應放在可控制成本；(D)錯誤：績效指標不必都納入全部服務成本，不可控制的成本不宜納入。","c":2,"f":1,"ap":["E20-44"]},{"i":"E20-51","q":"銀行法對「利害關係人」之規範，下列敘述何者錯誤？","o":["適用同一授信客戶之每筆或累計擔保授信金額，達新臺幣1 億元以上或銀行淨值1%孰低者","對同一法人之無擔保授信總餘額，不得超過銀行淨值5%","對同一自然人之無擔保授信總餘額，不得超過銀行淨值1%","對所有利害關係人之擔保授信總餘額，不得超過銀行淨值二倍"],"a":3,"e":"答案(D)。銀行對所有利害關係人的擔保授信總餘額，不得超過銀行淨值的1.5倍，不是二倍，故(D)錯誤。(A)為須經董事會特別決議的門檻（1億元或淨值1%孰低）；(B)(C)為同一法人無擔保授信不超過淨值5%、同一自然人無擔保授信不超過淨值1%的限額，皆正確。","c":7,"f":1,"ap":["E20-51"]},{"i":"E20-57","q":"A 銀行藉由表內業務及表外業務構成的「信用風險性資產」，分別為新臺幣1,500 億元與500 億元時，依現行的資本適足規定，須計提多少資本？","o":["210 億元","160 億元","158 億元","120 億元"],"a":0,"e":"答案(A)。現行資本適足率最低要求為10.5%。應計提資本＝(表內1,500億＋表外500億)×10.5%＝2,000億×10.5%＝210億元。","c":9,"f":1,"ap":["E20-57"]},{"i":"E21-2","q":"轉投資類型的投資中心，宜使用下列何者當作績效衡量指標？","o":["銷售額","內外部損益","可控制成本","資本或股權投資的報酬率"],"a":3,"e":"答案(D)。投資中心不只要對損益負責，還要對所投入的資本負責。轉投資類型的投資中心，宜用資本或股權投資的報酬率衡量績效。銷售額適合收入中心，內外部損益適合利潤中心，可控制成本適合成本中心。","c":2,"f":1,"ap":["E21-2"]},{"i":"E21-5","q":"有關聯行往來利率之功能，下列敘述何者錯誤？","o":["誘導相關部門，落實業務策略目標","加速業務部門開發有利提高績效的目標市場","提高資金定價成本，不利市場競爭","有利提升全行的會計利潤"],"a":2,"e":"答案(C)。聯行往來利率（內部資金移轉價格）的功能，是誘導各部門落實策略目標(A)、加速開發有利績效的目標市場(B)，並有利於提升全行利潤(D)。合理的聯行利率可讓資金定價更有效率，並不是「提高資金定價成本、不利競爭」，故(C)錯誤。","c":2,"f":1,"ap":["E21-5"]},{"i":"E21-6","q":"有關風險管理概念之敘述，下列何者正確？","o":["經濟資本又稱風險資本，屬於官方協助建立模型而計提的資本需求額","不論競爭情勢是否激烈，金融業務成本均須納入「風險成本」項目","標準法計提的資本需求額，稱為「管制資本」或「法定資本」","實務上，「資本風險」又稱「風險資本」或「償債能力風險」"],"a":2,"e":"答案(C)。標準法計提的資本需求額稱為「管制資本」或「法定資本」，(C)正確。(A)錯誤：經濟資本是銀行依自身風險胃納、以內部模型計提的資本，不是官方協助建立；(B)錯誤：風險成本是否納入業務成本，要看競爭情勢等因素；(D)錯誤：資本風險又稱償債能力風險，「風險資本」是另一個概念。","c":12,"f":1,"ap":["E21-6"]},{"i":"E21-7","q":"風險管理與資產負債管理應建立在下列哪些構面上，以求得風險與報酬之最適配置？ A.社會責任 B.業務 C.金融業務或商品 D.資金部位","o":["僅A、D","僅C、D","僅B、C、D","僅A、B、C"],"a":2,"e":"答案(C)。風險管理與資產負債管理，應建立在「業務」、「金融業務或商品」、「資金部位」三個構面上，以求風險與報酬的最適配置。社會責任不屬於這個配置構面，故選僅B、C、D。","c":1,"f":1,"ap":["E21-7"]},{"i":"E21-8","q":"下列何者不是組織內部理想的風險文化？","o":["風險管理制度能創造內部競爭的經營環境","看重組織成員能否在「小事」上忠心","凡事都盡力而為，不用區分「可控制」或「不可控制」的任務","具有廣納百川意見的胸襟，不逃避問題，相信「放棄今日的補救行動，明天仍然需要面對」"],"a":2,"e":"答案(C)。理想的風險文化應區分「可控制」與「不可控制」的任務，讓權責與績效評估合理，所以「凡事盡力而為、不必區分」不是理想的風險文化。(A)創造內部競爭環境、(B)重視在小事上忠心、(D)廣納意見而不逃避問題，都是理想的風險文化。","c":1,"f":1,"ap":["E21-8"]},{"i":"E21-10","q":"企業金融業務之放款利率＝基準利率＋風險加減碼，有關風險加減碼的涵蓋項目，下列何者錯誤？","o":["信用等級加碼","外匯實績加減碼","存款實績加減碼","借款期別加減碼"],"a":3,"e":"答案(D)。企業放款利率＝基準利率＋風險加減碼。風險加減碼包括信用等級加碼、外匯實績加減碼、存款實績加減碼等。依講義，「借款期別加減碼」不在風險加減碼的涵蓋項目內，故選(D)。","c":4,"f":1,"ap":["E21-10"]},{"i":"E21-11","q":"有關信用評等制度的設置功能，下列何者錯誤？","o":["2007 年之後實施的資本協定，在信用風險的資本計提方法，包括標準法與內部評等法","借款客戶的貸款利率，是由基準利率與風險加減碼所構成","基準利率的高低，反映長期資金市場的走勢，非個別銀行所能單獨主導","風險加減碼制度須視企業的經營績效與產業環境而定"],"a":2,"e":"答案(C)。基準利率反映的是「短期」資金市場的走勢，不是長期資金市場，故(C)錯誤（「非個別銀行所能單獨主導」這部分是對的）。2007年後的資本協定，信用風險計提有標準法與內部評等法(A)；貸款利率由基準利率加風險加減碼構成(B)；加減碼要看企業經營績效與產業環境(D)。","c":4,"f":1,"ap":["E21-11"]},{"i":"E21-12","q":"甲企業在2024 年12 月31 日的流動資產為85,951 萬元，其中現金及約當現金35,664 萬元、應收票據及帳款淨額28,180 萬元、存貨10,968 萬元、預付費用 125 萬元、其他流動資產11,014 萬元。負債總額79,219萬元，除長期負債38,030 萬元外，其餘為流動負債，請問該公司的速動比率為何？（四捨五入取最接近值）","o":["209%","199%","182%","185%"],"a":2,"e":"答案(C)。速動資產＝流動資產－存貨－預付費用＝85,951－10,968－125＝74,858萬元。流動負債＝負債總額－長期負債＝79,219－38,030＝41,189萬元。速動比率＝74,858÷41,189≒181.7%，約182%。","c":4,"f":1,"ap":["E21-12"]},{"i":"E21-13","q":"有關信用卡之偽冒詐欺事件，應歸類為下列何種風險型態？","o":["信用風險","市場風險","作業風險","流動性風險"],"a":2,"e":"答案(C)。信用卡偽冒詐欺，是外部詐欺或內部流程、系統不當所造成的損失，依Basel定義屬於作業風險（因內部作業、人員、系統不當或外部事件造成的損失），不是借款人違約的信用風險。","c":15,"f":1,"ap":["E21-13"]},{"i":"E21-14","q":"Moody’s 採取由上而下(Top-Down) 的評估方式，檢視受評公司的風險等級。所謂由上而下的評估方式，係指下列何者？","o":["由Aaa 信用等級至C 信用等級","風險評估的順序由國家風險至產業風險，終至企業風險","上自總經理下至各執行部門，逐一檢視各單位風險狀況","由該公司所隸屬產業之營運優劣排序，決定該公司之暴險等級"],"a":1,"e":"答案(B)。Moody's採「由上而下」(Top-Down)評估時，依序檢視國家風險、產業風險，最後才是個別企業風險。這是指風險層次的順序，不是評等等級由Aaa到C，也不是公司內部組織層級。","c":6,"f":1,"ap":["E21-14"]},{"i":"E21-17","q":"依銀行法規定，授信業務對同一關係企業之風險限額，下列敘述何者正確？","o":["授信總餘額不得超過銀行淨值的3%，其中無擔保授信總餘額不得超過銀行淨值的1%","授信總餘額不得超過銀行淨值的15%，其中無擔保授信總餘額不得超過銀行淨值的5%","授信總餘額不得超過銀行淨值的40%，其中無擔保授信總餘額不得超過銀行淨值的15%","授信總餘額不得超過銀行淨值的45%，其中無擔保授信總餘額不得超過銀行淨值的15%"],"a":2,"e":"答案(C)。依銀行法第33條之3授權規定，銀行對同一關係企業的授信總餘額不得超過銀行淨值40%，其中無擔保授信不得超過15%。(A)為同一自然人的限額（3%、1%），(B)為同一法人的限額（15%、5%）。","c":7,"f":1,"ap":["E21-17"]},{"i":"E21-18","q":"風險趨避(Risk Averse)的債權銀行，下列何項內容不符其管理理念？","o":["面對信用等級越佳客戶，給予越高風險限額","期待利息利潤越多越好，但利潤增加到某種程度後，滿足的效用呈現遞減","面對信用等級越佳客戶，儘管能夠賺取可觀利息利潤，也不願提高風險限額","屬於理性的授信行為"],"a":2,"e":"答案(C)。風險趨避的銀行重視風險與報酬的效率，對信用等級愈佳的客戶會給予愈高的風險限額(A)。利潤增加時邊際效用遞減(B)，屬於理性的授信行為(D)。信用等級佳又能賺取可觀利潤，卻不願提高限額，與其理念不符。","c":7,"f":1,"ap":["E21-18"]},{"i":"E21-19","q":"銀行公會針對中小型企業的信用評分，使用財務狀況、經營管理，以及產業特性暨展望三項構面，其評分比重分別為何？","o":["50%、30%及20%","40%、40%及20%","40%、30%及30%","30%、30%及40%"],"a":1,"e":"答案(B)。銀行公會的授信企業信用評等表中，中小型企業的財務狀況、經營管理、產業特性暨展望三個構面，比重分別為40%、40%、20%。大型企業則為50%、30%、20%。","c":5,"f":1,"ap":["E21-19"]},{"i":"E21-20","q":"針對國外企業的授信，碰到當地政府外匯短缺或政局不穩，而突然宣布全面禁止或限制本息匯出，稱為下列何種風險？","o":["產業風險","匯兌風險","國家風險","政治風險"],"a":2,"e":"答案(C)。授信企業本身沒有問題，卻因當地政府外匯短缺或政局不穩，宣布禁止或限制本息匯出而無法回收，這是國家主權行為造成的損失，屬於國家風險（外匯移轉風險即屬國家風險概念的一環）。產業風險與匯兌（匯率）風險都不是本題情境。","c":8,"f":1,"ap":["E21-20"]},{"i":"E21-23","q":"有關風險之資本計提，下列敘述何者錯誤？","o":["信用風險加權風險性資產，係衡量交易對手不履約，致銀行產生損失的風險","市場風險應計提之資本，是當市場價格波動，導致銀行資產產生損失之風險，所需計提之資本","風險性資產總額是由信用風險加權風險性資產，加計市場風險及作業風險應計提之資本乘以12.5 之合計數計算而得","作業風險應計提之資本，旨在衡量銀行因內部作業、人員及系統之不當或失誤，造成損失之風險，所需計提之資本，但不包含外部事件造成作業損失之風險"],"a":3,"e":"答案(D)。作業風險是指因內部作業、人員及系統的不當或失誤，「或外部事件」造成損失的風險，因此作業風險應計提之資本包含外部事件造成的損失，(D)稱不包含外部事件，錯誤。(A)信用風險加權風險性資產衡量交易對手不履約致銀行損失的風險、(B)市場風險應計提資本是因市場價格波動致資產損失所需計提之資本，均正確；(C)風險性資產總額＝信用風險加權風險性資產＋(市場風險＋作業風險應計提資本)×12.5，正確。","c":9,"f":1,"ap":["E21-23"]},{"i":"E21-29","q":"銀行為發揮內部評等法 (Internal Rating-Based Approach, IRB) 的管理功能，除須建立信用評等機制外，尚需建立之制度，下列敘述何者錯誤？","o":["風險調整後之資本報酬率(RaROC)","風險資本(Capital at Risk)","法定資本","經濟資本(Economic Capital, EC)"],"a":2,"e":"答案(C)。為發揮內部評等法(IRB)的管理功能，銀行除建立信用評等機制外，還要建立風險調整後資本報酬率(RaROC)、風險資本、經濟資本等內部管理制度。法定資本是依標準法等監理規定計提的資本，不是IRB需另行建立的內部制度。","c":12,"f":1,"ap":["E21-29"]},{"i":"E21-32","q":"有關不良授信資產，下列敘述何者錯誤？","o":["不良授信資產比率為不良授信資產除以總授信資產淨額之比率","不良授信資產係指第三類可望收回者至第五類收回無望者之授信資產合計","逾期放款比率為逾期放款（依法認列，還包括催收款及呆帳）對放款總額之比率","備抵呆帳覆蓋率為備抵呆帳對逾期放款（依法認列，還包括催收款及呆帳）之比率"],"a":1,"e":"答案(B)。授信資產分為五類，除第一類正常授信外，第二類至第五類都屬於不良授信資產，所以不良授信資產是「第二類」至第五類的合計，不是從第三類開始，(B)錯誤。(A)不良授信資產比率、(C)逾期放款比率、(D)備抵呆帳覆蓋率的定義均正確。","c":12,"f":1,"ap":["E21-32"]},{"i":"E21-33","q":"衡量市場風險時，主要部位或個別金融商品的「價格波動」，下列哪項指標是錯誤？","o":["標準差","變異數","變異係數","信用風險"],"a":3,"e":"答案(D)。部位價格波動是市場因素偏離平均水準的程度，統計上可用標準差、變異數、變異係數來衡量。信用風險是交易對手違約的風險，不是衡量價格波動的指標。","c":13,"f":1,"ap":["E21-33"]},{"i":"E21-35","q":"評估債券之「利率敏感性係數」，是以「Present Value of Basis Point；PVBP」指標為代表，請問實務上所稱1 BP 為下列何者？","o":["0.001%","0.01%","0.1%","1%"],"a":1,"e":"答案(B)。1個基點(Basis Point，BP)＝0.01%＝0.0001。PVBP是殖利率變動1BP時，債券價格的變動金額。","c":13,"f":1,"ap":["E21-35"]},{"i":"E21-39","q":"依銀行資本適足性及資本等級管理辦法規定，銀行本行及合併之資本適足比率，在第一類資本比率上應符合下列何者？","o":["不得低於8%","不得低於8.5%","不得低於9.5%","不得低於10.5%"],"a":1,"e":"答案(B)。依銀行資本適足性及資本等級管理辦法，銀行本行及合併的最低比率為：普通股權益比率7%、第一類資本比率8.5%、資本適足率10.5%（均含2.5%留存緩衝），所以第一類資本比率不得低於8.5%。","c":9,"f":1,"ap":["E21-39"]},{"i":"E21-42","q":"有關成本與收入觀念，下列敘述何者錯誤？","o":["投資中心包括在責任中心體系內","成本中心追求最低成本，利潤中心強調利潤最高","成本中心的主管通常無權決定產品售價","任何成本中心的主管，均應有權決定行銷產品的數量多寡與售價高低"],"a":3,"e":"答案(D)。成本中心只對成本或費用負責，對產量多寡及售價「無權決定」，所以「任何成本中心主管都有權決定行銷數量與售價」錯誤。投資中心屬於責任中心體系(A)；成本中心追求成本最低，利潤中心追求利潤最高(B)；成本中心主管通常無權決定售價(C)。","c":2,"f":1,"ap":["E21-42"]},{"i":"E21-45","q":"銀行爰用「信用風險值」當作放款權限的設置準則時，個別客戶的風險無法反映在下列何者？","o":["市場風險","違約風險","暴露風險","回收風險"],"a":0,"e":"答案(A)。信用風險值由違約風險（違約機率）、暴露風險（暴險額）與回收風險（違約損失率）組成，用來反映個別客戶的信用風險。市場風險來自市場價格變動，不是個別客戶的信用特性，無法由信用風險值反映。","c":12,"f":1,"ap":["E21-45"]},{"i":"E21-46","q":"臺灣實施新的資本適足規範後，對於資本風險的衡量，集中在下列哪四大要項上？ A.信用風險 B.市場風險 C.價格風險 D.作業風險 E.流動性風險","o":["ABCD","ABCE","ABDE","BCDE"],"a":2,"e":"答案(C)。依講義，臺灣實施新資本適足規範後，對資本風險的衡量集中在信用風險、市場風險、作業風險與流動性風險四大要項。價格風險已涵蓋在市場風險內，不另列為一項，故選ABDE。","c":9,"f":1,"ap":["E21-46"]},{"i":"E21-47","q":"乙公司2024 年度損益表的主要會計科目為：營業收入166,228 萬元、營業成本92,304 萬元、營業費用13,384萬元、利息費用1,858 萬元、處分固定資產損失99 萬元、匯兌損失33 萬元，請問該公司的財務費用率為多少？","o":["0.54%","0.84%","1.04%","1.14%"],"a":3,"e":"答案(D)。財務費用率＝財務費用÷營業收入，財務費用＝利息費用＋匯兌損失＋手續費。本題財務費用＝1,858＋33＝1,891萬元；處分固定資產損失屬營業外損失，不計入。1,891÷166,228≒1.14%。","c":4,"f":1,"ap":["E21-47"]},{"i":"E21-48","q":"大明在全體金融機構的信用貸款餘額85 萬元、房屋擔保貸款餘額100 萬元，大明平均月收入為5.5 萬元，擬向銀行申請一筆新增的信用貸款，依據金管會2005 年12 月19 日發函金融機構有關「債務人於全體金融機構之無擔保債務歸戶之總餘額」規範，銀行可以核給大明的信用貸款額度最高為多少？","o":["25 萬元","36 萬元","51 萬元","64 萬元"],"a":1,"e":"答案(B)。依金管會規定，債務人在全體金融機構的無擔保債務歸戶總餘額，不宜超過平均月收入的22倍。上限＝5.5萬×22＝121萬元；房屋擔保貸款屬有擔保債務，不計入，所以扣除現有信用貸款85萬元後，最多可再貸121－85＝36萬元。","c":5,"f":1,"ap":["E21-48"]},{"i":"E21-49","q":"有關消費金融之業務特點 ，下列敘述何者錯誤？","o":["利率訂價相對具僵硬性且偏高","業務成長循環和景氣榮枯存在高度相關性","因規模經濟導致其每筆作業成本是所有放款項目中最低","借款人普遍對利率變化缺乏敏感性"],"a":2,"e":"答案(C)。消費金融每筆金額小、客戶條件不一，作業成本相對較高，不是所有放款中最低，(C)錯誤。消費金融的利率訂價較僵硬且偏高(A)、與景氣高度相關(B)，借款人對利率變化也較不敏感(D)。","c":5,"f":1,"ap":["E21-49"]},{"i":"E21-52","q":"有關國家風險的統計，下列敘述何者錯誤？","o":["除已動用的放款餘額，總暴險額還需加計剩餘可用或未動用部分","信用狀保兌是按承作金額計算暴險值","已提列資產減損之有價證券投資，直接按減損後之資產價值計算","附賣回證券直接以有價證券之市場價值計算"],"a":3,"e":"答案(D)。國家風險統計時，總暴險除已動用餘額外，還要加計未動用額度(A)；信用狀保兌按承作金額計算(B)；已提列減損的有價證券按減損後價值計算(C)。依講義，附賣回交易應以可能發生的損失金額計算暴險，不是直接以有價證券的市場價值計算，故(D)錯誤。","c":8,"f":1,"ap":["E21-52"]},{"i":"E21-55","q":"有關違約、違約風險及違約事件，下列敘述何者錯誤？","o":["違約風險係由違約事件的發生機率加以描述","交易對手未遵守契約規定之違約，屬於技術性違約","逾期放款係指屆清償期達六個月以上，仍無法繳交本金或利息者","經濟違約，係指授信客戶的總資產市值低於總負債市值"],"a":2,"e":"答案(C)。逾期放款是指積欠本金或利息超過清償期「3個月」以上者，不是6個月，(C)錯誤。違約風險以違約事件的發生機率描述(A)；未遵守契約條款屬技術性違約(B)；總資產市值低於總負債市值屬經濟違約(D)。","c":12,"f":1,"ap":["E21-55"]},{"i":"E21-60","q":"有關作業風險管理權責，下列敘述何者錯誤？ A.為落實法令遵循，銀行會在第一線業務單位設置「法令遵循主管」，負責法遵宣導及法遵自評作業之檢核 B.為發揮制衡功能，總行業務管理單位所擬定相關規章及作業細則，不須會簽法遵及風管部門提供意見 C.第二道防線為有效發揮風險監督功能，亦將參與經營績效之考評 D.第三道防線負責評估前二道防線設計之程序是否有效，並查核各單位是否落實內部控制及風險控管","o":["ABCD","僅ABC","僅BC","僅B"],"a":2,"e":"答案(C)。B錯誤：總行業務管理單位擬定的規章及作業細則，應會簽法令遵循與風險管理部門表示意見，才能發揮制衡功能。C錯誤：第二道防線（風管、法遵）負責監督，須保持獨立性，不宜參與業務經營績效的考評。A（各單位設法令遵循主管）與D（第三道防線稽核評估前兩道防線並查核內控）均正確，故選僅BC。","c":15,"f":1,"ap":["E21-60"]},{"i":"E22-3","q":"假設A 銀行除了持有本金$10,000、票面利率固定5%之5 年期債券外，其餘資產均為現金；負債部分只發行一年到期的定期存單，金額$8,000，固定利率2%，到期後發行新存單的利率隨市場走勢調整，並預期未來無另外資產。市場利率在第一年年底，若上升50 個基準點(Basis Point)，請問第二年年底的淨利息利潤，相較於第一年年底變動多少？","o":["減少$50","減少$40","增加$40","增加$50"],"a":1,"e":"答案(B)。第一年淨利息利潤＝10,000×5%－8,000×2%＝500－160＝340。債券是5年期固定利率，利息收入不變；存單一年後重新發行，利率上升50BP成為2.5%，第二年淨利息利潤＝500－8,000×2.5%＝500－200＝300。兩年相比減少340－300＝$40。","c":14,"f":1,"ap":["E22-3"]},{"i":"E22-4","q":"有關外幣資產的組合管理，當投資標的報酬率間之相關係數為多少時，可使投資組合的風險分散至最低？","o":["1","0.5","0","-1"],"a":3,"e":"答案(D)。投資組合的風險分散效果取決於報酬率之間的相關係數。相關係數為－1（完全負相關）時，分散效果最大，理論上可將組合風險降到最低（甚至為零）。相關係數為1時完全沒有分散效果，為0時只有部分分散效果。","c":13,"f":1,"ap":["E22-4"]},{"i":"E22-5","q":"有關成本中心的敘述，下列何者錯誤？","o":["成本中心的主管僅能控制成本或費用","成本中心以追求產品或服務成本最低為努力目標","成本中心主管無權參與選擇各項投入資源的標準及來源","適用成本中心的單位，「無權決定」產量或服務多寡，以及產量或服務的售價"],"a":2,"e":"答案(C)。成本中心主管只能控制成本或費用(A)，以追求成本最低為目標(B)，對產量及售價「無權決定」(D)。但成本中心主管「有權」參與選擇各項投入資源的標準及來源，所以(C)說無權參與是錯誤的。","c":2,"f":1,"ap":["E22-5"]},{"i":"E22-6","q":"假設財務處轄下有資金調撥等三個部別，若要探討財務處長每月領取的薪資費用如何歸屬，則下列方法何者正確？","o":["此薪資費用是財務處的間接成本","此薪資費用是財務處轄下資金調撥等三個部別的直接成本","此薪資費用是財務處轄下資金調撥等三個部別的間接成本","此薪資費用不宜當作財務處轄下任何部別的直接或間接成本"],"a":2,"e":"答案(C)。財務處長的薪資，對財務處本身是直接成本；對轄下資金調撥等三個部別而言，因無法直接歸屬到某一個部別，要分攤，所以屬於三個部別的「間接成本」。","c":2,"f":1,"ap":["E22-6"]},{"i":"E22-8","q":"銀行的聯行往來利率，通常由下列哪一個單位核定？","o":["資產負債管理委員會","風險管理委員會","授信審查委員會","董事會"],"a":0,"e":"答案(A)。聯行往來利率（內部資金移轉價格）涉及全行資金的配置與資產負債管理，通常由資產負債管理委員會(ALCO)核定。","c":2,"f":1,"ap":["E22-8"]},{"i":"E22-9","q":"銀行根據風險胃納、策略及管理所需建立之損失機率範圍，藉由內部風險管理部門，計算「非預期損失」的資本需求額時，該資本名稱應為下列何者？","o":["法定資本","經濟資本","已投入資本","緩衝資本"],"a":1,"e":"答案(B)。經濟資本是銀行依自身的風險胃納、策略及管理需要訂定損失機率範圍（信賴水準），由內部風險管理部門計算「非預期損失」所需的資本。法定資本則是依主管機關規定計提的資本。","c":12,"f":1,"ap":["E22-9"]},{"i":"E22-11","q":"有關應收帳款代收融資業務，下列何者正確？","o":["應收帳款管理商無法向商品勞務供應者，追回墊付帳款時，稱為有追索權之應收帳款承購","有追索權的授信對象為應收帳款的讓與者（即商品勞務的賣方），無追索權的授信對象為應收帳款的還款者（即商品勞務的買方）","辦理應收帳款承購業務的銀行承擔過高流動性風險與信用風險時，可將部分應收帳款在初級市場轉售予其他銀行","辦理應收帳款承購業務的銀行發現商品勞務買方存在明顯不同的信用等級時，無須自行負擔保險費用（一般無法要求應收帳款讓與者額外負擔保險費用），即可降低信用風險"],"a":1,"e":"答案(B)。有追索權時，授信對象是應收帳款讓與者（賣方）；無追索權時，授信對象是應收帳款的還款者（買方），(B)正確。(A)錯誤：管理商可向供應者追回墊款，才是有追索權；(C)錯誤：應在「次級」市場轉售；(D)錯誤：買方信用等級明顯不同時，銀行可要求讓與者額外負擔保險費用，以降低信用風險。","c":4,"f":1,"ap":["E22-11"]},{"i":"E22-13","q":"有關信用卡業務，下列敘述何者錯誤？","o":["特約商店係指接收持卡人刷卡消費並簽帳的商店","所有發卡機構均從事代理收付持卡人在特約商店刷卡產生之帳款","正卡申請人應年滿18 歲，並檢附身分證明及與還款能力相關的資料","國外交易需經由國際清算組織，居間提供發卡機構和收單機構雙方的授權和清算服務"],"a":1,"e":"答案(B)。代理收付持卡人在特約商店刷卡所產生的帳款，是「收單機構」的業務，並不是所有發卡機構都從事收單，故(B)錯誤。特約商店的定義(A)、正卡申請人須年滿18歲並附身分及還款能力資料(C)、國外交易經由國際清算組織授權清算(D)，均正確。","c":5,"f":1,"ap":["E22-13"]},{"i":"E22-14","q":"穆迪信評公司將短期別債券之信用等級分為 Prime-1、Prime-2、Prime-3 以及 Not-Prime。請問其中Not-Prime 類似於長期債券何項信用等級以下？","o":["Aa1","A1","Baa1","Ba1"],"a":3,"e":"答案(D)。Moody's短期評等中，Prime-1、Prime-2、Prime-3屬投資級；Not-Prime相當於長期評等Ba1（含）以下的投機級。Moody's長期評等Baa3以上為投資級。","c":6,"f":1,"ap":["E22-14"]},{"i":"E22-16","q":"有關授信對象的風險限額，下列敘述何者錯誤？","o":["承作授信額度的上限稱為風險限額","個別戶的所有案件仍受總風險限額規範","風險限額又稱風險權限","傳統法令訂定的放款額度，衡量風險限額時，能快速反映違約風險，實務上優於「信用風險值」的計算"],"a":3,"e":"答案(D)。傳統法令訂定的放款額度無法快速反映違約風險，實務上「信用風險值」考量了違約機率、暴險額及違約損失率，比傳統額度更能反映風險，故(D)錯誤。授信額度上限稱為風險限額，又稱風險權限(A)(C)；個別戶的所有案件仍受總風險限額規範(B)。","c":7,"f":1,"ap":["E22-16"]},{"i":"E22-17","q":"中小企業信用保證基金的保證對象，哪類對象不符合申請資格？","o":["經常僱用員工人數200 人以內的公司","實收資本額在1 億元以下的公司","集團企業","微型企業"],"a":2,"e":"答案(C)。中小企業信用保證基金的保證對象是符合中小企業認定標準的企業，例如經常僱用員工200人以內、實收資本額1億元以下的公司，以及微型企業。集團企業不屬於中小企業範疇，不符申請資格。","c":4,"f":1,"ap":["E22-17"]},{"i":"E22-19","q":"授信對象若在英屬維京群島、開曼群島、百慕達群島或其他免稅地區註冊，但未實際營運，也無提供十足擔保時，如何認定國家別的風險限額？","o":["以承擔償還責任或保證責任者之法定國籍歸屬","以資金主要使用所在地","不須納入國別認定","按照屬地或屬人主義歸屬均可"],"a":1,"e":"答案(B)。授信對象在英屬維京群島、開曼群島、百慕達等免稅地區註冊，卻沒有實際營運，也沒有十足擔保時，應以「資金主要使用所在地」認定國家別，才能反映真實的國家風險。","c":8,"f":1,"ap":["E22-19"]},{"i":"E22-22","q":"A 銀行在114 年12 月底之信用風險加權風險性資產為新臺幣（以下同）1,000 億元，市場風險和作業風險應計提資本各為5 億元，請問三種風險合計的加權風險性資產為下列何者？","o":["1,000 億元","1,005 億元","1,010 億元","1,125 億元"],"a":3,"e":"答案(D)。風險性資產總額＝信用風險加權風險性資產＋(市場風險應計提資本＋作業風險應計提資本)×12.5＝1,000＋(5＋5)×12.5＝1,000＋125＝1,125億元。","c":9,"f":1,"ap":["E22-22"]},{"i":"E22-24","q":"巴塞爾資本協定增訂之流動性風險指標，下列敘述何者錯誤？","o":["流動性覆蓋比率係指高品質的流動資產除以30 天期之淨現金流出","流動性覆蓋比率大於100%，意指銀行在監理機關嚴峻的流動性管理下，有足夠能力處分資產、換取現金","淨穩定資金比率係指法定穩定資金除以可取得的穩定資金","淨穩定資金比率強調支應資產和業務活動的資金，至少須一定比率來自於穩定的負債"],"a":2,"e":"答案(C)。淨穩定資金比率(NSFR)＝可取得的穩定資金÷應有（法定）穩定資金，(C)把分子分母寫反了。流動性覆蓋比率(LCR)＝高品質流動資產÷未來30天淨現金流出(A)，大於100%表示在壓力情境下有足夠能力變現(B)；NSFR強調資金須有一定比率來自穩定負債(D)。","c":14,"f":1,"ap":["E22-24"]},{"i":"E22-25","q":"臺灣的票券金融公司在資本適足率未達多少時，不得設立分公司？","o":["未達6%","未達8%","未達10%","未達12%"],"a":1,"e":"答案(B)。票券金融公司的資本適足率不得低於8%；未達8%時，不得設立分公司，也不得以現金分配盈餘或買回股份。","c":10,"f":1,"ap":["E22-25"]},{"i":"E22-27","q":"有關證券商之資本適足率規範，下列敘述何者錯誤？","o":["資本適足率會影響包銷有價證券的規模","資本適足率連續3 個月達250%以上，對客戶的融資總金額可達淨值的400%","資本適足率低於150% 時，主管機關得暫緩增加新種業務","資本適足率連續6 個月均超過250%時，可申請經營衍生性金融商品業務"],"a":3,"e":"答案(D)。證券商申請經營衍生性金融商品業務，須最近6個月的資本適足率均超過200%，不是250%，故(D)錯誤。資本適足率會影響包銷規模(A)；連續3個月達250%以上，融資總金額可達淨值400%(B)；低於150%時，主管機關得暫緩新種業務(C)。","c":10,"f":1,"ap":["E22-27"]},{"i":"E22-29","q":"有關信用風險的類型與暴露風險，下列敘述何者錯誤？","o":["土建融案件之擔保品風險使用擔保成數衡量，亦即實際貸款額佔可貸值的比率(Loan-to-Value)，擔保成數越高，銀行債權保障越低","授信客戶未依還款計畫逕自提前還款，構成「提前還款風險」(Prepayment Risk)，性質類似「再投資風險」","衍生性業務之「當期暴險額」，反映目前暴露的風險，有別於反映未來可能存在風險之「潛在暴險額」","信用額度內未被動用之授信資產，稱為「放款承諾」，此項承諾使銀行承擔或有之「再投資風險」"],"a":3,"e":"答案(D)。放款承諾是額度內尚未動用的部分，客戶日後可能動用，使銀行承擔或有的暴露（信用）風險與資金需求，不是「再投資風險」，故(D)錯誤。擔保成數(LTV)愈高，債權保障愈低(A)；提前還款風險性質類似再投資風險(B)；當期暴險額與潛在暴險額的區別(C)，均正確。","c":12,"f":1,"ap":["E22-29"]},{"i":"E22-30","q":"甲銀行（賣方）與乙銀行（買方）承作CDS 合約，名目本金為100 元，逐日清算價值(Mark-to-Market) 若為 -3 元，則甲銀行從事衍生性金融商品交易的當期暴險額為多少？","o":["0 元","-3 元","+3 元","+100 元"],"a":0,"e":"答案(A)。衍生性商品的當期暴險額＝max(重置成本即逐日清算價值, 0)。甲銀行的逐日清算價值為－3元，代表甲是欠對方的一方，交易對手違約時甲沒有損失，所以當期暴險額為0元。","c":12,"f":1,"ap":["E22-30"]},{"i":"E22-32","q":"有關信用風險各項指標的計算，下列何項計算公式錯誤？","o":["表外非衍生性業務的信用相當額=交易金額x 信用轉換係數","表外衍生性業務的信用相當額=當期暴險額+潛在暴險額","資本適足率= 第一類合格資本/風險性資產","損失準備覆蓋率=損失準備/不良授信資產"],"a":2,"e":"答案(C)。資本適足率＝合格自有資本淨額（第一類資本淨額＋第二類資本淨額）÷風險性資產總額；「第一類資本÷風險性資產」是第一類資本比率，不是資本適足率，故(C)錯誤。(A)表外非衍生性的信用相當額、(B)衍生性的信用相當額＝當期暴險額＋潛在暴險額、(D)損失準備覆蓋率，公式均正確。","c":12,"f":1,"ap":["E22-32"]},{"i":"E22-34","q":"銀行藉由金融商品的「損失波動幅度」與「波動倍數」的相乘，估算哪種風險部位的限額門檻？","o":["信用風險值或限額","市場風險值或限額","作業風險值或限額","信用損失的期望值與標準差"],"a":1,"e":"答案(B)。市場風險值(VaR)＝損失波動幅度(σ)×波動倍數（依容忍水準決定的Z值，例如1%對應2.325），再乘以敏感性係數，用來估算市場風險值或市場風險限額的門檻。","c":13,"f":1,"ap":["E22-34"]},{"i":"E22-36","q":"檢視銀行之流動性風險管理，下列制度性敘述何者錯誤？","o":["宜重視新臺幣與美元的流動性缺口","宜編製新臺幣與美元的利率缺口","當市場利率由低往高攀升時，宜採取「正」缺口策略","資金缺口策略與市場利率無關，但與現金流入及流出有關"],"a":3,"e":"答案(D)。資金（重新訂價）缺口策略與市場利率走勢密切相關：利率上升時宜採正缺口(C)，利率下滑時宜採負缺口，利率處於高點或低點時宜採零缺口，所以「與市場利率無關」錯誤。實務上宜重視新臺幣與美元的流動性缺口(A)與利率缺口(B)。","c":14,"f":1,"ap":["E22-36"]},{"i":"E22-37","q":"有關利率風險管理的重新訂價缺口指標，下列敘述何者錯誤？","o":["類似流動性缺口指標是以不同天期「累計」概念衡量","實務上，利率風險的缺口指標，適合觀察個別營業單位","實務上，利率風險的缺口指標，均以全行或其銀行簿的部位為主","部位幣別以新臺幣與美金兩種計價為主，人民幣計價的部位為輔"],"a":1,"e":"答案(B)。實務上，利率風險的缺口指標都以全行或銀行簿的部位為主(C)，不適合觀察個別營業單位，故(B)錯誤。缺口指標與流動性缺口一樣，以不同天期的累計概念衡量(A)；幣別以新臺幣與美元為主，人民幣為輔(D)。","c":14,"f":1,"ap":["E22-37"]},{"i":"E22-38","q":"有關作業風險之資本計提，標準法是依業務別設定計提指標，並與對應且權數固定的β值相乘求得資本計提額，下列敘述何者錯誤？","o":["將銀行的業務活動分為八大類別","八類業務均以「營業毛利」作為計提標準","八類業務均以「營業利益」作為計提標準","風險係數β 值，依業務屬性與暴險程度，定在12%至18%之間"],"a":2,"e":"答案(C)。作業風險標準法將銀行業務分為八大類，各類業務都以「營業毛利」為計提指標，乘上12%至18%的固定β值，加總得出資本計提額。計提標準是營業毛利，不是「營業利益」，故(C)錯誤。","c":15,"f":1,"ap":["E22-38"]},{"i":"E22-39","q":"依銀行資本適足性及資本等級管理辦法規定，銀行的資本等級被劃分為「資本嚴重不足」時，此銀行的資本適足率為多少？","o":["資本適足比率未達2%","資本適足比率達2%以上但未達8.5%","資本適足比率達8.5%以上但未達10.5%","資本適足比率達10.5%"],"a":0,"e":"答案(A)。依銀行資本適足性及資本等級管理辦法，資本適足率未達2%者，屬「資本嚴重不足」；另依銀行法第44條，淨值占資產總額比率低於2%者，也視為資本嚴重不足。資本適足率在2%以上、未達8.5%，屬資本顯著不足。","c":9,"f":1,"ap":["E22-39"]},{"i":"E22-44","q":"以資金調撥與金融操作做為核心職掌的財務處，業務活動通常聚焦在下列哪些？ A.積極參與衍生性業務B.同業拆款 C.提高黃金商品多頭部位，抵抗通膨風險 D.票債券管理","o":["僅A、C","僅B、D","僅A、B、D","僅B、C、D"],"a":2,"e":"答案(C)。以資金調撥與金融操作為核心職掌的財務處，業務聚焦在衍生性業務(A)、同業拆款(B)與票債券管理(D)。刻意提高黃金多頭部位以對抗通膨，屬於方向性的投機操作，不是財務處的核心業務，故選僅A、B、D。","c":13,"f":1,"ap":["E22-44"]},{"i":"E22-47","q":"甲公司的年度財務數字如下：賒銷產生的營業收入166 百萬元、營業成本92 百萬元、營業外收入5 百萬元、期初應收帳款淨額13 百萬元、期末應收帳款淨額28 百萬元，請計算該公司的應收帳款週轉率約為何？","o":["6.1","8.1","10.1","13.1"],"a":1,"e":"答案(B)。應收帳款週轉率＝賒銷營業收入÷平均應收帳款＝166÷[(13＋28)÷2]＝166÷20.5≒8.1次。營業成本與營業外收入不必納入計算。","c":4,"f":1,"ap":["E22-47"]},{"i":"E22-55","q":"與信用風險有關之業務項目，下列敘述何者錯誤？","o":["表內(On-The-Balance-Sheet)與表外(Off-The-Balance-Sheet)項目皆可能產生信用風險","表內(On-The-Balance-Sheet)泛指企業金融業務，消費金融業務則被歸類在表外(Off-The-Balance-Sheet)","表外(Off-The-Balance-Sheet)的非衍生性業務項目如循環式包銷融通(Revolving Underwriting Facility; RUFs)","表外(Off-The-Balance-Sheet)的衍生性業務項目如金融交換(Swap)，可能同時存在市場風險與信用風險"],"a":1,"e":"答案(B)。表內項目同時包括企業金融與消費金融的放款等資產，消費金融（如房貸、信用卡）並不屬於表外項目，故(B)錯誤。表內與表外都可能產生信用風險(A)；循環式包銷融通(RUFs)屬於表外非衍生性項目(C)；金融交換(Swap)屬表外衍生性項目，同時有市場風險與信用風險(D)。","c":12,"f":1,"ap":["E22-55"]},{"i":"E22-57","q":"某銀行承作兩筆衍生性金融交易，其一為名目本金 $200,000，期別5 年的利率交換契約，計算權數為0.005，當期暴險額為$5,000 。另一筆為名目本金$100,000，期別3 年的外匯交換契約，計算權數為0.05，當期暴險額為$3,000，請問該銀行的信用相當額為何？","o":["3,000 元","6,000 元","7,000 元","14,000 元"],"a":3,"e":"答案(D)。信用相當額＝當期暴險額＋潛在暴險額（名目本金×計算權數）。利率交換：5,000＋200,000×0.005＝5,000＋1,000＝6,000；外匯交換：3,000＋100,000×0.05＝3,000＋5,000＝8,000。合計6,000＋8,000＝14,000元。","c":12,"f":1,"ap":["E22-57"]},{"i":"E22-60","q":"為避免投資人購買或交易複雜性較高之匯率類商品，導致承擔重大的風險，主管機構規定此類契約的交易期限不得超過下列何者？","o":["三個月","六個月","一年","五年"],"a":2,"e":"答案(C)。為避免投資人承擔重大風險，主管機關規定，屬於匯率類的複雜性高風險商品，契約期限不得超過一年。","c":13,"f":1,"ap":["E22-60"]},{"i":"E23-2","q":"「借長貸短」的資金部位，可能存在下列何種風險？","o":["再投資風險","再融資風險","市場價值風險","信用風險"],"a":0,"e":"答案(A)。「借長貸短」是用長期資金支應短期資產，資產會先到期，到期後資金要以當時（可能較低）的利率重新運用，因此有再投資風險。相反地，「借短貸長」是負債先到期，需要重新舉債，有再融資風險。","c":14,"f":1,"ap":["E23-2"]},{"i":"E23-4","q":"銀行扮演「存款貨幣機構」角色，在金融市場提供下列哪些功能？A.面額中介、B.風險中介、C.期間中介、D.資訊中介","o":["僅B","僅BC","僅ABC","ABCD"],"a":3,"e":"答案(D)。銀行扮演存款貨幣機構的角色，提供面額中介（集合小額存款轉為大額放款）、風險中介（分散並承擔信用風險）、期間中介（短期存款轉為長期放款）及資訊中介（降低資訊不對稱）等功能，四項皆屬之。","c":1,"f":1,"ap":["E23-4"]},{"i":"E23-5","q":"銀行組織內部第一層級的部門，若是按企業機能別劃分，部門主管較難承擔下列何種責任中心的職能？","o":["利潤中心","成本中心","費用中心","收入中心"],"a":0,"e":"答案(A)。按企業機能別（營業、信託、財務、國外等）劃分的部門，收入與成本分散在不同機能單位，部門主管很難同時對收入與成本負責，所以較難成立利潤中心。成本中心、費用中心、收入中心則相對容易實施。","c":2,"f":1,"ap":["E23-5"]},{"i":"E23-7","q":"有關營運利潤、會計利潤和財務利潤的金額大小，下列敘述何者正確？","o":["財務利潤=營運利潤+會計利潤","會計利潤=營運利潤+財務利潤","營運利潤=財務利潤+會計利潤","三者非屬相同會計基礎，無法衡量"],"a":1,"e":"答案(B)。營運利潤＝顧客價格與內部移轉價格的差額（營業單位賺得），財務利潤＝內部移轉價格與市場價格的差額（財務單位賺得），兩者相加等於全行的會計利潤，即會計利潤＝營運利潤＋財務利潤。","c":2,"f":1,"ap":["E23-7"]},{"i":"E23-8","q":"依銀行資本適足性及資本等級管理辦法規定，本國銀行之普通股權益比率，自108 年起不得低於多少？","o":["6.375%","7.00%","8.50%","10.50%"],"a":1,"e":"答案(B)。依銀行資本適足性及資本等級管理辦法，自108年起，本國銀行的普通股權益比率不得低於7%（4.5%＋2.5%留存緩衝），第一類資本比率不得低於8.5%，資本適足率不得低於10.5%。","c":9,"f":1,"ap":["E23-8"]},{"i":"E23-10","q":"與借款企業有關的授信業務，下列何者非屬銀行之經常性融資業務？","o":["票據融通","住宅用之房屋抵押貸款","擔保透支","短期放款"],"a":1,"e":"答案(B)。對借款企業的經常性融資，是協助企業短期週轉的授信，例如票據融通、擔保透支、短期放款。住宅用房屋抵押貸款是對個人的消費金融業務，不是企業的經常性融資。","c":4,"f":1,"ap":["E23-10"]},{"i":"E23-11","q":"企業金融業務常見的中長期融資，不包括下列何者？","o":["自創品牌放款","企業天然災害復建放款","民間投資興辦公共設施放款","墊付出口票款"],"a":3,"e":"答案(D)。中長期融資用來協助企業建立中長期營運資金，例如自創品牌放款、天然災害復建放款、民間投資興辦公共設施放款。墊付出口票款是短期的貿易融資，屬於經常性（短期）融資。","c":4,"f":1,"ap":["E23-11"]},{"i":"E23-16","q":"有關授信對象的「授信總餘額」，下列敘述何者錯誤？","o":["同一自然人，不得超過銀行淨值3%","同一法人，不得超過銀行淨值20%","同一關係人，不得超過銀行淨值40%","同一關係人的無擔保授信，不得超過銀行淨值10%"],"a":1,"e":"答案(B)。依銀行法第33條之3授權規定，銀行對同一法人的授信總餘額不得超過淨值15%（無擔保5%），不是20%，故(B)錯誤。同一自然人3%(A)、同一關係人40%(C)、同一關係人無擔保授信10%(D)，均正確。","c":7,"f":1,"ap":["E23-16"]},{"i":"E23-17","q":"有關「Paper Company」的財務金融特性，下列哪項內容不符合？","o":["屬於境外設立的空殼公司","稱為「紙上型」公司，營業活動普遍不明顯","企業受到租稅誘因影響，常在免稅或低稅率地區成立","只有上市櫃公司可設立，其他類型企業尚未開放申請"],"a":3,"e":"答案(D)。Paper Company是在境外（多為免稅或低稅率地區）設立的紙上公司，營業活動不明顯，常受租稅誘因而成立(A)(B)(C)。任何企業都可以設立，並非只有上市櫃公司可設立，故(D)不符合。","c":7,"f":1,"ap":["E23-17"]},{"i":"E23-21","q":"有關國家風險限額的核配，下列敘述何者錯誤？","o":["依據信評公司之評等結果，核配國家風險額度，稱為靜態核配制度","依據信用違約交換的價格變化，調整國家風險額度，稱為動態核配制度","信用違約交換的價格，原則上應每季檢查一次","當信用違約交換的價格觸及門檻標準時，應依內部相關機制凍結該國額度"],"a":2,"e":"答案(C)。國家風險限額核配：依信評結果核配稱為靜態核配(A)，依CDS價格變化調整稱為動態核配(B)，CDS價格觸及門檻時應凍結該國額度(D)。CDS價格原則上應「每日」檢視一次並留存資料（如取自Bloomberg），不是每季一次，故(C)錯誤。","c":8,"f":1,"ap":["E23-21"]},{"i":"E23-22","q":"巴塞爾資本協定的第三階段為強化銀行體系穩健性，防範景氣循環帶來的衝擊，新增下列何種制度？","o":["信用評價調整風險","交易簿增額風險之資本計提","增提額外緩衝資本","遞延所得稅資產自資本扣除"],"a":2,"e":"答案(C)。Basel III為強化銀行體系穩健性、防範景氣循環的衝擊，新增額外緩衝資本的要求，包括資本留存緩衝(2.5%)與抗景氣循環緩衝(0%～2.5%，由各國自行決定)，以限制信用過度擴張。(A)信用評價調整(CVA)風險、(B)交易簿增額風險資本計提、(D)遞延所得稅資產自資本扣除，雖也是資本規範的強化項目，但不是針對景氣循環所設計（同第19屆第24題）。","c":9,"f":1,"ap":["E23-22"]},{"i":"E23-24","q":"有關淨穩定資金比率(NSFR)，下列敘述何者錯誤？","o":["為流動性風險的短期量化指標","為可取得的穩定資金除以法定穩定資金的比率","強調支應資產和業務活動的資金，須一定比率來自穩定負債","推動初期設定的比率門檻為大於100%"],"a":0,"e":"答案(A)。淨穩定資金比率(NSFR)是衡量一年期間資金結構穩定性的中長期流動性指標；短期指標是流動性覆蓋比率(LCR，30天)，故(A)錯誤。NSFR＝可取得穩定資金÷應有穩定資金(B)，強調資金須一定比率來自穩定負債(C)，我國自107年起最低標準為100%(D)。","c":14,"f":1,"ap":["E23-24"]},{"i":"E23-26","q":"證券商的資本適足率高於100%，但低於120%，應將節餘數多少比率提列作「特別盈餘公積」？","o":["10%","20%","30%","40%"],"a":3,"e":"答案(D)。依講義，證券商依資本適足率提列特別盈餘公積：未達100%者須將全部結餘數提列；100%以上、未達120%者提列40%；120%以上、未達150%者提列20%。本題介於100%與120%之間，故提列40%；(B)20%是120%～未達150%的提列比率。","c":10,"f":1,"ap":["E23-26"]},{"i":"E23-27","q":"保險業經營的人身保險業務，其風險構成項目包括下列哪些？ A.保險風險 B.利率風險 C.資產風險D.信用風險","o":["僅AB","僅CD","僅ABC","ABCD"],"a":2,"e":"答案(C)。依保險業風險基礎資本(RBC)的計算架構，人身保險業的風險項目包括資產風險、保險風險、利率風險及其他風險。信用風險歸在資產風險（如資產違約）之內，不單獨列項，故選僅A、B、C。","c":10,"f":1,"ap":["E23-27"],"g":"講義所列人身保險風險項目含信用風險（新制分類），與官方答案「僅ABC」不完全一致，依傳統RBC分類信用風險併入資產風險"},{"i":"E23-28","q":"有關授信業務之回收風險，在構成因素及效益方面，不包括下列何者？","o":["契約保障條款：效益為積極採取法律矯正行動","擔保品：效益為將信用風險移轉為資產風險","建立拍賣市場：效益為損失回收","第三人保證：效益為風險由借款人移轉為借款人與保證人共同承擔"],"a":2,"e":"答案(C)。回收風險的構成因素與效益：契約保障條款可積極採取法律矯正行動(A)；擔保品可將信用風險移轉為資產風險(B)；第三人保證使風險由借款人改為借款人與保證人共同承擔(D)。「建立拍賣市場」不是回收風險的構成因素。","c":12,"f":1,"ap":["E23-28"]},{"i":"E23-29","q":"商業銀行的業務種類中，將信用風險區分為表內業務的風險及表外業務的風險，下列何者屬於表外業務的風險？ A.承作「非衍生性業務」的「放款承諾」 B.房屋貸款 C.學生貸款 D.開立擔保信用狀 E.提供商業本票的貼現","o":["僅BC","僅ABC","僅AD","ABCDE"],"a":2,"e":"答案(C)。表外業務不列入資產負債表，例如非衍生性業務的放款承諾(A)、開立擔保信用狀(D)。房屋貸款(B)、學生貸款(C)、商業本票貼現(E)都是已撥付的資金，列在資產負債表內，屬於表內業務，故選僅AD。","c":12,"f":1,"ap":["E23-29"]},{"i":"E23-30","q":"依Basel 提供之標準法，下列敘述何者錯誤？","o":["是透過銀行內外部的信用評等制度，決定借款客戶的風險權數","將借款對象分為13 種，再依不同借款對象的複雜程度決定是否細分，給予每種類別數種信用等級","倘借款對象為各國政府時，其風險權數均為0%","借款期間越長的授信案件，信用風險越高"],"a":2,"e":"答案(C)。依Basel標準法，對各國政府的風險權數依信用評等而定：AAA至AA-為0%，A+至A-為20%，BBB為50%，BB+至B-為100%，CCC+以下為150%，未評等為100%，並不是一律0%，故(C)錯誤。(A)(B)(D)均為標準法的正確敘述。","c":12,"f":1,"ap":["E23-30"]},{"i":"E23-33","q":"依據巴賽爾委員會規範，與市場風險資本計提有關的「主要部位」，不包括下列何者？","o":["外匯部位","權益證券部位","擔保放款部位","固定收益證券部位"],"a":2,"e":"答案(C)。依巴塞爾委員會規範，市場風險計提的主要部位為利率（固定收益證券）、權益證券、外匯及商品部位。擔保放款屬於銀行簿的授信資產，是信用風險的範疇，不屬於市場風險的主要部位。","c":13,"f":1,"ap":["E23-33"]},{"i":"E23-34","q":"假設常態情況的容忍水準為1%，殖利率之標準差為0.5%，敏感性係數β為0.5，下列市場風險值(VaR)敘述何者正確？","o":["VaR=0-2.325×1×0.005","VaR=0-2.325×1×0.01","VaR=0-2.325×0.5×0.01","VaR=0-2.325×0.5×0.005"],"a":3,"e":"答案(D)。VaR＝0－Z×β×σ。容忍水準1%（單尾）對應Z＝2.325；敏感性係數β＝0.5；殖利率標準差σ＝0.5%＝0.005。所以VaR＝0－2.325×0.5×0.005。","c":13,"f":1,"ap":["E23-34"]},{"i":"E23-35","q":"有關市場風險的標準法與內部模型法，下列敘述何者錯誤？","o":["標準法在正常情形，可使市場風險之門檻設計及風險配置更加精緻","銀行可使用內部模型法，計算各部位之市場風險值與資本計提額","常理上，內部模型法對於市場風險衡量的精細程度優於標準法，計提的資本需求額通常較標準法少","銀行可使用標準法計算各部位之市場風險限額與資本計提額"],"a":0,"e":"答案(A)。內部模型法的風險衡量比標準法精細，可讓市場風險的門檻設計與風險配置更精緻，計提的資本通常也較少(C)。(A)把這項優點歸給標準法，是錯誤的。銀行可用內部模型法(B)或標準法(D)計算市場風險值、限額與資本計提額。","c":13,"f":1,"ap":["E23-35"]},{"i":"E23-36","q":"金融商品的賣價減去買價大於0 時，實務上如何看待財務涵義？","o":["該交易呈現「資本損失」","該交易有「利息收入」","該交易有「證券交易所得」","該交易存在「價格風險」"],"a":2,"e":"答案(C)。金融商品的賣價減買價大於0，代表賣出時獲得資本利得，實務上視為「證券交易所得」。若小於0則為資本損失；利息收入來自持有期間的票息，與價差無關。","c":13,"f":1,"ap":["E23-36"]},{"i":"E23-37","q":"金融商品的流動性，具備下列何種特性？","o":["獲利能力","變現能力","償債能力","違約機率"],"a":1,"e":"答案(B)。金融商品的流動性，是指在不大幅犧牲價格下迅速轉換為現金的能力，也就是變現能力。獲利能力、償債能力與違約機率都不是流動性的定義。","c":14,"f":1,"ap":["E23-37"]},{"i":"E23-39","q":"第二類資本之合計數，不包含下列哪種會計項目？","o":["長期次順位債券","特別盈餘公積","可轉換之次順位債券","營業準備及備抵呆帳"],"a":1,"e":"答案(B)。特別盈餘公積屬於普通股權益第一類資本，不是第二類資本。第二類資本包括長期次順位債券、可轉換次順位債券、營業準備及備抵呆帳（在規定限額內）等。","c":9,"f":1,"ap":["E23-39"]},{"i":"E23-40","q":"依銀行資本適足性及資本等級管理辦法規定，銀行的資本適足比率，應符合下列何者？","o":["不得低於13%","不得低於10.5%","不得低於8.5%","不得低於7%"],"a":1,"e":"答案(B)。依銀行資本適足性及資本等級管理辦法，銀行本行及合併的資本適足率不得低於10.5%（8%＋2.5%留存緩衝）。第一類資本比率不得低於8.5%，普通股權益比率不得低於7%。","c":9,"f":1,"ap":["E23-40"]},{"i":"E23-42","q":"銀行對外舉借期限1 年、年利率1%的債務，支應兩年、年報酬率2%的資產，第1 年結束，銀行在該年，有利息利潤還是利息損失？原來債務1 年後到期，需要重新舉債，隱含再融資風險，如果第2 年新債務的年利率為3%，第2 年產生利息利潤還是利息損失？","o":["第1 年：1%利息利潤，第2 年：1%利息損失","第1 年：1%利息損失，第2 年：1%利息利潤","第1 年：1%利息利潤，第2 年：2%利息損失","第1 年：1%利息損失，第2 年：2%利息利潤"],"a":0,"e":"答案(A)。第1年：資產報酬2%－負債成本1%＝利息利潤1%。第2年：舊債到期需重新舉債，新利率3%，資產報酬仍為2%，2%－3%＝利息損失1%，這就是借短貸長的再融資風險。","c":14,"f":1,"ap":["E23-42"]},{"i":"E23-44","q":"有關營運利潤、財務利潤與會計利潤之關係，下列敘述何者錯誤？","o":["會計利潤為營運利潤與財務利潤的相加","財務利潤來自內部移轉價格與市場價格的差額","營運利潤為顧客價格與內部移轉價格的差額","會計利潤為內部損益與外部損益的合計，將不同營業單位的內部損益相抵減，合計數通常不為零"],"a":3,"e":"答案(D)。會計利潤＝營運利潤＋財務利潤(A)；財務利潤來自內部移轉價格與市場價格的差額(B)；營運利潤來自顧客價格與內部移轉價格的差額(C)。各營業單位之間的內部損益互為收支，全行加總相互抵銷後合計數為零，所以「合計數通常不為零」錯誤。","c":2,"f":1,"ap":["E23-44"]},{"i":"E23-45","q":"有關作業基礎成本制之特徵，包括下列哪些？ A.將所有間接成本視為性質一致 B.著重資源分配合理性C.計算每個作業活動的成本內涵 D.以單一基礎分攤作業成本","o":["僅AB","僅BC","僅BD","僅ABC"],"a":1,"e":"答案(B)。作業基礎成本制(ABC)是依各作業活動的實際資源耗用（成本動因）分攤間接成本，著重資源分配的合理性(B)，並計算每個作業活動的成本內涵(C)。ABC不把所有間接成本視為性質一致(A)，也不以單一基礎分攤(D)，那是傳統成本制的作法。","c":2,"f":1,"ap":["E23-45"]},{"i":"E23-48","q":"某甲的月收入平均6 萬元，目前的無擔保債務僅有向乙銀行申辦信用卡，刷卡使用尚欠的循環信用餘額80萬元。某甲打算再向丙銀行申辦信用貸款，依主管機關規定，請問某甲最高可貸多少金額？","o":["32 萬元","42 萬元","52 萬元","62 萬元"],"a":2,"e":"答案(C)。依主管機關規定，無擔保債務歸戶總餘額不宜超過平均月收入的22倍。上限＝6萬×22＝132萬元；信用卡循環信用餘額80萬元屬於無擔保債務，所以最高可再貸132－80＝52萬元。","c":5,"f":1,"ap":["E23-48"]},{"i":"E23-49","q":"發卡銀行辦理的信用卡業務，主要有三種收入來源，不包括下列何者？","o":["利息收入","國外刷卡之匯差收入","手續費收入","向特約商店收取的清算交割費用"],"a":1,"e":"答案(B)。發卡銀行信用卡業務的三大收入來源是：循環信用的利息收入、手續費收入（年費、預借現金手續費等），以及向特約商店收取的清算交割（折扣）費用。國外刷卡的匯差收入不是主要收入來源。","c":5,"f":1,"ap":["E23-49"]},{"i":"E23-51","q":"依照銀行公會的準則，大型企業在信用評分時，「財務狀況」、「經營管理」、「產業特性及展望」等三種構面的比重分別為：","o":["50%、25%、25%","40%、40%、20%","50%、30%、20%","40%、30%、30%"],"a":2,"e":"答案(C)。依銀行公會的授信企業信用評等表，大型企業的財務狀況、經營管理、產業特性及展望三個構面，比重分別為50%、30%、20%。中小型企業則為40%、40%、20%。","c":5,"f":1,"ap":["E23-51"]},{"i":"E23-52","q":"S & P 國際信評機構的國家主權評等，攸關等級制度的敘述，下列何者正確？ A.分成投資級與投機級兩大類 B.信用等級介於AA 與CCC 之間者，相同等級再細分三個層級 C.旨在反映各國「主權基金」的償還能力 D.旨在反映各國政府機關所發行「權益證券」的信用品質","o":["僅ABC","僅BCD","僅ABD","ABCD"],"a":0,"e":"答案(A)。S&P國家主權評等分為投資級與投機級兩大類(A)；AA至CCC之間的等級再以+、無符號、-細分為三個層級(B)；主權評等反映各國政府「主權債務」的償還能力（講義原文為「主權債」）(C)。主權評等評的是債務，不是政府發行的「權益證券」，故D錯誤，選僅ABC。","c":8,"f":1,"ap":["E23-52"],"g":"題目C「主權基金」用詞不精確，講義原題為「主權債」；依官方答案應理解為主權債務"},{"i":"E23-53","q":"依銀行法第74 條規定，銀行得投資「金融相關事業」及「非金融相關事業」，下列何者錯誤？","o":["投資總額不得超過投資時銀行淨值之40%","投資非金融相關事業之總額，不得超過投資時淨值之10%","投資金融相關事業，其屬同一業別者，除配合政府政策，經主管機關核准者外，以1 家為限","投資非金融相關事業，對每一事業之投資金額不得超過該被投資事業實收資本總額或已發行股份總數之3%"],"a":3,"e":"答案(D)。依銀行法第74條，銀行投資非金融相關事業時，對每一事業的投資金額不得超過該被投資事業實收資本總額或已發行股份總數的5%，不是3%，故(D)錯誤。投資總額不超過淨值40%(A)、投資非金融相關事業總額不超過淨值10%(B)、同一業別以1家為限(C)，均正確。","c":9,"f":1,"ap":["E23-53"]},{"i":"E23-54","q":"有關金控集團合格資本淨額的各項扣除數，下列扣除對象的敘述，何者正確？ A.依創業投資公司之方法計算者，使用該子公司之「資本溢額」 B.依保險公司計算自有資本之子公司來自資本性質債券之資本溢額，補充其他保險業資本缺額後之數額的三分之一 C.已自集團合格資本總額中扣除之投資帳列金額，不再計入集團法定資本需求","o":["僅AB","僅AC","僅BC","ABC"],"a":1,"e":"答案(B)。依金融控股公司合併資本適足性管理辦法第4條，依創業投資公司方法計算的子公司，以其資本溢額作為扣除數(A)；已自集團合格資本中扣除的投資帳列金額，不再計入集團法定資本需求(C)，兩者均正確。B錯誤：保險子公司來自資本性質債券的資本溢額，補充其他保險業資本缺額後，扣除的是剩餘數額的「二分之一」，不是三分之一。","c":9,"f":1,"ap":["E23-54"]},{"i":"E23-55","q":"國際清算銀行(Bank for International Settlements, BIS) 之巴賽爾委員會，負責推動資本適足管理。針對授信業務的風險管理制度，除傳統指標外，透過內部評等法(Internal Rating-Based Approach, IRB)開始重視風險量化指標，但不包括下列何者？","o":["違約風險","暴露風險","回收風險","市場風險"],"a":3,"e":"答案(D)。內部評等法(IRB)用來量化授信業務的信用風險，重點在違約風險(PD)、暴露風險(EAD)與回收風險(LGD)。市場風險來自市場價格波動，不是IRB針對授信業務的量化指標。","c":12,"f":1,"ap":["E23-55"]},{"i":"E23-56","q":"當授信客戶之信用暴險額及違約損失率已知，但未知違約發生機率時，銀行可藉由「簡化」公式估算客戶的信用損失，下列公式何者錯誤？","o":["信用損失=信用暴險額×違約機率×違約損失率","信用損失=信用暴險額×違約機率×(1﹣回收率)","信用損失=信用暴險額×違約機率×呆帳準備率","信用損失=信用暴險額×違約機率﹣回收金額"],"a":2,"e":"答案(C)。信用損失＝信用暴險額×違約機率×違約損失率(A)，違約損失率＝1－回收率，故(B)與(A)相同；(D)以「暴險額×違約機率－回收金額」表示，概念上也成立。呆帳準備率是會計上提列準備的比率，不等於違約損失率，故(C)錯誤。","c":12,"f":1,"ap":["E23-56"]},{"i":"E23-57","q":"A 銀行的信用等級為AAA-，B 銀行的信用等級為A+，當B 銀行買入A 銀行發行之7 年期金融債券新臺幣1 億元時，B 銀行持有此筆金融債券，構成多少信用風險性資產？","o":["1 億元","0.5 億元","0.2 億元","0"],"a":2,"e":"答案(C)。B銀行持有A銀行發行的金融債券，屬於對銀行的債權；A銀行信用等級在AAA至AA-之間，依標準法風險權數為20%。信用風險性資產＝1億元×20%＝0.2億元。","c":12,"f":1,"ap":["E23-57"]},{"i":"E23-58","q":"假設英國政府發行5 年期零息債券，到期一次還本、面額1 百萬英鎊，市場顯示相同風險等級之5 年期殖利率為6%。當殖利率上升1%時，根據敏感性係數估算之債券價值變化，下列何者正確？","o":["約-35,200 英鎊","約+35,200 英鎊","約-37,400 英鎊","約+37,400 英鎊"],"a":0,"e":"答案(A)。零息債券的現值＝1,000,000÷1.06^5≒747,258英鎊。修正存續期間（敏感性係數）＝5÷1.06≒4.717。殖利率上升1%時，價值變化≒－4.717×747,258×1%≒－35,248英鎊，約－35,200英鎊（殖利率上升時債券價格下跌，所以是負值）。","c":13,"f":1,"ap":["E23-58"]},{"i":"E23-60","q":"有關作業風險的資本計提，下列敘述何者正確？","o":["由簡至繁，可分為基本指標法、標準法、選擇性標準法，以及風險評等法","銀行一旦採用較高階之方法，得基於業務需要，於未經主管機關許可下，自行退回原計提方法，改採資本計提額相對低的方法","標準法的風險係數一律訂為15%","標準法適用條件比基本指標法嚴格，須經主管機關核准"],"a":3,"e":"答案(D)。標準法的適用條件比基本指標法嚴格，須經主管機關核准，(D)正確。(A)錯誤：作業風險計提方法由簡至繁為基本指標法、標準法（或選擇性標準法）、進階衡量法，沒有「風險評等法」；(B)錯誤：未經主管機關許可，不得自行退回較簡單的方法；(C)錯誤：β值依業務別介於12%至18%，不是一律15%。","c":15,"f":1,"ap":["E23-60"]}],"handout":[[1,["H1-1","H1-2","H1-3","H1-4","H1-5","H1-6","H1-7","H1-8","H1-9","H1-10","H1-11","H1-12","H1-13","H1-14","H1-15"]],[2,["H2-1","H2-2","H2-3","H2-4","H2-5","H2-6","H2-7","H2-8","H2-9","H2-10","H2-11","H2-12","H2-13","H2-14","H2-15","H2-16","H2-17","H2-18","H2-19"," function shuffle(a){ a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
function toast(msg){ const t = $('#toast'); t.textContent = msg; t.classList.add('show'); clearTimeout(t._h); t._h = setTimeout(() => t.classList.remove('show'), 1800); }

function record(id, ok){

  r[2] = ok ? 1 : 0; r[3] = now();

}
