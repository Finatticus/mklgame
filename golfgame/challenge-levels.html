<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>挑戰關卡總覽</title>
<style>
  :root { --bg: #f4f6f2; --card: #fff; --ink: #1d2a22; --sub: #66736b; --line: #dde3dc; --acc: #2f7d4f; --boss: #b5452f; --chip: #eef2ec; }
  @media (prefers-color-scheme: dark) { :root { --bg: #131814; --card: #1c231e; --ink: #e6ece7; --sub: #93a197; --line: #2c362f; --acc: #5fbf86; --boss: #e07a62; --chip: #253029; } }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 14px/1.5 system-ui, -apple-system, "Segoe UI", "Noto Sans TC", "Microsoft JhengHei", sans-serif; }
  header { position: sticky; top: 0; z-index: 5; background: var(--bg); border-bottom: 1px solid var(--line); padding: 10px 16px; }
  h1 { font-size: 18px; margin: 0 0 6px; }
  .bar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  select, input { font: inherit; padding: 5px 8px; border: 1px solid var(--line); border-radius: 8px; background: var(--card); color: var(--ink); }
  input { width: 90px; }
  .note { color: var(--sub); font-size: 12px; margin: 6px 0 0; }
  main { padding: 8px 16px 40px; max-width: 1200px; margin: 0 auto; }
  h2 { font-size: 16px; margin: 22px 0 8px; display: flex; gap: 8px; align-items: baseline; }
  h2 small { color: var(--sub); font-weight: normal; font-size: 12px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(340px, 1fr)); gap: 10px; }
  .lv { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 10px; display: grid; grid-template-columns: 90px 1fr; gap: 10px; }
  .lv.boss { border-color: var(--boss); }
  canvas { width: 90px; height: 160px; border-radius: 8px; background: var(--chip); display: block; }
  .top { display: flex; justify-content: space-between; gap: 6px; align-items: baseline; }
  .no { font-weight: 700; font-size: 15px; }
  .no em { font-style: normal; color: var(--boss); font-size: 12px; margin-left: 4px; }
  .meta { color: var(--sub); font-size: 12px; }
  .diff { display: flex; gap: 2px; margin: 4px 0; align-items: center; font-size: 11px; color: var(--sub); }
  .diff i { width: 9px; height: 6px; border-radius: 2px; background: var(--line); }
  .diff i.on { background: var(--acc); }
  .diff.hot i.on { background: var(--boss); }
  .chips { display: flex; flex-wrap: wrap; gap: 4px; margin: 4px 0 6px; }
  .chips span { background: var(--chip); border-radius: 6px; padding: 1px 6px; font-size: 11.5px; }
  ol { margin: 0; padding: 0; list-style: none; font-size: 12.5px; }
  ol li { display: flex; gap: 5px; }
  ol li b { color: #d9a400; font-weight: normal; white-space: nowrap; }
  .legend { display: flex; flex-wrap: wrap; gap: 10px; font-size: 11.5px; color: var(--sub); margin-top: 6px; }
  .legend span::before { content: ""; display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 4px; vertical-align: -1px; background: var(--c); }
  @media (max-width: 420px) { .grid { grid-template-columns: 1fr; } }
</style>
</head>
<body>
<header>
  <h1>挑戰關卡總覽（500 關）</h1>
  <div class="bar">
    <select id="ch"><option value="">全部章節</option></select>
    <input id="go" type="number" min="1" max="500" placeholder="跳到第幾關">
  </div>
  <p class="note">左邊小圖是球洞俯視圖（下面是發球台、上面是果嶺）。第 1 顆星都是在桿數上限內進洞，第 2、3 顆星是每關自己的條件。難度格數 1~10 是依障礙數、果嶺、風、桿數上限估的。</p>
  <div class="legend">
    <span style="--c:#4f9a4a">球道</span><span style="--c:#3a7434">長草</span><span style="--c:#7fd16b">果嶺</span><span style="--c:#e6d49a">沙坑</span>
    <span style="--c:#3a7fc4">水</span><span style="--c:#b49a72">荒地</span><span style="--c:#1d4a22">樹</span><span style="--c:#7d4b45">界外</span><span style="--c:#30343c">裂縫 / 斷崖</span>
  </div>
</header>
<main id="list">載入中…</main>
<script>
  // 載入失敗時不要一直停在「載入中…」：直接雙擊本機檔案（file://）瀏覽器不准載入程式模組；其他錯誤把訊息秀出來
  (function () {
    var list = document.getElementById('list');
    var fail = function (msg) { if (list.dataset.ok) return; list.innerHTML = '<p style="color:#b5452f">' + msg + '</p>'; };
    if (location.protocol === 'file:') { fail('這個頁面要從遊戲網址打開（例如 https://finatticus.github.io/mklgame/golfgame/challenge-levels.html），直接雙擊電腦裡的檔案瀏覽器不會載入。'); return; }
    window.addEventListener('error', function (e) { fail('載入失敗：' + (e.message || '程式錯誤') + '。請重新整理頁面（電腦按 Ctrl + F5，手機下拉重新整理）。'); });
    window.addEventListener('unhandledrejection', function (e) { fail('載入失敗：' + ((e.reason && e.reason.message) || e.reason) + '。請重新整理頁面。'); });
    setTimeout(function () { fail('載入太久沒有完成。請重新整理頁面（電腦按 Ctrl + F5，手機下拉重新整理）。'); }, 15000);
  })();
</script>
<script type="module">
import { LEVELS, CHAPTERS } from './js/challenge.js';
import { designLevels } from './js/challenge-design.js';
import { buildHole } from './js/terrain.js';
import { SURF } from './js/physics.js';

const D = designLevels();
const esc = s => String(s).replace(/[&<>]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' }[c]));
const sel = document.getElementById('ch'), list = document.getElementById('list');
CHAPTERS.forEach((c, i) => sel.insertAdjacentHTML('beforeend', `<option value="${i}">${c.from}~${c.to}　${esc(c.name)}</option>`));

function card(L) {
  // 瀏覽器還拿著舊版的 challenge-design.js（沒有 feat / diff）時也照樣顯示
  const d = { feat: [], diff: 0, ...(D[L.n - 1] || {}) }, boss = CHAPTERS.some(c => c.to === L.n);
  const bars = Array.from({ length: 10 }, (_, i) => `<i class="${i < d.diff ? 'on' : ''}"></i>`).join('');
  const chips = d.feat.map(f => `<span>${esc(f)}</span>`).join('');
  const goals = L.goals.map((g, i) => `<li><b>${'★'.repeat(i + 1)}</b><span>${esc(g.text)}</span></li>`).join('');
  return `<div class="lv${boss ? ' boss' : ''}" id="lv${L.n}"><canvas data-n="${L.n}" width="90" height="160"></canvas><div>
    <div class="top"><span class="no">${L.n}　${esc(L.title)}${boss ? '<em>頭目</em>' : ''}</span></div>
    <div class="meta">${L.par} 桿洞・${L.yards} 碼・上限 ${L.max} 桿${L.wind ? `・風 ${L.wind.mph} mph` : ''}</div>
    <div class="diff${d.diff >= 8 ? ' hot' : ''}">${bars}<span>&nbsp;難度 ${d.diff}</span></div>
    <div class="chips">${chips || '<span>沒有特別的障礙</span>'}</div>
    <ol>${goals}</ol></div></div>`;
}
function render() {
  const k = sel.value;
  const chs = k === '' ? CHAPTERS : [CHAPTERS[+k]];
  list.innerHTML = chs.map(c => `<h2>${esc(c.name)}<small>第 ${c.from}~${c.to} 關</small></h2><div class="grid">${LEVELS.slice(c.from - 1, c.to).map(card).join('')}</div>`).join('');
  list.querySelectorAll('canvas').forEach(cv => io.observe(cv));
  list.dataset.ok = '1';
}

// ---- 俯視小圖：沿「發球台 → 果嶺」方向取樣地形 ----
const COL = { [SURF.FAIRWAY]: '#4f9a4a', [SURF.ROUGH]: '#3a7434', [SURF.DEEP]: '#285a26', [SURF.GREEN]: '#7fd16b', [SURF.FRINGE]: '#66b85a', [SURF.TEE]: '#5fae55',
  [SURF.SAND]: '#e6d49a', [SURF.WATER]: '#3a7fc4', [SURF.WASTE]: '#b49a72', [SURF.OB]: '#7d4b45', [SURF.CHASM]: '#30343c' };
const queue = [];
let busy = false;
const io = new IntersectionObserver(es => { for (const e of es) if (e.isIntersecting) { io.unobserve(e.target); queue.push(e.target); } pump(); }, { rootMargin: '300px' });
function pump() {
  if (busy || !queue.length) return;
  busy = true;
  const cv = queue.shift();
  setTimeout(() => { try { draw(cv); } catch (e) { console.warn(e); } busy = false; pump(); }, 0);
}
function draw(cv) {
  const L = LEVELS[+cv.dataset.n - 1], h = buildHole(L.course, 0, { pinSeed: 1 });
  const W = cv.width, H = cv.height, ctx = cv.getContext('2d'), img = ctx.createImageData(W, H);
  const t = h.path[0], g = [h.green.u, h.green.v];
  const len = Math.hypot(g[0] - t[0], g[1] - t[1]), dir = [(g[0] - t[0]) / len, (g[1] - t[1]) / len], perp = [dir[1], -dir[0]];
  const span = len + 50, m = span / H, half = W / 2;
  const hex = c => [parseInt(c.slice(1, 3), 16), parseInt(c.slice(3, 5), 16), parseInt(c.slice(5, 7), 16)];
  const cache = {};
  for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) {
    const along = (H - y) * m - 20, lat = (x - half) * m;
    const u = t[0] + dir[0] * along + perp[0] * lat, v = t[1] + dir[1] * along + perp[1] * lat;
    const s = h.surfaceUV(u, v), c = cache[s] || (cache[s] = hex(COL[s] || '#2f6b2c')), k = (y * W + x) * 4;
    img.data[k] = c[0]; img.data[k + 1] = c[1]; img.data[k + 2] = c[2]; img.data[k + 3] = 255;
  }
  ctx.putImageData(img, 0, 0);
  // 樹（世界座標 x = u、z = -v）
  ctx.fillStyle = 'rgba(20,60,26,0.85)';
  for (const tr of h.trees) {
    const du = tr.x - t[0], dv = -tr.z - t[1], along = du * dir[0] + dv * dir[1], lat = du * perp[0] + dv * perp[1];
    const px = half + lat / m, py = H - (along + 20) / m;
    if (px < -2 || px > W + 2 || py < -2 || py > H + 2) continue;
    ctx.beginPath(); ctx.arc(px, py, Math.max(1, (tr.r || 3) / m * 0.8), 0, 6.3); ctx.fill();
  }
  // 旗桿
  const pu = h.pin[0] - t[0], pv = -h.pin[1] - t[1];
  const fx = half + (pu * perp[0] + pv * perp[1]) / m, fy = H - ((pu * dir[0] + pv * dir[1]) + 20) / m;
  ctx.fillStyle = '#fff'; ctx.fillRect(fx - 0.5, fy - 7, 1.5, 7); ctx.fillStyle = '#e33'; ctx.fillRect(fx + 1, fy - 7, 4, 3);
}

sel.onchange = render;
document.getElementById('go').onchange = e => {
  const n = Math.max(1, Math.min(500, +e.target.value || 1)), ci = CHAPTERS.findIndex(c => n >= c.from && n <= c.to);
  if (sel.value !== '' && +sel.value !== ci) { sel.value = ci; render(); }
  document.getElementById('lv' + n)?.scrollIntoView({ block: 'center' });
};
render();
</script>
</body>
</html>
